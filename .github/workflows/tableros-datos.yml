# Actualizacion automatica de los tableros (/plataforma) desde SharePoint.
#
# Los tableros se generan en cada publicacion de Vercel, directo desde los Excels de SharePoint
# (scripts/tableros.mjs). Esta tarea solo decide CUANDO volver a publicar: cada hora compara los
# Excels de SharePoint con la huella que publico el sitio (/plataforma/estado-origen.json) y, si
# cambiaron, le pide a Vercel una publicacion nueva con su Deploy Hook. No toca el repo.
#
# Puesta en marcha: tableros/docs/actualizacion-automatica.md
name: Tableros · datos desde SharePoint

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Publicar de nuevo aunque SharePoint no haya cambiado"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tableros-datos
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tableros

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # pipeline/sharepoint.py solo necesita PyYAML para comparar
      - name: Dependencias
        run: pip install "PyYAML>=6.0"

      - name: Comparar SharePoint con lo publicado
        id: sharepoint
        working-directory: tableros
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: |
          if [ -z "${{ vars.SITIO_URL }}" ]; then
            echo "Falta la variable SITIO_URL (ver tableros/docs/actualizacion-automatica.md)"
            exit 1
          fi
          python -m pipeline.sharepoint --comparar-con "${{ vars.SITIO_URL }}/plataforma/estado-origen.json"

      - name: Pedirle a Vercel que vuelva a publicar
        if: steps.sharepoint.outputs.cambios == 'true' || inputs.forzar
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Falta el secreto VERCEL_DEPLOY_HOOK (ver tableros/docs/actualizacion-automatica.md)"
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          echo "Publicacion pedida. Vercel tarda unos minutos en bajar los Excels y compilar."
