# Los ~2.000 informes que ya reunio el analista (RF7.2) entran por un lote nuevo cuando esten
# en SharePoint: se declara el lote con los metadatos que comparten y se corre
# `python -m pipeline.corpus cargar-lote`, que escribe una entrada por archivo y deja en
# `sin_indexar` las que les falte un metadato obligatorio.

# La cobertura que se espera tener, para que RF9.1 pueda decir que falta. Sin esto el hueco no
# se puede detectar: una combinacion sector x anio sin informes puede ser que falte cargarlos
# o que ese sector no se siga, y son dos cosas distintas.
cobertura_esperada:
  desde: 2016
  sectores:
    - agricultura
    - ganaderia
    - lecheria
    - clima
