# Asignación ícono -> producto. La escribe constructor-dashboards y la lee pipeline/site_build.py.
#
# --- Revisión 2026-09-29: vuelven los íconos de JC -----------------------------------------
# Los íconos de PRODUCTO son otra vez los PNG que armó JC (site/assets/iconos/bn/ y color/,
# 101 por variante, catalogados en site/assets/iconos/catalogo.yaml). Queda derogada la
# decisión del 22-sep de dibujar íconos de trazo propios.
#
# Lo pidió JC en la hoja INDICACIONES de "0000000000 Maqueta Agri.xlsx" (punto 3), y explica
# por qué ese paquete y no otro: "fue el ÚNICO DONDE LOGRÉ ENCONTRAR TODO EL UNIVERSO DE
# PRODUCTOS CONTEMPLADOS LUEGO DE 1 SEMANA DE NAVEGAR". Y pide el criterio de variante:
# el producto INACTIVO va en B&W y el ACTIVO en COLOR. Son dos dibujos distintos, no el mismo
# dibujo con dos tintas (que es lo que había hasta ahora: marrón para el chip en reposo y
# cocoa para el elegido).
#
# El build sirve los dos archivos por producto y el CSS muestra uno u otro según aria-pressed.
# Al copiarlos les saca el fondo plano #f7f7f7 con que vienen los PNG (pipeline/pngs.py); los
# archivos de site/assets/iconos/ no se tocan nunca, son los que mandó JC.
#
# La clave es el nombre canónico del producto en marts (el valor del filtro), no la etiqueta
# del chip: "Soja total" se muestra "Soja" pero el dato se llama "Soja total".
# El valor es el nombre del ícono en el catálogo. `null` = sin ícono; ese producto queda fuera
# del universo visible (no es chip ni serie propia, pero sus datos siguen en los agregados).
# Un producto AUSENTE de esta lista es un error del build: obliga a decidir el ícono de cada
# alta en vez de dejarla caer en silencio.
cultivos:
  "Algodón": algodon
  # Sin ícono en el catálogo de JC (no hay "Alpiste" en los anexos): chip sin ícono.
  "Alpiste": null
  # El catálogo dice "Arvejas"; el mart dice "Arveja". Mismo cultivo.
  "Arveja": arvejas
  "Avena": avena
  "Cártamo": cartamo
  "Cebada total": cebada
  "Centeno": centeno
  "Colza": colza
  "Garbanzo": garbanzo
  "Girasol": girasol
  # El catálogo de JC no trae ícono de lenteja (su propio protocolo la usa de ejemplo de
  # cultivo casi sin datos). El chip sale sin ícono; si JC manda uno, se agrega acá.
  "Lenteja": null
  "Lino": lino
  "Maíz": maiz
  "Maní": mani
  "Mijo": mijo
  # El catálogo trae "Poroto Alubia" y "Poroto Negro" pero no un poroto genérico. Se usa el
  # negro: es el que dibuja JC en su mockup (frijoles oscuros) y el dominante en la provincia.
  "Poroto total": poroto-negro
  "Soja total": soja
  "Sorgo": sorgo
  "Trigo total": trigo

# --- Familia DTV de hortalizas (bases 56 batata, 57 cebolla, 75 papa) ---------------------
# Los tres productos de Agricultura > Cultivos intensivos. La clave es el nombre canónico del
# producto en marts (hecho_movimientos_vegetales.producto), que es el valor del filtro.
# El algodón de la base 53 vive en el mismo mart pero NO es de esta familia: es cultivo
# extensivo y ya tiene su ícono arriba.
  "Batata": batata
  "Cebolla": cebolla
  "Papa": papa

# --- Íconos que NO salen del paquete de JC ------------------------------------------------
# Todo lo que se nombre acá se sirve desde site/assets/iconos/trazo/ en vez de bn/ y color/.
#
# --- Revisión 2026-09-30: se fueron la batata y el zoom ------------------------------------
# JC mandó "specs/fuentes/000 Iconos.docx", que trae justo los dos que faltaban: **Batata**
# (en color y en B&W) y **Zoom aumento** (solo en color). Los dos entraron al catálogo
# (site/assets/iconos/catalogo.yaml) y se borraron los tres SVG propios que los suplían
# (trazo/batata.svg, trazo/batata-color.svg y trazo/zoom.svg).
#
# Con eso NO QUEDA NINGUNA EXCEPCIÓN DE PRODUCTO: los tres productos de Cultivos intensivos
# (batata, cebolla, papa) salen del paquete de JC, con su criterio B&W inactivo / color
# activo. El backlog 56 ("pedirle a JC el ícono de batata") queda resuelto.
#
# Lo que queda acá son los DOS íconos de interfaz que JC no dibuja: no son productos, son
# cromo del sitio, y se siguen pintando con los colores del theme (site_build.COLOR_TRAZO),
# que es lo que los deja re-brandeables (F3).
trazo:
  exportar-como-pdf:
    motivo: "ícono de interfaz, no de producto; no está en el paquete de JC"
    tema: true
  ia:
    motivo: "ícono de interfaz, no de producto; no está en el paquete de JC"
    tema: true
