# Asignación ícono -> cultivo. La escribe constructor-dashboards y la lee pipeline/site_build.py.
#
# Los dibujos viven en site/assets/iconos/trazo/<icono>.svg: son PROPIOS, dibujados el
# 22-sep-2026 con el lenguaje visual del sitio institucional (trazo de 1.6 sobre 24x24, puntas
# redondeadas, sin relleno). Reemplazan a los PNG de los Anexos I y II del "Protocolo de
# formato - Versión 1" de JC, cuya licencia (flaticon) seguía sin verificar desde el 10-ago
# (backlog pregunta 26, RESUELTA: ya no se usa material de terceros).
#
# Variantes: el build escribe cada dibujo dos veces, con el color que le toca según el theme
# (bn = marrón para los chips en reposo; color = cocoa para el cultivo SELECCIONADO y la
# tarjeta de contexto). El dibujo es el mismo: lo único que cambia es el color del trazo.
# Acá solo se dice QUÉ ícono le toca a cada cultivo.
#
# Para dar de alta un cultivo nuevo: dibujar site/assets/iconos/trazo/<nombre>.svg y nombrarlo
# acá. Si falta el dibujo, el build corta con el nombre que falta.
#
# La clave es el nombre canónico del cultivo en marts (el valor del filtro), no la etiqueta
# del chip: "Soja total" se muestra "Soja" pero el dato se llama "Soja total".
cultivos:
  "Algodón": algodon
  # Sin ícono en el catálogo de JC (no hay "Alpiste" en los anexos): chip sin ícono.
  "Alpiste": null
  # El catálogo dice "Arvejas"; el mart dice "Arveja". Mismo cultivo.
  "Arveja": arvejas
  "Avena": avena
  "Cártamo": cartamo
  "Cebada total": cebada
  "Centeno": centeno
  "Colza": colza
  "Garbanzo": garbanzo
  "Girasol": girasol
  # El catálogo de JC no trae ícono de lenteja (su propio protocolo la usa de ejemplo de
  # cultivo casi sin datos). El chip sale sin ícono; si JC manda uno, se agrega acá.
  "Lenteja": null
  "Lino": lino
  "Maíz": maiz
  "Maní": mani
  "Mijo": mijo
  # El catálogo trae "Poroto Alubia" y "Poroto Negro" pero no un poroto genérico. Se usa el
  # negro: es el que dibuja JC en su mockup (frijoles oscuros) y el dominante en la provincia.
  "Poroto total": poroto-negro
  "Soja total": soja
  "Sorgo": sorgo
  "Trigo total": trigo
