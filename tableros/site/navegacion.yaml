# Layout del sitio: que ramas tiene la home, en que orden, y como se agrupan las vistas
# dentro de cada seccion publicada.
#
# El ARBOL de la home no se escribe aca: sale de configs/manifiesto-indice.yaml, que es el
# indice de JC. Aca solo va el ORDEN de las ramas y como se rotula cada una, porque el indice
# no declara un orden y el sitio necesita uno estable (si no, la home cambia entre builds).
#
# El orden de los grupos y de las vistas de una seccion tambien vive aca: el protocolo de
# numeracion de cuadros exige "un dato explicito del layout, no el orden de lectura del disco".
#
# Lo lee pipeline/site_build.py.

# --- Ramas de la home, en orden. `bloque` y `rama` matchean tema.bloque/tema.ruta[0] ---
ramas:
  - id: agricultura
    bloque: acceso-por-tema
    rama: Agricultura
    titulo: Agricultura
    bajada: "Qué se siembra, dónde y con qué resultado."
  - id: ganaderia
    bloque: acceso-por-tema
    # Sin `tira_de_secciones` desde el 12-oct-2026: la tira de especies arriba de la banda
    # del breadcrumb (fila 6 de la maqueta) repetia el menu lateral, que ya lista las mismas
    # especies. Pedido explicito: "saca el menu superior porque repite el lateral". El
    # mecanismo sigue en el build y en Cascara.tsx: se vuelve a prender con
    # `tira_de_secciones: true`.
    # 13-oct-2026 (decision de la usuaria): la tira queda APAGADA y se respeta el pedido del
    # 12-oct. La navegacion por especie vive en el menu lateral (backlog 76, nota para JC).
    rama: Ganadería
    titulo: Ganadería
    bajada: "Existencias, movimientos y faena por departamento."
    # Como se PUBLICA un departamento cuyo nombre canonico de dim_geo no es el de JC (13-oct-
    # 2026). dim_geo canoniza "BANDA" por alias y asi tiene que seguir; JC escribe "La Banda"
    # y la ordena entre Juan F. Ibarra y Loreto. Se resuelve aca, en la presentacion: todos
    # los cuadros de la rama la nombran y la ordenan asi (site_build.renombrar_departamentos).
    nombres_departamento:
      "BANDA": "LA BANDA"
  # AgroClima (maqueta de JC "0000000000 Maqueta Clima 1.xlsx", 14-oct-2026): JC llama asi a
  # la rama en el menu y en la miga de sus nueve hojas. `rama` sigue siendo "Clima" porque es la
  # clave con que el indice de JC (manifiesto-indice.yaml) ubica las bases del tema.
  - id: clima
    bloque: acceso-por-tema
    rama: Clima
    titulo: AgroClima
    bajada: "Acceso a datos, informes y mapas: las estaciones agrometeorológicas del INTA y los mapas de agua en el suelo y de vegetación."
  - id: economia
    bloque: acceso-por-tema
    rama: Economía
    titulo: Economía
    bajada: "Combustibles, patentamientos, consumo y warrants."
  - id: empleo
    bloque: acceso-por-tema
    rama: Empleo
    titulo: Empleo
    bajada: "Empleo registrado y remuneraciones por departamento y por rama."
  - id: industria
    bloque: acceso-por-tema
    rama: Industria
    titulo: Industria
    bajada: "Establecimientos e insumos de la cadena agroalimentaria."
  - id: general
    bloque: acceso-por-tema
    rama: General
    titulo: Datos generales
    bajada: "Población, educación y contexto de la provincia."
    # Mismo criterio que ganadería: dim_geo canoniza "BANDA" y el sitio la publica como la
    # nombra la provincia (los mapas y tablas de las capas del IGN, 14-oct-2026).
    nombres_departamento:
      "BANDA": "LA BANDA"
  - id: registros
    bloque: acceso-por-territorio
    rama: Departamento
    titulo: Registros
    bajada: "Padrones de empresas y establecimientos con domicilio en la provincia."

# --- Menu lateral (Modelo 2 de JC, aprobado el 10-ago-2026) ---
# Los seis sectores del menu lateral verde, en el orden y con los rotulos en que JC los dibujo
# en su mockup (y en la captura del tema visual): Inicio arriba y despues estos, desplegables.
# Cada sector despliega sus secciones publicadas; un sector sin secciones se muestra igual,
# rotulado "Próximamente", sin ningun link muerto. Empleo y Registros no estan en el mockup de
# JC y quedan afuera del menu hasta que JC los ubique (siguen accesibles desde la home).
# El rotulo del menu puede diferir del titulo de la rama en la home ("General" vs "Datos
# generales"): en el menu manda el mockup.
menu_lateral:
  - {rama: agricultura, titulo: "Agricultura"}
  - {rama: ganaderia, titulo: "Ganadería"}
  - {rama: clima, titulo: "AgroClima"}
  - {rama: industria, titulo: "Industria"}
  - {rama: economia, titulo: "Economía"}
  - {rama: general, titulo: "General"}

# --- Secciones publicadas (las que tienen vistas construidas) ---
secciones:
  - id: cultivos-extensivos
    base: 9
    rama: agricultura
    ruta: [Agricultura, Cultivos extensivos]
    url: agricultura/cultivos-extensivos
    # La frase de una linea que muestra la landing en "Entra directo a la vista que
    # necesitas" (src/lib/dashboard.ts la lee del contenido generado).
    bajada_corta: "Superficie sembrada y cosechada y producción, por campaña."
    titulo: "Cultivos extensivos"
    bajada: >
      Superficie sembrada y cosechada, producción y rendimiento de los cultivos extensivos de
      Santiago del Estero, por departamento y por campaña. Datos del Ministerio de Agricultura,
      Ganadería y Pesca de la Nación.
    # --- Tercera tanda del 10-ago-2026 (JC): en cultivos el esquema tablero+analisis NO
    # EXISTE MAS ("OLVIDATE DEL ANÁLISIS COMPLETO... TE QUEDES CON LOS TABLEROS"). La seccion
    # queda en TRES paginas: el tablero (index, calcado del mockup Modelo 2), el dato
    # departamental y la comparacion NOA. Sin analisis.html, sin pestañas, sin listado de
    # vistas: las 16 vistas de detalle pasaron a `estado: no-publicada` en sus specs y no se
    # generan. Regla: _protocolo-presentacion.formato_v1.tercera_tanda.solo_tableros.
    sin_pestanias: true
    # Banderas de idioma es/en/pt en la cabecera, donde estaba el titulo duplicado (JC: "ahí
    # iban las banderas de idiomas"; backlog 33, resuelta).
    cabecera_banderas: true
    # Botones de cabecera del mockup, HABILITADOS el 10-ago (segunda tanda), en el orden en
    # que JC los dibujo. El build los resuelve a URLs y los deja viajar con la seleccion
    # vigente (persistencia_de_filtros). Si la vista destino no esta publicada (ej. si
    # Francisco baja la comparacion NOA, backlog 11), el boton no se dibuja.
    botones_cabecera:
      - {texto: "Santiago en el NOA", vista: 09-noa-participacion-provincia}
      - {texto: "Datos por Departamento", vista: 09-departamento-datos}
    # Las dos unicas paginas ademas del tablero, SUELTAS: se generan en la seccion pero no
    # hay listado que las agrupe. Se llega por los botones de cabecera y el click del mapa.
    vistas_sueltas:
      - 09-departamento-datos
      - 09-noa-participacion-provincia
    grupos: []

  # Agricultura > Cultivos intensivos (frutas y hortalizas). Tres bases que comparten mart,
  # adapter y modelo de analisis, asi que comparten seccion: la eleccion de producto es un
  # filtro, no tres paginas. Construida el 23-sep-2026 a pedido de Francisco, con la maqueta
  # "Agri 2" de JC y la hoja "Modelo analisis" de la base 53.
  #
  # Mismo formato que cultivos extensivos (JC f39-f41: "los formatos se mantienen SIEMPRE"):
  # SIN "Analisis completo" (tercera tanda del 10-ago: solo tableros), banderas de idioma en
  # la cabecera y los dos botones de cabecera que pide el Modelo analisis. La unica vista de
  # detalle es la departamental, suelta, alcanzable por esos botones y por el clic del mapa.
  - id: cultivos-intensivos
    familia: dtv-hortalizas
    bases: [56, 57, 75]
    rama: agricultura
    ruta: [Agricultura, Cultivos intensivos]
    url: agricultura/cultivos-intensivos
    # La frase de una linea que muestra la landing en "Entra directo a la vista que
    # necesitas" (src/lib/dashboard.ts la lee del contenido generado).
    bajada_corta: "Toneladas de cebolla, batata y papa que salen de la provincia, mes a mes."
    titulo: "Cultivos intensivos"
    bajada: >
      Cuántas toneladas de cebolla, batata y papa salen de Santiago del Estero, desde qué
      departamentos, hacia qué provincias y en qué meses. Cada movimiento es una Declaración
      de Tránsito Vegetal (DTV) emitida por SENASA.
    sin_pestanias: true
    cabecera_banderas: true
    # UN solo boton: las dos salidas que pide el Modelo analisis de JC ("ver todos los años"
    # y "al hacer clic en un departamento que se abra su informacion") son la MISMA pagina con
    # distinto ambito. El boton la abre en Total provincia, que es "ver todos los años"; el
    # clic del mapa la abre en el departamento, como en cultivos extensivos. Dos botones al
    # mismo destino serian dos veces el mismo link.
    botones_cabecera:
      - {texto: "Ver todos los años", vista: dtv-departamento-movimientos}
    vistas_sueltas:
      - dtv-departamento-movimientos
    grupos: []

  # ANUNCIADA, todavia sin datos: sale en el menu lateral y en la home con "Próximamente",
  # sin link. Su spec ya esta escrito (tablero-pasturas-forrajes.yaml + _comunes-base-43.yaml)
  # a partir de la maqueta de JC "Modelo 1 - Pasturas y forrajes"; lo que falta es el Excel de
  # la base 43 y los mapas del Observatorio (backlog 71 y 72). El dia que entren, se le saca
  # `proximamente` y el build la genera.
  # JC la tiene dibujada en el menu de las cuatro hojas de su maqueta (celda B11), que es el
  # motivo de que se anuncie en vez de esconderse: la seccion existe para el lector.
  - id: pasturas-y-forrajes
    familia: recursos-forrajeros
    bases: [43]
    rama: agricultura
    ruta: [Agricultura, Pasturas y forrajes]
    url: agricultura/pasturas-y-forrajes
    bajada_corta: "Cómo viene el forraje de cada zona contra su propia historia, quincena a quincena."
    titulo: "Pasturas y forrajes"
    # La tira de paginas que JC dibuja a la DERECHA de la banda del breadcrumb, en las
    # cuatro hojas de su maqueta: "Información por departamento | Mapas | Metodología".
    # La que no tiene `vista` todavia no esta construida y se dibuja apagada.
    paginas_de_seccion:
      # Lleva a ESTA misma pagina con un departamento puesto, que es la hoja "Agri 3-b" de
      # JC: los mismos cuadros recortados, mas el mapa para cambiar de departamento. El
      # departamento de arranque lo resuelve el build (el primero con dato).
      - {texto: "Información por departamento", primer_departamento: true}
      - {texto: "Mapas", vista: 43-mapas-forrajeros}
      # NO es otra pagina: en el Excel de JC su hipervinculo (celda BD5) apunta a una celda
      # de SU MISMA hoja, donde el pone las observaciones. Acá es el ancla del bloque de notas
      # metodológicas, al pie.
      - {texto: "Metodología", ancla: metodologia}
    vistas_sueltas:
      - 43-mapas-forrajeros
    bajada: >
      Producción de materia seca de los recursos forrajeros de Santiago del Estero, comparada
      contra el promedio histórico de cada quincena. No mide cuánto pasto hubo: mide si hubo
      más o menos que lo habitual para esa época del año en ese lugar.
    grupos: []

  # ---------------------------------------------------------------------------
  # GANADERÍA · siete especies, 21 páginas (maqueta "Maqueta Ganad VF", 9-oct-2026)
  # ---------------------------------------------------------------------------
  # Reemplaza a las dos secciones que había (`stock-bovino` y `movimientos-hacienda`):
  # Francisco fue explícito, "las que tenemos actualmente no sirven". Sus specs quedan en el
  # repo como registro, igual que las vistas de la base 9 que la tercera tanda dejó fuera.
  #
  # La estructura es la de JC y tiene DOS tiras, una arriba de la otra: la de ESPECIE (fila 6
  # de sus 21 hojas, que acá es `ramas.ganaderia.tira_de_secciones`) y la de PÁGINA dentro de
  # la especie (fila 10, que es `paginas_de_seccion`). Las dos están siempre a la vista: es la
  # respuesta a lo que el propio JC pregunta en la celda E62 de "GanBov IN", "analizar cómo
  # sería el mejor regreso de las páginas internas a la principal de ganadería bovina".
  #
  # Desde el 12-oct-2026 cada especie con datos ingeridos tiene construida su PRIMERA página
  # (la de stocks, `tablero-<especie>.yaml` sobre `_comunes-stock-<especie>.yaml`). Las otras
  # páginas de cada tira esperan su spec y se dibujan apagadas con "Próximamente". Apícola
  # se construyó el 12-oct-2026, cuando se configuró su base (30).

  - id: bovinos
    base: 48
    rama: ganaderia
    ruta: [Ganadería, Bovinos]
    url: ganaderia/bovinos
    titulo: "Bovinos"
    bajada_corta: "Existencias, movimientos, vacunación, leche y faena del rodeo bovino."
    bajada: >
      El rodeo bovino de Santiago del Estero: cuántas cabezas hay y de qué categoría, cómo se
      mueven, cuántas se vacunan, qué produce la cuenca lechera y qué sale a faena. Por
      departamento y año a año.
    # Las ocho páginas de la tira de JC. La primera ES esta página (el tablero de la
    # sección); las otras siete esperan su spec y se dibujan apagadas con "Próximamente".
    # La quinta dice "Producc Leche" y no "Faena": en cuatro de sus hojas figura como
    # "Faena" y en tres como "Producc Leche", y la quinta página es la de leche. Además la
    # faena bovina, según el propio JC, es una imagen de SENASA y no una página (backlog 78).
    paginas_de_seccion:
      - {texto: "Stocks", tablero: true}
      - {texto: "Indicadores", vista: tablero-bovinos-indicadores}
      - {texto: "Movimientos", vista: tablero-bovinos-movimientos}
      - {texto: "Vacunaciones", vista: tablero-bovinos-vacunaciones}
      # "Producc Leche" sin punto, literal de JC (13-oct-2026).
      - {texto: "Producc Leche", vista: tablero-bovinos-leche}
      # Construida el 13-oct-2026 con la hoja "Estratificación" de la base 48 (JC, celda E165
      # de "GanBovESTR"): ya no es "Próximamente".
      - {texto: "Estratos y UP", vista: tablero-bovinos-estratos}
      - {texto: "Razas", vista: tablero-bovinos-razas}
      - {texto: "Feed Lots, Hilton y Tambos", vista: tablero-bovinos-feedlots}
    # La matriz origen-destino de los movimientos internos: pagina suelta, se llega por el
    # boton "Matrices Origen Destino (OD)" de Movimientos (hoja "GanBov DTE").
    vistas_sueltas:
      - 85-matriz-od-interna
    grupos: []

  - id: bubalinos
    base: 183
    rama: ganaderia
    ruta: [Ganadería, Bubalinos]
    url: ganaderia/bubalinos
    titulo: "Bubalinos"
    bajada_corta: "Existencias de búfalos por categoría, departamento y estrato."
    bajada: >
      Las existencias bubalinas de Santiago del Estero: poco más de dos mil cabezas en una
      cuarentena de establecimientos, por categoría, departamento y tamaño de rodeo.
    # Página única: la maqueta no le pone tira de páginas.
    grupos: []

  - id: porcinos
    base: 232
    rama: ganaderia
    ruta: [Ganadería, Porcinos]
    url: ganaderia/porcinos
    titulo: "Porcinos"
    bajada_corta: "Existencias, estratos, movimientos y faena porcina."
    bajada: >
      El stock porcino de Santiago del Estero por categoría y departamento, su evolución desde
      2017, el tamaño de los establecimientos y lo que sale a faena por raza.
    paginas_de_seccion:
      - {texto: "Stocks", tablero: true}
      - {texto: "Estratos y UP", vista: tablero-porcinos-estratos}
      - {texto: "Movimientos", vista: tablero-porcinos-movimientos}
      - {texto: "Razas", vista: tablero-porcinos-razas}
    grupos: []

  - id: equinos
    base: 229
    rama: ganaderia
    ruta: [Ganadería, Equinos]
    url: ganaderia/equinos
    titulo: "Equinos"
    bajada_corta: "Existencias de équidos por categoría, estrato y departamento."
    bajada: >
      Caballos, yeguas, potrillos, mulas, burros y asnos de Santiago del Estero: existencias
      desde 2008, tamaño de los establecimientos y movimientos con DTE.
    paginas_de_seccion:
      - {texto: "Stocks, UP y Estratos", tablero: true}
      - {texto: "Movimientos", vista: tablero-equinos-movimientos}
    grupos: []

  - id: ovinos
    base: 157
    rama: ganaderia
    ruta: [Ganadería, Ovinos]
    url: ganaderia/ovinos
    titulo: "Ovinos"
    bajada_corta: "Existencias ovinas por categoría, departamento y estrato."
    bajada: >
      Las existencias ovinas de Santiago del Estero por categoría y departamento, su serie
      desde 2008 y el tamaño de los rebaños.
    paginas_de_seccion:
      - {texto: "Stocks, Establec. y UP", tablero: true}
      - {texto: "Movimientos", vista: tablero-ovinos-movimientos}
      - {texto: "Estratos", vista: tablero-ovinos-estratos}
    grupos: []

  - id: caprinos
    base: 177
    rama: ganaderia
    ruta: [Ganadería, Caprinos]
    url: ganaderia/caprinos
    titulo: "Caprinos"
    bajada_corta: "Existencias caprinas por categoría, departamento y estrato."
    bajada: >
      Casi medio millón de cabezas caprinas en más de ocho mil unidades productivas: por
      categoría, por departamento y por tamaño de majada.
    paginas_de_seccion:
      - {texto: "Stocks, Establecim. y UP", tablero: true}
      - {texto: "Estratos", vista: tablero-caprinos-estratos}
    grupos: []

  - id: apicola
    base: 30
    rama: ganaderia
    ruta: [Ganadería, Apícola]
    url: ganaderia/apicola
    titulo: "Apícola"
    bajada_corta: "Apiarios y colmenas por departamento."
    bajada: >
      La producción apícola de Santiago del Estero: cuántos apiarios y cuántas colmenas hay en
      cada departamento, y cuántas colmenas tiene en promedio cada apiario.
    # JC no la pone en la tira de especies de su maqueta aunque le dedica una hoja. Se suma
    # igual: dejarla afuera de la tira la volvería inalcanzable salvo por el menú lateral.
    grupos: []

  # ---------------------------------------------------------------------------
  # GENERAL · Infraestructura y riesgo (capas del IGN, 14-oct-2026, backlog 104)
  # ---------------------------------------------------------------------------
  # Pedido de JC por WhatsApp: "Rutas provinciales, nacionales y caminos rurales (Red vial
  # primaria, secundaria y terciaria); Tendidos ferroviarios; Amenazas hidrometeorologicas",
  # del catálogo Capas SIG del IGN. Es la primera sección de la rama General (hasta acá salía
  # "Próximamente"). No sale de una base del índice de JC: el contexto es `capas-ign`
  # (configs/dims/capas-ign/). JC no dibujó maqueta: el armado es nuestro (backlog 106).
  # Las mismas capas se prenden también sobre los mapas de agricultura y ganadería (opt-in
  # por spec, apagadas al abrir).
  - id: infraestructura-y-riesgo
    familia: capas-ign
    rama: general
    ruta: [General, Infraestructura y riesgo]
    url: general/infraestructura-y-riesgo
    titulo: "Infraestructura y riesgo"
    bajada_corta: "Rutas, caminos rurales, ferrocarril y amenazas hidrometeorológicas (IGN)."
    bajada: >
      La red vial nacional, provincial y rural de Santiago del Estero, el tendido ferroviario y
      sus estaciones, y los eventos adversos de origen hidrometeorológico registrados por
      departamento entre 1970 y 2015. Capas del Instituto Geográfico Nacional.
    paginas_de_seccion:
      - {texto: "Red vial y ferrocarril", tablero: true}
      - {texto: "Amenazas hidrometeorológicas", vista: tablero-infraestructura-amenazas}
    grupos: []

  # ---------------------------------------------------------------------------
  # AGROCLIMA · datos, informes y mapas (maqueta "0000000000 Maqueta Clima 1.xlsx", 14-oct-2026)
  # ---------------------------------------------------------------------------
  # Nueve hojas de JC y una sola seccion: la portada ("Clima Ingreso") son tarjetas que llevan a
  # la pagina de las estaciones del INTA (base 111) y a seis galerias de mapas (SEPA-INTA y ORA,
  # imagenes en site/assets/clima/). La pagina AgroMet y el bloque "Destacados" no tienen base
  # entregada (backlog 107). Lectura de la maqueta en docs/maqueta-clima.md.
  - id: agroclima
    familia: agroclima
    bases: [111]
    rama: clima
    ruta: [AgroClima, Datos, informes y mapas]
    url: clima/agroclima
    titulo: "Datos, informes y mapas"
    bajada_corta: "Estaciones del INTA día a día y mapas de agua en el suelo y de vegetación."
    bajada: >
      El dato diario de las estaciones agrometeorológicas del INTA en Santiago del Estero y los
      mapas de reservas de agua en el suelo, evapotranspiración y estado de la vegetación que
      publican SEPA-INTA y la Oficina de Riesgo Agropecuario.
    # JC dibuja "Regresar" a la derecha de la banda en las ocho hojas internas: vuelve a la
    # portada de la rama. Va donde va la tira de paginas, y solo en las paginas que no son la
    # portada.
    regresar: "Regresar"
    # Sin pestañas Tablero/Análisis: la rama son páginas sueltas a las que se llega por las
    # tarjetas de la portada, como en las hojas de JC.
    sin_pestanias: true
    vistas_sueltas:
      - 3001-mapas-ora-humedad-suelo
      - 3002-mapas-evapotranspiracion
      - 3003-mapas-variacion-agua
      - 3004-mapas-porcentaje-agua
      - 3005-mapas-ndvi
      - 3006-mapas-vci
    grupos: []

privadas:
  titulo: "Material comparativo (sin publicar)"
  bajada: >
    Estas vistas comparan a Santiago del Estero con otras provincias y con el total del país.
    CLAUDE.md las trata como material sensible: no salen al sitio sin decisión escrita de
    Francisco registrada en el spec. Quedan generadas acá para poder verlas.
  vistas:
    # 09-noa-participacion-provincia salio de esta lista el 3-ago-2026: Francisco la aprobo y
    # ahora vive en Agricultura > Cultivos extensivos > Comparación regional.
