# Branding del sitio. F3: un theme por cliente. NADA de estilo hardcodeado en los componentes.
#
# Todo lo que se ve (colores, tipografia, ancho, textos de marca) sale de aca. El CSS del
# sitio se genera desde site/templates/pivotal.css.j2 con estos valores: para re-brandear a
# otro cliente se edita este archivo y se corre `make site`, sin tocar una linea de codigo.
#
# Los colores de DATOS (rampas de mapa por tipo de variable) NO viven aca: los define
# specs/modelos/_protocolo-presentacion.yaml, porque son una regla de JC y no del cliente.
# Aca vive la paleta CATEGORICA, que es cromo de marca y se usa cuando el color distingue
# categorias (un cultivo por serie) y no magnitudes.
#
# --- Revision 2026-08-03 -----------------------------------------------------------------
# JC rechazo el diseño anterior en la reunion del 3-ago: el sitio parecia un informe y no un
# tablero. Los valores de abajo salen del mockup aprobado por Francisco, que esta archivado en
# specs/fuentes/WhatsApp Image 2026-07-27 at 20.24.16.jpeg. Los hex se muestrearon del propio
# archivo, no se eligieron a ojo.
#
# --- Revision 2026-09-22 -----------------------------------------------------------------
# DISEÑO DEL SITIO INSTITUCIONAL (decision de Francisco): los tableros pasan a verse como
# pivotal.ai. Cambia SOLO el cromo (lienzo, cabecera, menu, paneles, chips, tablas) y la
# tipografia; los colores de DATOS (paleta_categorica, rampas de los mapas, series) NO se
# tocan: los manda specs/modelos/_protocolo-presentacion.yaml, que es regla de JC.
# La paleta es la del sitio: cocoa #2b1c18, marron #7d5545, rosa #c18477, crema #f1dccb,
# oliva #7c8465. Deroga el cromo verde institucional de la revision del 10-ago.
#
# --- Revision 2026-08-10 -----------------------------------------------------------------
# TEMA VISUAL FINAL (Facu, en persona con JC): la pagina tiene que verse como la captura de
# specs/fuentes/WhatsApp Image 2026-08-10 at 11.08.41.jpeg
# (_protocolo-presentacion.formato_v1.tema_visual). Queda derogado el lienzo greige: el lienzo
# es BLANCO y el cromo institucional VERDE (cabecera, menu lateral, banda de breadcrumb).
# Los hex del bloque `cromo` se muestrearon de la propia captura, no se eligieron a ojo.
# Los tokens del 3-ago que siguen abajo quedan para los DATOS (series, barras, links), que no
# cambian: los colores de datos los manda el protocolo, no el tema.

cliente: "Pivotal (beta interna)"
titulo_sitio: "Pivotal · Santiago del Estero"
# La marca se escribe PIVOTAL, sin articulo. El mockup dice "EL PIVOTAL" y esta mal:
# CLAUDE.md fija que es "Pivotal", nunca "El Pivotal".
marca_corta: "PIVOTAL"
bajada_sitio: "Inteligencia de datos agroproductivos para el gobierno de Santiago del Estero"
colores:
  primario: "#22502c"        # verde profundo: series, chips activos de detalle, links
  primario_medio: "#407a47"  # verde medio: barras, lineas de tendencia, segunda categoria
  secundario: "#3f5343"      # verde grisado: rotulos de seccion y bordes de encabezado de tabla
  fondo: "#f1dccb"           # crema del sitio: el lienzo (derogado el blanco del 10-ago)
  texto: "#2b1c18"           # cocoa del sitio
  texto_apoyo: "#7d5545"     # marron del sitio: rotulos, pies y texto secundario
  borde: "#d8c7b8"           # cocoa al 18% sobre la crema
  fondo_cuadro: "#fbf4ec"    # crema aclarada: las cajas se despegan del lienzo
  fondo_apoyo: "#e8d6c6"     # relleno de rieles, filas de total, chips inactivos
  # Cromo institucional de la captura del 10-ago. Muestreado de la captura misma.
  cromo: "#2b1c18"           # cocoa: cabecera, menu lateral, banda de breadcrumb
  cromo_oscuro: "#7d5545"    # marron: tira de pestañitas de campaña y estados sobre el cromo
  seleccion: "#c18477"       # rosa del sitio: chip de cultivo SELECCIONADO y acentos
  borde_panel: "#dbc9ba"     # borde fino de las cajas de panel, KPI y chips
  # Texto y bordes SOBRE el cromo (cabecera, menu, banda) y sobre el color de seleccion
  sobre_cromo: "#f1dccb"     # crema sobre cocoa: 12,4:1
  sobre_seleccion: "#2b1c18" # cocoa sobre rosa: 5,1:1
  enlace: "#7d5545"          # marron: links y acciones de texto (los datos siguen en --primario)
  # Los tokens del "tema moderno" de la segunda tanda (borde_suave, menu_fondo, sombra_panel)
  # se sacaron el 10-ago-2026, tercera tanda: JC rechazo ese rediseño ("Todo deformado Facu")
  # y el mockup Modelo 2 volvio a mandar de forma LITERAL, diseño incluido
  # (formato_v1.tercera_tanda.mockup_literal). No hay tema alternativo en cultivos.

# --- CROMADA POR AREA (29-sep-2026) --------------------------------------------------------
# JC, hoja INDICACIONES de "0000000000 Maqueta Agri.xlsx": "Para lo que es agricola, el color
# predominante (por asociacion natural) es el verde y en ganaderia el borravino o un marron.
# Que tono de verde o borravino/marron queda a su criterio, pero siemple aplicable a todo ese
# grupo de productos."
#
# Lectura: el color acompaña al AREA, no al sitio. Una seccion de Agricultura se ve verde y
# una de Ganaderia se ve marron, con la MISMA maqueta, la misma tipografia y las mismas
# medidas. Cambia la cromada, no el diseño.
#
# Los colores de arriba (`colores`) son la cromada POR DEFECTO: la marron del 22-sep, que es
# la que le corresponde a Ganaderia y la que usan las paginas que no son de ningun area (la
# home, el material reservado). Cada entrada de abajo se llama igual que una rama de
# site/navegacion.yaml y PISA solo los tokens que nombra. Una rama sin entrada sale con el
# default y no rompe nada.
#
# CONTRASTE: todo par texto/fondo esta medido y ninguno baja de 4,5:1 (WCAG AA texto normal).
# Es la razon por la que el cromo de agricultura NO es el #00af50 de la captura del 10-ago:
# ese verde da 2,19:1 contra la crema y no se puede usar de fondo de cabecera. El verde que
# se usa es el institucional que ya vive en este archivo (`primario`) y al que el protocolo
# ata la rampa de superficie.
cromadas:
  agricultura:
    cromo: "#22502c"           # verde profundo (= primario): cabecera, menu lateral, banda
    cromo_oscuro: "#35693e"    # verde medio: tira de campañas y seccion activa del menu
    seleccion: "#9fbb86"       # salvia claro: chip de producto SELECCIONADO y acentos
    borde_panel: "#c6cdb4"     # verde grisado muy claro: borde fino de panel, KPI y chips
    enlace: "#2f6238"          # verde: links y acciones de texto sobre la crema
    # sobre_cromo y sobre_seleccion no cambian: crema sobre el verde y cocoa sobre el salvia.
    contraste_medido:
      - "crema #f1dccb sobre cromo #22502c = 7,03:1"
      - "crema #f1dccb sobre cromo_oscuro #35693e = 4,89:1"
      - "cocoa #2b1c18 sobre seleccion #9fbb86 = 7,74:1"
      - "enlace #2f6238 sobre fondo_cuadro #fbf4ec = 6,58:1"
  ganaderia:
    # Ya era marron: no pisa ningun token. Queda declarada para que se vea que la decision
    # es explicita y no un olvido, y para que otro cliente sepa donde tocarla (F3).
    contraste_medido:
      - "crema #f1dccb sobre cromo #2b1c18 = 12,36:1"
      - "crema #f1dccb sobre cromo_oscuro #7d5545 = 4,86:1"
      - "cocoa #2b1c18 sobre seleccion #c18477 = 5,33:1"

# Logo provincial (cabecera). EL LOGO NUEVO, 29-sep-2026: JC avisa que el que vale es el que
# el mismo pone en su maqueta ("0000000000 Maqueta Agri.xlsx", hoja "Agri 1", primera imagen
# anclada en A1). Es el ISOLOGOTIPO OFICIAL DEL GOBIERNO: banner rojo con el escudo provincial
# y "SANTIAGO DEL ESTERO" en blanco, 287x96 px, guardado tal cual salio del archivo en
# site/assets/logo-provincia-escudo.png. `archivo` es la ruta PUBLICA; el build lo copia a
# public/plataforma/ (y le antepone el prefijo /plataforma).
#
# Trae su PROPIO fondo rojo opaco, asi que no necesita variante para fondo oscuro y funciona
# igual sobre la cromada verde de Agricultura y sobre la marron de Ganaderia. Por eso ya no se
# usa la derivacion negativa del 22-sep (site/assets/logo-provincia-cromo.png) ni el
# isologotipo multicolor que trajo Facu el 10-ago (site/assets/logo-provincia.png): los dos
# archivos quedan en el repo como registro de lo que hubo antes, sin referenciar.
#
# La `bajada` se sigue dibujando chica debajo del logo. El wordmark de texto queda como
# fallback si otro cliente no trae asset (F3).
#
# LIMITACION CONOCIDA: el archivo de JC mide 287x96, o sea que en la cabecera (3,8rem de alto)
# se dibuja a 179 px de ancho y en una pantalla de alta densidad queda un poco blando. Si la
# provincia tiene el original en mayor resolucion, se reemplaza el archivo y listo.
logo_provincia:
  nombre: "Santiago del Estero"
  bajada: "Gobierno de la Provincia de Santiago del Estero"
  # El ISOLOGOTIPO NEGATIVO oficial, sacado del manual de marca (MANUAL_MARCA_SDE_2025.pdf,
  # pagina 11: "Isologotipo positivo/negativo"). PNG blanco sobre fondo TRANSPARENTE, asi que
  # apoya sobre el cromo de cada area -verde en agricultura, cocoa en ganaderia- sin recuadro.
  #
  # Que reemplaza y por que: antes era `logo-provincia-escudo.png`, un recorte de la maqueta
  # de JC con el escudo en blanco sobre un BLOQUE ROJO opaco. Dos problemas: el bloque rojo se
  # veia como una estampilla pegada sobre el verde, y el escudo venia en silueta, que el
  # manual prohibe expresamente ("NO aplicar el escudo en outline", pagina 12, usos
  # incorrectos). La version PRINCIPAL del manual es el isologotipo a color con el texto en
  # negro: no se lee sobre un cromo oscuro, por eso va la negativa.
  archivo: "/logo-provincia-sde.png"
logo: null                   # logo Pivotal: sigue pendiente (semana 3-ago)
pie: "Pivotal · Elaboración propia en base a fuentes oficiales citadas en cada cuadro"
# Pie de tecnologia del Modelo 2 de JC (aprobado el 10-ago, backlog 35).
pie_tecnologia: "Tecnología Pivotal: B3, Minibox y ∞ Prompt"

tipografia:
  # Las mismas del sitio institucional (decision de Francisco, 22-sep-2026; deroga el
  # "Calibri, y como segunda opcion Arial" de JC del 10-ago). Las carga Next.js en
  # src/app/(tableros)/layout.tsx y las expone como variables CSS: no se descarga nada a mano.
  familia: "var(--font-archivo), system-ui, -apple-system, 'Segoe UI', sans-serif"
  # Los rotulos chicos en versalita espaciada son lo que le da caracter al tablero, igual que
  # en el sitio: van en la monoespaciada de la marca (IBM Plex Mono).
  familia_rotulos: "var(--font-plex-mono), ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
  # Titulos editoriales, como el hero del sitio
  familia_titulos: "var(--font-newsreader), Georgia, 'Times New Roman', serif"
  base_px: 15
ancho_maximo_px: 1280

# Paleta categorica: cuando el color distingue CATEGORIAS (un cultivo por serie, una
# provincia por porcion de torta) y no magnitudes. La asignacion concreta la escribe
# constructor-dashboards en site/colores-cultivo.yaml, en orden alfabetico, para que sea
# la misma en todas las vistas y en todos los builds (protocolo: `regla_color_cultivo`).
#
# Los cinco primeros son los del anillo del mockup, en su mismo orden. El resto extiende la
# misma familia (tierras, verdes y ocres apagados): tonos que aguantan proyeccion y que se
# siguen distinguiendo en escala de grises, que es como JC imprime.
paleta_categorica:
  - "#22502c"   # verde profundo      (mockup)
  - "#b8552e"   # terracota           (mockup)
  - "#407a47"   # verde medio         (mockup)
  - "#c9a226"   # oro                 (mockup)
  - "#8fb07b"   # salvia              (mockup)
  - "#6b5344"   # marron
  - "#2f6b6a"   # verde petroleo
  - "#8c3b52"   # borgoña
  - "#4a5c8a"   # azul apagado
  - "#a8763a"   # caramelo
  - "#5c7a3a"   # oliva
  - "#7a5c8a"   # violeta apagado
  - "#2d6e4e"   # esmeralda
  - "#c1743f"   # naranja tostado
  - "#4f6f7f"   # azul pizarra
  - "#9a9a3d"   # lima apagado
  - "#7d4a2e"   # siena
  - "#3f8a7a"   # verde agua
  - "#a55c6b"   # rosa viejo
  - "#5f6b47"   # verde militar
  - "#8a6f2e"   # mostaza oscuro
  - "#35544f"   # petroleo oscuro
  - "#b98a5e"   # arena
  - "#64553f"   # topo
