  fuente_de_verdad: El indice declara INTENCION (que bases habra), nunca datos.
  registros_declarados: 'Conteo de la base nacional completa. El recorte de Santiago del Estero siempre
    es menor: usar solo como orden de magnitud, nunca como validacion dura.'
  rango_declarado: Cobertura que promete la fuente, no la del archivo recibido.
  unidades_y_geografia: Copia literal de las columnas 'Var unit' y 'Var geog' de JC. A veces traen la
    unidad ('tn', 'depart') y a veces un conteo ('7' = siete provincias). Son una pista para el config
    de la base, no un contrato.
  alias_historicos: Si JC renumera o renombra una base, se anota aca el numero o nombre viejo para no
    romper configs ni specs.
