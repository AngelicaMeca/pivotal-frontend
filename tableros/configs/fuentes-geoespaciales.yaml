    # anunciada con este nombre, que es la forma en que de verdad se rompen.
    verificacion:
      tipo: ogc
      endpoint: https://wms.ign.gob.ar/geoserver/ign_riesgo/ows
      capa: ign_riesgo:desinventar_hidrometeorologico_riesgo
    modo_visualizacion:
      resuelto: visor-propio
      criterio: "Igual que ign-vial-nacional."
    licencia:
      nombre: "Datos abiertos del IGN"
      exige_cita: true
      atribucion: "Fuente: IGN - DESINVENTAR"
      redistribucion: permitida
    indicaciones: [evaluar-utilidad-analitica]
    observaciones: >
      Está ingestada y normalizada por departamento, y su página existe, pero NO se publica: JC
      la mandó sacar el 16-oct-2026 ("SACAR COMPLETO ESO DE RIESGO HIDROLOGICO", y lo de las
      amenazas "era solo para ver qué contenía"). Queda aprobada y sin publicar hasta que él la
      pida. Dos cosas a avisarle si vuelve: tiene subregistro reconocido por la propia metadata
      del IGN y termina en 2015; y la categoría que trae por departamento es un corte de Jenks
      NACIONAL, que compara a Santiago contra todo el país y no departamentos entre sí (por eso
      el mapa usa una rampa propia sobre la cantidad de registros).
    normalizacion:
      aplicada: true
      criterio: interseccion-por-superficie
      detalle: >
        La capa del IGN ya viene con el código de departamento: no hubo que cruzar geometrías.
        El build controla que la suma por tipo de evento de cada departamento dé su total.
      validada_por: equipo-datos
      fecha_validacion: 2026-10-14
    publicado_en:
