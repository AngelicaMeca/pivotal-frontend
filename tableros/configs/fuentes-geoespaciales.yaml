    licencia:
      nombre: "Datos abiertos del IGN"
      exige_cita: true
      atribucion: "Fuente: IGN - BAHRA (dato del INDEC)"
      redistribucion: permitida
    indicaciones: [exportar-capa]
    publicado_como: capa
    observaciones: >
      Es OTRA capa que ign-localidades-bahra: `ign:bahra_paraje`, y hace falta porque
      `localidad_bahra` no trae ni un paraje. Son 1.022 en la provincia contra 165 localidades.
      Entró el 17-nov-2026 como sujeto del indicador de proximidad a la red pavimentada
      (RF18.1) y SIN dibujarse en ningún mapa, con el criterio de que JC no había pedido la
      capa. SE PUBLICA EN EL MAPA DE INFRAESTRUCTURA EL 20-nov-2026, y la que corrigió ese
      criterio fue el QA de Francisco: JC sí había pedido los parajes -puso la tarjeta "Parajes
      por provincia" en la portada de Mapas que él mismo armó-, y esa tarjeta abría el portal
      del INDEC en un indicador de población, porque en el catálogo de ese portal no hay
      ninguno de parajes. O sea que el visor del organismo no puede mostrar lo que él pidió, y
      entonces manda su regla: "la idea era BAJAR LAS CAPAS Y PONER NUESTRO PROPIO VISOR". Va
      en Infraestructura porque es lo que él anotó para esta capa: "CRUZAR CON RED TERCIARIA Y
      RUTAS". Cada punto trae su departamento en la fila (`cod_depto`).
      Cuatro parajes vienen con `cod_pcia` 86 y un `cod_depto` de la provincia vecina (San
      Antonio, Colonia El Bellaco, Pozo Jume y Pozo del Arbolito, todos sobre el límite): no se
      les inventa departamento, quedan fuera de los conteos y registrados en el resumen.
    normalizacion:
