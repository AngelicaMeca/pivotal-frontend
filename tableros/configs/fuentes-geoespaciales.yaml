  - id: ign-vial-nacional
    nombre: "Red vial nacional (red vial primaria)"
    organismo: "Instituto Geográfico Nacional (IGN)"
    url: https://www.ign.gob.ar/NuestrasActividades/InformacionGeoespacial/CapasSIG
    tipo_contenido: servicio-ogc
    alcance: nacional
    estado: publicada
    responsable: equipo-datos
    fecha_estado: 2026-10-14
    modo_acceso: ogc-wfs
    # RF23: que se le pide para saber si sigue en pie. A un servicio OGC no alcanza con
    # que el host contaste: se le pide el GetCapabilities y se controla que la capa siga
    # anunciada con este nombre, que es la forma en que de verdad se rompen.
    verificacion:
      tipo: ogc
      endpoint: https://wms.ign.gob.ar/geoserver/ows
      capa: ign:vial_nacional
    modo_visualizacion:
      resuelto: visor-propio
      criterio: >
        La capa se baja del WFS, se recorta a la provincia y se commitea: el sitio no le pide
        nada al servidor del IGN en ningún momento. Decidido el 14-oct-2026 porque el IGN se cae
        seguido (de hecho se cayó el 17-nov-2026, en medio de este trabajo) y una página que
        depende de su servidor se ve rota sin que nosotros hayamos tocado nada.
    licencia:
      nombre: "Datos abiertos del IGN"
      exige_cita: true
      atribucion: "Fuente: IGN - Dirección Nacional de Vialidad"
      redistribucion: permitida
    indicaciones: [exportar-capa]
    observaciones: >
      Pedido textual de JC el 08-oct-2026 y de nuevo el 15-nov-2026: "Redes viales (primaria,
      secundaria y terciaria)".
    normalizacion:
      aplicada: false
      motivo: >
        Es una capa de LÍNEAS que se dibuja sobre el mapa, no un dato por departamento: no hay
        nada que agregar por departamento. Los km por jerarquía y calzada que calcula el build
        son provinciales (haversine sobre el trazado recortado).
    publicado_en:
      - configs/dims/capas-ign.yaml
      - specs/modelos/tablero-infraestructura-y-riesgo.yaml
    publicado_como: capa

