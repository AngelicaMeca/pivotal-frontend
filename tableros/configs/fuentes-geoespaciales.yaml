    # RF24.2: el visor del organismo se incrusta en el sitio, con el encuadre de
    # RF22.4. Se declara embebible SOLO porque se midio; ver `embebible.medicion`.
    visualizacion_embebida:
      encuadre: >
        El portal abre en el indicador de poblacion total por departamento. CON EL PAIS
        ENTERO: su URL no acepta un encuadre, ver `no_se_puede_encuadrar`.
      encuadre_en_la_url: false
      # POR QUE NO SE PUEDE ABRIR EN SANTIAGO DEL ESTERO (medido el 20-nov-2026, QA de
      # Francisco, M4). El portal declara en su propio codigo un parametro para arrancar
      # filtrado en una provincia (`?filter=86`, leido en portalgeoestadistico.indec.gob.ar/
      # js/core.js), pero su funcion `build_geoportal` lo aplica SOLO a la dimension
      # geografica cuyo `desaggregation_level` sea "0", y en la configuracion que publica hoy
      # (api/v1/map/2) las cinco dimensiones -jurisdicciones, departamentos, gobiernos
      # locales, localidades y radios- lo traen VACIO. O sea que el parametro no hace nada.
      # Tampoco sirven `region`, `geounit` ni `geo`: estan en la lista de parametros que lee
      # pero no los usa ninguna funcion. Y el aviso legal que pide aceptar en cada visita es
      # del portal, no nuestro. La unica forma de que estos tres mapas abran en la provincia
      # es dibujarlos nosotros: el dato por departamento esta en su API publica
      # (api/v1/indicator/<id>/records). Propuesto en el backlog 141.
      no_se_puede_encuadrar: >
        El portal no acepta un encuadre por URL: su parametro `filter` depende de un nivel de
        desagregacion que su propia configuracion no declara. Abre con el pais entero.
      embebible:
        verificado: 2026-11-17
        medicion: >
          Medido el 17-nov-2026 pidiendo la portada del visor y leyendo sus cabeceras: no
          manda X-Frame-Options ni frame-ancestors, asi que se deja embeber. Los
          visores del INTA (visor.inta.gob.ar y geo-nodo02) y el de la ORA mandan
          `X-Frame-Options: SAMEORIGIN` y salen EN BLANCO adentro de un iframe:
          esos siguen abriendo en otra pestania y no hay que volver a intentarlo.

