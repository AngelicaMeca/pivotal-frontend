  - id: energia-media-tension
    nombre: "Tendido eléctrico de media tensión"
    organismo: "Consejo Federal de la Energía Eléctrica - Secretaría de Energía, con datos de EDESE"
    # Corregida el 17-nov-2026: acá decía https://datos.gob.ar/dataset/energia-sistema-electrico-nacional,
    # que da 404. La buena ya estaba escrita en configs/dims/capas-energia.yaml (`fuente.portal`) y
    # es la que se usó para bajar la capa; en esta ficha se había copiado otra. Lo encontró el
    # chequeo de vigencia (RF23) en su primera corrida.
    url: https://datos.energia.gob.ar/dataset/redes-de-distribucion-electrica-del-consejo-federal
    tipo_contenido: capa-descargable
    alcance: provincial
    estado: publicada
    responsable: equipo-datos
    fecha_estado: 2026-11-17
    modo_acceso: descarga-directa
    modo_visualizacion:
      resuelto: visor-propio
      criterio: >
        Se baja el CSV del recurso de CKAN, se recorta a la provincia y se commitea. Se eligió el
        CSV y no el SHP porque su columna `geojson` se lee con la biblioteca estándar: un
        shapefile habría exigido una dependencia nueva, que el repo no admite sin justificación.
    licencia:
      nombre: CC-BY-4.0
      exige_cita: true
      atribucion: "Fuente: Consejo Federal de la Energía Eléctrica - Secretaría de Energía, con datos de EDESE (CC BY 4.0)"
      redistribucion: permitida
    indicaciones: [exportar-capa]
    observaciones: >
      Es la segunda mitad del pedido de JC del 15-nov-2026: "el mapa de tendido eléctrico... La
      fuente es IGN, salvo el de tendido eléctrico que es Secretaría de Energía". PENDIENTE DE
      PREGUNTAR: la fuente NO documenta en qué unidad está su campo `tension` (los valores son
      76, 33 y 13). Se publica el número tal cual, con la nota de que la fuente no declara la
      unidad, y nunca se lo presenta como kV.
    normalizacion:
      aplicada: false
