# CATÁLOGO DE FUENTES GEOESPACIALES
#
# Es el registro que pide el ERS "Mapas y Contexto IA" v1.1 (11-nov-2026), RF1 a RF15 y RF22 a
# RF23, implementado como lo prescribe su propia sección 5.1: "se implementan como registro
# declarativo versionado... archivos YAML versionados, con la misma mecánica de los modelos y
# las configuraciones ya existentes", y "los bloqueos de publicación de los RF6, RF15.1, RF15.2
# y RF17.3 se implementan como validaciones del pipeline que interrumpen la construcción del
# sitio, no como controles de interfaz".
#
# O sea: NO hay pantallas de administración y no hace falta ninguna. El alta de una fuente (RF1)
# es agregar una entrada acá; la baja (RF3) es ponerle `estado: descartada` con su motivo; el
# cambio de estado (RF11.1) es editar dos campos; y el catálogo (RF11) y el avance (RF10) se
# leen de este archivo con `python -m pipeline.fuentes_geo`. El historial de quién cambió qué y
# cuándo lo da git, que es más confiable que una tabla de auditoría.
#
# Quién valida qué: `pipeline/fuentes_geo.py` lo verifica en cada `make build` y CORTA la
# corrida si algo no cierra. Lo que corta está escrito en ese archivo.
#
# ----------------------------------------------------------------------------------------------
# CÓMO SE LEE UNA ENTRADA
#
#   id                    el nombre con el que se la nombra en el resto del repo
#   nombre                descriptivo, el que vería una persona                        (RF1)
#   organismo             quién la publica                                             (RF1)
#   url                   de acceso                                                    (RF1)
#   tipo_contenido        visor-web | capa-descargable | servicio-ogc | repositorio    (RF1)
#   alcance               nacional | provincial | regional | departamental             (RF1)
#   estado                a-evaluar | en-evaluacion | aprobada | en-ingesta |
#                         normalizada | publicada | descartada | caida               (RF11.1)
#   responsable           a quién le toca el próximo paso                            (RF11.2)
#   fecha_estado          cuándo pasó a ese estado                                   (RF11.2)
#   modo_acceso           visor-embebible | descarga-directa | catalogo-con-descarga |
#                         ogc-wms | ogc-wfs | exportacion-desde-app                    (RF13)
#   modo_visualizacion    visor-del-organismo | visor-propio, con `criterio`            (RF14)
#   licencia              nombre, exige_cita, atribucion, redistribucion                (RF15)
#                         redistribucion: permitida | no-permitida | a-confirmar
#   indicaciones          qué hay que hacerle, del vocabulario del RF1.2
#   observaciones         lo que hay que saber para usarla bien                       (RF1.3)
#   motivo                obligatorio en `descartada` y en `caida`                      (RF3)
#   consulta_tecnica      la pregunta concreta a resolver, con `asistencia_especializada` (RF4)
#   normalizacion         criterio del cruce departamental y quién lo validó       (RF6, RF17)
#   publicado_en          los archivos del repo que publican material de esta fuente
#   publicado_como        visor | capa | enlace | imagen | descarga
#
# Las indicaciones de tratamiento (RF1.2) son, textual del ERS: "cruzar con límites
# departamentales", "exportar capa", "evaluar utilidad analítica", "evaluar modo de acceso" y
# "cruzar con otra capa". Se escriben en kebab-case; el texto original de JC, cuando lo hay, va
# en `indicacion_original` (RF2.1).
# ----------------------------------------------------------------------------------------------

version: 1
actualizado: 2026-11-17

# De dónde salió el inventario inicial (RF2): la planilla de JC. La hoja "VER" son las fuentes a
# evaluar y la hoja "BAJAR y agregar" las aprobadas, que es la lectura que fija el ERS.
inventario_importado:
  archivo: "0000000000 Base datos mapas.xlsx"
  adjunto_asana: https://app.asana.com/app/asana/-/get_asset?asset_id=1220087701095227
  subido: 2026-11-01
  importado: 2026-11-17
  hojas:
    VER: a-evaluar
    "BAJAR y agregar": aprobada
  nota: >
    La hoja "BAJAR y agregar" no trae los títulos como texto: cada URL lleva debajo una captura
    del visor donde el título se lee. Se leyeron de esas capturas, una por una
    (configs/dims/mapas-ingreso.yaml). La hoja "VER" aporta las dos filas "POR FAVOR VER QUE ES
    ESTO", que entran como `a-evaluar` con su consulta técnica.

