# Procedencia de site/assets/mapas/ingreso/ (las miniaturas del area "Mapas", JC 15-nov-2026).
#
# Pedido textual de JC (comentario del 15-nov-2026, punto 3.b MAPAS): "Con el mismo formato de
# 'Agroclima' hacemos un area de 'ingreso' con los titulos de los mapas que envie el link. Ahi
# esta la fuente, que salvo el de Poblacion, la mayoria son de INTA".
#
# DE DONDE SALEN LOS TITULOS. Los "links que envio" son la hoja "BAJAR y agregar" del Excel
# "0000000000 Base datos mapas.xlsx" (adjunto de Asana 1220087701095227, subido el 01-11-2026).
# Esa hoja NO trae los titulos como texto: solo las URL, y debajo de cada una JC pego una
# CAPTURA del visor con el mapa abierto, donde el titulo se lee. Los titulos de abajo se
# leyeron de esas capturas, una por una; no se infirio ninguno y no se tradujo ninguno (van
# como los escribe el organismo, con su ortografia, incluido "Areas" sin tilde del INTA).
#
# Las capturas son ademas la MINIATURA de cada tarjeta, que es lo que hace que el area se vea
# "con el mismo formato de Agroclima": alla la miniatura es el mapa mas reciente de la galeria,
# aca es la captura del propio JC. Se publican reducidas a 400 px de ancho (las originales
# pesan 7 MB juntas y la tarjeta las dibuja chicas); el original queda en el adjunto de Asana y
# su huella, abajo.
#
# Igual que las capas del IGN, esto no pasa por raw/: la fuente es un adjunto de Asana. Lo que
# se commitea es la miniatura ya reducida.

carpeta: site/assets/mapas/ingreso

fuente:
  archivo: "0000000000 Base datos mapas.xlsx"
  hoja: "BAJAR y agregar"
  adjunto_asana: https://app.asana.com/app/asana/-/get_asset?asset_id=1220087701095227
  comentario: https://app.asana.com/1/1199241515527219/task/1217681319199651/comment/1220087701095230
  subido_por: "Juan Carlos Antuña"
  subido: 2026-11-01
  leido: 2026-11-17
  como_se_leyo: >
    Las imagenes salen de xl/media/ del propio xlsx y su posicion de los anclajes del dibujo
    (xl/drawings/drawing2.xml, que es el de la hoja "BAJAR y agregar"): cada captura esta
    anclada una o dos filas debajo de la URL a la que corresponde. Es el mismo metodo con que
    se leyeron las maquetas de JC (ver docs/maqueta-clima.md).

transformacion:
  herramienta: "Pillow (LANCZOS), 400 px de ancho, PNG optimizado"
  nota: >
    Se corre a mano una sola vez, como pipeline/recorte_sepa.py: la fuente no vive en el repo.
    Si JC manda capturas nuevas, se regeneran y se actualizan las huellas de abajo.

