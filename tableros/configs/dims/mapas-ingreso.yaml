advertencias_para_jc:
  - >
    Las tarjetas llevan al VISOR DEL ORGANISMO, en otra pestaña, y no a una pagina nuestra:
    todavia no hay ninguna capa de estas ingestada. Es la unica forma de que el area de ingreso
    sirva hoy sin publicar material de terceros.
  - >
    Las cuatro primeras son capas DENTRO del visor del INTA. El link abre el visor en el
    encuadre que vos mandaste, pero el visor arranca con sus capas por defecto: hay que
    prenderla a mano en el menu de la izquierda (se indica en cada tarjeta donde esta).
  - >
    Las dos filas de "POR FAVOR VER QUE ES ESTO" del Excel (los servicios WMS y WFS de GeoNode
    INDEC) NO entran al area: no son un mapa con titulo, son dos servicios cuyo contenido esta
    sin averiguar. Quedan en el catalogo de fuentes como "a evaluar".
