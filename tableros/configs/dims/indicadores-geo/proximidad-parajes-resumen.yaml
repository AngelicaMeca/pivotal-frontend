metodo:
  medida: 'Distancia en linea recta desde el paraje al punto mas cercano de CUALQUIER
    tramo pavimentado, medida contra los segmentos de la linea (no contra sus vertices).

    '
  proyeccion: 'Plano equirrectangular local centrado en la latitud media de la provincia:
    x = R*cos(lat0)*lon, y = R*lat, con R = 6.371.008,8 m. A las distancias que mide
    este indicador (decenas de kilometros) el error contra la distancia sobre la esfera
    queda por debajo del 0,2%, y a cambio el calculo es una resta y una raiz. NO sirve
    para medir distancias de cientos de kilometros.

    '
  no_es: 'No es distancia por camino ni tiempo de viaje: es la distancia en linea
    recta al asfalto mas cercano. Un paraje a 8 km en linea recta puede estar a 30
    km de manejo.

    '
  recorte: 'La red se toma ya recortada a la provincia, asi que un paraje del borde
    puede tener asfalto mas cerca del otro lado del limite y aca figurar mas lejos.
    Son pocos y se avisa en la nota del cuadro.

    '
  latitud_media_de_la_red: -27.861252
