# INTA AgroMet · los ejemplares del Informe agrometeorologico semanal que publica la pagina
# AgroClima > INTA AgroMet (hoja "ClimAGM" de la maqueta de JC "0000000000 Maqueta Clima 1.xlsx",
# spec specs/modelos/2008-informes-agromet.yaml). Lo lee site_build.construir_documentos.
#
# Los PDF son la base "2008 IC-CD" de JC: una carpeta de PDFs en SharePoint (OneDrive de
# AUTOScraping), "Pivotal Repositorio/Operaciones/Maquetas/Recursos clima/", con las subcarpetas
# "2008 - IC -CD - Parte A" (899 a 910) y "2008 - IC -CD - Parte B" (911 a 922). La baja
# pipeline/sharepoint.py junto con los Excels (configs/origen-sharepoint.yaml, `documentos`) a
# <raw>/documentos/agromet/, y el build copia los de la ventana a
# public/plataforma/documentos/agromet/: el sitio sirve el PDF que mando JC, no el del INTA.
#
# QUE ES CADA CAMPO
#   numero           el numero del ejemplar TAL CUAL lo escribe JC en la maqueta (R10..AY20). Es
#                    el que se publica: "Nº 922 - 7 octubre 2026" se compone de numero + fecha.
#   fecha            fecha de publicacion (AAAA-MM-DD). JC, W33: "CORRECTAS LAS FECHAS".
#                    Numero y fecha NO se deducen del nombre del archivo: es ambiguo ("10626" es
#                    10 de junio y "10726" es 1 de julio).
#   numero_en_tapa   solo cuando la tapa impresa del PDF dice otro numero (errata del INTA). No se
#                    publica: queda escrito para que nadie lo "corrija" al reves.
#   archivo, bytes   el nombre EXACTO del PDF en la carpeta de SharePoint y su tamaño. El build
#                    CORTA si falta un PDF declarado o si su tamaño no coincide.
#   parte            la subcarpeta (A o B). Informativo: el build no la usa.
#   referencia_inta  el mismo PDF en argentina.gob.ar (mismo tamaño, byte a byte; comparado el
#                    2026-10-15). Solo procedencia: NO se publica ni se enlaza. Si alguna vez se
#                    enlaza al INTA, que sea al PDF y nunca a la pagina web del ejemplar: desde
#                    septiembre de 2026 sus titulos estan corridos +1.
#
# PROCEDENCIA
#   - Lista (numeros y fechas): JC, maqueta, hoja ClimAGM (14-oct-2026). JC ya corrigio las
#     erratas de tapa del INTA en 899, 902 y 917.
#   - Cada PDF verificado contra su tapa impresa el 2026-10-15 (listado del INTA,
#     https://www.argentina.gob.ar/inta/informacion-agroclimatica/informes-agrometeorologicos/agromet-semanal).
#   - Archivos y tamaños: listado de la carpeta de SharePoint del 2026-10-15. El nombre de la 905
#     en la carpeta no lleva el "_1" que tiene en el INTA.
#
# NO ESTAN (no estan en la maqueta ni en la carpeta de JC; backlog 109):
#   - el ejemplar del 26-ago-2026 (tapa Nº 917, INTA .../2026/08/917-agromet_semanal_260826.pdf);
#   - el Nº 923 del 14-oct-2026 (INTA .../2026/10/923-agromet_semanal_141026.pdf), posterior.
#
# COMO SE SUMA UN EJEMPLAR NUEVO: JC sube el PDF a la carpeta y se agrega su entrada ARRIBA de
# todo (ver el spec 2008-informes-agromet.yaml). Un PDF que esta en la carpeta y no aca NO se
# publica: el build lo avisa y sigue.
publicacion: "INTA AgroMet"
verificado: 2026-10-15
base:
  codigo: "2008 IC-CD"
  carpeta: "Pivotal Repositorio/Operaciones/Maquetas/Recursos clima"

