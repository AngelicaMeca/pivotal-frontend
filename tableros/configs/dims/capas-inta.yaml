      archivo_pais: cobertura-del-suelo-2006-2007-pais.geojson
      etiqueta: "Cobertura del suelo 2006-2007 (INTA)"
      geometria: poligonos
      tooltip: "{clase}"
      clases_al_prender: true
      # 1,7 MB: se baja recien cuando alguien prende la capa, nunca al abrir la pagina.
      grande: true
