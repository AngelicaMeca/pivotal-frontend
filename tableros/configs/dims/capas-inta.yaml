# Procedencia de configs/dims/capas-inta/ (los mapas del INTA que pidio JC).
#
# PEDIDO TEXTUAL DE JC (comentario del 18-nov-2026 en la tarea 1220512131004640):
#   "JAMAS DIJE QUE PONGAMOS LINKS EXTERNOS AL RESTO DE LOS MAPAS... la idea es QUE ESTEN
#   DENTRO DE AGRIFOOD!!!! Nunca pusimos links externos a nada, por ende, no se porque se hizo
#   en este caso. La idea era BAJAR LAS CAPAS Y PONER NUESTRO PROPIO VISOR, SI NO SE PUEDE,
#   ELIMINAMOS TODO. PARA QUE QUEDE DENTRO DE NUESTRA WEB. Lo que no entiendo es que si se
#   pudo hacer con el mapa de cultivos, porque no con los otros???? TODOS TIENEN LA OPCION DE
#   DESCARGAR LA CAPA... Ahi esta clarisimo el link a la descarga. TODOS TIENEN la opcion
#   DESCARGAR, por ende podemos ponerlo en nuestro propio visor."
#
# Tenia razon. Lo que habia frenado las capas del INTA era su propia objecion del 22-oct-2026,
# anotada en `inta-geoservicios` de configs/fuentes-geoespaciales.yaml ("los geoservicios del
# INTA son publicos, pero este tipo de acceso no"): se habia leido como que no usaramos sus
# servicios, asi que las 8 tarjetas del INTA quedaron como links al visor. Al senialar el boton
# "Descargar" autorizo expresamente la via de la descarga, que es la que se usa aca.
#
# QUE SE ENCONTRO, MEDIDO EL 18-NOV-2026. Las 8 tarjetas del INTA estan repartidas en DOS
# nodos distintos, y eso es lo que habia hecho pensar que algunas no existian. SEIS ESTAN
# PUBLICADAS ACA; las dos que no, no son una limitacion tecnica nuestra: una espera que JC
# decida su leyenda y la otra el INTA no la publica en su servicio.
#
#   | Tarjeta de JC                            | Donde esta                      | Estado          |
#   |------------------------------------------|---------------------------------|-----------------|
#   | Aptitud de Tierras                       | nodo02, geonode:usoaptitshp     | PUBLICADA aqui  |
#   | Zonificacion del Uso del Suelo           | nodo02, geonode:zonificacion_usosuelo | PUBLICADA aqui |
#   | Suelo Santiago del Estero                | nodo02, geonode:suel_sgo        | baja bien, leyenda a decidir (backlog 129) |
#   | Ordenamiento Territorial Bosques Nativos | nodo02: en el catalogo, NO en el WFS | no se puede bajar |
#   | Cuencas hidricas del NOA                 | geo-backend, geonode:cuencas_noa_ll | PUBLICADA aqui  |
#   | Cursos de Agua NOA                       | geo-backend, geonode:cursosdeagua | PUBLICADA aqui  |
#   | Cobertura del suelo 2006-2007 (LCCS-FAO) | geo-backend, geonode:lccs_n3_2007 | PUBLICADA aqui  |
#   | Areas ganaderas deforestadas 2008-2017   | geo-backend, geonode:tb_layers_ganaderas_transii | PUBLICADA aqui |
#
# El nodo que sirve cada una NO es el que esta en el link de JC: `visor.inta.gob.ar` se apoya
# en `geo-backend.inta.gob.ar` (se descubrio cargando el visor y leyendo sus pedidos de red) y
# las fichas de catalogo de `geo-nodo02.inta.gob.ar` tienen su propio GeoServer. `geo.inta.gob.ar`
# NO tiene geoservicios: es un WordPress y /geoserver da 404.
#
# Esto NO es un dato de JC ni pasa por raw/: igual que las capas del IGN y el tendido, se baja
# de la fuente oficial y se commitea el resultado. El sitio publica una copia y no le pide nada
# al servidor del INTA en ningun momento: si el INTA se cae, el sitio sigue igual.

carpeta: capas-inta

fuente:
  organismo: Instituto Nacional de Tecnología Agropecuaria (INTA)
  descargado: 2026-11-18
  proyeccion_declarada: EPSG:4326
  # DOS NODOS, por lo que explica la tabla de arriba. El de cada capa esta anotado en
  # descargas_crudas. Los dos son GeoServer y los dos comandos son el mismo salvo el host.
  nodos:
    geo-nodo02:
      base: https://geo-nodo02.inta.gob.ar
      catalogo: https://geo-nodo02.inta.gob.ar/catalogue/
      servicio: WFS 2.0.0 de https://geo-nodo02.inta.gob.ar/geoserver/wfs
      estilo: GetStyles (SLD 1.0.0) de https://geo-nodo02.inta.gob.ar/geoserver/geonode/wms
      sirve: "Aptitud de tierras, Zonificación del uso del suelo (y suel_sgo, sin publicar)"
    geo-backend:
      base: https://geo-backend.inta.gob.ar
      servicio: WFS 2.0.0 de https://geo-backend.inta.gob.ar/geoserver/wfs
      estilo: GetStyles (SLD 1.0.0) de https://geo-backend.inta.gob.ar/geoserver/geonode/wms
      sirve: "Cuencas hídricas del NOA, Cursos de agua del NOA, Cobertura del suelo 2006-2007, Áreas ganaderas deforestadas (es el nodo del visor del INTA)"
  comando: >
    curl -o <capa>.json "https://<nodo>.inta.gob.ar/geoserver/wfs?service=WFS&version=2.0.0
    &request=GetFeature&typeNames=geonode:<capa>&outputFormat=application/json&srsName=EPSG:4326"
  comando_estilo: >
    curl -o <capa>.sld "https://<nodo>.inta.gob.ar/geoserver/geonode/wms?service=WMS
    &version=1.1.1&request=GetStyles&layers=geonode:<capa>"

descargas_crudas:
  # archivo: [capa, bytes]
  #
  # Sin sha256 por el mismo motivo que las capas del IGN: GeoServer le estampa a cada respuesta
  # su propio `"timeStamp"`, asi que volver a bajar el mismo archivo da el mismo tamanio y otro
  # hash. Los bytes si se reproducen y son lo que se verifica a ojo.
  usoaptitshp.json: [geonode:usoaptitshp, 253599]
  usoaptitshp.sld: [geonode:usoaptitshp, 9621]
  zonificacion_usosuelo.json: [geonode:zonificacion_usosuelo, 412509]
  zonificacion_usosuelo.sld: [geonode:zonificacion_usosuelo, 11052]
  # Del otro nodo (geo-backend). Son de TODO el noroeste, asi que se recortan a la provincia.
  cuencas_noa_ll.json: [geonode:cuencas_noa_ll, 3647450]
  cuencas_noa_ll.sld: [geonode:cuencas_noa_ll, 16842]
  cursosdeagua.json: [geonode:cursosdeagua, 5601152]
  cursosdeagua.sld: [geonode:cursosdeagua, 4898]
  # La mas pesada de las ocho: 116 MB de GeoJSON para todo el pais.
  lccs_n3_2007.json: [geonode:lccs_n3_2007, 121706507]
  lccs_n3_2007.sld: [geonode:lccs_n3_2007, 40548]
  tb_layers_ganaderas_transii.json: [geonode:tb_layers_ganaderas_transii, 30664234]
  tb_layers_ganaderas_transii.sld: [geonode:tb_layers_ganaderas_transii, 1157]

licencia:
  # El catalogo del nodo02 no declara una licencia por dataset. El INTA publica su informacion
  # geoespacial como dato publico y su visor ofrece la descarga de cada capa sin registro, que
  # es la via que JC senialo expresamente. Queda pedida la confirmacion por escrito (backlog
  # 130) y hasta que llegue se cita al organismo en cada cuadro, como pide el protocolo.
  nombre: a-confirmar
  exige_cita: true
  permite_redistribuir: a-confirmar
  atribucion: "Fuente: INTA - Instituto Nacional de Tecnología Agropecuaria"

transformacion:
  script: pipeline/capas_inta.py
  uso: >
    python -m pipeline.capas_inta <carpeta de descargas> configs/dims/capas-inta
    configs/dims/sde-departamentos.geojson
  leyenda: >
    Las clases y sus colores salen del SLD que publica el GeoServer del INTA, no de una paleta
    nuestra: es el mismo criterio que las 18 clases del Mapa Nacional de Cultivos, que salieron
    del .qml del INTA. Un poligono con un valor que el SLD no declara CORTA la corrida.
  simplificacion: >
    Douglas-Peucker con tolerancia 0,0005 grados (~55 m). Saca el 25% de los vertices de las
    dos capas de suelo, el 75% de cuencas y el 91% de los cursos de agua (en estas dos ultimas
    la mayor parte de lo que se va no es simplificacion sino recorte: son capas de todo el
    noroeste). La cobertura del suelo lleva su PROPIA tolerancia, 0,002 grados (~222 m), y es
    una decision medida: recortada a la provincia quedan 1.331 poligonos, y el archivo pesa
    3,51 MB a 56 m, 2,49 MB a 111 m, 1,61 MB a 222 m y 1,04 MB a 444 m. A 222 m el error es
    menor que un pixel hasta el zoom maximo -la provincia entra en 1.052 px, unos 400 m por
    pixel, y el zoom llega a 8x- asi que es detalle que no se ve y pesa un tercio mas. Es una
    capa NACIONAL de 4,36 millones de vertices: no esta dibujada a escala provincial. El dato del INTA viene de shapefiles digitalizados a escala regional: un vertice
    cada 55 m es mas detalle del que la fuente sostiene.
  huecos: >
    La estructura del poligono se conserva (anillo exterior + huecos) y el navegador los dibuja
    en un solo trazo. Aptitud de Tierras tiene 19 huecos y la Zonificacion 20: aplanarlos
    pintaria lleno el hueco de una unidad que rodea a otra y le taparia el color.
  recorte: >
    Las dos capas del nodo02 NO se recortan: ya son de Santiago del Estero, y el script verifica
    que todo vertice caiga dentro de la caja provincial y corta si no. Las dos de geo-backend
    son de todo el noroeste y SI se recortan, contra el contorno disuelto de los departamentos
    (el mismo que usan las capas del IGN y el tendido electrico, asi que el borde de una capa
    calca exactamente la silueta del mapa). Los cursos de agua se cortan con la misma rutina
    que el tendido (`recortar_linea`) y quedan abiertos donde cruzan el limite. Las cuencas son
    AREAS: un area cortada tiene que CERRARSE caminando por el borde de la provincia, o no es
    un area, asi que se recortan con Weiler-Atherton sobre el anillo del contorno. Hay cuencas
    mas grandes que la provincia, que la contienen entera: ese caso devuelve el contorno.
  recorte_verificado: >
    Las macrocuencas tapizan la region, asi que la suma de las areas recortadas tiene que dar
    el area de la provincia. Da el 96,019%. Y no es que el recorte se coma un 4%: sorteando
    3.000 puntos adentro de la provincia, el 4,03% no tiene NINGUNA cuenca encima en el dato
    original del INTA. Los dos numeros coinciden dentro del error de muestreo. Las unicas
    aristas cuyo punto medio cae afuera son las 224 que caminan sobre el borde mismo (208 con
    los dos extremos en el contorno, el resto arrancando en un cruce).
  determinista: "Corrido dos veces sobre la misma descarga: archivos identicos byte a byte."

salidas:
  aptitud-de-tierras.geojson: >
    83 rasgos (19 huecos), 5.756 vertices, 10 clases de aptitud, 137.685 bytes.
  zonificacion-del-uso-del-suelo.geojson: >
    79 rasgos (20 huecos), 10.556 vertices, 12 zonas, 240.504 bytes.
  cuencas-hidricas.geojson: >
    12 rasgos, 32.869 vertices, 6 macrocuencas de las 16 del SLD, 718.804 bytes.
  cursos-de-agua.geojson: >
    3 rasgos (uno por tipo) con 201 tramos, 16.461 vertices, 359.374 bytes. Un rasgo por tipo y
    no uno por tramo, igual que el tendido electrico publica un rasgo por nivel de tension.
  cobertura-del-suelo-2006-2007.geojson: >
    1.274 rasgos, 71.202 vertices de 4.361.800, 16 clases de las 41 del SLD, 1.726.895 bytes.
  areas-deforestadas-2008-2017.geojson: >
    UN rasgo con 18.085 parches, 145.912 vertices, una sola clase, 3.253.506 bytes.

# ----------------------------------------------------------------- "Mostrar todo el país"
todo_el_pais:
  por_que: >
    Pedido de la usuaria del 25-nov-2026: un botoncito que diga "mostrar todo el pais", como el
    de los mapas de AgroClima. Alla es gratis -la imagen del SEPA ya es nacional y el visor deja
    de recortarla- y aca hizo falta publicar la OTRA version de cada capa: la que el INTA sirve
    entera, sin el recorte contra el contorno de la provincia.
  hasta_donde_llega_cada_una: >
    No lo decidimos nosotros, lo decide la fuente. Aptitud de tierras y Zonificacion del uso del
    suelo NO tienen version nacional: el INTA las publica solo para Santiago del Estero, y con
    el boton prendido se siguen viendo dibujadas sobre la provincia y nada alrededor. Cuencas
    hidricas y Cursos de agua son de todo el NOROESTE. Cobertura del suelo y Areas ganaderas
    deforestadas son NACIONALES.
  descarga: >
    Las cuatro capas se volvieron a bajar el 25-nov-2026, con el mismo comando de arriba. OJO:
    el GeoServer del INTA sirve hoy MUCHOS MAS BYTES que el 18-nov por los mismos rasgos (son
    las coordenadas con todos sus decimales): cuencas 8.639.484 contra 3.647.450, cursos
    21.595.647 contra 5.601.152, cobertura 395.644.717 contra 121.706.507 y deforestadas
    54.518.299 contra 30.664.234. Los SLD bajan identicos (mismos bytes), asi que las clases y
    los colores no cambiaron. POR ESO las capas recortadas NO se regeneraron: lo que JC ya vio
    sale de la descarga del 18-nov y no se toca de rebote. El script de las versiones
    nacionales es otro y solo escribe archivos nuevos.
  script: pipeline/capas_pais.py
  uso: ".venv/Scripts/python -m pipeline.capas_pais <carpeta de descargas> configs/dims/capas-inta"
  memoria: >
    El archivo de la cobertura del suelo (395 MB) no se puede abrir con `json.load`: el arbol
    de objetos pide varios gigabytes. El script lo recorre rasgo por rasgo contando llaves
    (`rasgos_del_archivo`), asi que la memoria se queda en lo que mida el rasgo mas grande. La
    corrida entera son 90 segundos.
  simplificacion: >
    Mas gruesa que la de la provincia, y medida capa por capa. El encuadre del boton es el pais
    en una caja de 640 px de alto, o sea 5,8 km por pixel.
      - Cuencas, 222 m: 0,69 MB. A 55 m -la tolerancia de la version provincial- serian 3,66 MB.
      - Cursos de agua, 222 m: 1,65 MB. A 555 m serian 0,88, pero un rio es una linea fina y
        angulosa y el ahorro no justifica despeinarla.
      - Cobertura del suelo, 2,2 km y UN RASGO POR CLASE: 3,58 MB. Es un tapiz que cubre el
        pais entero con 14,1 millones de vertices. Medido: 13,09 MB a 555 m, 7,94 MB a 1,1 km y
        3,58 MB a 2,2 km. A 2,2 km el error es 0,4 px en el encuadre del boton. Agrupar por
        clase saca 12.723 envoltorios de rasgo (casi 2 MB) y deja 42 llamadas de dibujo en vez
        de 12.765; el cartel no pierde nada, porque dice la clase.
      - Areas deforestadas, 555 m y el mismo corte de 1 hectarea que la version provincial:
        2,77 MB con 33.222 parches de los 88.651. El corte de 1 ha deja el 98,8% de las
        hectareas desmontadas; con 100 ha quedarian 1.958 parches y el 40% de la superficie, o
        sea un mapa que diria que se desmonto la mitad de lo que se desmonto.
  dibujo: >
    A escala de pais el navegador NO saltea las partes chicas, y esto esta medido. El mapa de
    capas se saltea las partes que miden menos de un pixel porque no se ven y cuestan igual que
    una grande (es lo que hizo que la provincia se pudiera recorrer con 18.085 parches
    prendidos). Con el pais en 640 px, un parche de 1 a 100 hectareas mide entre 0,02 y 0,2
    pixeles: TODOS caen debajo del minimo y la capa de areas deforestadas desaparecia (54
    pixeles verdes contra 1.671 dibujandolos). Asi que con el boton prendido se dibujan todas
    las partes que estan en pantalla -lo que quedo fuera de la vista se sigue salteando- y el
    desmonte se lee como lo que es: un salpicado sobre el Chaco. Cuesta: un paso de rueda con
    las deforestadas prendidas y el pais a la vista tarda 0,45 s (medido el 25-nov-2026 en Edge
    headless, 1.400 x 1.100). Es la capa mas pesada del sitio y es el peor caso; si molesta, el
    corte de 1 hectarea se puede subir en pipeline/capas_pais.py (a 10 ha quedan 15.241 parches
    y el 91,5% de las hectareas; a 25 ha, 9.439 y el 81,5%).
  mapa_base: >
    Fuera de la provincia no habia nada dibujado: el mapa base del pais son las 24 provincias
    del IGN y esta documentado aparte, en configs/dims/pais-provincias.yaml.
  salidas:
    cuencas-hidricas-pais.geojson: >
      85 rasgos, 32.866 vertices de 308.996, las 16 macrocuencas del SLD, 726.017 bytes.
    cursos-de-agua-pais.geojson: >
      6 rasgos (uno por tipo) con 10.472 tramos, 78.610 vertices de 643.646, 1.733.866 bytes.
    cobertura-del-suelo-2006-2007-pais.geojson: >
      42 rasgos (uno por clase) con 12.765 partes, 169.257 vertices de 14.115.655, las 42
      clases del SLD, 3.750.865 bytes.
    areas-deforestadas-2008-2017-pais.geojson: >
      UN rasgo con 33.222 parches, 128.513 vertices, una sola clase, 2.906.069 bytes.

advertencias_para_jc:
  - >
    NO HAY FECHA DE RELEVAMIENTO EN EL CATALOGO del nodo02 para ninguna de las dos capas. El
    mapa sirve para ver la zonificacion y la aptitud, no para decir en que anio se midieron.
    Queda preguntado (backlog 130).
  - >
    "Aptitud de Tierras" clasifica por su campo `apt_desc`, que junta el codigo y su
    descripcion ("G3 - Ganadera: Apta para pasturas, receptividad..."). Son las 10 clases que
    dibuja el propio INTA. El campo `descapt` de la misma capa trae los mismos textos con la
    codificacion de caracteres rota en la fuente ("AgrMcola", "Ganader agrdcola"): no se usa.
  - >
    "Suelo Santiago del Estero" se baja bien (302 poligonos) pero su leyenda oficial son 81
    UNIDADES CARTOGRAFICAS ("MKtc", "AEtc"), que al costado del mapa ocuparian mas que el mapa.
    La capa trae ademas drenaje, textura, salinidad, sodicidad y capacidad de uso, cualquiera
    de los cuales da una leyenda de 8 a 13 renglones que se lee. Decide JC (backlog 129).
  - >
    LAS CUENCAS DEL INTA NO CUBREN TODA LA PROVINCIA: el 4% de la superficie provincial no
    pertenece a ninguna macrocuenca en el dato del organismo (medido, ver
    transformacion.recorte_verificado). En el mapa ese 4% se ve como el fondo del panel, sin
    color. No es un error del recorte ni un hueco nuestro: es asi en la fuente.
  - >
    LA LEYENDA DE CUENCAS LISTA SEIS MACROCUENCAS de las 16 que declara el INTA: las otras diez
    no llegan a Santiago del Estero. Lo mismo con los cursos de agua: el INTA declara cuatro
    tipos y en la provincia hay tres (no hay ninguna QUEBRADA, que es un rasgo de montania).
  - >
    "CANADA" NO TIENE ESTILO EN EL SLD DEL INTA: su propio mapa no dibuja ese rasgo, que es uno
    solo de 1.666. Se publica igual, con un tono mas claro de la misma familia azul de los otros
    tres tipos y nombrado en la leyenda, porque perder un rasgo en silencio es peor. Esta
    declarado en pipeline/capas_inta.py con su motivo y su cuenta: si el INTA reexporta la capa
    y la cuenta cambia, la corrida se corta.
  - >
    EL SLD DE CUENCAS CLASIFICA POR DOS CAMPOS: 14 reglas por `Nom_Macro_` y 2 por `Cod_Macro_`
    (las dos de "Sin Aporte Significativo"). Las dos ultimas se cruzan por el NOMBRE de la
    regla, que coincide exactamente con el valor del campo que clasifica. No se adivina: si no
    coincidiera, esos rasgos quedarian sin leyenda y la corrida se cortaria.
  - >
    LA COBERTURA DEL SUELO ES DE 2006-2007: tiene casi veinte anios. Sirve para leer la
    estructura del paisaje (bosque, arbustal, pastizal, salinas, cuerpos de agua), no para
    decir que hay hoy en un lote. Su leyenda lista 16 clases de las 41 que declara el INTA:
    las otras no aparecen en la provincia.
  - >
    DE LAS AREAS DEFORESTADAS NO SE DIBUJAN LOS PARCHES DE MENOS DE 1 HECTAREA. Son 31.112 de
    los 49.467 que publica el INTA -el 63%- y suman 6.220 de las 628.883 hectareas, o sea el
    0,99% de la superficie. Una hectarea es la cuatrocientosmilesima parte de un pixel a
    escala provincial: no se ve, y dibujarla costaba 1,4 MB. El corte esta medido y se puede
    cambiar en pipeline/capas_inta.py (`minimo_ha`). Si hace falta la superficie exacta por
    departamento, el dato crudo del INTA trae `sup_ha` por parche y se calcula sin dibujarlo.
  - >
    CON "MOSTRAR TODO EL PAIS" PRENDIDO, DOS DE LAS SEIS CAPAS NO CRECEN: Aptitud de tierras y
    Zonificacion del uso del suelo se siguen viendo solo sobre la provincia, porque el INTA las
    publica solo para Santiago del Estero. No es un recorte nuestro: es todo lo que hay
    publicado. Las otras cuatro se dibujan enteras (dos del noroeste y dos nacionales).
  - >
    Y LA LEYENDA CAMBIA CUANDO SE PRENDE EL BOTON, porque afuera de la provincia aparecen
    clases que adentro no estan: cuencas pasa de 6 macrocuencas a 16, cursos de agua de 3 tipos
    a 6 y la cobertura del suelo de 16 clases a 42. Todas salen del mismo SLD del INTA.
  - >
    EL DIBUJO NACIONAL ES MAS GRUESO QUE EL PROVINCIAL, y se nota si se acerca mucho con el
    boton prendido: la cobertura del suelo esta simplificada a 2,2 km (contra 222 m la version
    de la provincia) porque entera pesa cuatro veces mas. El detalle fino vuelve apagando el
    boton. El motivo y las mediciones estan en `todo_el_pais.simplificacion`.
  - >
    FUERA DE LA PROVINCIA, LOS CURSOS DE AGUA TRAEN TRES CLASES QUE EL SLD DEL INTA NO DIBUJA:
    "CAÑADA" (16 tramos), "AGUADA" (1) y "ZANJON" (1). Es el mismo caso que la "CAÑADA" de
    adentro de la provincia y se resolvio igual: se publican nombradas en la leyenda, con tonos
    de la misma familia azul, declaradas en pipeline/capas_pais.py con su motivo y su cuenta.
  - >
    LA COBERTURA NACIONAL TRAE UNA CLASE MAS QUE LA PROVINCIAL EN EL SLD: "Hielo" (los campos
    de hielo patagonicos, 3 poligonos). El INTA le da color, pero lo escribe partido en dos
    pedazos con una funcion del SLD, y por eso antes quedaba sin leer. Ahora se lee: el color
    es el suyo (#55ffff), no uno nuestro.
  - >
    El Ordenamiento Territorial de Bosques Nativos 2015 esta en el catalogo del INTA (ficha
    dataset/11) pero su capa NO esta publicada en el WFS del nodo (de las 29 capas que sirve,
    ninguna es esa): no hay de donde bajarla. El OTBN de Santiago del Estero lo publican tambien
    la provincia y el Ministerio de Ambiente de la Nacion; si JC quiere ese mapa, hay que ir por
    esa fuente y no por el INTA (backlog 129).

publicacion:
  carpeta_publica: geo/capas
  capas:
    inta-aptitud-tierras:
      archivo: aptitud-de-tierras.geojson
      etiqueta: "Aptitud de tierras (INTA)"
      geometria: poligonos
      tooltip: "{clase}"
      clases_al_prender: true
      fuente: "INTA - Aptitud de Tierras"
    inta-zonificacion-uso-suelo:
      archivo: zonificacion-del-uso-del-suelo.geojson
      etiqueta: "Zonificación del uso del suelo (INTA)"
      geometria: poligonos
      tooltip: "{clase}"
      clases_al_prender: true
      fuente: "INTA - Zonificación del Uso del Suelo"
    inta-cuencas:
      archivo: cuencas-hidricas.geojson
      # "Mostrar todo el país": la capa entera, sin el recorte provincial (ver el bloque
      # `todo_el_pais` de arriba). El navegador la baja recien cuando prenden el boton.
      archivo_pais: cuencas-hidricas-pais.geojson
      etiqueta: "Cuencas hídricas (INTA)"
      geometria: poligonos
      tooltip: "{clase}"
      clases_al_prender: true
      fuente: "INTA - Cuencas hídricas del NOA"
    inta-cobertura-suelo:
      archivo: cobertura-del-suelo-2006-2007.geojson
      # "Mostrar todo el país": la capa nacional entera (ver `todo_el_pais`). 3,58 MB, que se
