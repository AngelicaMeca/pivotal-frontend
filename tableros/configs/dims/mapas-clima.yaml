# Procedencia de site/assets/clima/ (los mapas de la rama AgroClima, maqueta de JC
# "0000000000 Maqueta Clima 1.xlsx", 14-oct-2026). Mismo criterio que configs/dims/capas-ign.yaml
# y que los mapas del Observatorio Forrajero (site/assets/mapas-forrajeros/).
#
# Estos archivos NO son `raw/`: raw/ es para datos que el pipeline lee y transforma, y el
# pipeline de SharePoint solo baja Excels. Son IMAGENES que el sitio publica tal cual, sin
# leerlas: van en site/assets/ y se commitean, como el logo del manual de marca y los iconos de
# JC. El build las copia a public/plataforma/mapas/clima/<serie>/.
#
# De cada mapa hay TRES archivos (dos en la galeria de la ORA, que no tiene visor):
#   <nombre>.<gif|jpg>   el ORIGINAL, tal cual llego de SharePoint (sha256 abajo). Es el que
#                        abre el popup ("Imagen original") y el que dibuja "Mostrar todo el
#                        pais".
#   <nombre>-mini.jpg    la miniatura, 400 px de ancho, JPEG calidad 85. Es la que dibuja la
#                        grilla: son 115 mapas y con los originales la galeria bajaria 110 MB.
#                        Se generaron UNA vez (14-oct-2026) con System.Drawing de Windows
#                        (escalado bicubico de alta calidad) y se commitean junto al original.
#                        No se regeneran en el build: el pipeline no depende de ninguna
#                        libreria de imagenes.
#   <nombre>-sde.<png|jpg>  el RECORTE A LA PROVINCIA (27-oct-2026), que es lo que baja el
#                        VISOR georreferenciado y lo unico que en la practica se mira. La imagen
#                        del SEPA es el pais entero y el visor la dibuja recortada, o sea que de
#                        1,6 MB usaba el 6%: con eso el mapa tardaba ocho segundos en aparecer
#                        ("cuando hago el deploy a produccion, los mapas demoran mucho en
#                        cargar", la usuaria). Pesa entre 5 y 11 veces menos. Se generan a mano
#                        con `python -m pipeline.recorte_sepa --escribir` (necesita Pillow, que
#                        NO es dependencia del pipeline) y se commitean, igual que la miniatura;
#                        el rectangulo es de pixeles ENTEROS del original, asi que no mueve la
#                        georreferenciacion. Su posicion en la imagen la declara cada spec en
#                        `assets.recorte: {x, y}` y el build CORTA si a un mapa publicado le
#                        falta su recorte o si no mide lo mismo que los demas de la galeria.
#                        Solo las cinco galerias del SEPA: la ORA no lleva visor.
#
# El ROTULO de cada mapa (fechas) no se escribe en ningun lado: lo calcula el build a partir del
# NOMBRE del archivo (site_build.periodo_de_mapa_clima), con la regla de cada producto que
# declara su spec (3001..3006-*.yaml). JC: "CORRECTAS LAS FECHAS Y LAS MINIATURAS".
#
# Carpetas de origen en SharePoint (OneDrive de AUTOScraping, "Pivotal Repositorio/Bases de
# datos"), listadas el 14-oct-2026:
#   000 Entrega Beta Clima - Parte 1B/3001 - Humedad suelo SDE      (ORA; seis zip JPG-AAAAMMDD.zip)
#   000 Entrega Beta Clima - Parte 1B/3002 - Evapotranspiracion SDE (SEPA-INTA)
#   000 Entega beta clima - parte 2/3003 - Variacion Agua SDE       (SEPA-INTA)
#   000 Entega beta clima - parte 2/3004 - Porcentaje Agua suelo SDE (SEPA-INTA)
#   000 Entega beta clima - parte 2/3005 - NDVI - SDE               (SEPA-INTA)
#   000 Entega beta clima - parte 2/3006 - VCI -SDE                 (SEPA-INTA)
# ("Entega", sin r, es el nombre real de la carpeta.) Los numeros 3001..3006 son los codigos de
# base que JC escribe al pie de cada hoja de su maqueta ("3002 MP", etc.).
#
# Para sumar mapas nuevos: copiar el original y su miniatura (400 px) a la carpeta de la serie,
# agregar su linea aca y correr `make site`. Un nombre que no siga el patron de su spec corta el
# build: un mapa no se pierde en silencio.

carpeta: site/assets/clima
descargado: 2026-10-14
miniaturas: {ancho_px: 400, formato: jpg, calidad: 85, herramienta: "System.Drawing (Windows), una sola vez"}

series:
  ora-humedad:
    codigo_jc: "3001 MP"
    producto: "Estado de las reservas hídricas en el suelo por cultivo"
    organismo: "ORA (Oficina de Riesgo Agropecuario)"
    sharepoint: "000 Entrega Beta Clima - Parte 1B/3001 - Humedad suelo SDE"
    nota: >
      Llegaron como seis zip (JPG-20260726.zip ... JPG-20261004.zip, uno por fecha); los jpg de
      abajo son el contenido de esos zip, sin tocar. Los nombres son "[500_]<CULTIVO>_AAAAMMDD":
      en la fecha 20260920 vienen sin el prefijo "500_" y en el resto con el; el prefijo no
      cambia el contenido y el build acepta las dos formas. El codigo de cultivo es el de JC
      (G1 Girasol Temprano, G2 Girasol Tardio, M1 Maiz Temprano, P Pradera, TC Trigo Tardio, TL
      Trigo Temprano); se verifico que TC dice "TRIGO - Siembra tardía" en la imagen.
  evapotranspiracion:
    codigo_jc: "3002 MP"
    producto: "Evapotranspiración real máxima (decádica)"
    organismo: "SEPA - INTA (Instituto de Clima y Agua)"
    sharepoint: "000 Entrega Beta Clima - Parte 1B/3002 - Evapotranspiracion SDE"
    nombre: "et_AAAAMM_D (D = decada 1, 2 o 3 del mes)"
  variacion-agua:
    codigo_jc: "3003 MP"
    producto: "Variación del agua disponible hasta 2 metros (decádica)"
    organismo: "SEPA - INTA (Instituto de Clima y Agua)"
    sharepoint: "000 Entega beta clima - parte 2/3003 - Variacion Agua SDE"
    nombre: "db_AAAAMM_D"
  porcentaje-agua:
    codigo_jc: "3004 MP"
    producto: "Agua en el suelo con respecto al máximo posible (decádica)"
    organismo: "SEPA - INTA (Instituto de Clima y Agua)"
    sharepoint: "000 Entega beta clima - parte 2/3004 - Porcentaje Agua suelo SDE"
    nombre: "pj_AAAAMM_D"
  ndvi:
    codigo_jc: "3005 MP"
    producto: "Índice de vegetación NDVI (composición de 16 días)"
    organismo: "SEPA - INTA (Instituto de Clima y Agua)"
    sharepoint: "000 Entega beta clima - parte 2/3005 - NDVI - SDE"
    nombre: "iv_AAAADDD (DDD = dia juliano en que empieza la composicion)"
  vci:
    codigo_jc: "3006 MP"
    producto: "Índice de condición de la vegetación VCI (8 días)"
    organismo: "SEPA - INTA (Instituto de Clima y Agua)"
    sharepoint: "000 Entega beta clima - parte 2/3006 - VCI -SDE"
    nombre: "vi_AAAADDD (DDD = dia juliano en que empieza el periodo)"

