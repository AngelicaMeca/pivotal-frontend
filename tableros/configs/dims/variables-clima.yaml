  temperatura_abrigo_150cm_media:
    columnas_origen: ["Temperatura_Abrigo_150cm"]
    etiqueta: "Temp. abrigo 150 cm media"
    tipo: numero
    unidad: null
    nota_unidad: >
      Ni la fuente ni la definicion de JC dicen la unidad. Por los valores serian grados
      Celsius; a confirmar con JC antes de rotular el eje.
    en_maqueta: 1
    definicion_titulo: "Temperatura abrigo 150 cm (media, mínima y máxima)"
    definicion: "La \"temperatura en abrigo\" es la medida real de la temperatura del aire tomada dentro de un abrigo meteorológico (o garita). Este dispositivo aísla los termómetros de la radiación solar directa, la lluvia y el viento  permitiendo que el aire circule libremente para lograr una medición precisa de las condiciones ambientales"
    definicion_origen: "Estaciones!B14:C15"
    notas:
      - >
        El encabezado del INTA no dice "media" ("Temperatura_Abrigo_150cm"); la definicion de
        JC habla de "media, minima y maxima" y su maqueta la rotula "media". Por eso el nombre
        canonico lleva `_media`.

