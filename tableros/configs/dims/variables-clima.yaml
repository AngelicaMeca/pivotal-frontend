# Diccionario de las variables de clima diario (familia `clima-diario`, base 111: estaciones
# agrometeorologicas del INTA en Santiago del Estero). Lo lee adapters/clima_diario.py y lo
# puede leer el sitio: una entrada por variable CANONICA, con su nombre legible, su unidad y la
# definicion que escribio JC.
#
# De donde sale cada cosa (que no se mezcle lo de JC con lo nuestro):
#
#   columnas_origen  los encabezados EXACTOS de las hojas "DD <estacion>" que van a esta
#                    variable. El adapter corta la ingesta si una hoja trae un encabezado que no
#                    figura en ninguna variable: una columna nueva no se pierde en silencio.
#   etiqueta         nombre legible para el sitio. Para las 11 columnas de la tabla diaria de
#                    la maqueta "Maqueta Clima 1" es el rotulo de JC; para el resto es el
#                    encabezado del INTA con tildes y espacios.
#   unidad           SOLO si la dice la fuente o la definicion de JC (`unidad_origen` dice
#                    donde). Si no la dice nadie queda NULA y `nota_unidad` explica que falta:
#                    no se inventan unidades. Que la magnitud "parezca" grados o milimetros no
#                    alcanza; se le pregunta a JC.
#   definicion       texto LITERAL de JC en la hoja "Estaciones" del Excel (filas 14 a 61,
#                    columna C, a veces partido en dos filas o en dos celdas: aca va unido con un
#                    espacio). `definicion_origen` da las celdas. Nula si JC no la definio.
#                    OJO: en varias definiciones se perdieron las COMAS al pegar el texto (se ven
#                    como dos espacios seguidos: "la lluvia y el viento  permitiendo") y en la de
#                    precipitacion cronologica una coma partio el texto en dos celdas ("(horas" |
#                    " dias o meses)"). Se transcribe tal cual; la correccion la decide JC.
#   en_maqueta       posicion de la columna en la tabla diaria de la maqueta (1 a 11) o null.
#   tipo             numero (va a `valor`) o categoria (va a `valor_texto`, con su `dominio`).
#
# Ninguna variable declara agregacion: la maqueta muestra el dato DIARIO y el grafico de lineas
# diario. Si un cuadro pide meses o anios, la regla de agregacion (suma la lluvia, promedia la
# temperatura, maximo de la maxima...) la escribe constructor-reglas en el spec, no este archivo.
#
# Creado el 14-oct-2026 por ingestor-bases con la entrega-03 (clima).

variables:

