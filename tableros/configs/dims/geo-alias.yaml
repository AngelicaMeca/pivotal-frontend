# Etiquetas que la fuente usa para filas de agregado, no son departamentos.
# El adapter las marca como nivel_geo=provincia / pais y nunca las dropea.
agregados:
  "Total provincia": provincia
  "Total pais": pais

# Etiquetas con las que la fuente dice "no se el lugar". NO son departamentos y no se les
# inventa un codigo: el adapter les deja geo_id nulo, marca la fila con geo_sin_dato=true
# y la conserva entera (se agrega a nivel provincia). Cada base que las trae las declara
# en `geo.sin_dato` de su config.
sin_dato:
  - "S/D"      # base 53 (DTV algodón): 2.013 movimientos sin departamento de origen

alias_pendientes: []  # nombres vistos sin match, con propuesta y verificar: true
                      # (la base 9 no genero ninguno: trae los ids INDEC en el archivo;
                      #  la familia DTV tampoco: los 22 departamentos que nombra ya
                      #  estaban cargados por las bases 9 y 85)
