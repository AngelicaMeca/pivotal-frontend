# Tabla de alias de nombres geográficos → código INDEC.
# La mantiene ingestor-bases: cada nombre nuevo entra con verificar: true hasta confirmarse.
# Los 27 departamentos de Santiago del Estero (código provincia INDEC: 86).
# Los códigos de depto salen de las bases que ya traen ids (base 9 y base 30: depto_id = 86000 + código).
#
# Estructura: departamentos está anidado por código de provincia porque los nombres se
# repiten entre provincias (CAPITAL existe en Salta 66028 y en Tucumán 90084; RIVADAVIA
# en Santiago 86154 y en Salta 66133). Los valores son el código INDEC de 5 dígitos.
#
# Los nombres se escriben en MAYÚSCULAS y SIN TILDES, que es como los trae la fuente que dio
# los códigos. Una base cuyo Excel los escriba de otra forma ("Río Hondo", "Guasayán") declara
# `geo.normalizar_nombre: true` en su config y el adapter busca normalizado. Eso es para las
# ERRATAS de tipeo (la base 48 escribe "Ojo De Agua", "Ojo de Agua" y "Ojo de agua" para el
# mismo departamento): no se agrega una entrada por cada variante, porque no son nombres
# alternativos. Un nombre realmente distinto (LA BANDA vs BANDA) sí va como alias acá abajo.
provincia:
  "SANTIAGO DEL ESTERO": 86
  "Santiago del Estero": 86
  "CATAMARCA": 10
  "JUJUY": 38
  "SALTA": 66
  "TUCUMAN": 90
  "TUCUMÁN": 90
  # Sumadas el 2026-07-31 al ingerir la base 85 (DTE bovinos): son las provincias que
  # aparecen como contraparte de un movimiento de hacienda santiagueño. Los códigos son
  # los de provincia del INDEC. De estas NO se cargan departamentos: la base las trae por
  # nombre de partido y alcanza con agregar los flujos a nivel provincia.
  "BUENOS AIRES": 6
  "CORDOBA": 14
  "CORRIENTES": 18
  "CHACO": 22
  "ENTRE RIOS": 30
  "FORMOSA": 34
  "LA PAMPA": 42
  "LA RIOJA": 46
  "MISIONES": 54
  "SAN LUIS": 74
  "SANTA FE": 82
  # Sumadas el 2026-09-23 al ingerir la familia DTV (bases 53, 56, 57 y 75): son las
  # provincias a las que viaja producto vegetal santiagueño y que todavía no aparecían
  # como contraparte de ningún movimiento. Los códigos son los de provincia del INDEC
  # (codificación oficial de 2 dígitos), no una propuesta del agente, así que no llevan
  # verificar. De estas tampoco se cargan departamentos: la base las trae por nombre de
  # partido y alcanza con agregar los flujos a nivel provincia.
  "CIUDAD AUTONOMA DE BUENOS AIRES": 2
  "CHUBUT": 26
  "MENDOZA": 50
  "NEUQUEN": 58
  "RIO NEGRO": 62
  "SAN JUAN": 70
  "SANTA CRUZ": 78
  "TIERRA DEL FUEGO": 94
  # Sumada el 2026-09-23 al ingerir la base 8 (precios MCBA). No es una provincia nueva:
  # es la abreviatura con la que el Mercado Central escribe la PROCEDENCIA de la
  # mercadería ("SGO.EST."). El config de la base la traduce a este nombre canónico
  # (`geo.procedencias`), así que acá no hace falta una entrada nueva; queda anotado
  # dónde está esa traducción para no buscarla dos veces.

# Sembrado el 2026-07-30 desde la base 9 (cultivos extensivos), que trae idProvincia e
