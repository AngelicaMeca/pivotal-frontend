generado_por: python -m pipeline.capas_departamento
para: 'RF25 del ERS de Mapas: los valores de las capas activas por departamento.'
metodo:
  puntos: Punto en poligono. Exacto.
  lineas: Cada segmento se le asigna al departamento que contiene su PUNTO MEDIO y
    se suma su largo (haversine) ahi. No se corta el segmento en el limite, asi que
    el total provincial se conserva exacto y lo que puede estar mal atribuido es el
    pedazo que cruza un limite.
  corte_en_el_limite: Un pedazo cuyas dos puntas caen en departamentos distintos se
    parte al medio y se sigue, hasta que coincidan o hasta que baje de 25 metros.
  cota_de_error: '`cota_error_km` es el largo de los pedazos que quedaron abajo de
    los 25 metros sin resolverse: es el maximo que podria estar del lado equivocado,
    no el error real. Sin el corte en el limite esa cota llegaba al 6,56% en el ferrocarril.'
  no_es: 'No es distancia por camino ni accesibilidad: son kilometros de traza y cantidades
    de puntos adentro de cada departamento.'
