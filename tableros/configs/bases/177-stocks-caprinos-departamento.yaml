# Base 177 · Existencias y establecimientos caprinos por departamento (SENASA, 2025)
#
# Alimenta "Sgo. del Estero - Stock caprino por categoría, totales y cantidad de UP por
# departamento - año 2.025" (hoja "GanCaprST").
#
# OJO con los nombres de las categorías: acá vienen en SINGULAR (CHIVO, CABRA) y en la base
# 178, que es la serie provincial del mismo stock, en PLURAL (CHIVOS, CABRAS). Se publican con
# la misma etiqueta en las dos -el plural- para que el sitio pueda cruzarlas; el nombre crudo
# del Excel queda igual en `variable`, que es lo que permite rastrear la celda de origen.

base: 177
slug: stocks-caprinos-departamento
familia: stock
estado: activa

archivo:
  patron: "^177 - Existencias y establecimientos caprinos"

hojas:
  datos:
    - nombre: "Data SDE"
      header_fila: 2
      anio_fijo: 2025
      ambito: sde
      contenido: >
        El total provincial y sus 27 departamentos, con cinco categorias, el total, establecimientos y UP.
      geo:
        nivel: departamento
  ignorar:
    - nombre: "Modelo Análisis"
      motivo: >
        Hoja vacia (1x1).

columnas:
  "Provincia": departamento
  "Establecimientos": establecimientos
  "Unidades Productivas": unidades_productivas
  "CHIVO": chivos
  "CABRA": cabras
  "CABRITO": cabritos
  "CAPON": capones
  "CABRILLA/CHIVITO": cabrillas
  "TOTAL DE CAPRINOS": total_caprinos

valores:
  chivos:
    etiqueta: "Chivos"
    medida: cabezas
    especie: caprinos
    categoria: "Chivos"
    rol: componente
    unidad: cabezas
    agregable: true
  cabras:
    etiqueta: "Cabras"
    medida: cabezas
    especie: caprinos
    categoria: "Cabras"
    rol: componente
    unidad: cabezas
    agregable: true
  cabritos:
    etiqueta: "Cabritos"
    medida: cabezas
    especie: caprinos
    categoria: "Cabritos"
    rol: componente
    unidad: cabezas
    agregable: true
  capones:
    etiqueta: "Capones"
    medida: cabezas
    especie: caprinos
    categoria: "Capones"
    rol: componente
    unidad: cabezas
    agregable: true
  cabrillas:
    etiqueta: "Cabrillas/chivitos"
    medida: cabezas
    especie: caprinos
    categoria: "Cabrillas/chivitos"
    rol: componente
    unidad: cabezas
    agregable: true
  total_caprinos:
    etiqueta: "Total caprinos"
    medida: cabezas
    especie: caprinos
    categoria: "Total"
    # Es la suma de las categorias y nunca se suma con ellas.
    rol: agregado
    unidad: cabezas
    agregable: false
  establecimientos:
    etiqueta: "Establecimientos"
    medida: establecimientos
    especie: caprinos
    categoria: null
    rol: conteo
    unidad: establecimientos
    agregable: true
  unidades_productivas:
    etiqueta: "Unidades productivas"
    medida: unidades_productivas
    especie: caprinos
    categoria: null
    rol: conteo
    unidad: unidades
    agregable: true

geo:
  nivel: departamento
  usa_ids_indec: false
  normalizar_nombre: true
  particion: sde
  provincia_propia: 86
  resolver: [86]
  # La hoja no trae columna de provincia: toda la tabla es Santiago del Estero.
  provincia_fija: "SANTIAGO DEL ESTERO"
  agregados:
    nombres_total: ["SANTIAGO DEL ESTERO"]

salida:
  staging: "staging/base-177-stocks-caprinos-departamento.parquet"
  mart: hecho_stock_caprino
  particiones: [provincia, anio]

indice:
  fuente: "SENASA"
  titulo_en_el_indice: "Existencias y establecimientos caprinos"
