# Base 179 - Estratificacion de caprinos por departamento (SENASA, 2025)
#
# Alimenta la hoja "GanCaprEstr": "Stock caprino por categoria, estrato, cantidad de
# Establecimientos y UP por departamento" y "Participacion del stock caprino y cantidad de UP
# por estrato".
#
# La fila 2 del Excel es un "Totales" general sin departamento. Como la columna geografica
# viene vacia, el adapter la saltea igual que al pie de tabla; no se pierde nada porque el
# total se computa sobre el detalle, que es la regla del repo.

base: 179
slug: stocks-caprinos-estrato
familia: stock
estado: activa

archivo:
  patron: "^179 - Estratificaci"

hojas:
  datos:
    - nombre: "Data SDE"
      header_fila: 1
      anio_fijo: 2025
      ambito: sde
      contenido: >
        Una fila por departamento y estrato, con las cinco categorias caprinas y el total.
      geo:
        nivel: departamento
  ignorar:
    - nombre: "Modelo Análisis"
      motivo: >
        Hoja vacia (1x1).

columnas:
  "PROVINCIA": provincia_nombre
  "DEPARTAMENTO": departamento
  "TOTAL ESTABLECIMIENTOS": establecimientos
  "TOTAL RENSPAs": renspas
  "ESTRATO CAPRINOS": estrato
  "TOTAL CAPRINOS": total_caprinos
  "CHIVO": chivos
  "CABRA": cabras
  "CABRITO": cabritos
  "CAPÓN": capones
  "CABRILLA/CHIVITO": cabrillas

valores:
  chivos:
    etiqueta: "Chivos"
    medida: cabezas
    especie: caprinos
    categoria: "Chivos"
    rol: componente
    unidad: cabezas
    agregable: true
  cabras:
    etiqueta: "Cabras"
    medida: cabezas
    especie: caprinos
    categoria: "Cabras"
    rol: componente
    unidad: cabezas
    agregable: true
  cabritos:
    etiqueta: "Cabritos"
    medida: cabezas
    especie: caprinos
    categoria: "Cabritos"
    rol: componente
    unidad: cabezas
    agregable: true
  capones:
    etiqueta: "Capones"
    medida: cabezas
    especie: caprinos
    categoria: "Capones"
    rol: componente
    unidad: cabezas
    agregable: true
  cabrillas:
    etiqueta: "Cabrillas/chivitos"
    medida: cabezas
    especie: caprinos
    categoria: "Cabrillas/chivitos"
    rol: componente
    unidad: cabezas
    agregable: true
  total_caprinos:
    etiqueta: "Total caprinos"
    medida: cabezas
    especie: caprinos
    categoria: "Total"
    # Es la suma de las categorias y nunca se suma con ellas.
    rol: agregado
    unidad: cabezas
    agregable: false
  establecimientos:
    etiqueta: "Establecimientos"
    medida: establecimientos
    especie: caprinos
    categoria: null
    rol: conteo
    unidad: establecimientos
    agregable: true
  renspas:
    etiqueta: "RENSPAs"
    medida: renspas
    especie: caprinos
    categoria: null
    rol: conteo
    unidad: renspas
    agregable: true

geo:
  nivel: departamento
  usa_ids_indec: false
  normalizar_nombre: true
  particion: sde
  provincia_propia: 86
  resolver: [86]
  agregados:
    # Filas de total embebidas entre el detalle. Se MARCAN, no se borran.
    nombres_total: ["SANTIAGO DEL ESTERO", "Totales", "TOTALES", "Total"]

salida:
  staging: "staging/base-179-stocks-caprinos-estrato.parquet"
  mart: hecho_stock_caprino_estrato
  particiones: [provincia, anio]

indice:
  fuente: "SENASA"
  titulo_en_el_indice: "Estratificacion caprinos"
