# Base 154 · Existencias y UP de Cuota Hilton por departamento (SENASA, 2025)
#
# El segundo de los tres regímenes de la hoja "GanBov FLHT": "Sgo. del Estero - Stocks bovinos
# Cuota Hilton por categoría, totales y UP por departamento - año 2.025".
#
# Mismo criterio que los tambos (base 152): mart propio, no se suma al stock general de la
# base 48 porque son los mismos animales con otro recorte.

base: 154
