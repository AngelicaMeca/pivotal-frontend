salida:
  staging: "staging/base-230-dte-equinos.parquet"
  mart: hecho_movimientos_equinos
  particiones: [provincia, anio]

sensibilidad: >
  Trae la provincia de DESTINO de cada movimiento, o sea material de contraparte
