# Base 230 · DTE equinos, movimientos con origen en Santiago del Estero (SENASA)
#
# Alimenta la hoja "GanEquiDTE" de la maqueta: "Movimientos cabezas equinas por categoría y
# DTE Totales provincia - años 2.024 a 2.026 (parcial)" y "Movimientos equinos por categoría
# y DTE por Departamento - año 2.025". JC lo resume en la celda E88: "MISMA ESTRUCTURA Y
# ORGANIZACIÓN QUE TODOS LOS DTE ANIMALES (BASE BOVINOS)".
#
# EL ARCHIVO PESA 91 MB Y TIENE 471 FILAS. El resto es formato vacío que arrastra el Excel;
# openpyxl reporta 1.034.739 filas por hoja y son 268 + 203 con dato. No es un problema -el
# adapter salta las filas vacías- pero explica por qué la bajada de SharePoint tarda.
#
# SOLO SE LEE LA HOJA DE EGRESOS. La de ingresos viene rota y está en `pendientes` con el
# detalle; es la pregunta 82 del backlog.
#
# Esta base NO trae PARTIDO ORIGEN: el origen se conoce a nivel provincia (siempre Santiago)
# y el detalle departamental está del lado del destino. Para los movimientos INTERNOS -los
# 43 que tienen destino en la propia provincia- eso alcanza para el cuadro por departamento
# que pide JC; para los que salen de la provincia, el departamento de origen no existe en la
# fuente y no se inventa.

base: 230
slug: dte-equinos
familia: dte
estado: activa

archivo:
  patron: "^230 - DTE Equinos"

hojas:
  datos:
    - nombre: "Egreso SDE"
      header_fila: 1
      sentido: salida
      ambito: sde
      contenido: >
        268 movimientos con origen en Santiago del Estero, 2024 a 2026 (2026 parcial).
        Incluye los internos (43 filas con destino en la propia provincia). Las siete
        categorías suman el total declarado en LAS 268 FILAS: la hoja cierra.
  pendientes:
    - nombre: "Ingreso SDE"
      motivo: >
        La hoja viene ROTA y no se puede leer sin inventar. Tres cosas, todas verificadas
        sobre las 203 filas: (1) la última columna, "CANTIDAD DE ÉQUIDOS (INGRESO)", está
        VACÍA en las 203; (2) los valores están corridos un lugar a la izquierda, así que lo
        que figura bajo "YEGUA" es en realidad el total, y aun leyéndola corrida solo cierra
        en 156 de 203 filas; (3) las 203 filas dicen PROVINCIA ORIGEN = SANTIAGO DEL ESTERO
        y destino en otra provincia, que es un EGRESO y no un ingreso.
        No se ingiere hasta que JC confirme cómo se lee o reexporte la hoja (backlog 82).
      ambito: sde

columnas:
  "PROVINCIA ORIGEN": origen_provincia
  "AÑO EGRESO": anio
  "MES EGRESO": mes
  "PROVINCIA DESTINO": destino_provincia
  "PARTIDO DESTINO": destino_departamento
  "TIPO DE DESTINO": tipo_destino
  "CANTIDAD DTE": dte_equinos
  "ASNO": asnos
  "BURRO": burros
  "CABALLO": caballos
  "MULA": mulas
  "PADRILLO": padrillos
  "POTRILLO/A": potrillos
  "YEGUA": yeguas
  "CANTIDAD DE ÉQUIDOS (SALIDAS)": total_equinos

