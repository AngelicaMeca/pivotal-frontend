geo:
  nivel: departamento
  usa_ids_indec: false
  normalizar_nombre: true
  particion: sde
  provincia_propia: 86
  # Se resuelve a código solo el departamento de Santiago; los partidos de las otras
  # provincias se guardan por nombre, igual que en la base 85.
  resolver: [86]

tiempo:
