  total_bovinos:
    etiqueta: "Total vacunado"
    medida: cabezas
    especie: bovinos
    categoria: "Total"
    # Es la suma de las categorias y nunca se suma con ellas.
    rol: agregado
    unidad: cabezas
    agregable: false

geo:
  nivel: departamento
  usa_ids_indec: false
  normalizar_nombre: true
  particion: sde
  provincia_propia: 86
  resolver: [86]
  provincia_fija: "Santiago del Estero"
  agregados:
    # Cada hoja cierra con una fila "TOTALES" sin provincia. Se MARCA como agregado, no se
    # borra: sirve de control contra la suma de los departamentos.
    nombres_total: ["TOTALES", "Total", "TOTAL"]

salida:
  staging: "staging/base-228-vacunacion-bovina.parquet"
  mart: hecho_vacunacion_bovina
  particiones: [provincia, anio]

indice:
  fuente: "SENASA"
  titulo_en_el_indice: "Vacunacion antiaftosa bovina"
