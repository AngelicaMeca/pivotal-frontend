  usa_ids_indec: false
  normalizar_nombre: true
  particion: sde
  provincia_propia: 86
  resolver: [86]
  # La fila TOTALES no trae provincia: toda la planilla es de Santiago del Estero.
  provincia_fija: "SANTIAGO DEL ESTERO"
  agregados:
    nombres_total: ["TOTALES", "SANTIAGO DEL ESTERO", "Total"]

salida:
