# Base 85 - DTE Bovinos (SENASA). Movimientos de hacienda bovina desde y hacia
# Santiago del Estero, agregados por documento de transito electronico (DTE).
# Escrito sobre raw/entrega-01/85 - DTE Bovinos SDE.xlsx el 2026-07-31.
# El adapter de la familia (adapters/dte.py) lee este archivo y no sabe nada mas de la base.
base: 85
slug: dte-bovinos
familia: dte
estado: activa
demo_prioritaria: true

archivo:
  patron: "^85 - DTE Bovinos"     # regex sobre el nombre del archivo en raw/entrega-NN/

# ---------------------------------------------------------------------------
# HOJAS
# ---------------------------------------------------------------------------
# Las dos hojas de datos tienen exactamente el mismo schema de 34 columnas, pero el
# header esta en filas distintas: la de destino lleva arriba un rotulo "INTRODUCCION"
# en la fila 1 y recien en la 2 empiezan los encabezados.
#
# Las dos hojas NO se pisan: ORIGEN es todo lo que sale de un departamento santiaguenio
# (incluidos los movimientos internos SDE -> SDE) y DESTINO es todo lo que entra a
# Santiago desde otra provincia. Verificado al perfilar: en DESTINO no hay una sola fila
# con provincia de origen Santiago del Estero. Se pueden unir sin duplicar cabezas.
hojas:
  datos:
    - nombre: "Data ORIGEN SDE"
      header_fila: 1
      sentido: salida               # el movimiento arranca en Santiago
      ambito: sde                   # publicable, ver nota `sensibilidad`
      contenido: >
        28.112 movimientos con origen en Santiago del Estero, 2022 a 2026 (2026 parcial).
        Incluye los internos (10.505 filas con destino en la propia provincia).
    - nombre: "Data DESTINO SDE"
      header_fila: 2
      sentido: entrada              # introduccion: el movimiento termina en Santiago
      ambito: sde
      contenido: >
        17.920 movimientos con destino en Santiago del Estero y origen en otra provincia,
        2022 a 2026 (2026 parcial).

  ignorar:
    - nombre: "Modelo Analisis"
      motivo: >
        Especificacion de negocio escrita por JC: que cortes quiere ver (movimientos totales
        sin introduccion, movimientos internos, participacion por categoria sobre el total) y
        la instruccion "AGREGAR TODAS LAS OPERACIONES DE VARIACIONES COMO EN AGRICOLA".
        No son datos: va a constructor-reglas para convertirse en specs/modelos/base-85-*.yaml.
        Sus tablas ya estan calculadas a mano y sirven de control: ver nota `control`.
    - nombre: "Hoja2"
      motivo: "Hoja vacia (1 fila x 1 columna)."

# ---------------------------------------------------------------------------
# COLUMNAS: origen -> canonico snake_case (identicas en las dos hojas de datos)
# ---------------------------------------------------------------------------
columnas:
  "MOTIVO": motivo
  "TIPO ORIGEN": tipo_origen
  "TIPO DESTINO": tipo_destino
  "AÑO": anio
  "MES": mes
  "MES_INICIO": mes_inicio            # fecha del primer dia del mes; redundante con anio+mes,
                                      # se mapea para no romper el chequeo de columnas y no se usa
  "PROVINCIA ORIGEN": origen_provincia
  "PARTIDO ORIGEN": origen_departamento
  "PROVINCIA DESTINO": destino_provincia
  "PARTIDO DESTINO": destino_departamento
  "DTE BOVINOS": dte_bovinos
  "TOTAL BOVINOS": total_bovinos
  "TERNEROS": terneros
  "TERNERAS": terneras
  "NOVILLITOS": novillitos
  "NOVILLOS": novillos
  "TORITOS / MEJ": toritos
  "TOROS": toros
  "VACAS": vacas
  "VAQUILLONAS": vaquillonas
  "DTE BUBALINOS": dte_bubalinos
  "TOTAL BUBALINOS": total_bubalinos
  "TERNEROS BUB": terneros_bub
  "TERNERAS BUB": terneras_bub
  "NOVILLITOS BUB": novillitos_bub
  "NOVILLOS BUB": novillos_bub
  "TORITOS / MEJ BUB": toritos_bub
  "TOROS BUB": toros_bub
  "VACAS BUB": vacas_bub
  "VAQUILLONAS BUB": vaquillonas_bub
  "BOVINOS INGRESOS A TAMBOS ACTUALES": ingresos_tambo
  "BOVINOS EGRESOS DE TAMBOS ACTUALES": egresos_tambo
  "BOVINOS INGRESOS A EC ACTUALES": ingresos_ec
  "BOVINOS EGRESOS DE EC ACTUALES": egresos_ec

