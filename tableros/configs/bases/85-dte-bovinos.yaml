# ---------------------------------------------------------------------------
# TIEMPO
# ---------------------------------------------------------------------------
tiempo:
  grano: anio_mes
  columnas: [anio, mes]
  cobertura_real: "2022-01 a 2026-06"   # 2026 esta incompleto, ver nota `anomalia`

# ---------------------------------------------------------------------------
# GEOGRAFIA (dos puntas: origen y destino)
# ---------------------------------------------------------------------------
# El archivo trae la geografia por NOMBRE, no con ids INDEC (al reves que la base 9),
# asi que se resuelve contra configs/dims/geo-alias.yaml.
#
# `resolver` = provincias a las que se les asigna codigo INDEC de departamento. Solo
# Santiago, que es la unica con dim_geo cargada. Las otras 15 provincias que aparecen
# como contraparte se guardan con nombre de provincia y de partido, provincia_id INDEC
# y geo_id nulo: alcanza para agregar flujos por provincia sin tener que cargar los 395
# partidos del resto del pais.
geo:
  particion: sde
  provincia_propia: 86
  resolver: [86]
  nivel: departamento
  agregados:
    fila_total_al_pie: true    # las dos hojas cierran con una fila de totales sin motivo
                               # ni anio. El adapter la marca es_agregado_fila=true.

# ---------------------------------------------------------------------------
# SALIDA
# ---------------------------------------------------------------------------
salida:
  staging: "staging/base-85-dte-bovinos.parquet"
  mart: hecho_movimientos_hacienda
  particiones: [provincia, anio]

# ---------------------------------------------------------------------------
# METADATA HEREDADA DEL INDICE (configs/manifiesto-indice.yaml, base nro 85)
# ---------------------------------------------------------------------------
indice:
  fuente: "SENASA"
  cita_fuente_al_pie: "Fuente: SENASA"

# ---------------------------------------------------------------------------
notas:
  - fecha: "2026-07-31"
    tipo: familia
    texto: >
      Familia `dte`: movimientos agregados por documento de transito, con las categorias
      WIDE (una columna por categoria). Las bases 144 (porcinos) y 145 (ovinos) son de la
      misma familia pero traen la categoria LONG; cuando entren hay que agregarle al adapter
      el modo `categoria_long`, no escribir un adapter nuevo.
  - fecha: "2026-07-31"
    tipo: sensibilidad
    texto: >
      Las dos hojas quedan con ambito `sde` y por lo tanto publicables. El criterio: CLAUDE.md
      marca como sensibles las COMPARACIONES entre provincias (del tipo "SDE produce mas que
      Tucuman"). Esto no es una comparacion sino un flujo: de donde sale y a donde va la
      hacienda santiaguenia, que es justamente lo que la demo tiene que contar. Igual conviene
      que Francisco lo confirme antes de publicar la vista, porque el dato deja ver que
      provincias le compran hacienda a Santiago.
  - fecha: "2026-07-31"
    tipo: control
    texto: >
      La hoja Modelo Analisis de JC trae los totales por anio ya calculados a mano. Sirven de
      control de la ingesta: 2022 a 2025 coinciden EXACTO con la suma de la hoja ORIGEN
      (2022: 29.209 DTE y 1.030.999 cabezas; 2023: 27.778 y 959.102; 2024: 27.058 y 953.831;
      2025: 27.844 y 966.161). El unico anio que no cierra es 2026, ver nota `anomalia`.
  - fecha: "2026-07-31"
    tipo: anomalia
    texto: >
      Las dos hojas traen al pie una fila con totales y sin motivo ni anio (r28115 en ORIGEN,
      r17924 en DESTINO). Se marcan con es_agregado_fila=true, no se borran. Ojo con las dos:
      en ORIGEN el total dice 4.192.293 cabezas y el detalle suma 4.192.353 (60 de diferencia);
      en DESTINO el "total" dice 489.284, que no es el total de nada sino exactamente el
      subtotal de 2025. Ninguna de las dos se puede usar como control. Para qa-datos.
  - fecha: "2026-07-31"
    tipo: anomalia
    texto: >
      Las cifras de 2026 de la hoja Modelo Analisis quedaron viejas respecto del detalle:
      JC tiene 8.549 DTE y 282.200 cabezas, y el detalle suma 8.553 y 282.260. La diferencia
      de 60 cabezas es la misma que la de la fila de total al pie, asi que la lectura probable
      es que se agregaron filas al detalle y no se refrescaron ni el resumen ni el total.
      No se corrige nada: manda el detalle. Para qa-datos y para preguntarle a JC.
  - fecha: "2026-07-31"
    tipo: anomalia
    texto: >
      La hoja DESTINO trae 30 motivos distintos contra 18 de ORIGEN, y entre los que solo
      aparecen ahi hay varios ajenos a la hacienda bovina: "Traslado de Aves Ornamentales",
      "Vareo/Competencia", "Venta a forrajerias, agropecuarias y veterinarias", "Deportes",
      "Traspatio o autoconsumo". Se ingieren igual. Para qa-datos: preguntarle a JC si son
      residuo de la clasificacion general de SENASA y si hay que excluirlos de los totales.
  - fecha: "2026-07-31"
    tipo: anomalia
    texto: >
      3 filas de la hoja ORIGEN tienen TOTAL BOVINOS distinto de la suma de sus 8 categorias
      (ej. r con AGUIRRE -> NUEVE DE JULIO 2022-12: total 182 contra 180 sumando categorias).
      En DESTINO no pasa en ninguna. Para qa-datos.
  - fecha: "2026-07-31"
    tipo: cobertura
    texto: >
      Esta base si cubre los 27 departamentos de Santiago, incluido SALAVINA, que era el unico
      que faltaba en la base 9. Ademas nombra "LA BANDA" al departamento que la base 9 llama
      "BANDA" (86035): los dos nombres quedaron cargados en geo-alias.yaml.
  - fecha: "2026-07-31"
    tipo: dato
    texto: >
      Los bubalinos (bufalos) estan en cero en toda la hoja ORIGEN y suman 845 cabezas en
      DESTINO. Las columnas se ingieren igual, marcadas con especie=bubalinos, para no
      esconder que la fuente las trae. Ninguna vista deberia mezclarlas con bovinos.
