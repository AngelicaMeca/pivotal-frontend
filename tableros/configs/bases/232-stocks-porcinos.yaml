# Base 232 · Existencias porcinas por departamento, 2017 a 2026 (SENASA)
#
# Alimenta la hoja "GanPorcST": el mapa por departamento y los dos cuadros de evolución
# ("Evolución del stock porcino por categoría y totales - años 2.017 a 2.025" y "... total por
# departamento").
#
# UNA HOJA POR AÑO ("SDE-2017" a "SDE-2026") y ninguna trae columna de año: lo declara cada
# hoja con `anio_fijo`. No se deduce del nombre de la hoja a propósito — si mañana JC agrega
# una hoja con otro criterio de nombre, el config tiene que decirlo y no adivinarlo.
#
# La hoja trae 2026, que la maqueta todavía no muestra (sus cuadros llegan hasta 2025). Se
# ingiere igual: el recorte de la ventana lo decide el spec de la vista, no la ingesta.

base: 232
slug: stocks-porcinos
familia: stock
estado: activa

archivo:
  patron: "^232 - Existencias Porcinas por Departamento"

hojas:
  datos:
    - nombre: "SDE-2017"
      header_fila: 2
      anio_fijo: 2017
      ambito: sde
      contenido: >
        Existencias porcinas del anio 2017: el total provincial y sus departamentos.
      geo:
        nivel: departamento
