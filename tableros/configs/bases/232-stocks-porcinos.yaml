      geo:
        nivel: departamento
  ignorar:
    - nombre: "Analisis"
      motivo: >
        Pivoteos que arma JC sobre las hojas de datos (matriz departamento x anio y composicion por categoria). Los pivoteos los hace el pipeline.
    - nombre: "Hoja11"
      motivo: >
        Vacia.

columnas:
  "Provincia/Departamento": departamento
  "Padrillo": padrillos
  "Cerda": cerdas
  "Lechon": lechones
  "Capones": capones
  "Cachorro": cachorros
  "M.E.I.": mei
  "Cachorra": cachorras
  "Total Porcinos": total_porcinos

valores:
  padrillos:
    etiqueta: "Padrillos"
    medida: cabezas
    especie: porcinos
    categoria: "Padrillos"
    rol: componente
    unidad: cabezas
    agregable: true
  cerdas:
