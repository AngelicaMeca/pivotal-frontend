# ---------------------------------------------------------------------------
# TIEMPO
# ---------------------------------------------------------------------------
# Grano ANIO calendario: el stock es una foto al 31 de diciembre, no un acumulado del anio.
# Es el mismo grano que la base 85, asi que las dos comparten dim_tiempo.
tiempo:
  grano: anio
  columna: anio

# ---------------------------------------------------------------------------
# GEOGRAFIA
# ---------------------------------------------------------------------------
# El archivo NO trae ids INDEC: los departamentos vienen por nombre y en Title Case con
# tildes ("Río Hondo", "Guasayán"), mientras que geo-alias.yaml los tiene en mayusculas y sin
# tildes. Ademas la fuente escribe el mismo departamento de varias formas ("Ojo De Agua",
# "Ojo de Agua", "Ojo de agua"). Por eso el lookup se hace NORMALIZADO (mayusculas, sin
# tildes, espacios colapsados): resuelve las tres variantes contra la misma entrada y evita
# ensuciar la tabla de alias con ruido de tipeo. Ver notas.
geo:
  nivel: departamento
  usa_ids_indec: false
  normalizar_nombre: true
  particion: sde
  provincia_propia: 86
  resolver: [86]             # solo SDE: la hoja de datos no trae otras provincias
  agregados:                 # filas de total embebidas entre el detalle: se MARCAN, no se borran
    nombres_total: ["Total"]

# ---------------------------------------------------------------------------
# SALIDA
# ---------------------------------------------------------------------------
salida:
  staging: "staging/base-48-stocks-bovinos.parquet"
  mart: hecho_stock_bovino
  particiones: [provincia, anio]

# ---------------------------------------------------------------------------
# METADATA HEREDADA DEL INDICE (configs/manifiesto-indice.yaml, base nro 48)
# ---------------------------------------------------------------------------
indice:
  fuente: "MAGyP"
  frecuencia: "anual"
  rango_declarado: "2007-01-01 a 2025-12-31"
  registros_declarados: 7633     # OJO: el archivo trae 392 filas. Ver notas (cobertura).
  unidades_declaradas: [cabezas, categorias]
  geografia_declarada: []
  hojas_declaradas: ["Data SDE"]
  estatus_modelo: "CON MODELO"
  cita_fuente_al_pie: "Fuente: MAGyP"

# ---------------------------------------------------------------------------
notas:
  - fecha: "2026-08-05"
    tipo: familia
    texto: >
      Familia `stock`, NUEVA (la novena). No encajaba en ninguna de las ocho de CLAUDE.md: no es
      `tidy` (las categorias vienen wide, una columna por categoria, no una fila por
      observacion), no es `dte` (no hay origen-destino, ni motivo, ni mes) y no es `wide-mes`
      (lo que abre a lo ancho es la categoria, no el mes). La decision se tomo mirando header y
      forma, no el nombre del archivo. El config declara los valores igual que la 85, asi que
      quien conoce esa base lee esta sin aprender nada nuevo.
  - fecha: "2026-08-05"
    tipo: drift
    texto: >
      El indice declara la hoja "Data SDE" y el archivo la trae como "Data stock SDE". Ademas
      el archivo suma dos hojas no declaradas: "Modelo An 01" y "Estratificación".
  - fecha: "2026-08-05"
    tipo: cobertura
    texto: >
      El indice declara rango 2007-2025 y 7.633 registros. El archivo cubre 2012-2025 (14
      anios, 28 filas por anio, 392 filas en total). Faltan los anios 2007 a 2011 que JC
      declaro. Para qa-datos: preguntarle a JC si el recorte es a proposito o si falta data.
  - fecha: "2026-08-05"
    tipo: anomalia
    texto: >
      Cada anio trae una fila "Total" embebida ENTRE el detalle departamental (es la primera
      fila de cada anio, no la ultima). Son 14 filas de agregado sobre 392. No se dropean:
      quedan marcadas con es_agregado_geo=true y nivel_geo=provincia. Es el caso que el propio
      JC advirtio y que esta en docs/audit-bases-1ra-entrega.md.
  - fecha: "2026-08-05"
    tipo: anomalia
    texto: >
