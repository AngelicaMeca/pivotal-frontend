  cantidad_up:
    etiqueta: "Unidades productivas"
    medida: unidades_productivas
    especie: bovinos
    categoria: "Total"
    rol: simple
    unidad: up
    agregable: true

  # --- Hoja "Estratificación" (13-oct-2026): nueve estratos x cuatro campos. El estrato lo
  # declara cada valor (viene en el grupo del header, no en una columna). Las UP de esta hoja
  # se guardan como `renspas`, que es como se llaman las UP en las otras bases por estrato
