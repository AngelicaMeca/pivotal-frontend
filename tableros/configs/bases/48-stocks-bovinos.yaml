# Base 48 - Stocks bovinos por departamento y categoria (MAGyP). Existencias al 31 de
# diciembre de cada anio, grano anio x departamento, con las cabezas abiertas por categoria.
# Escrito por ingestor-bases el 2026-08-05 sobre
# raw/entrega-01/48 - Stocks bovinos por depto y categ - SDE.xlsx.
# El adapter de la familia (adapters/stock.py) lee este archivo y no sabe nada mas de la base.
#
# OJO, no confundir con la base 85: aca las cabezas son STOCK (cuantos animales HAY en un
# momento) y en la 85 son FLUJO (cuantos se MOVIERON en el anio, y un animal que se movio tres
# veces cuenta tres). No se suman entre si ni se comparan sin aclararlo.
base: 48
slug: stocks-bovinos
familia: stock
estado: activa
demo_prioritaria: true

archivo:
  patron: "^48 - Stocks bovinos"     # regex sobre el nombre del archivo en raw/entrega-NN/

# ---------------------------------------------------------------------------
# HOJAS
# ---------------------------------------------------------------------------
# El indice de JC declara una sola hoja, "Data SDE". El archivo recibido la trae como
# "Data stock SDE" y ademas suma otras dos no declaradas: "Modelo An 01" y "Estratificacion".
# Ver notas (drift).
hojas:
  datos:
    - nombre: "Data stock SDE"
      header_fila: 2               # la r1 esta vacia
      ambito: sde                  # publicable
      contenido: "Santiago del Estero por departamento, anios 2012 a 2025, 28 filas por anio"
      geo:
        nivel: departamento

    # Estratificacion de establecimientos por tamanio del rodeo (13-oct-2026, decision de la
    # usuaria: JC la pide en su hoja "GanBovESTR", celda E165 -"Base de estratos y UP | 48 |
    # HOJA ESTRATIFICACION"-). Es la foto a diciembre de cada anio por PROVINCIA, con nueve
    # estratos y cuatro campos por estrato. Entra SOLO la fila de Santiago del Estero
    # (`solo_filas`): las otras provincias y el total pais son material comparativo que no se
    # publica (CLAUDE.md). Las filas son provinciales: entran como agregado de la provincia
    # (`geo.nivel: provincia`), con su estrato, y no se mezclan con el stock departamental
    # (pipeline/stock.py las separa por la columna `estrato`).
    - nombre: "Estratificación"
      header_fila: 4
      encabezado_grupo_fila: 3
      ambito: sde
      contenido: "Santiago del Estero por estrato de tamanio, anios 2012 a 2025 (una fila por anio)"
      geo:
        nivel: provincia
      solo_filas:
        provincia_nombre: ["Santiago del Estero"]
      columnas:
        "Provincia\n(sin tilde)": provincia_sin_tilde
        "Hasta 20 | Estableci-mientos": hasta_20_establecimientos
        "Hasta 20 | Cantidad de UP": hasta_20_up
        "Hasta 20 | Vacas": hasta_20_vacas
        "Hasta 20 | Total Bovinos": hasta_20_total
        "Entre 21 y 100 | Estableci-mientos": e21_100_establecimientos
        "Entre 21 y 100 | Cantidad de UP": e21_100_up
        "Entre 21 y 100 | Vacas": e21_100_vacas
        "Entre 21 y 100 | Total Bovinos": e21_100_total
        "Entre 101 y 250 | Estableci-mientos": e101_250_establecimientos
        "Entre 101 y 250 | Cantidad de UP": e101_250_up
        "Entre 101 y 250 | Vacas": e101_250_vacas
        "Entre 101 y 250 | Total Bovinos": e101_250_total
        "Entre 251 y 500 | Estableci-mientos": e251_500_establecimientos
        "Entre 251 y 500 | Cantidad de UP": e251_500_up
        "Entre 251 y 500 | Vacas": e251_500_vacas
        "Entre 251 y 500 | Total Bovinos": e251_500_total
        "Entre 501 y 750 | Estableci-mientos": e501_750_establecimientos
        "Entre 501 y 750 | Cantidad de UP": e501_750_up
        "Entre 501 y 750 | Vacas": e501_750_vacas
        "Entre 501 y 750 | Total Bovinos": e501_750_total
        "Entre 751 y 1000 | Estableci-mientos": e751_1000_establecimientos
        "Entre 751 y 1000 | Cantidad de UP": e751_1000_up
        "Entre 751 y 1000 | Vacas": e751_1000_vacas
        "Entre 751 y 1000 | Total Bovinos": e751_1000_total
        "Entre 1001 y 2000 | Estableci-mientos": e1001_2000_establecimientos
        "Entre 1001 y 2000 | Cantidad de UP": e1001_2000_up
        "Entre 1001 y 2000 | Vacas": e1001_2000_vacas
        "Entre 1001 y 2000 | Total Bovinos": e1001_2000_total
        "Entre 2001 y 4000 | Estableci-mientos": e2001_4000_establecimientos
        "Entre 2001 y 4000 | Cantidad de UP": e2001_4000_up
        "Entre 2001 y 4000 | Vacas": e2001_4000_vacas
        "Entre 2001 y 4000 | Total Bovinos": e2001_4000_total
        "Más de 4000 | Estableci-mientos": mas_4000_establecimientos
        "Más de 4000 | Cantidad de UP": mas_4000_up
        "Más de 4000 | Vacas": mas_4000_vacas
        "Más de 4000 | Total Bovinos": mas_4000_total
        # El grupo "Total" es la suma de los nueve estratos: se mapea para que el header
        # cierre pero NO se declara en `valores` (no entra al mart). El total provincial se
        # recalcula sumando los estratos, como el de los departamentos; verificado 2025:
        # 5.281 / 9.009 / 477.780 / 1.083.349, identico a esta columna.
        "Total | Estableci-mientos": control_total_establecimientos
        "Total | Cantidad de UP": control_total_up
        "Total | Vacas": control_total_vacas
        "Total | Total Bovinos": control_total_total

  ignorar:
    - nombre: "Modelo An 01"
      motivo: >
        Especificacion de negocio escrita por JC: la tabla de composicion del stock por
        categoria comparando dos anios, con participaciones, y una columna ZONA que agrupa los
        departamentos en zonas productivas. No son datos: va a constructor-reglas para
        convertirse en specs/modelos/48-*.yaml. La zonificacion NO existe en ninguna otra
        parte del repo y hay que levantarla de ahi.

# ---------------------------------------------------------------------------
# COLUMNAS: origen -> canonico snake_case
# ---------------------------------------------------------------------------
# El titulo de la columna de departamento viene con un espacio al final en el Excel
# ("Partido/Departamento "). Se declara sin el espacio: el adapter compara con strip.
columnas:
  "Año": anio
  "Provincia": provincia_nombre
  "Partido/Departamento": departamento
  "Vacas": vacas
  "Vaquillonas": vaquillonas
  "Novillos": novillos
  "Novillitos": novillitos
  "Terneros": terneros
  "Terneras": terneras
  "Toros": toros
  "Toritos": toritos
  "Bueyes": bueyes
  "Total": total_bovinos
  "Cantidad de UP": cantidad_up

# ---------------------------------------------------------------------------
# VALORES: las columnas que el adapter despivotea a filas.
# ---------------------------------------------------------------------------
# Aca lo que viene WIDE es la CATEGORIA del animal, no la medida: las nueve columnas son la
# misma medida (cabezas) abierta por categoria. Por eso cada entrada declara `categoria`, y
# `rol` distingue el agregado de sus partes para que nadie sume el Total con las categorias.
#
# Los nombres de categoria se dejan tal cual los escribe esta fuente. Unificarlos con los de
# la base 85 ("Toritos / mejoradores") es decision de reglas, no de ingesta: ver notas.
valores:
  vacas:
    etiqueta: "Vacas"
    medida: cabezas
    especie: bovinos
    categoria: "Vacas"
    rol: componente
    unidad: cabezas
    agregable: true
  vaquillonas:
