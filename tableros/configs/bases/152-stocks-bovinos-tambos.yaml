# Base 152 · Existencias bovinas en TAMBOS por departamento (SENASA, 2025)
#
# Uno de los tres regímenes de la hoja "GanBov FLHT" (Feed Lots, Cuota Hilton y Tambos):
# "Sgo. del Estero - Stocks bovinos en Tambos por categoría, totales y UP por departamento".
#
# Va a su propio mart y NO se mezcla con el stock bovino general de la base 48: son los
# mismos animales contados con otro recorte -solo los establecimientos con tambo-, así que
# sumarlos daría doble conteo. Son 8 departamentos, no 27: solo donde hay tambos.

base: 152
slug: stocks-bovinos-tambos
familia: stock
estado: activa

archivo:
  patron: "^152 - Existencias bovinos en tambos"

hojas:
  datos:
    - nombre: "Data SDE"
      header_fila: 1
      anio_fijo: 2025
      ambito: sde
      contenido: >
        Los departamentos con tambo (8), con nueve categorias bovinas, el total, establecimientos, UP y titulares.
      geo:
        nivel: departamento
  ignorar:
    - nombre: "Modelo Analisis"
      motivo: >
        Hoja vacia (1x1).

columnas:
  "PROVINCIA": provincia_nombre
  "DEPARTAMENTO": departamento
  "ESTABLECIMIENTOS": establecimientos
  "UP": unidades_productivas
  "TITULARES": titulares
  "TOTAL BOVINOS": total_bovinos
  "TERNEROS": terneros
  "TERNERAS": terneras
  "NOVILLITOS": novillitos
  "TORITOS": toritos
  "NOVILLOS": novillos
  "VAQUILLONAS": vaquillonas
  "VACAS": vacas
  "TOROS": toros
  "BUEYES": bueyes

