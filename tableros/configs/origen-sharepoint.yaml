# De donde salen los Excels de los tableros.
#
# Los Excels de JC viven en el OneDrive de AUTOScraping, carpeta "Pivotal Repositorio/Bases de
# datos". En cada publicacion de Vercel, pipeline/sharepoint.py los baja con la API de Microsoft
# Graph, los ordena con la forma de raw/ (entrega-NN/, indice/) y el pipeline arma los tableros.
# La tarea de GitHub usa esta misma lista para saber si cambiaron. Ver
# docs/actualizacion-automatica.md para las credenciales.
#
# Para sumar una entrega nueva: agregar una linea en `entregas` con el nombre de su carpeta en
# SharePoint. Una carpeta que ya se llame "entrega-NN" no hace falta declararla.

# Sitio de OneDrive (sale de la URL: autoscraping-my.sharepoint.com/personal/<usuario>)
sitio: "autoscraping-my.sharepoint.com:/personal/fbattan_autoscraping_com"

# Carpeta dentro de "Documentos" de ese OneDrive
carpeta: "Pivotal Repositorio/Bases de datos"

# entrega del pipeline -> carpeta en SharePoint (dentro de `carpeta`)
entregas:
  entrega-01: "00000 1ra entrega bases"
  # Ganaderia (9-oct-2026). 24 archivos: los stocks, estratos y movimientos de las siete
  # especies de la maqueta "Maqueta Ganad VF", mas vacunacion, Siocarnes y la cuenca
  # lechera. Incluye de nuevo la base 48, que ya estaba en la entrega-01: gana la mas
  # reciente. La lectura de la maqueta esta en docs/maqueta-ganaderia.md.
  entrega-02: "00000 Entrega Beta Ganaderia"
  # Clima (14-oct-2026), maqueta "Maqueta Clima 1". De esta carpeta el pipeline solo baja el
  # Excel de las estaciones del INTA (base 111). Los mapas de las subcarpetas 3001-3002 y de la
  # carpeta "000 Entega beta clima - parte 2" (3003-3006) son imagenes: se publican como assets
  # en site/assets/clima/, igual que los mapas forrajeros.
  entrega-03: "000 Entrega Beta Clima - Parte 1B"

# Carpeta con las versiones del indice de JC ("Bases para Beta - N.xlsx"), dentro de `carpeta`.
# Opcional: el build no la usa (solo la etapa `indice`). null = no se baja.
indice: null

# DOCUMENTOS que el sitio publica tal cual (no son Excels y el pipeline no los lee como datos).
# Cada clave es una carpeta de raw/documentos/<clave>/ y su valor la carpeta de SharePoint, con
# la ruta COMPLETA dentro de "Documentos" (no cuelga de `carpeta`). Se bajan todos los PDF de la
# carpeta y de sus subcarpetas, juntos en una sola carpeta (dos PDF con el mismo nombre cortan).
# Entran en la HUELLA: un PDF nuevo de JC dispara la publicacion horaria igual que un Excel.
documentos:
  # 15-oct-2026, pedido de la usuaria: la pagina AgroClima > INTA AgroMet (hoja "ClimAGM" de la
  # maqueta de clima) sirve los PDF de la base "2008 IC-CD" de JC desde el sitio, no desde el
  # INTA. Subcarpetas "2008 - IC -CD - Parte A" y "Parte B" (24 PDF, ~170 MB). Que ejemplares se
  # publican lo dice configs/dims/agromet-ejemplares.yaml, no esta carpeta.
  agromet: "Pivotal Repositorio/Operaciones/Maquetas/Recursos clima"
