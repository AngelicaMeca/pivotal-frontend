# Registro de la serie del Mapa Nacional de Cultivos del INTA (ERS de Mapas, RF19 a RF21).
#
# RF19 pide registrar la serie completa con su DOI, su URL, sus archivos y el estado de ingesta
# de cada campaña. Esto es ese registro, y es declarativo: `pipeline/cultivos_serie.py` lo
# obedece y no tiene ni un nombre de archivo ni un código de cultivo adentro.
#
# JC pidió el 15-nov-2026 publicar SOLO la última campaña ("Por ahora solo pongamos el último,
# o sea campaña 2024/2025"), y eso sigue igual: la página `4001-mapa-cultivos.yaml` publica esa
# y nada más. Este registro existe para lo OTRO que pide el ERS: el análisis de evolución
# interanual (RF21), que necesita la serie entera cruzada con los límites departamentales.
#
# ---------------------------------------------------------------------------------------------
# LO QUE HAY QUE SABER ANTES DE TOCAR ESTO
#
# 1. **Cada campaña tiene SU PROPIA tabla de clases y los códigos NO significan lo mismo.** Esto
#    no es un detalle: en el mapa de invierno, el código 19 es "No agrícola" en 2019/2020 y
#    "Caña de Azúcar" en 2020/2021; el 17 es "Barbecho" en 2019/2020 y "Otros cultivos" desde
#    2021/2022; y "Cereales de invierno" es el 0 hasta 2020/2021 y el 16 desde 2021/2022. Usar
#    una sola tabla para toda la serie habría contado monte nativo como caña de azúcar y habría
#    perdido todo el trigo de las tres primeras campañas. Por eso la tabla viaja POR MITAD DE
#    CAMPAÑA y por eso una clase que no esté declarada corta la corrida.
#
# 2. **De dónde sale cada tabla** (`clases_de`): `estilo` = del archivo .qml de QGIS que el INTA
#    publica al lado del ráster; `informe` = de las Tablas 1 y 2 del informe PDF de esa campaña,
#    transcriptas acá. Las cuatro primeras campañas no publicaron .qml. El método se validó
#    donde se puede: en 2022/2023 el INTA publica las DOS cosas, y la tabla del informe y el
#    .qml dicen exactamente lo mismo, los mismos códigos y los mismos nombres.
#
# 3. **Los nombres se transcriben COMO LOS ESCRIBE EL INTA**, con sus variantes incluidas
#    ("Maiz" sin tilde en 2019/2020, "Sorgo" en 2019/2020 y "Sorgo GR" después, "No agrícola" y
#    "No Agrícola"). No se corrigen acá: la unificación para la serie la hace
#    `cultivos_canonicos`, que es explícito y auditable. Así se puede ver qué dijo la fuente.
#
# 4. **Las dos mitades de una campaña NO SE SUMAN.** Son dos mapas del mismo territorio en dos
#    momentos: un lote puede tener trigo en invierno y soja en verano, y los dos son ciertos.
#
# 5. **2018/2019 es estructuralmente distinta**: el INTA la publicó como UN mapa de la campaña
#    completa con secuencias de cultivo (simples y dobles), no como dos mapas. Sus clases no son
#    cultivos sino secuencias, así que no es comparable con las otras seis sin una decisión
#    sobre cómo leerla. Queda registrada y SIN ingerir (RF20.2 / RF21.2 la cuentan como hueco).
#
# 6. Los `bytes` y los `md5` son los que publica Zenodo, leídos de su API, no tipeados a mano.
#    `pipeline/cultivos_serie.py ingerir` los verifica y saltea la campaña que no cierre.
#
# ---------------------------------------------------------------------------------------------

fuente:
  nombre: Mapa Nacional de Cultivos
  organismo: "Instituto Nacional de Tecnología Agropecuaria (INTA)"
  repositorio: Zenodo
  licencia: CC-BY-4.0
  atribucion: "Fuente: INTA - Mapa Nacional de Cultivos (CC BY 4.0)"
  resolucion_original_m: 30
  proyeccion: EPSG:4326
  # El área que el INTA clasifica son las zonas agrícolas del Panorama Agrícola Semanal de la
  # Bolsa de Cereales: el oeste de la provincia queda sin clasificar en todas las campañas.
  cobertura: "zonas agrícolas del PAS (Bolsa de Cereales de Buenos Aires)"
  bajado: 2026-11-17
  carpeta_local: raw/mnc/<id de Zenodo>/

# Los cultivos de TODA la serie: etiqueta del INTA -> nombre con el que se publica.
#
# Una etiqueta que no esté acá CORTA la ingesta. Es a propósito: un cultivo nuevo del INTA
# (el Tabaco entró en 2022/2023) tiene que entrar por decisión y no aparecer solo en un gráfico.
cultivos_canonicos:
  # --- verano
  "Soja": Soja
  "Maíz": Maíz
  "Maiz": Maíz
  "Girasol": Girasol
  "Girasol-CV": Girasol seguido de otro cultivo de verano
  "Poroto": Poroto
  "Algodón": Algodón
  "Algodon": Algodón
  "Maní": Maní
  "Arroz": Arroz
  "Sorgo": Sorgo para grano
  "Sorgo GR": Sorgo para grano
  "Verdeo de Sorgo": Verdeo de sorgo
  "Tabaco": Tabaco
  # --- invierno
  "Cereales de invierno": Cereales de invierno
  "Garbanzo": Garbanzo
  "Arveja": Arveja
  "Otros cultivos de invierno": Otros cultivos de invierno
  "Otros cultivos": Otros cultivos de invierno
  # --- en las dos
  "Caña de azúcar": Caña de azúcar
  "Caña de Azúcar": Caña de azúcar
  "Papa": Papa
  # --- lo que no es cultivo. Entra igual al cruce, porque es la única forma de que las
  #     superficies cierren contra el territorio y de poder decir qué parte es agrícola.
  "Barbecho": Barbecho
  "No agrícola": No agrícola
  "No Agrícola": No agrícola
  "Máscara": Sin clasificar
  "255": Sin clasificar
  "Sin clasificar": Sin clasificar

campanias:

  - id: "2018-2019"
    rotulo: "Campaña 2018/2019"
    doi: https://doi.org/10.5281/zenodo.8286326
    zenodo: 8286326
    publicado: 2019-09-01
    # NO se ingiere, y el motivo no es que falte el archivo: es que mide otra cosa.
    estado_ingesta: no-comparable
    motivo_no_ingesta: >
      El INTA la publicó como UN mapa de la campaña completa con secuencias de cultivo (simples
      y dobles), no como un mapa de invierno y uno de verano. Sus clases son secuencias
      ("trigo/soja 2da"), así que ponerla en una serie de superficie por cultivo junto a las
      otras seis sería comparar cosas distintas. Hace falta una decisión sobre cómo leerla; está
      preguntado en el backlog.
    mitades:
      - mitad: unica
        raster: "mnc_2018-2019_V1R1.tif"
        bytes: 131823962
        md5: ff4bfaaaf54b7bb3eaa264ac189a132e
        estilo: null
        clases_de: informe
        # La tabla esta transcripta para que la decision sobre esta campania se pueda
        # implementar sin volver a leer el PDF, pero NO se ingiere: se ve en la tabla misma
        # por que no es comparable. Sus clases son SECUENCIAS de cultivo ("CI-Soja" es un
        # cultivo de invierno seguido de soja, "CI sin cultivo verano" es invierno y nada
        # despues) y encima trae usos del suelo que las otras campanias no tienen
        # (Ganaderia, Lenosa natural, Lenosas cultivadas). No hay forma de sacar de aca
        # "hectareas de soja en la campania" que signifique lo mismo que en 2019/2020.
        # A proposito sus etiquetas NO estan en `cultivos_canonicos`: si alguien le cambia
        # el `estado_ingesta` sin decidir primero como se leen las secuencias, la ingesta
        # corta en `canonico()` en vez de publicar un numero que no significa nada.
        clases:
          0: "Maiz"
          1: "Soja 1ra"
          2: "CI-Soja"
          3: "CI-Maiz"
          4: "Mani"
          5: "Girasol"
          6: "CI sin cultivo verano"
          7: "Ganaderia"
          8: "Lenosa natural"
          9: "Lenosas cultivadas"
          11: "Algodon"
          12: "Poroto"
          13: "Cania"
          14: "Girasol-CV"
          15: "Mascara"
    informe:
      archivo: "Mapa Nacional de Cultivos campaña 2018_2019.pdf"
      bytes: 35719709
      md5: d4c4e0851cbcf7f9ba680b5b61a574c2

