# AgroClima > Mapas > Humedad en el suelo (porcentaje de agua en el suelo) · hoja "ClimPAS" de la
# maqueta de JC (base "3004 MP"). Mismo mecanismo que 3002-mapas-evapotranspiracion.
#   X52 "PARA EL BETA DE WEB PUBLICA, SOLO 6 meses de mapas - 3 por mes (son decádicas)"
#   X54 "LOS CODIGOS DE IMÁGENES ESTÁN PUESTOS por mes y década (1, 2 y 3)"
#   X56 "CORRECTAS LAS FECHAS Y LAS MINIATURAS"
# Rotulo con el formato de JC: "al 10 septiembre", "al 20 ...", "al 30/31 ..." (agua al final de
# la decada; la imagen dice "Acumulado al 30/09/2026").
familia: agroclima
seccion: agroclima
slug: 3004-mapas-porcentaje-agua
protocolo: _protocolo-presentacion
tipo: galeria

titulo: "Humedad en el suelo"
subtitulo: "SEPA - INTA · porcentaje de agua en el suelo, decádico, últimos 6 meses"
breadcrumb: "AgroClima - Provincia - mapas - SEPA-INTA - Porcentaje agua en suelo"
titulo_protocolo: "SEPA - INTA - Mapas de porcentaje de agua en suelo {anios} (últimos 6 meses)"
subtitulo_cuadro: "Del período más reciente al más antiguo · clic en un mapa para verlo completo"

serie: porcentaje-agua
assets:
  carpeta: "site/assets/clima/porcentaje-agua"
  patron: "^pj_(?P<anio>\\d{4})(?P<mes>\\d{2})_(?P<decada>[123])(?P<mini>-mini)?(?P<sde>-sde)?\\.(?P<ext>gif|jpg|png)$"
periodo: decada-al
orden: descendente
por_fila: 6
ventana:
  cuantos: 18
  motivo: "JC, X52: SOLO 6 meses de mapas - 3 por mes (son decádicas)"
destacado: mas_reciente

definicion:
  titulo: "PORCENTAJE DE AGUA EN EL SUELO"
  parrafos:
    - >
      Expresa la relación porcentual entre el contenido de agua disponible para la vegetación
      que tiene el perfil (al final del período informado) y la capacidad potencial del suelo
      para retener agua útil.
    - >
      Permite saber cuán completa está la recarga del suelo, lo que modifica la posibilidad de
      que la vegetación transpire durante todo el día, dado que, por debajo de un determinado
      umbral, la transpiración está limitada en las horas de mayor demanda. También indica el
      almacenaje de agua en el suelo al inicio de una época de siembra, lo cual se relaciona
      con la probabilidad de sufrir futuras sequías.
  enlace: {texto: "https://sepa.inta.gob.ar/productos/", href: "https://sepa.inta.gob.ar/productos/"}

fuente:
  pie: "Fuente: SEPA - INTA (Instituto de Clima y Agua)"

sensibilidad: normal
estado: publicada
origen:
  tipo: maqueta de JC
  archivo: "0000000000 Maqueta Clima 1.xlsx"
  hojas: ["ClimPAS"]
  recibido: 2026-10-14

# VISOR GEORREFERENCIADO (20-oct-2026, pedido de la usuaria): cada imagen se ubica en el mapa
# con la caja del KML del SEPA (configs/dims/sepa-kml.yaml). La galeria sigue debajo, y una
# miniatura elige el periodo del visor.
georreferencia:
  kml: PJ_DECADA
  # `usar` o `ignorar` la rotacion que trae el KML (se decide mirando si los limites calzan).
  rotacion: ignorar
  # EL RECORTE DE LA PROVINCIA (27-oct-2026, pedido de la usuaria: "los mapas demoran mucho en
  # cargar"). La imagen del SEPA es el pais entero y el visor dibuja la provincia sola: de ese
  # peso usaba el 6%. Al lado de cada original hay un `<nombre>-sde.<ext>` con la caja de la
  # provincia y nada mas, que es lo que baja el visor; el original se baja solo cuando hace
  # falta de verdad ("Imagen original" y "Mostrar todo el pais"). Son cuatro y media veces menos.
  # `x` e `y` son la esquina del recorte en pixeles de la imagen original: con eso y el tamanio
  # del archivo recortado el build saca su caja en grados, exacta, sin reescalar nada. Los
  # genera `python -m pipeline.recorte_sepa --escribir`, que tambien escribe estos dos numeros.
  recorte: {x: 379, y: 617}
  # LA ESCALA, ESCRITA ACA Y NO RECORTADA DE LA IMAGEN (26-oct-2026, pedido de la usuaria:
  # "hardcodea la escala de colores de los mapas de calor de agroclima, no me gusta que los
  # hayas puesto como imagen"). Es la misma decision que la faena equina de SENASA y las
  # caravanas: lo que la fuente publica dibujado se transcribe a datos y lo dibuja el sitio.
  # Asi la escala no depende de que la imagen cargue, entra en el ancho que le toque y se lee
  # con la tipografia del sitio.
  #
  # Responde al pedido de JC del 16-oct-2026: "LOS MAPAS DE AGROCLIMA SE VEN PERFECTOS... SOLO
  # QUE NO CONTIENEN LAS ESCALAS... ¿Y SI SE DIVIDE LA PANTALLA, SUPONGAMOS UN 20% DONDE ESTE
  # LA ESCALA QUE NO VARIE Y EN EL OTRO 80% PONEMOS EL MAPA AMPLIABLE???". El visor la dibuja
  # fija al costado del mapa: el zoom y el arrastre no la tocan.
  #
  # Los textos son LITERALES del recuadro que trae la imagen; el titulo tambien. El color de
  # cada clase NO se saca de una sola imagen: es la MEDIANA POR CANAL del relleno de esa muestra
  # medido en las 18 imagenes de la galeria. Las 18 dan el mismo color, con una diferencia
  # maxima de 2 por canal: esta escala del SEPA no cambia con la fecha.
  #
  # La ultima clase, "Cursos y cuerpos de agua", viene TRAMADA (rayado azul grisaceo sobre
  # blanco) y no con un relleno plano: su color es el promedio del tramado, que es como se ve la
  # muestra en el recuadro.
  leyenda:
    titulo: "Referencias"
    clases:
      - {color: "#FD0000", texto: "0-10 %"}
      - {color: "#FEA500", texto: "10 - 20 %"}
      - {color: "#FFD500", texto: "20 - 30 %"}
      - {color: "#EFF804", texto: "30 - 40 %"}
      - {color: "#00FE01", texto: "40 - 50 %"}
      - {color: "#4DC833", texto: "50 - 60 %"}
      - {color: "#00FFFF", texto: "60 - 70 %"}
      - {color: "#3FDFD1", texto: "70 - 80 %"}
      - {color: "#2AA3F0", texto: "80 - 90 %"}
      - {color: "#0000FD", texto: "90 - 100 %"}
      - {color: "#B06808", texto: "Áreas misceláneas"}
      - {color: "#A7B7CA", texto: "Cursos y cuerpos de agua"}
  # Caja AJUSTADA (21-oct-2026, pedido de la usuaria: "los bordes de la provincia y los
  # departamentos no coinciden con el borde negro"). La caja del KML deja la imagen corrida
  # unos px respecto de los limites que ella misma trae dibujados. Esta caja se midio
  # buscando el corrimiento y la escala que pegan los limites del GeoJSON del sitio a las
  # lineas de la imagen: en pj_202604_1.jpg la distancia media de cada limite del GeoJSON a la
  # linea de la imagen paso de 0,97 px (caja del KML) a 0,04 px; en pj_202609_3.jpg, de 1,01 a
  # 0,02 px.
  # Todas las imagenes del producto tienen el mismo marco, asi que vale para toda la galeria.
  # Se mide sin rotacion, por eso `rotacion: ignorar`.
  caja_ajustada:
    norte: -18.442184
    sur: -43.643096
    este: -49.214780
    oeste: -69.716920
  nota: >-
    Ubicada en el mapa con el KML que publica el SEPA para este producto (PJ_DECADA.kml). La rotación de 0,28° que trae el KML no se aplica: sin ella los límites departamentales calzan con los de la imagen.
