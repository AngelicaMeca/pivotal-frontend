definicion:
  titulo: "PORCENTAJE DE AGUA EN EL SUELO"
  parrafos:
    - >
      Expresa la relación porcentual entre el contenido de agua disponible para la vegetación
      que tiene el perfil (al final del período informado) y la capacidad potencial del suelo
      para retener agua útil.
    - >
      Permite saber cuán completa está la recarga del suelo, lo que modifica la posibilidad de
      que la vegetación transpire durante todo el día, dado que, por debajo de un determinado
      umbral, la transpiración está limitada en las horas de mayor demanda. También indica el
      almacenaje de agua en el suelo al inicio de una época de siembra, lo cual se relaciona
      con la probabilidad de sufrir futuras sequías.
