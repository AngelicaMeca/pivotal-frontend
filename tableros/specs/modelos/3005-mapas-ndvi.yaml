# AgroClima > Mapas > Índice de Vegetación NDVI · hoja "ClimNDVI" de la maqueta de JC (base
# "3005 MP"). Mismo mecanismo que 3002-mapas-evapotranspiracion.
#   U49 "PARA EL BETA DE WEB PUBLICA, SOLO 6 meses de mapas - 2 por mes (son quincenales)"
#   U52 "CORRECTAS LAS FECHAS Y LAS MINIATURAS"
# El nombre "iv_AAAADDD" trae el DIA JULIANO en que empieza la composicion de 16 dias (texto de
# JC: "Se contabilizan los 16 días a partir del 1º de enero de cada año, obteniéndose un total
# de 23 imágenes anuales"). El rotulo es el rango exacto: iv_2026241 = "29 agosto al 13
# septiembre", que es lo que dice la propia imagen (la maqueta decia "1 al 13 septiembre").
# La ultima composicion del anio se corta el 31/12.
familia: agroclima
seccion: agroclima
slug: 3005-mapas-ndvi
protocolo: _protocolo-presentacion
tipo: galeria

titulo: "Índice de Vegetación NDVI"
subtitulo: "SEPA - INTA · índice de vegetación, composiciones de 16 días, últimos 6 meses"
breadcrumb: "AgroClima - Provincia - mapas - SEPA-INTA - NDVI"
titulo_protocolo: "SEPA - INTA - Mapas de NDVI (Indice de Vegetación) {anios} (últimos 6 meses)"
subtitulo_cuadro: "Del período más reciente al más antiguo · clic en un mapa para verlo completo"

serie: ndvi
assets:
  carpeta: "site/assets/clima/ndvi"
  patron: "^iv_(?P<anio>\\d{4})(?P<dia>\\d{3})(?P<mini>-mini)?(?P<sde>-sde)?\\.(?P<ext>gif|jpg|png)$"
periodo: dias-julianos
dias: 16
orden: descendente
por_fila: 6
ventana:
  cuantos: 12
  motivo: "JC, U49: SOLO 6 meses de mapas - 2 por mes (son quincenales)"
destacado: mas_reciente

definicion:
  # JC escribe "NVDI": se corrige la sigla (el producto es NDVI, como dice el mismo texto).
  titulo: "INDICE DE VEGETACIÓN COMPUESTO (NDVI)"
  parrafos:
    - >
      Es el índice de vegetación normalizado (IVN; NDVI en inglés) que se calcula tomando los
      valores máximos para una composición de imágenes correspondientes a 16 días. Se
      contabilizan los 16 días a partir del 1º de enero de cada año, obteniéndose un total de
      23 imágenes anuales.
    - >
      Se utilizan imágenes del sensor MODIS de los satélites AQUA-TERRA con una resolución
      espacial de 6,25 hectáreas (250 m).
  enlace: {texto: "https://sepa.inta.gob.ar/productos/", href: "https://sepa.inta.gob.ar/productos/"}

fuente:
  pie: "Fuente: SEPA - INTA (Instituto de Clima y Agua)"

sensibilidad: normal
estado: publicada
origen:
  tipo: maqueta de JC
  archivo: "0000000000 Maqueta Clima 1.xlsx"
  hojas: ["ClimNDVI"]
  recibido: 2026-10-14

# VISOR GEORREFERENCIADO (20-oct-2026, pedido de la usuaria): cada imagen se ubica en el mapa
# con la caja del KML del SEPA (configs/dims/sepa-kml.yaml). La galeria sigue debajo, y una
# miniatura elige el periodo del visor.
georreferencia:
  kml: NDVI_DECADA
  # `usar` o `ignorar` la rotacion que trae el KML (se decide mirando si los limites calzan).
  rotacion: usar
  # EL RECORTE DE LA PROVINCIA (27-oct-2026, pedido de la usuaria: "los mapas demoran mucho en
  # cargar"). La imagen del SEPA es el pais entero y el visor dibuja la provincia sola: de ese
  # peso usaba el 6%. Al lado de cada original hay un `<nombre>-sde.<ext>` con la caja de la
  # provincia y nada mas, que es lo que baja el visor; el original se baja solo cuando hace
  # falta de verdad ("Imagen original" y "Mostrar todo el pais"). Son veintidos veces menos.
  # `x` e `y` son la esquina del recorte en pixeles de la imagen original: con eso y el tamanio
  # del archivo recortado el build saca su caja en grados, exacta, sin reescalar nada. Los
  # genera `python -m pipeline.recorte_sepa --escribir`, que tambien escribe estos dos numeros.
  recorte: {x: 841, y: 545}
  # LA ESCALA, ESCRITA ACA Y NO RECORTADA DE LA IMAGEN (26-oct-2026, pedido de la usuaria:
  # "hardcodea la escala de colores de los mapas de calor de agroclima, no me gusta que los
  # hayas puesto como imagen"). Es la misma decision que la faena equina de SENASA y las
  # caravanas: lo que la fuente publica dibujado se transcribe a datos y lo dibuja el sitio.
  # Asi la escala no depende de que la imagen cargue, entra en el ancho que le toque y se lee
  # con la tipografia del sitio.
  #
  # Responde al pedido de JC del 16-oct-2026: "LOS MAPAS DE AGROCLIMA SE VEN PERFECTOS... SOLO
  # QUE NO CONTIENEN LAS ESCALAS... ¿Y SI SE DIVIDE LA PANTALLA, SUPONGAMOS UN 20% DONDE ESTE
  # LA ESCALA QUE NO VARIE Y EN EL OTRO 80% PONEMOS EL MAPA AMPLIABLE???". El visor la dibuja
  # fija al costado del mapa: el zoom y el arrastre no la tocan.
  #
  # Los textos son LITERALES del recuadro que trae la imagen; el titulo tambien. El color de
  # cada clase NO se saca de una sola imagen: es la MEDIANA POR CANAL del relleno de esa muestra
  # medido en 10 de las 12 imagenes de la galeria. Las otras dos quedan afuera porque la
  # cuantizacion del GIF les deja dos clases vecinas del mismo color y no se pueden separar.
  # Entre las 10 la diferencia maxima por canal es de 29, de ahi la mediana.
  leyenda:
    titulo: "Referencias"
    clases:
      - {color: "#0B0FCB", texto: "0.01 a 0.1"}
      - {color: "#AB11CB", texto: "0.11 a 0.2"}
      - {color: "#F80301", texto: "0.21 a 0.3"}
      - {color: "#D4980E", texto: "0.31 a 0.4"}
      - {color: "#FDFD03", texto: "0.41 a 0.5"}
      - {color: "#7FEE15", texto: "0.51 a 0.6"}
      - {color: "#14EA1A", texto: "0.61 a 0.7"}
      - {color: "#2A9734", texto: "> 0.71"}
  # Caja AJUSTADA (21-oct-2026, pedido de la usuaria: "los bordes de la provincia y los
  # departamentos no coinciden con el borde negro"). La caja del KML deja la imagen corrida
  # unos px respecto de los limites que ella misma trae dibujados. Esta caja se midio
  # buscando el corrimiento y la escala que pegan los limites del GeoJSON del sitio a las
  # lineas de la imagen: en iv_2026081.gif la distancia media de cada limite del GeoJSON a la
  # linea de la imagen paso de 1,97 px (caja del KML) a 1,27 px; en iv_2026257.gif, de 4,18 a 3,27
  # px.
  # Todas las imagenes del producto tienen el mismo marco, asi que vale para toda la galeria.
  # Se mide sin rotacion, por eso `rotacion: ignorar`.
  caja_ajustada:
    norte: -16.326091
    sur: -59.946261
    este: -47.616066
    oeste: -79.360519
  nota: >-
    El SEPA no publica KML para el NDVI de 16 días: se ubica con el del NDVI decádico (NDVI_DECADA.kml), cuyas imágenes tienen el mismo marco. Se verificó que los límites departamentales calzan.
