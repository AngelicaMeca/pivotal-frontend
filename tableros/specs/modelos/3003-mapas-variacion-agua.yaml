ventana:
  cuantos: 18
  motivo: "JC, X56: SOLO 6 meses de mapas - 3 por mes (son decádicas)"
destacado: mas_reciente

definicion:
  titulo: "VARIACION DEL AGUA DISPONIBLE"
  parrafos:
    - >
      Representa el cambio en el agua disponible (expresado en mm) al final de un período de
      10 días con respecto al final del período anterior.
    - >
      Permite analizar la magnitud del aumento (período actual mayor al anterior) o reducción
      (período actual menor al anterior) del agua disponible en el perfil en hasta 2 metros de
      profundidad.
    - >
      El producto balance hídrico estima diariamente la variación espacial del agua disponible
      en el suelo en las regiones Pampeana, Chaqueña, Semiárida Central y Litoral, cubriendo la
      mayor parte de la superficie ocupada por los principales cultivos agrícolas extensivos en
      Argentina.
    - >
      El balance integra la estimación del ingreso de agua al perfil del suelo por
      precipitaciones (no incluye riego) y el egreso de agua por evaporación directa y
      transpiración (evapotranspiración real). Las precipitaciones se estiman a partir de
      información satelital proveniente del sensor IMERG-GPM, corregida diariamente con datos
      de estaciones meteorológicas INTA y SMN distribuidas en toda la región (Gusmerotti et al.,
      2022). Por otro lado, la estimación de la evapotranspiración real se realiza mediante el
      uso de un coeficiente dual para transpiración y evaporación (Allen, 1998; Mercau et al.,
      2016). Para ello, se estima la demanda atmosférica diaria a través de una interpolación
      espacial de la evapotranspiración de referencia (ETo) según el modelo Penman-Monteith
      FAO-56 (Allen, 1998), utilizando las variables agrometeorológicas registradas en las
      estaciones.
  enlace: {texto: "https://sepa.inta.gob.ar/productos/", href: "https://sepa.inta.gob.ar/productos/"}

fuente:
  pie: "Fuente: SEPA - INTA (Instituto de Clima y Agua)"

sensibilidad: normal
estado: publicada
origen:
