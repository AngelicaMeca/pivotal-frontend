# ===========================================================================
# 1. SEPARADORES Y CARACTERES
# ===========================================================================
tipografia:
  separador_titulo: " - "
  separador_codepoint: "U+002D (guion medio ASCII) con UN espacio antes y UN espacio despues"
  prohibidos:
    - {caracter: "–", codepoint: "U+2013", nombre: "guion en"}
    - {caracter: "—", codepoint: "U+2014", nombre: "raya / em dash"}
  regla: >
    UN solo separador en todo el sitio: " - ". JC en su docx alterna U+2013 y U+002D dentro del
    mismo titulo ("Chaco – ganado bovino - Concentracion..."). Eso es tipeo de Word, no una regla.
    CLAUDE.md prohibe los em dashes, asi que normalizamos todo a U+002D y queda escrito aca para
    que nadie lo "arregle" de nuevo en un template.
  separador_areas: "/"          # sin espacios: "Santiago del Estero/País" (asi lo escribe JC)
  separador_lista: ", "
  ultimo_de_lista: " y "
  familia:
    regla_de_jc: "Calibri, y como segunda opcion Arial"
    origen_docx_v2: {seccion: GENERALES, texto: "TIPOGRAFIA: Usaremos Calibri y como segunda opción Arial. Está demostrado que es una tipografía equilibrada (si los chicos de marketing tienen otra opinión, los discutimos)"}
    implementacion: >
      Pila CSS "Calibri, Carlito, Arial, sans-serif", sin descargar ninguna fuente: Calibri donde
      este instalada (Windows/Office), Carlito (su equivalente metrico libre) donde exista, Arial
      como segunda opcion de JC. El sitio sigue siendo autonomo. El cambio concreto lo hace
      constructor-dashboards en site/theme.yaml (`tipografia.familia`), que hoy trae la pila de
      sistema del mockup del 27-jul y queda desactualizado frente a esta regla.
    nota_interpretacion: >
      Calibri no es una fuente libre para embeber en la web. JC mismo deja la puerta abierta a
      marketing. Si marketing pide otra cosa, se cambia en theme.yaml y esta regla se versiona.
      Backlog pregunta 27.
  origen_docx:
    - {parrafo: 5, texto: "Chaco – ganado bovino - Concentración de cabezas por departamento – año 2009"}
    - {parrafo: 27, texto: "Distribución porcentual del stock bovino por estrato - Santiago del Estero/País - año 2010", nota: "titulo del grafico de barras embebido, leido de word/charts/chart1.xml"}

# ===========================================================================
# 2. TITULOS
# ===========================================================================
titulo:
  # -------------------------------------------------------------------
  # Los dos titulos de una vista, que NO son el mismo
  # -------------------------------------------------------------------
  roles:
    titulo_protocolo:
      que_es: "El titulo que va ARRIBA del cuadro, grafico o mapa. Se arma con las plantillas de este archivo."
      obligatorio: true
      se_escribe_a_mano: false
      posicion: "parte superior, fuera del area de dibujo"
      origen_docx: {parrafo: 9, texto: "Título: Parte SUPERIOR (dentro o fuera del gráfico)"}
      nota: >
        JC acepta adentro o afuera del grafico. Elegimos AFUERA siempre: es texto HTML, se puede
        copiar, se lee en celular y no se deforma cuando ECharts redimensiona el canvas.
    titulo:
      que_es: >
        El campo `titulo` que ya traen los specs ("Ranking de departamentos por cultivo"). NO se
        muestra arriba del cuadro. Se usa en el menu, en el catalogo, en el breadcrumb, en la
        pestaña del navegador y en los links entre vistas.
      obligatorio: true
      se_escribe_a_mano: true
      motivo: >
        El titulo de protocolo es descriptivo y largo (hasta 100 caracteres) porque tiene que
        sobrevivir a una captura de pantalla pegada en un informe sin contexto. Un menu con seis
        titulos de 100 caracteres no se puede navegar. Son dos necesidades distintas y por eso son
        dos campos distintos. Ninguno reemplaza al otro.

  # -------------------------------------------------------------------
  # Los 4 componentes que JC exige
  # -------------------------------------------------------------------
  componentes_obligatorios:
    - {slot: area, que_es: "Area geografica", origen_docx: {parrafo: 10, texto: "Area geográfica del mapa (Chaco en este caso)"}}
    - {slot: sujeto, que_es: "Sector o subsector", origen_docx: {parrafo: 11, texto: "Descripción del sector o subsector (Ganado bovino)"}}
    - {slot: variable, que_es: "Descripcion de la variable", origen_docx: {parrafo: 12, texto: "Descripción de la variable (“Concentración de cabezas por departamento)"}}
    - {slot: periodo, que_es: "Año o periodo de referencia", origen_docx: {parrafo: 13, texto: "Año de referencia (2009)"}}
  componentes_opcionales:
    - {slot: apertura, que_es: "Por que dimension se abre el dato (por departamento, por cultivo, por estrato)"}
    - {slot: recorte,  que_es: "Que parte del universo se esta mostrando, cuando el cuadro no muestra el total", origen_jc: "hoja 'Modelo Analisis' de la base 85, donde JC titula sus propios cuadros 'Movimientos totales (sin introducción)' y 'Movimientos cabezas salidas (extracción)'"}

  # -------------------------------------------------------------------
  # Como se compone (algoritmo, sin interpretacion)
  # -------------------------------------------------------------------
  composicion:
    algoritmo:
      - "1. Resolver cada slot contra el spec y contra el valor actual de los filtros (los titulos son dinamicos: si el usuario cambia de campaña, el titulo cambia)."
      - "2. Tomar la plantilla del `tipo` de la vista (bloque `plantillas`). Es una lista ordenada de grupos."
      - "3. Para cada grupo, recorrer sus `variantes` en orden y quedarse con la PRIMERA cuyos slots esten todos resueltos y no vacios."
      - "4. Si ningun variante aplica: si el grupo es `opcional: true` se saltea; si no, el build FALLA con el nombre del spec y del slot."
      - "5. Unir los fragmentos resultantes con `tipografia.separador_titulo`."
      - "6. Mayusculas: se pone en mayuscula la primera letra del PRIMER fragmento y la primera letra del fragmento del grupo `variable`. Nada mas. Todo lo demas queda tal como lo declara cada slot."
    por_que_asi_las_mayusculas: >
      Es como escribe JC. En "Chaco - ganado bovino - Concentración de cabezas por departamento -
      año 2009" el area va en mayuscula porque es un nombre propio, el sujeto va en minuscula, la
      variable va en mayuscula y el periodo en minuscula. La regla reproduce ese patron sin tener
      que decidir nada caso por caso.
    determinismo: >
      Sustitucion de strings y nada mas. Sin heuristicas, sin acortar, sin elegir sinonimos, sin
      recortar por largo. Mismo spec + mismos filtros = mismo titulo, siempre.
    largo:
      maximo_duro: null
      recomendado: 100
      si_se_pasa: "Se publica igual y se deja envolver en dos lineas. NUNCA se trunca ni se abrevia automaticamente: un titulo cortado incumple el protocolo de JC."

  # -------------------------------------------------------------------
  # Como lo declara cada spec de vista
  # -------------------------------------------------------------------
  como_lo_declara_cada_spec:
    campo: titulo_componentes
    obligatorio_en: "todo spec de vista"
    sintaxis:
      area:
        - "provincia                              -> el nombre de la provincia del parametro"
        - "{desde_filtro: geo}                    -> provincia o departamento, segun el selector"
        - "{desde_filtro: departamento}           -> siempre un departamento"
        - "{fijo: \"NOA\"}                          -> texto fijo"
        - "{comparacion: [provincia, pais]}       -> unidos con `separador_areas`, en ese orden"
      sujeto:
        - "{fijo: \"los cultivos extensivos\"}"
        - "{desde_filtro: cultivo}                -> pasa por `nombre_de_cultivo_para_titulo`"
        - "{desde_filtro: estacion}               -> pasa por `estacion_a_frase`"
        - "{desde: subsector}                     -> el subsector de la base"
        - "{desde_filtro: X, frases: {...}}       -> tabla explicita valor-del-filtro -> frase, escrita en el spec"
      variable:
        - "{fijo: sup_sembrada_ha}"
        - "{desde_filtro: variable}"
        - "{multiple: [a, b, c]}"
        - "{override: \"...\", motivo: \"...\"}       -> plantilla, admite {art} y {frase}"
      apertura: "un id de `slots.apertura.frases`, o null si la vista no abre por ninguna dimension"
      recorte:
        - "{fijo: \"(extracción)\"}                 -> texto fijo, ya con los parentesis"
        - "{desde_universo: true}                 -> la `etiqueta_corta` del universo que declara `universo.recorte`"
        - "{desde_filtro: recorte}                -> cuando el recorte es un selector de la pagina"
      periodo:
        - "{desde_filtro: campania}"
        - "{desde_filtro: anio}"
        - "{ventana: ventana_campanias}           -> el rango resuelto de la ventana de la base"
        - "{ventana: ventana_anios}               -> idem para las bases de grano anual"
        - "{ventana: ventana_propia}              -> si la vista define su propia ventana"
        - "{fijo: \"2024/25\"}"
    campo_de_control:
      titulo_protocolo_ejemplo: >
        Cada spec deja escrito el titulo que sale con sus valores por defecto. No lo usa el sitio:
        es para que un humano (JC) pueda leer el spec y ver el titulo sin correr el pipeline, y para
        que el build compare lo que genera contra lo que el spec dice que tiene que generar.

  # -------------------------------------------------------------------
  # Plantillas por tipo de vista
  # -------------------------------------------------------------------
  # Sintaxis: cada tipo trae `grupos`, una lista ordenada. Cada grupo tiene `variantes` (strings
  # con slots entre llaves) y, si puede faltar, `opcional: true`.
  # JC escribe los mapas con el area PRIMERO y los graficos con el area anteultima. Se respetan sus
  # dos ordenes porque los dos figuran en el documento, cada uno con su ejemplo.
  #
  # Las variantes con {recorte} van SIEMPRE primero dentro de su grupo. El compositor se queda con
  # la primera variante cuyos slots esten todos resueltos, asi que una vista que no declara recorte
  # (las 16 de la base 9) las saltea sin que haya que escribir ninguna condicion.
  plantillas:

    mapa:
      # Calcado del ejemplo de JC: "Chaco - ganado bovino - Concentracion de cabezas por departamento - año 2009"
      origen_docx: {parrafo: 5}
      grupos:
        - {grupo: area,     variantes: ["{area}"]}
        - {grupo: sujeto,   variantes: ["{sujeto}"]}
        - {grupo: variable, variantes: ["{variable} {recorte} por {apertura}", "{variable} {recorte}", "{variable} por {apertura}", "{variable}"]}
        - {grupo: periodo,  variantes: ["{periodo}"]}

    torta:
      # Calcado del grafico embebido: "Distribucion porcentual del stock bovino por estrato - Sgo. del Estero/Pais - año 2010"
      origen_docx: {parrafo: 27}
      grupos:
        - {grupo: variable, variantes: ["{variable} de {sujeto} {recorte} por {apertura}", "{variable} de {sujeto} {recorte}", "{variable} de {sujeto} por {apertura}", "{variable} de {sujeto}", "{variable} por {apertura}"]}
        - {grupo: area,     variantes: ["{area}"]}
        - {grupo: periodo,  variantes: ["{periodo}"]}

    ranking:
      grupos:
        - {grupo: variable, variantes: ["{variable} de {sujeto} {recorte} por {apertura}", "{variable} de {sujeto} {recorte}", "{variable} de {sujeto} por {apertura}", "{variable} por {apertura}", "{variable} de {sujeto}"]}
        - {grupo: area,     variantes: ["{area}"]}
        - {grupo: periodo,  variantes: ["{periodo}"]}

    serie:
      grupos:
        - {grupo: variable, variantes: ["{variable} de {sujeto} {recorte} por {apertura}", "{variable} de {sujeto} {recorte}", "{variable} de {sujeto} por {apertura}", "{variable} de {sujeto}", "{variable}"]}
        - {grupo: area,     variantes: ["{area}"]}
        - {grupo: periodo,  variantes: ["{periodo}"]}

    tabla-variaciones:
      origen_docx: {parrafo: 75, texto: "Tabla 2 – Diferencias y variaciones por categorías del stock entre 2009 y 2008 (parte I)"}
      grupos:
        - {grupo: variable, variantes: ["{variable} de {sujeto} {recorte} por {apertura}", "{variable} de {sujeto} {recorte}", "{variable} de {sujeto} por {apertura}", "{variable} por {apertura}", "{variable} de {sujeto}"]}
        - {grupo: area,     variantes: ["{area}"]}
        - {grupo: periodo,  variantes: ["{periodo}"]}

    lista:
      grupos:
        - {grupo: variable, variantes: ["{variable} de {sujeto} por {apertura}", "{variable} de {sujeto}", "{sujeto}"]}
        - {grupo: area,     variantes: ["{area}"]}
        - {grupo: periodo,  variantes: ["{periodo}"]}

    flujo-od:
      # Confirmada con la primera vista del tipo: 85-matriz-od-interna (la matriz origen-destino de
      # 27x27 que JC dejo dibujada y vacia en su hoja, con la instruccion "COMPLETAR TODA LA MATRIZ").
      # El documento de JC no trae ejemplo de flujos, asi que la plantilla sigue el mismo orden que
      # `ranking` y la apertura la escribe el spec ("por departamento de origen y de destino").
      estado: confirmada
      confirmada_con: 85-matriz-od-interna
      grupos:
        - {grupo: variable, variantes: ["{variable} de {sujeto} {recorte} por {apertura}", "{variable} de {sujeto} {recorte}", "{variable} de {sujeto} por {apertura}", "{variable} de {sujeto}"]}
        - {grupo: area,     variantes: ["{area}"]}
        - {grupo: periodo,  variantes: ["{periodo}"]}

  # -------------------------------------------------------------------
  # Ejemplos resueltos (sirven de prueba de aceptacion del compositor)
  # -------------------------------------------------------------------
  ejemplos:
    - spec: 09-cultivo-mapa-sup-sembrada
      con_filtros: {cultivo: "Soja total", campania: "2024/25"}
      resultado: "Santiago del Estero - soja - Superficie sembrada por departamento - campaña 2024/25"
    - spec: 09-ranking-cultivo-produccion
      con_filtros: {cultivo: "Algodón", campania: "2024/25"}
      resultado: "Ranking de producción de algodón por departamento - Santiago del Estero - campaña 2024/25"
    - spec: 09-cultivo-evolucion-sup-sembrada
      con_filtros: {cultivo: "Soja total", geo: provincia}
      resultado: "Evolución de la superficie sembrada de soja - Santiago del Estero - campañas 2015/16 a 2024/25"
    - spec: 09-departamento-cartera
      con_filtros: {departamento: MORENO, campania: "2024/25", variable: produccion_tn, estacion: verano}
      resultado: "Distribución porcentual de la producción de los cultivos de verano por cultivo - MORENO (Santiago del Estero) - campaña 2024/25"
    - reproduccion_del_docx_mapa:
        nota: "El titulo del mapa de ejemplo de JC tiene que salir de la plantilla `mapa` sin tocar nada."
        slots: {area: "Chaco", sujeto: "ganado bovino", variable: "concentración de cabezas", apertura: "departamento", periodo: "año 2009"}
        resultado: "Chaco - ganado bovino - Concentración de cabezas por departamento - año 2009"
        diferencia_con_el_docx: "JC escribe dos de los tres separadores con U+2013. Nosotros usamos U+002D en los tres. Es la unica diferencia."
    - reproduccion_del_docx_grafico:
        nota: >
          El titulo del grafico de barras embebido sale de la plantilla `torta` (que es la de las
          distribuciones porcentuales), usando la tercera variante del grupo `variable`, porque JC
          mete el sujeto adentro de la frase de la variable ("del stock bovino").
        slots: {variable: "distribución porcentual del stock bovino", sujeto: null, apertura: "estrato", area: "Santiago del Estero/País", periodo: "año 2010"}
        resultado: "Distribución porcentual del stock bovino por estrato - Santiago del Estero/País - año 2010"
        ojo: >
          El titulo cierra, pero el TIPO de grafico no: son barras de una distribucion por categoria
          (estrato) comparando dos areas, y eso no es exactamente ninguno de los 7 tipos permitidos
          en CLAUDE.md (`ranking` esta ordenado por magnitud, `serie` es temporal, `torta` es una
          sola area). Con la base 9 no hace falta; con la base 48 si. Propuesta de tipo nuevo
          `distribucion` elevada a Francisco, no se inventa por las nuestras.

# ===========================================================================
# 3. SLOTS: como se resuelve cada uno
# ===========================================================================
slots:

  # --- area ----------------------------------------------------------
  area:
    resolucion:
      provincia: "Santiago del Estero"                 # nombre completo, nunca "SDE" ni "Sgo. del Estero"
      departamento: "{nombre} (Santiago del Estero)"   # nombre = dim_geo.nombre, tal cual
      pais: "País"
      region: "{nombre de la region}"                  # ej. "NOA"
      comparacion: "lista de areas unida con `tipografia.separador_areas`, en el orden declarado en el spec"
    orden_en_comparaciones: "Santiago del Estero SIEMPRE primero, despues el agregado mayor. Ej: Santiago del Estero/País."
    nombres_de_departamento:
      regla: "Se muestran EXACTAMENTE como vienen en dim_geo.nombre: mayusculas y sin tildes (MORENO, RIO HONDO, JUAN F. IBARRA)."
      motivo: >
        Es como los escribe la fuente. Pasarlos a "Río Hondo" obliga a inventar tildes y a decidir
        caso por caso (JUAN F. IBARRA, OJO DE AGUA). No inventamos: si JC prefiere capitalizacion
        normal, se agrega una columna de nombre para mostrar en configs/dims/geo-alias.yaml y se
        cambia esta linea. Preguntado en el backlog (pregunta 18).
    provincia_es_parametro: true   # CLAUDE.md: nada hardcodeado a SDE fuera de configs

  # --- sujeto: el "sector o subsector" de JC ---------------------------
  sujeto:
    de_donde_sale: >
      Del arbol tematico que JC arma en su propio indice (configs/manifiesto-indice.yaml,
      `tema.ruta`). No lo inventamos nosotros: es su vocabulario.
    nivel_que_se_usa: >
      El SUBSECTOR, no el sector. En su ejemplo JC escribe "ganado bovino" (la base 48 cuelga de
      Ganadería > Bovinos > Carne), no escribe "ganadería". Se usa el mismo nivel para todas las bases.
    por_base:
      9:
        sector: "Agricultura"
        subsector: "cultivos extensivos"
        frase_en_titulo: "los cultivos extensivos"
        arbol_jc: "Agricultura > Cultivos extensivos > [Granos, Oleaginosas, Algodón, Legumbres]"
        justificacion: >
          Es literalmente la rama que JC le puso a la base 9 en su indice, y coincide con el nombre
          que ya usa todo el repo (configs/bases/9-cultivos-extensivos.yaml, slug_base
          `cultivos-extensivos`, la seccion del catalogo). "Agricultura extensiva" describiria la
          ACTIVIDAD; "cultivos extensivos" describe la COSA que se cuenta, que es lo que hace JC
          cuando escribe "ganado bovino" en vez de "ganadería". Se elige el paralelo exacto.
      # --- familia DTV de hortalizas (bases 56 batata, 57 cebolla, 75 papa) ---
      # No es una base: son tres bases que comparten mart, adapter y modelo de analisis, y se
      # titulan igual. La clave es la familia y no un numero, para que ninguna de las tres
      # quede con un titulo distinto de las otras dos.
      dtv-hortalizas:
        sector: "Agricultura"
        subsector: "cultivos intensivos"
        frase_en_titulo: "las hortalizas"
        arbol_jc: "Agricultura > Cultivos intensivos > Frutas y hortalizas"
        estado: provisorio
        justificacion: >
          El subsector es literalmente la rama que JC le puso a las tres bases en su indice
          ("Agricultura > Cultivos intensivos > Frutas y hortalizas"), igual que en la base 9.
          Detras de "de" no se puede usar ("de cultivos intensivos" se lee mal cuando el sujeto
          del cuadro es un producto), asi que la frase para esa posicion es "las hortalizas",
          que es ademas como las nombra la maqueta "Agri 2" de JC ("DTV de hortalizas"). Mismo
          criterio que la base 85 con "ganado bovino" / "la hacienda bovina". Se confirma con
          JC en la primera revision de la seccion.
      48:
        sector: "Ganadería"
        subsector: "ganado bovino"
        frase_en_titulo: "el ganado bovino"
        arbol_jc: "Ganadería > Bovinos > Carne"
        estado: provisorio
        nota: "Se adopta la frase literal del docx de JC ('Ganado bovino'), que es mas legible que 'bovinos'. Se confirma cuando entre la base 48."
      85:
        sector: "Ganadería"
        subsector: "ganado bovino"
        frase_en_titulo: "la hacienda bovina"
        arbol_jc: "Ganadería > Bovinos"
        estado: confirmado
        por_que_dos_frases_distintas: >
          El subsector es el literal de JC ("Chaco - ganado bovino - ...") y se usa donde el sujeto
          va suelto, o sea en la plantilla `mapa`. Detras de "de" no se puede usar: "de el ganado
          bovino" no es castellano y el compositor no contrae articulos (no hace heuristicas, ver
          `composicion.determinismo`). La frase para esa posicion es "la hacienda bovina", que es
          ademas la que ya declara _comunes-base-85.presentacion.frase_en_titulo.
    dos_frases_por_que:
      subsector: "va solo, sin articulo. Lo usa la plantilla `mapa`, donde el sujeto es un fragmento aparte ('Chaco - ganado bovino - ...')."
      frase_en_titulo: "va detras de 'de'. La usan todas las demas plantillas ('evolución del rendimiento de los cultivos extensivos')."
      regla: "`{desde: subsector}` resuelve a una o a otra segun donde caiga el sujeto en la plantilla. No lo decide el spec."
    afinado_por_vista:
      regla: >
        El spec puede afinar el sujeto a algo mas especifico que el subsector, si la vista habla de
        una sola cosa. Es lo que hace JC: la base es de bovinos pero el grafico dice "stock bovino".
      opciones:
        - {valor: "subsector", da: "cultivos extensivos"}
        - {valor: "{desde_filtro: cultivo}", da: "soja, algodón, maíz..."}
        - {valor: "{desde_filtro: estacion}", da: "cultivos de verano | cultivos de invierno | cultivos extensivos"}
      articulo: >
        El sujeto se declara CON su articulo cuando la frase lo pide ("los cultivos de verano"), y
        sin el cuando es un nombre suelto ("soja"). Lo decide la tabla, no el compositor.
      si_hay_varios_valores:
        regla: "Si el filtro admite varios valores a la vez (ej. 3 cultivos en una serie), con 1 valor se usa ese valor y con 2 o mas se usa el `subsector` de la base."
        ejemplo: "3 cultivos elegidos -> 'los cultivos extensivos'"
    nombre_de_cultivo_para_titulo:
      regla:
        - "rol `agregado`  -> se usa `cultivo_grupo` ('Soja total' -> 'soja', 'Trigo total' -> 'trigo')"
        - "rol `simple`    -> se usa `cultivo` ('Algodón' -> 'algodón', 'Maní' -> 'maní')"
        - "rol `componente`-> se usa `cultivo` completo ('Soja 1ra' -> 'soja 1ra')"
        - "minusculas: se baja SOLO la primera letra, el resto queda tal cual (no rompe siglas ni tildes)"
      motivo: >
        "Santiago del Estero - soja total - ..." se lee mal y ademas "total" no es parte del nombre
        del cultivo: es la marca de que la fila es el agregado. En el titulo va el cultivo; que la
        cifra sea el total y no la suma de partes se explica en la nota `total-no-suma-componentes`.
      tabla_fuente: "specs/modelos/dim-cultivos.yaml (columnas cultivo, grupo, rol)"
    estacion_a_frase:
      verano: "los cultivos de verano"
      invierno: "los cultivos de invierno"
      todos: "los cultivos extensivos"

  # --- variable -------------------------------------------------------
  variable:
    frase_base:
      # medida del mart -> frase para el titulo. Siempre en minuscula: la mayuscula la pone el paso 6.
      # `genero` resuelve la contraccion del articulo sin que nadie tenga que pensarla.
      sup_sembrada_ha:   {frase: "superficie sembrada",  genero: f}
      sup_cosechada_ha:  {frase: "superficie cosechada", genero: f}
      produccion_tn:     {frase: "producción",           genero: f}
      rendimiento_kg_ha: {frase: "rendimiento",          genero: m}
      # --- base 85 (movimientos de hacienda). La medida se llama `cabezas` en el mart, pero la
      # frase dice "cabezas movidas" porque el dato es un FLUJO: un animal que se movio tres veces
      # cuenta tres. "Cabezas" a secas es el stock, y esa es la base 48, que todavia no entro; su
      # medida se va a llamar distinto (existencias) justamente para que las dos no se pisen.
      cabezas:                 {frase: "cabezas movidas",        genero: f_plural}
      documentos:              {frase: "documentos de tránsito", genero: m_plural}
      ingreso_establecimiento: {frase: "ingresos",               genero: m_plural}
      egreso_establecimiento:  {frase: "egresos",                genero: m_plural}
      balance_cabezas:         {frase: "balance de cabezas",     genero: m}
      # --- familia DTV de hortalizas (bases 56, 57 y 75) ---
      # `peso_tn` es un FLUJO, como las cabezas de la base 85: son las toneladas que se
      # movieron, no las que se produjeron. La frase lo dice ("movidas") para que nadie lea el
      # numero como produccion provincial. `movimientos` se dice completo en el titulo
      # ("declaraciones de transito vegetal") y abreviado DTV en rotulos y columnas, que es
      # como lo escribe JC. `superficie_estimada_ha` no es una medida del mart: es el calculo
      # de JC (kilos de las DTV sobre el rendimiento promedio) y la frase dice "estimada".
      peso_tn:                {frase: "toneladas movidas",                  genero: f_plural}
      movimientos:            {frase: "declaraciones de tránsito vegetal",  genero: f_plural}
      superficie_estimada_ha: {frase: "superficie estimada",                genero: f}
    articulo:
      f:        "de la"
      m:        "del"
      f_plural: "de las"
      m_plural: "de los"
      multiple: "de"       # cuando la frase junta varias medidas
    frase_multiple:
      regla: "Si la vista muestra varias medidas a la vez, se unen con `separador_lista` y `ultimo_de_lista`, en el orden en que estan declaradas en `variables`, y el genero pasa a `multiple`."
      ejemplo: "superficie sembrada, superficie cosechada, producción y rendimiento"
      si_queda_muy_largo: "el spec usa `override` con motivo (ej. 'superficie, producción y rendimiento')"
    prefijo_por_tipo:
      # Da el "tipo de grafico y variable" que pide JC (parrafo 21).
      # {art} se reemplaza por `articulo[genero]`.
      mapa:              "{frase}"                                # el mapa ya es la distribucion: no lleva prefijo
      serie:             "evolución {art} {frase}"                # "evolución de la superficie sembrada" / "evolución del rendimiento"
      ranking:           "ranking de {frase}"                     # sin articulo: "ranking de producción"
      torta:             "distribución porcentual {art} {frase}"  # calcado de JC (parrafo 21)
      tabla-variaciones: "diferencias y variaciones {art} {frase}"
      lista:             "{frase}"
      flujo-od:          "{frase}"                              # la matriz YA es el flujo: no lleva prefijo, igual que el mapa
      origen_docx: {parrafo: 21, texto: "Tipo de gráfico y variable (distribución porcentual)"}
    prefijo_por_grafico:
      # Tiene PRIORIDAD sobre `prefijo_por_tipo` cuando el spec declara `grafico`. Existe porque el
      # `tipo` dice de que va la vista y el `grafico` dice que esta viendo el ojo: unas barras
      # apiladas al 100% son una distribucion porcentual aunque el tipo de la vista sea `serie`.
      barras-apiladas-100: "distribución porcentual {art} {frase}"
    override:
      permitido: true
      campo_en_el_spec: "titulo_componentes.variable.override"
      que_reemplaza: "el fragmento COMPLETO del grupo variable (prefijo + frase). Los otros slots se siguen resolviendo normalmente."
      es_una_plantilla: "puede usar {frase} y {art}, asi que sigue reaccionando al filtro de variable"
      exige: "un `motivo` escrito al lado. Sin motivo, el build falla."
      cuando: "solo cuando la composicion mecanica dice algo falso o incomprensible (una tabla de puestos no muestra 'diferencias y variaciones'). No para gustos de redaccion."
      usos_actuales: "4 de las 16 vistas de la base 9, cada uno con su motivo escrito en el spec."
    unidades_en_el_titulo:
      regla: "NO van. La unidad va en el subtitulo, en el rotulo del eje y en la leyenda del mapa."
      motivo: "Los dos ejemplos de JC (mapa y grafico) tienen el titulo sin unidad."

  # --- apertura -------------------------------------------------------
  apertura:
    de_donde_sale: "la primera dimension de `dimensiones` que NO sea el eje temporal"
    frases:
      departamento: "departamento"
      provincia:    "provincia"
      cultivo:      "cultivo"
      variedad:     "variedad"
      categoria:    "categoría"
      estrato:      "estrato"
      campania:     "campaña"
      motivo:       "motivo"
      # --- base 85 ---
      mes:                 "mes"
      origen-destino:      "departamento de origen y de destino"
      provincia-destino:   "provincia de destino"
      provincia-origen:    "provincia de origen"
    dinamica:
      como: "{desde_filtro: apertura} -> el VALOR del filtro es un id de `frases`"
      cuando: "vistas con un selector de apertura (ej. la evolucion anual, que se puede ver total o abierta por categoria)"
    sin_apertura:
      valores: [total]
      que_significa: >
        El filtro de apertura esta en "total": la vista no abre por ninguna dimension y el titulo
        cae en la variante sin {apertura}. Esta escrito como una lista y no como un `if` en el
        codigo para que el vocabulario de los filtros quede en el protocolo y no en el build.
    si_no_hay: "el grupo `variable` usa la variante sin apertura. No se inventa una."
    origen_docx: {parrafo: 12, texto: "Concentración de cabezas por departamento"}

  # --- recorte --------------------------------------------------------
  recorte:
    que_es: >
      El universo del que sale el numero, cuando la vista muestra una PARTE del total y el titulo
      tiene que decirlo para que el numero se entienda. Va entre parentesis, pegado al fragmento
      de la variable.
    de_donde_sale: >
      De JC. En la hoja "Modelo Analisis" de la base 85 el titula sus propios cuadros
      "Movimientos totales (sin introducción)", "Movimientos internos (dentro SDE)" y
      "Movimientos cabezas salidas (extracción)". El parentesis es suyo, no nuestro.
    por_que_es_un_slot_aparte: >
      Podria escribirse dentro del texto de la variable, pero entonces cada vista tendria que
      repetir la frase completa y el recorte dejaria de reaccionar al selector. Son cuatro
      universos que se combinan con cada medida: como slot, se declaran una sola vez en
      `_comunes-base-85.universos` y el titulo cambia solo cuando el usuario cambia de recorte.
    como_se_declara:
      - "{fijo: \"(extracción)\"}      -> texto fijo, con los parentesis incluidos"
      - "{desde_universo: true}       -> la `etiqueta_corta` del universo que declara `universo.recorte`"
      - "{desde_filtro: recorte}      -> la `etiqueta_corta` del universo elegido en el selector"
    formato: "el texto se escribe YA con los parentesis. El compositor no los agrega ni los saca."
    si_no_hay: >
      El grupo `variable` cae en su primera variante sin {recorte}. Ninguna vista de la base 9 lo
      declara, asi que ninguno de sus 16 titulos cambia.

  # --- periodo --------------------------------------------------------
  periodo:
    principio: >
      La palabra "año" se reserva para las bases cuyo grano REALMENTE es el año calendario (SENASA,
      bases 48 y 85, que es de donde salen los ejemplos de JC). La base 9 tiene grano CAMPAÑA y una
      campaña no es un año: 2024/25 arranca en 2024 y termina en 2025. Escribir "año 2024" sobre un
      dato de campaña seria decir algo falso. Se dice "campaña".
    plantillas:
      anio_simple:        "año {anio}"                          # "año 2009"
      anio_rango:         "años {desde} a {hasta}"              # "años 2009 a 2015"
      anio_lista:         "años {lista}"                        # hasta 3 no contiguos
      anio_muchas:        "{n} años hasta {hasta}"              # 4 o mas no contiguos
      campania_simple:    "campaña {campania}"                  # "campaña 2024/25"
      campania_rango:     "campañas {desde} a {hasta}"          # "campañas 2015/16 a 2024/25"
      campania_lista:     "campañas {lista}"                    # hasta 3, unidas con separador_lista y ultimo_de_lista
      campania_muchas:    "{n} campañas hasta {hasta}"          # 4 o mas no contiguas
      mes_simple:         "{mes} de {anio}"
      mes_rango:          "{mes_desde} de {anio_desde} a {mes_hasta} de {anio_hasta}"
    grano_por_base:
      # Cual de las dos familias de plantillas usa cada base. Lo decide el GRANO del dato, no la
      # vista: es la aplicacion del `principio` de arriba.
      9:  campania
      48: anio
      85: anio
      dtv-hortalizas: anio   # el mart es diario; el sitio lo agrega a año y a año-mes
    como_se_elige:
      - "1 solo valor -> `*_simple`"
      - "2 o mas valores CONTIGUOS segun dim_tiempo_campania.orden -> `*_rango`, con el primero y el ultimo"
      - "2 o 3 valores no contiguos -> `campania_lista`"
      - "4 o mas no contiguos -> `campania_muchas`"
    fuente_del_orden: "marts/dim_tiempo_campania.parquet, columna `orden` (la contiguidad se evalua ahi, no comparando strings)"
    grano_anual:
      contiguidad: "los años son enteros: contiguos = consecutivos de a uno. No hace falta tabla de orden."
      lista_y_muchas: >
        Con grano anual se usan las mismas dos plantillas de cierre que con campañas, cambiando la
        palabra: `anio_lista` ("años 2022, 2024 y 2025") y `anio_muchas` ("6 años hasta 2025").
      anio_en_curso: >
        El año incompleto NO se rotula con sufijo en el titulo. Se decide antes: o la vista lo
        excluye (`excluye_anio_en_curso: true`, que es lo que hacen los totales y los rankings) o
        lo muestra y lo explica con una advertencia en pantalla, como la serie mensual. Un titulo
        que dijera "años 2022 a 2026" sobre un cuadro que llega hasta mayo seria enganioso, y por
        eso la ventana efectiva del titulo sale de los años realmente graficados, no de la ventana
        declarada.
    campania_en_curso:
      sufijo: " (en curso)"
      cuando: "la campaña mostrada es la que `_comunes-base-N.campania_en_curso` marca como abierta"
      ejemplo: "campaña 2025/26 (en curso)"
    ventana_del_demo:
      nota: "Si la vista usa la ventana completa, el periodo se resuelve contra `ventana_campanias.resueltas_*`, no contra un string escrito a mano. Hoy da: campañas 2015/16 a 2024/25."
    origen_docx:
      - {parrafo: 13, texto: "Año de referencia (2009)"}
      - {parrafo: 24, texto: "Año o período de referencia. (en este caso NO hay un rango de períodos)"}

# ===========================================================================
# 4. SUBTITULO
# ===========================================================================
subtitulo:
  obligatorio: true
  que_lleva: "la unidad de medida, y cualquier recorte del universo que cambie como se lee el numero"
  plantilla_por_defecto: "En {unidad_larga}"
  unidad_larga:
    ha:    "hectáreas"
    tn:    "toneladas"
    kg/ha: "kilos por hectárea"
    "%":   "porcentaje"
    cabezas: "cabezas"
    dte:   "documentos"
    dtv:   "declaraciones de tránsito"   # familia DTV de hortalizas (bases 56, 57 y 75)
    "$/kg": "pesos por kilo"             # precios mayoristas del MCBA (base 8)
  se_puede_escribir_a_mano: true
  regla: "Si el spec trae `subtitulo`, manda el del spec, pero TIENE que nombrar la unidad. El build lo verifica buscando la unidad larga en el texto."
  motivo: "JC no pide subtitulo en el docx, pero tampoco quiere la unidad en el titulo, y un numero sin unidad no se publica. Los 16 specs de la base 9 ya lo traen escrito."

# ===========================================================================
# 5. PIE DE FUENTE
# ===========================================================================
pie_de_fuente:
  obligatorio: true
  origen_docx: {parrafo: 7, texto: "Fuente: SENASA"}
  tambien_lo_pide: "CLAUDE.md (fuente citada al pie de cada cuadro/grafico)"
  plantilla: "Fuente: {organismo}"
  plantilla_con_publicacion: "Fuente: {organismo}, {publicacion}"
  de_donde_sale_el_organismo:
    columna: "fuente"
    tabla: "el mart que alimenta la vista (ej. marts/hecho_cultivos.parquet)"
    regla: >
      Valor unico de la columna `fuente` de las filas que efectivamente se estan mostrando. No se
      escribe a mano en el spec: asi la cita nunca puede contradecir al dato que esta arriba.
    varias_fuentes: "si el conjunto trae mas de un valor, se listan con `separador_lista` y `ultimo_de_lista`, en orden alfabetico"
  publicacion:
    por_defecto: null
    regla: "Solo se agrega si esta declarada en el config de la base. No se completa de memoria."
    base_9: null
    aclaracion_base_9:
      texto: "(Ministerio de Agricultura, Ganadería y Pesca)"
      plantilla: "Fuente: {organismo} {aclaracion}"   # sin coma, calcado del mockup
      resultado: "Fuente: MAGyP (Ministerio de Agricultura, Ganadería y Pesca)"
      origen: "mockup Modelo 2, pie del mapa (tercera tanda 10-ago-2026). Backlog 14, respondida."
    nota_base_9: >
      JC declara la cita en su propio indice como "Fuente: MAGyP" (configs/bases/9-cultivos-extensivos.yaml,
      `indice.cita_fuente_al_pie`), y el mart trae `fuente = 'MAGyP'` en las 11.728 filas. Los 16 specs
      venian citando "MAGyP, Estimaciones Agrícolas", que es el nombre real de la serie del ministerio
      pero NO es lo que JC declaro. La pregunta 14 del backlog quedo respondida por el mockup
      LITERAL de la tercera tanda (10-ago-2026): JC escribe de su puño
      "Fuente: MAGyP (Ministerio de Agricultura, Ganadería y Pesca)" bajo el mapa. Se adopta
      esa forma en cultivos: organismo del mart ("MAGyP") + la aclaracion entre parentesis como
      publicacion declarada aca. "Estimaciones Agrícolas" queda descartada.
  verificacion_en_el_build:
    - "el spec declara `fuente.organismo_esperado`; si el mart trae otro valor, el build FALLA"
    - "ninguna vista se renderiza sin pie"
  posicion: "debajo del grafico, alineado a la izquierda, tipografia menor que el cuerpo"
  pie_del_sitio: "El pie general del sitio (site/theme.yaml, campo `pie`) es OTRA cosa y no reemplaza a este. Van los dos."

# ===========================================================================
# 6. NUMERACION DE TABLAS Y GRAFICOS
# ===========================================================================
numeracion:
  origen_docx: {parrafo: 75, texto: "Tabla 2 – Diferencias y variaciones por categorías del stock entre 2009 y 2008 (parte I)"}
  se_adopta: parcialmente
  decision:
    numeracion_global_entre_paginas: NO
    motivo: >
      "Tabla 2" viene de un informe impreso, donde las tablas van en un orden fijo y el lector tiene
      todo el documento. El sitio son paginas separadas con navegacion libre: no hay un orden. Una
      numeracion global seria ademas fragil (agregar una vista renumera todo lo que viene despues,
      y JC quedaria citando "la tabla 7" que paso a ser la 8) y no deterministica salvo que
      inventemos un orden artificial y lo mantengamos a mano para siempre.
    numeracion_dentro_de_una_pagina: SI
    como:
      formato_tabla: "Tabla {n}"
      formato_grafico: "Gráfico {n}"
      formato_mapa: "Mapa {n}"
      donde_va: "antepuesto al titulo de protocolo, separado con `tipografia.separador_titulo`"
      contador: "por pagina y por tipo de elemento, arrancando en 1"
      orden: "el orden en que la pagina lista sus vistas en el layout (un dato explicito del layout, no el orden de lectura del disco)"
      cuando_se_aplica: "solo si la pagina tiene 2 o mas elementos DEL MISMO TIPO. Un unico grafico en la pagina no se numera."
      determinismo: "el layout de cada pagina es un archivo versionado; mismo layout, misma numeracion"
    parte_i_parte_ii:
      que_es: "JC parte una tabla ancha en 'parte I' y 'parte II' porque no le entra en la hoja."
      se_adopta: NO
      en_su_lugar: "scroll horizontal con la primera columna fija. En pantalla no hay borde de hoja; partir la tabla obliga a comparar dos cuadros que podrian ser uno."
  ejemplo_resuelto: "Gráfico 2 - Evolución de la producción de soja - Santiago del Estero - campañas 2015/16 a 2024/25"

# ===========================================================================
# 7. EJE VERTICAL
# ===========================================================================
eje_vertical:
  origen_docx: {parrafo: 25, texto: "Las escalas verticales deben tener UN MÍNIMO DE 5 ESCALAS (los intervalos, en este caso 5% los elige cada uno: 0%; 5%; 10%, etc)"}
  regla_de_jc: "minimo 5 marcas rotuladas"
  lo_que_no_hacemos: >
    "los elige cada uno" no puede quedar asi: en un sitio generado no hay un "cada uno". Se define
    una funcion y todos los graficos del sitio la usan. La funcion esta calibrada para reproducir el
    intervalo que eligio JC en su propio grafico.
  funcion:
    nombre: marcas_eje
    entrada: [minimo_de_la_serie, maximo_de_la_serie]
    objetivo_intervalos: 7
    mantisas_permitidas: [1, 2, 2.5, 5, 10]
    pasos:
      - "1. piso_bruto = min(0, minimo_de_la_serie); techo_bruto = max(0, maximo_de_la_serie). El eje SIEMPRE incluye el cero (son barras: si no, la comparacion visual miente)."
      - "2. rango = techo_bruto - piso_bruto. Si rango = 0, marcas = [0, 1] y se termina."
      - "3. crudo = rango / objetivo_intervalos"
      - "4. exponente = floor(log10(crudo)); mantisa = crudo / 10^exponente"
      - "5. paso = 10^exponente * (primera mantisa permitida >= mantisa)"
      - "6. piso = floor(piso_bruto / paso) * paso; techo = ceil(techo_bruto / paso) * paso"
      - "7. marcas = (techo - piso) / paso + 1"
      - "8. mientras marcas < 5: paso = paso / 2 y volver al 6 (a lo sumo 2 veces)"
    se_calcula_en: "la unidad de display (puntos porcentuales para ejes en %, no fracciones)"
  eje_secundario:
    cuando: "grafico `barras-y-linea` (produccion en barras + rendimiento en linea)"
    regla: "se calcula el eje izquierdo con la funcion, y el derecho se fuerza a la MISMA cantidad de intervalos, con `paso_derecho = nice(rango_derecho / intervalos_izquierdos)` usando las mismas mantisas permitidas"
    motivo: "si los dos ejes tienen distinta cantidad de marcas, las lineas de grilla no coinciden y el grafico se lee sucio"
  pruebas_de_aceptacion:
    - caso: "grafico embebido de JC: distribucion porcentual del stock bovino por estrato, maximo 31,84%"
      esperado: "paso 5, marcas 0% 5% 10% 15% 20% 25% 30% 35% (8 marcas)"
      verificado: "coincide exactamente con el eje del grafico del docx (leido de word/charts/chart1.xml)"
    - caso: "barras apiladas al 100%"
      esperado: "paso 20, marcas 0% 20% 40% 60% 80% 100% (6 marcas)"
      nota: "sale de la misma funcion, no hace falta un caso especial"
  eje_horizontal:
    campanias: "se rotulan TODAS las campañas de la ventana. Con 10 no hace falta saltear ninguna."
    rotacion: "0 grados si entran; si no entran, 45 grados. Nunca se ocultan etiquetas."

# ===========================================================================
# 8. MAPAS DE CALOR
# ===========================================================================
mapa:
  origen_docx:
    - {parrafo: 14, texto: "Departamentos: con nombre (para el caso de mapas nacionales NO será necesario agregar nombres)."}
    - {parrafo: 15, texto: "Escala de referencia: En quintiles proporcionales con detalle de color, mínimo y máximo de cada subescala."}

  rotulos:
    departamentos_con_nombre: true
    fuente_del_nombre: "dim_geo.nombre (mismo criterio que `slots.area.nombres_de_departamento`)"
    mapas_nacionales: "sin nombres"
    si_no_entra_el_nombre: "se dibuja igual el nombre del departamento en los que entran y el resto se ve con el mouseover. Nunca se rotula solo a algunos por criterio estetico: el corte es por espacio y es el mismo en cada build."

  escala:
    tipo: quintiles_proporcionales
    clases: 5
    interpretacion: >
      "Quintiles proporcionales" = clasificacion por CANTIDAD de departamentos (5 grupos de tamaño
      parecido), no por partes iguales del rango de valores. Es lo unico que funciona con estos
      datos: en soja 2024/25 el mayor departamento tiene 355.400 ha y el menor 575. Cortando el
      rango en 5 partes iguales, 24 de los 26 departamentos caerian en la clase mas baja y el mapa
      quedaria todo del mismo color.
    algoritmo:
      - "1. Universo = departamentos CON DATO para la combinacion de filtros de la vista. Ver `sin_dato` mas abajo."
      - "2. Ordenar los valores de menor a mayor. n = cantidad."
      - "3. Para k = 1..4: i_k = redondeo comercial (half-up) de n * k / 5. corte_k = el valor que esta en la posicion i_k (contando desde 1)."
      - "4. Clases: C1 = [minimo, corte_1]; C2 = (corte_1, corte_2]; C3 = (corte_2, corte_3]; C4 = (corte_3, corte_4]; C5 = (corte_4, maximo]."
      - "5. Empates: como los cortes SON valores del propio conjunto y los intervalos son semiabiertos, dos departamentos con el mismo valor caen siempre en la misma clase. Por eso las clases no salen todas del mismo tamaño, y esta bien que asi sea."
      - "6. Si dos cortes consecutivos coinciden, la clase del medio queda vacia: NO se dibuja en la leyenda y queda anotada en el log del build."
      - "7. Si n < 5, no hay quintiles: una clase por valor distinto, hasta 5, usando los colores mas oscuros de la rampa. Se rotula 'menos de 5 departamentos con dato'."
    se_recalcula: "por cada combinacion de filtros (cultivo x campaña x variable)"
    advertencia_obligatoria_en_pantalla:
      id: cortes-propios-de-cada-mapa
      texto: >
        Los cortes de la escala se calculan con los datos de este mapa. Dos mapas de campañas
        distintas usan los mismos colores pero no necesariamente los mismos cortes: para comparar
        entre campañas hay que mirar los valores de la referencia, no el color.
      nota_para_jc: "Si prefiere cortes fijos para toda la serie, se cambia aca y los mapas pasan a ser comparables entre si. Backlog pregunta 16."

  leyenda:
    muestra: "el color, el minimo y el maximo de cada subescala"
    plantilla_de_clase: "{minimo} a {maximo}"
    valores_que_se_muestran: "el menor y el mayor de los departamentos QUE ESTAN en la clase (no los puntos de corte)"
    formato: "el de `precision_display` de la base (para superficie: entero, redondeado a la centena si es >= 1.000)"
    redondeo: "comercial (half-up). NO el redondeo bancario que Python trae por defecto en round()."
    si_el_redondeo_solapa_dos_clases: "se muestran las dos clases sin redondear. Una leyenda donde una clase termina en 26.200 y la siguiente empieza en 26.200 se lee como un error."
    orden: "de la clase mas alta a la mas baja, de arriba hacia abajo"
    ultima_entrada: "'Sin datos', con el color `sin_dato.color`, siempre al final y siempre presente si hay al menos un departamento sin dato"
    unidad: "va en el encabezado de la leyenda, una sola vez (ej. 'Hectáreas sembradas')"

  sin_dato:
    entran_al_calculo_de_quintiles: false
    motivo: >
      Un departamento sin dato no es un departamento con cero. Si entrara al calculo, correria los
      cortes de las 5 clases y ademas pintaria de color claro (que se lee como "poco") algo de lo
      que no sabemos nada.
    se_dibuja: true
    motivo_de_dibujarlo: >
      Un hueco en el mapa se lee como un error de la provincia, no como ausencia de dato
      (configs/dims/sde-departamentos.yaml, advertencia `salavina-sin-datos`).
    color: "#bdbdbd"
    borde: "#9e9e9e"
    etiqueta_en_leyenda: "Sin datos"
    caso_conocido:
      departamento: "SALAVINA"
      geo_id: "86168"
      base: 9
      detalle: "Tiene poligono en el GeoJSON pero no tiene ni una fila en la base 9, en ninguna campaña. El mapa dibuja 27 departamentos y el calculo de quintiles corre sobre 26."
      nota_metodologica: "salavina-sin-datos (definida en _comunes-base-9.yaml)"
    otros_estados_sin_dato: "los tres estados de `_comunes-base-9.estados_sin_dato` (sin_datos, sembrado_sin_cosechar, produccion_no_informada) se pintan igual y se distinguen en el mouseover"

  geometria:
    archivo: "configs/dims/sde-departamentos.geojson"
    clave_de_join: "properties.geo_id contra dim_geo.geo_id (5 digitos INDEC)"
    procedencia: "configs/dims/sde-departamentos.yaml"

  prueba_de_aceptacion:
    caso: "09-cultivo-mapa-sup-sembrada con cultivo = Soja total, campaña 2024/25, variable = sup_sembrada_ha"
    n: 26
    cortes: {corte_1: 4400, corte_2: 5850, corte_3: 26150, corte_4: 93500}
    clases:
      - {clase: 5, deptos: 5, leyenda: "95.500 a 355.400", color: "#1b5e20"}
      - {clase: 4, deptos: 5, leyenda: "26.700 a 93.500",  color: "#388e3c"}
      - {clase: 3, deptos: 6, leyenda: "7.200 a 26.200",   color: "#66bb6a"}
      - {clase: 2, deptos: 5, leyenda: "5.000 a 5.900",    color: "#a5d6a7"}
      - {clase: 1, deptos: 5, leyenda: "575 a 4.400",      color: "#e8f5e9"}
      - {clase: null, deptos: 1, leyenda: "Sin datos", color: "#bdbdbd", detalle: "SALAVINA"}
    verificado_contra: "marts/hecho_cultivos.parquet el 2026-07-30"
    nota: "La clase 3 tiene 6 departamentos y no 5 por el redondeo de las posiciones de corte. Es el comportamiento esperado del algoritmo, no un error."

# ===========================================================================
# 9. COLORES
# ===========================================================================
# LA REGLA MAS FUERTE DEL DOCUMENTO.
colores:
  origen_docx: {parrafo: 17, texto: "COLORES: SIEMPRE SE CONSERVARÁ LA MISMA ESCALA DE COLORES PARA EL MISMO TIPO DE VARIABLE."}
  tambien_lo_pide: "_comunes-base-9.uniformidad (JC f39-f41: 'sino seria un carnaval')"

  regla: >
    El color lo decide el TIPO DE VARIABLE, no la vista, no la base, no el cultivo y no quien
    construye la pagina. Superficie es verde en todos lados y siempre; produccion es ocre en todos
    lados y siempre. Si una vista necesita otro color, se cambia ACA y cambia en todo el sitio.

  como_se_hereda: >
    Cada nueva base declara a que tipo de variable pertenece cada una de sus medidas. Si el tipo ya
    existe, usa su rampa sin discutir. Si es un tipo nuevo (cabezas, milimetros de lluvia, pesos),
    se agrega una rampa nueva aca, una sola vez, y queda fija para siempre.

  rampas:
    superficie:
      medidas: [sup_sembrada_ha, sup_cosechada_ha]
      unidad: ha
      hex: ["#e5f1db", "#b7d3a8", "#7fae7a", "#4c8352", "#22502c"]
      color_solido: "#22502c"
      justificacion: >
        Termina exactamente en el verde institucional de site/theme.yaml (#22502c), asi que la
        variable principal del sitio y la identidad visual son el mismo color. Cinco pasos con
        diferencia de luminosidad pareja entre si.
        Actualizada el 2026-08-03: la regla no cambio, cambio el verde institucional al que la
        regla la ata. Los dos extremos se muestrearon del mapa del mockup aprobado por Francisco
        (specs/fuentes/WhatsApp Image 2026-07-27 at 20.24.16.jpeg).
    produccion:
      medidas: [produccion_tn]
      unidad: tn
      hex: ["#fff3e0", "#ffcc80", "#ffa726", "#f57c00", "#e65100"]
      color_solido: "#e65100"
      justificacion: "Ocre/naranja de grano cosechado. Un solo tono, sin choque con el verde institucional: en un tablero con las dos variables al lado se distinguen de un vistazo y tambien en escala de grises."
    rendimiento:
      medidas: [rendimiento_kg_ha]
      unidad: kg/ha
      hex: ["#e3f2fd", "#90caf9", "#42a5f5", "#1976d2", "#0d47a1"]
      color_solido: "#0d47a1"
      justificacion: >
        El rendimiento es un cociente, no un volumen: no se suma ni se acumula. Merece un tono
        claramente distinto de los dos anteriores para que nadie lo lea como "mas superficie" o
        "mas produccion". El azul no se confunde con el verde ni con el ocre en las formas de
        daltonismo mas frecuentes.
    cabezas:
      medidas: [cabezas, ingreso_establecimiento, egreso_establecimiento, balance_cabezas]
      unidad: cabezas
      hex: ["#efebe9", "#bcaaa4", "#8d6e63", "#5d4037", "#3e2723"]
      color_solido: "#5d4037"
      estado: confirmada
      confirmada_con: "las 15 vistas de la base 85 (movimientos de hacienda), 2026-07-31"
      justificacion: "Ganaderia (bases 48 y 85). Tipo de variable distinto de todo lo agricola, rampa propia desde el dia uno, tal como pide JC."
    documentos:
      medidas: [documentos]
      unidad: dte
      hex: ["#eceff1", "#b0bec5", "#78909c", "#455a64", "#263238"]
      color_solido: "#455a64"
      estado: confirmada
      justificacion: >
        Un DTE no es una cabeza: es un papel. Contar documentos y contar animales son dos
        variables distintas y el protocolo manda que dos tipos de variable no compartan escala.
        Gris azulado porque es el color de lo administrativo y porque, puesto al lado del marron
        de la hacienda, deja claro de un vistazo cual de los dos cuadros esta mirando el ojo.
    precio:
      medidas: [precio_kg]
      unidad: "$/kg"
      hex: ["#f3e5f5", "#ce93d8", "#ab47bc", "#7b1fa2", "#4a148c"]
      color_solido: "#7b1fa2"
      estado: nueva
      agregada: 2026-09-23
      agregada_por: "el panel de precios del MCBA del tablero de cultivos intensivos (base 8)"
      justificacion: >
        Un PRECIO no es ninguna de las variables que ya tenian rampa. No es un volumen (no se
        suma ni se acumula), no es un papel y no es un rendimiento fisico: es dinero por unidad
        de producto, y ademas viene en pesos CORRIENTES, o sea que su escala mezcla el precio
        real con la inflacion. El protocolo manda que dos tipos de variable no compartan escala
        ni rampa, asi que le corresponde una propia. El violeta no lo usa ninguna otra rampa
        (verde superficie, ocre produccion, azul rendimiento, marron hacienda, gris azulado
        documentos) ni el cromo del theme, y se distingue de todas ellas tambien en escala de
        grises.
      preguntado_a_jc: "backlog 50"

  sin_dato:
    hex: "#bdbdbd"
    regla: "No pertenece a ninguna rampa y no se usa nunca para representar un valor."

  no_choca_con_el_theme:
    verificado: 2026-07-30
    detalle: >
      site/theme.yaml define primario #1b5e20 (verde), secundario #37474f (gris azulado), fondo
      #fafafa y texto #212121. La rampa de superficie TERMINA en el primario (a proposito). El resto
      de las rampas no toca ninguno de los cuatro colores del theme. El secundario #37474f queda
      libre para cromo de interfaz (bordes, ejes, tipografia de apoyo) y no se usa para datos.

  series_de_un_grafico:
    aclaracion: >
      Las rampas de arriba son para ESCALAS DE INTENSIDAD (mapas y todo lo que pinte por magnitud).
      Cuando el color distingue categorias (un cultivo por serie, una provincia por serie), manda
      la regla `uniformidad.regla_color_cultivo` de _comunes-base-9: un color fijo por cultivo,
      asignado una sola vez y respetado en todas las vistas.
    comparaciones_geograficas:
      regla: "En un grafico que compara areas (Santiago contra el pais, o contra el NOA), Santiago del Estero va SIEMPRE con el primario #1b5e20 y el agregado de comparacion con el secundario #37474f."
      motivo: "Es el caso del grafico de ejemplo de JC (Sgo. del Estero vs Total Pais). El sujeto del sitio es la provincia: siempre se lee primero y con el color de la casa."

