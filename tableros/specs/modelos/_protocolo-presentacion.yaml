    Se implemento el compositor tal como esta descripto aca y se corrio sobre los 16 specs de la
    base 9. Los 16 titulos salen exactamente iguales a los `titulo_protocolo_ejemplo` que declara
    cada spec, y los dos titulos del propio docx de JC (el mapa del Chaco y el grafico de barras)
    se reproducen con las plantillas `mapa` y `torta` sin ningun caso especial.
  quintiles: "la prueba de aceptacion del mapa se calculo contra marts/hecho_cultivos.parquet"
