  # Bloques nuevos de pagina que trae el mockup (formas que HOY no existen
  # en el template de tablero: las agrega constructor-dashboards, no este spec)
  # -------------------------------------------------------------------
  bloques_del_mockup:
    tabla_datos:
      que_es: "la tabla de datos crudos debajo del grafico de evolucion (campaña, sup. cosechada, produccion, rendimiento)"
      estado: >
        a reconstruir segun el mockup LITERAL (tercera tanda del 10-ago-2026): vuelve a los DOS
        bloques de campañas lado a lado que dibuja JC en su Modelo 2, con las columnas Campaña,
        Superficie Cos. (Ha), Producción (Tn) y Rendimiento Kg/ha en cada bloque, y sin titulo
        de panel (el mockup no le dibuja titulo). Detalle en tablero-cultivos-extensivos.yaml,
        paneles.tabla-datos.
      una_sola_serie:
        estado: DEROGADA (tercera tanda del 10-ago-2026)
        decidido_por: "Facu, 10-ago-2026, con JC presente (segunda tanda de decisiones del dia)"
        cita: >
          "En los datos por campaña se vea una sola cosa, no que quede un espacio de blanco en
          la tabla."
        derogacion: >
          La tercera tanda del mismo dia ("el mockup es LITERAL, hay que hacer lo que dice JC")
          es posterior y manda: la tabla vuelve a los dos bloques del dibujo de JC. Con la
          ventana de 10 campañas los bloques cierran 5 y 5, sin hueco. Interpretacion anotada
          para confirmar con Facu: backlog pregunta 38.
    utilidades:
      que_es: "panel 'UTILIDADES': Asistente IA y Exportar como PDF (los anexos traen tambien JPG y Excel)"
      estado: >
        habilitado (Facu, 10-ago-2026): entro como iconos DESHABILITADOS con rotulo
        "Proximamente" (Asistente IA y Exportar PDF). Era una excepcion explicita y ACOTADA a
        la regla "no se dibujan botones que no hacen nada", que sigue vigente para todo lo
        demas. Backlog pregunta 33, resuelta en parte.
        EXPORTAR COMO PDF ES UN BOTON DE VERDAD desde el 22-sep-2026 (Francisco): imprime el
        tablero con la seleccion vigente y el PDF lo arma el navegador. La excepcion ahora
        cubre solo al Asistente IA. Un item de utilidades se activa declarando su `accion` en
        el spec del tablero; sin `accion` sigue deshabilitado.
        Que entra en el PDF: cabecera con el logo, la ruta (que dice el cultivo elegido), los
        indicadores, los cuadros con sus fuentes y el pie con la fecha de los datos. Que NO
        entra: los CONTROLES (menu, pestañitas de campaña, chips de cultivo, filtros,
        "Volver") ni los bloques deshabilitados (las propias UTILIDADES e "Información
        relacionada"), porque en un PDF no se puede hacer clic y solo ocupan lugar.
      donde_va_en_cada_tablero: >
        EL PANEL NO ES OBLIGATORIO; LAS ACCIONES SI. El mockup Modelo 2 las junta en una tira
        "UTILIDADES" (cultivos extensivos) y la maqueta "Agri 2" las pone AL PIE DE CADA
        CUADRO, una vez por panel (cultivos intensivos, desde el 23-sep-2026, decision de
        Francisco: "Cada panel tiene su 'Mas informacion' y su 'Generar PDF'. Al pie de cada
        cuadro, no un panel de utilidades unico al final."). Es la misma regla de siempre
        aplicada a lo que dibujo JC en cada hoja: la FORMA se comparte, la disposicion la
        decide la maqueta de esa seccion. La accion, el icono y la validacion contra
        site_build.ACCIONES_UTILIDAD son identicas en los dos casos.
        El "Asistente IA" solo existe donde la maqueta lo dibuja: hoy, cultivos extensivos.
    informacion_relacionada:
      que_es: "'Información relacionada (abre en nueva ventana)': costos y margenes, exportaciones, calendario de siembra y cosecha, precios, VBP del cultivo elegido"
      estado: >
        SE DIBUJA con los links deshabilitados y rotulo "Próximamente" (cuarta tanda del
        10-ago-2026: "tiene que estar aunque no lleve a ningún lado"; deroga el "no se dibuja"
