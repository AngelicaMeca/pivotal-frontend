    orden_de_trabajo: "Se empieza por Agricultura (cultivos extensivos); ganaderia se revisa despues."
    pagina_de_inicio: "Queda para el final, se hace con marketing. No condiciona los contenidos."
    origen_docx_v2: {seccion: "GENERALES + LA PROPUESTA DE FORMATO", texto: "En esta versión 1 vamos a concentrarnos en la interfaz pública... Siempre comenzaremos por agricultura"}
    solo_cultivos_desde_el_10_ago:
      decidido_por: "Facu, 10-ago-2026, con JC presente (segunda tanda de decisiones del dia)"
      cita: "DE AHORA EN MAS TRABAJO SOLO EN CULTIVOS, NO TRABAJES CON LOS OTROS DE BOVINOS."
      regla: >
        Todo el trabajo de diseño y formato es EXCLUSIVAMENTE sobre la seccion de cultivos
        extensivos. Las otras secciones (movimientos de hacienda, stock bovino) NO se tocan
        hasta nueva orden: quedan con el tema anterior tal como estan hoy y se migran despues.
        constructor-dashboards no las modifica en ninguna pasada hasta que se levante esta regla.

  # -------------------------------------------------------------------
  # TERCERA TANDA del 10-ago-2026: EL MOCKUP MODELO 2 ES LITERAL
  # (ver `origen_tercera_tanda` al principio del archivo; JC rechazo el rediseño del
  # commit 41df326 y Facu ordeno "arrancar de cero y no mezclar con lo anterior. Hay que
  # hacer lo que dice JC, respetá"). Estas reglas MANDAN sobre cualquier otra de formato_v1
  # que las contradiga; cada derogacion queda dicha explicitamente.
  # -------------------------------------------------------------------
  tercera_tanda:
    decidido_por: "Facu, 10-ago-2026, tercera tanda, tras el rechazo de JC al rediseño publicado"
    alcance: "la seccion de cultivos extensivos (el alcance solo-cultivos de la segunda tanda sigue vigente)"

    mockup_literal:
      regla: >
        La pagina de cultivos tiene que quedar COMO LA CAPTURA
        (specs/fuentes/WhatsApp Image 2026-08-10 at 11.08.41.jpeg): misma estructura, mismos
        titulos, mismas proporciones, misma disposicion. Sin reescrituras propias, sin
        "modernizaciones", sin mezclar con lo construido antes ("Todo deformado Facu").
        La regla_de_oro del tema_visual queda RESTAURADA SIN MATICES.
      deroga:
        - "tema_visual.principio_formato_no_diseno (segunda tanda): 'formato si, diseño literal no' ya no corre; el diseño TAMBIEN es literal"
        - "tema_visual.menu_lateral_discreto (segunda tanda): el menu lateral vuelve al verde de la captura"
        - "bloques_del_mockup.tabla_datos.una_sola_serie (segunda tanda): la tabla vuelve a los dos bloques que dibuja JC (interpretacion anotada, backlog 38)"
      no_deroga:
        - "alcance.solo_cultivos_desde_el_10_ago: el trabajo sigue siendo SOLO cultivos"
        - "navegacion.dos_areas_de_inicio (Datos por Departamento habilitado) ni navegacion.comparacion_noa (habilitada, ratificacion de Francisco pendiente)"
        - "las verificaciones de datos y de pie de fuente: el mockup manda la presentacion, no los numeros"

    titulos_del_tablero_literales:
      cita_jc: "No son los mismos títulos. Los gráficos tampoco. Tenemos que respetar el protocolo de títulos de gráficos."
      regla: >
        Los titulos de KPI y de graficos del tablero de cultivos se calcan del mockup y del
        protocolo de titulos de JC (specs/fuentes/000 PROTOCOLO PARA GRAFICOS Y MAPAS
        ELABORADOS.docx), SIN reescrituras propias. Dinamicos SOLO en los slots {cultivo},
        {campaña} y {ventana}; el resto del texto es literal, incluida la abreviatura
        "Sgo del Estero" que usa JC en sus titulos de grafico.
      plantillas_literales_del_mockup:
        tendencia: "{Cultivo} - Sgo del Estero - Total - Evolución de la superficie cosechada y producción - Campañas {desde} a {hasta}"
        anillo: "Sgo del Estero - Campaña {campania} - Participación porcentual por cultivo en el total de la producción (fina y gruesa)"
        top: "Ranking de sup. Sembrada sobre el total provincial"
        kpis: ["Superficie sembrada", "Superficie cosechada", "Producción", "Rendimiento promedio"]
      resuelve: "backlog 31 (RESUELTA). El punto en revision orden-y-abreviatura-en-titulos-del-mockup queda cerrado: el orden y la abreviatura del mockup SON intencionales."
      alcance_de_la_regla: >
        Aplica a los paneles del tablero de cultivos (y por interpretacion a las otras dos
        paginas publicadas de la seccion, backlog 40). Las plantillas de la seccion 2 siguen
        vigentes para el resto de las bases y para los specs que quedan como registro.
      nota_interpretacion: >
        El componente "Total" del titulo de tendencia se lee como el recorte "total" (soja
        total, agregado provincial, sin abrir por variedad ni departamento). Backlog 39.
        El slot de periodo se resuelve con las campañas realmente graficadas: el mockup dice
        "2013/14 a 2024/25" pero la ventana sigue en 10 campañas mientras JC no la amplie
        (backlog 32); la plantilla es literal, el periodo es el real.

    kpis_sin_variacion:
      cita_jc: "NO había que poner la diferencia con la campaña anterior"
      regla: >
        Los 4 indicadores de cabecera muestran SOLO el valor con su unidad (Superficie
        sembrada ha, Superficie cosechada ha, Producción tn, Rendimiento promedio kg/ha),
        como el mockup. PROHIBIDA la variacion contra la campaña anterior, la flechita, el
        porcentaje o cualquier otro adorno comparativo en los KPI.

    eje_vertical_visible:
      cita_jc: "En el gráfico de líneas no está el eje vertical y tampoco la escala"
      regla: >
        El grafico de lineas lleva eje vertical VISIBLE con su escala rotulada, en "Millones"
        como lo dibuja JC (rotulo "Millones" y marcas 0,00 a 4,00 en la captura). Un solo eje
        para las dos series (superficie cosechada en ha y produccion en tn sobre el mismo eje
        de millones), tal cual el mockup: sin eje secundario. La funcion `marcas_eje` de la
        seccion 7 sigue decidiendo las marcas (minimo 5); lo que esta regla prohibe es
        ocultar el eje o su escala.

    solo_tableros:
      cita_jc: >
        "NO va con 'ver detalle'... NO debe llevar NADA a otra página salvo el dato
        departamental. OLVIDATE DEL ANÁLISIS COMPLETO, ESO YA NO EXISTE MÁS, NECESITO QUE LO
        SAQUES Y TE QUEDES CON LOS TABLEROS"
      regla: >
        En cultivos desaparece TODO el esquema tablero+analisis: analisis.html NO EXISTE MAS
        y no se genera. Ningun panel lleva link "ver detalle" ni ninguna otra navegacion de
        salida. Las UNICAS salidas del tablero son: (1) los dos botones de cabecera del
        mockup ("Santiago en el NOA" y "Datos por Departamento") y (2) el click en un
        departamento del mapa, que lleva al dato departamental (09-departamento-datos).
        Nada mas.
      consecuencia_en_specs: >
        Las vistas de detalle de la base 9 pasan a estado `no-publicada`: los specs quedan
        como registro de las reglas (y cuatro de ellos siguen alimentando paneles del
        tablero), pero no se construye pagina propia para ninguno. Paginas publicadas de
        cultivos: tablero-cultivos-extensivos (index), 09-departamento-datos y
        09-noa-participacion-provincia. Ninguna otra.
      persistencia_de_filtros: >
        La regla navegacion.persistencia_de_filtros sigue vigente para las salidas que
        quedan: los dos botones de cabecera y el click del mapa viajan con el cultivo y la
        campaña seleccionados.
      amplia: "estructura_de_seccion (backlog 28) y deroga en cultivos la regla del 3-ago de CLAUDE.md (tablero + analisis.html)"

    cabecera:
      cita_jc: "En la parte de producción agrícola eso está duplicado... ahí iban las banderas de idiomas"
      regla: >
        La cabecera queda como el mockup: logo provincial a la izquierda, los dos botones
        ("Santiago en el NOA", "Datos por Departamento"), y ARRIBA A LA DERECHA las banderas
        de idioma es/en/pt. SIN titulo de pagina duplicado: el titulo "Producción agrícola"
        no se dibuja en la cabecera (el lugar es de las banderas); la identificacion de la
        pagina la da la barra verde del breadcrumb ("Agricultura - Cultivos Extensivos -
        {Cultivo} - Provincia").
      banderas_idioma:
        regla: >
          Banderas es/en/pt dibujadas como el mockup: ESPAÑOL ACTIVA; ingles y portugues
          DESHABILITADAS con rotulo "Próximamente". Misma excepcion explicita y ACOTADA a la
          regla "no se dibujan botones que no hacen nada" que ya cubre a las utilidades.
        resuelve: "backlog 33 (RESUELTA). Deroga el estado anterior de bloques_del_mockup.idiomas ('NO entran todavia')."

    mapa_grande:
      cita_jc: "El mapa es una miniatura y está deformado"
      regla: >
        El mapa ocupa la COLUMNA IZQUIERDA ENTERA del contenido, grande, con la proporcion
        geografica CORRECTA de la provincia (nunca estirado ni comprimido para llenar la
        caja: la caja se adapta al mapa). Arriba el rotulo "Seleccione departamento" y al
        pie "Fuente: MAGyP (Ministerio de Agricultura, Ganadería y Pesca)", como el mockup.
        Prohibido dibujarlo como miniatura o panel chico.

  # -------------------------------------------------------------------
  # CUARTA TANDA del 10-ago-2026: ajustes de Facu sobre la reconstruccion
  # literal (ver `origen_cuarta_tanda` al principio del archivo). NO deroga
  # la literalidad del mockup (tercera_tanda sigue vigente): son ajustes de
  # puesta, escala y usabilidad, mas dos reglas GENERALES nuevas
  # (tooltips_con_nombre_y_datos y proporciones_sin_huecos, que valen para
  # todo el sitio, no solo para cultivos).
  # -------------------------------------------------------------------
  cuarta_tanda:
    decidido_por: "Facu, 10-ago-2026, cuarta tanda, revisando la reconstruccion literal del mockup"
    alcance: >
      La seccion de cultivos extensivos (sigue el alcance solo-cultivos), SALVO
      tooltips_con_nombre_y_datos y proporciones_sin_huecos, que son reglas generales de
      presentacion para todo el sitio, y home_sin_menu_lateral, que es de la home raiz.

    logo_provincial_bien_puesto:
      cita_facu: "El logo de Santiago está mal puesto, no sé si deberíamos usar otro, se ve horrible."
      regla: >
        Se corrige la PUESTA del asset actual (site/assets/logo-provincia.png) en la cabecera:
        tamaño, alineacion y respiro acordes al mockup, sin deformarlo ni recortarlo. El asset
        en si NO cambia en esta pasada: si se consigue uno mejor lo deciden Francisco y
        marketing (backlog pregunta 41) y no bloquea nada.

    escala_legible:
      cita_facu: "En el gráfico de líneas está mal la escala, no se distinguen las variaciones."
      regla: >
        La escala del grafico de lineas tiene que dejar LEER las variaciones entre campañas.
        El eje unico en "Millones" de la tercera tanda (eje_vertical_visible) SIGUE: lo que
        cambia es el paso y el rango. La construccion actual usa paso 1,00 y aplasta las
        curvas; JC dibujo paso 0,50 en su mockup. Paso mas fino (0,50 de referencia) y/o
        rango ajustado al dato, lo que haga falta para que las variaciones se distingan.
        La regla de "minimo 5 marcas" de la seccion 7 sigue valiendo; el criterio nuevo es
        que el paso no puede ser tan grueso que las series se lean planas.

    informacion_relacionada_se_dibuja:
      cita_facu: "Falta Información relacionada, tiene que estar aunque no lleve a ningún lado."
      regla: >
        El panel "Información relacionada (abre en nueva ventana)" del mockup SE DIBUJA, con
        los links del mockup (costos y margenes, exportaciones, calendario de siembra y
        cosecha, precios, VBP) DESHABILITADOS con rotulo "Próximamente". Misma excepcion
        explicita y ACOTADA a la regla "no se dibujan botones que no hacen nada" que las
        utilidades y las banderas. Resuelve la pregunta que dejo abierta constructor-dashboards
        y deroga el estado anterior ("no se dibuja porque sus destinos no existen"). Los
        DESTINOS siguen sin existir: las vistas de precios/costos/exportaciones siguen
        bloqueadas por falta de bases (backlog 8); los links se activan cuando entren.

    home_sin_menu_lateral:
      cita_facu: "El sidebar en la página principal no tiene que estar; tiene que aparecer recién cuando se entra a un dashboard."
      regla: >
        La home raiz del sitio (index.html) va SIN menu lateral. El menu tematico lateral
        aparece recien DENTRO de las secciones/dashboards. Matiza
        navegacion.menu_tematico_lateral: la regla del menu describe las paginas de seccion,
        no la home.

    tooltips_con_nombre_y_datos:
      # REGLA GENERAL (todo el sitio), sale de dos comentarios de Facu (puntos 5 y 6).
      cita_facu:
        - "En el mapa, el mouseover muestra el ID del departamento."
        - "Cuando uno vaya al mapa, con mouseover que se vean los datos, no necesariamente tocar, dado que ya está el botón de Datos por Departamento."
      regla: >
        Un tooltip NUNCA muestra codigos internos (geo_id, ids de spec, claves de mart):
        siempre el NOMBRE legible de la entidad, como lo resuelve dim_geo. Y en los mapas el
        mouseover muestra el nombre del departamento MAS sus datos para la seleccion vigente
        (en cultivos: las variables de la secuencia fija para el cultivo y la campaña
        activos): la lectura rapida es por hover, sin obligar al click. El click hacia el
        dato departamental se mantiene (es la salida que dejo JC), pero no puede ser la unica
        forma de ver el numero.
      bug_que_la_dispara: "el tooltip del mapa de cultivos mostraba el geo_id del departamento en vez del nombre"

    boton_volver_provincia:
      cita_facu: "Cuando uno va a Datos por Departamento, el botón sigue diciendo Datos por Departamento; debería volver a Provincia."
      regla: >
        En la vista departamental (09-departamento-datos), el boton de cabecera que en el
        tablero dice "Datos por Departamento" se transforma en "Provincia" y VUELVE al
        tablero (conservando cultivo y campaña, persistencia_de_filtros). Un boton que nombra
        la pagina en la que ya estas no navega a ningun lado.

    anillo_sin_cifra_central:
      cita_facu: "El gráfico de torta queda muy chico por el número en el medio; prefiero sacarlo y que quede bien."
      regla: >
        El anillo de participacion va SIN la cifra central (el total en el medio): el grafico
        usa el espacio del panel. El total "(fina y gruesa)" se sigue mostrando fuera del
        centro (subtitulo o pie del panel), porque un numero sin universo no se publica.
      excepcion_a_la_literalidad: >
        Es un desvio del mockup decidido por Facu (cuarta tanda); queda anotado para que JC
        lo valide en la proxima revision, igual que el resto de la reconstruccion.

    proporciones_sin_huecos:
      # REGLA GENERAL (todo el sitio), pedida explicitamente como regla ("dejá anotado").
      cita_facu: "Dejá anotado que tiene que haber proporciones en los cuadros que se usen: no puede ser que quede un espacio en blanco usando las campañas."
      regla: >
        Los paneles y cuadros mantienen sus proporciones y se dimensionan para LLENAR su
        espacio: no se admiten huecos en blanco dentro de un panel. Caso que la dispara: la
        tabla de campañas en dos bloques dejaba espacio vacio. Si el contenido no llena el
        panel, se ajusta el dimensionado del panel o la disposicion del contenido; el hueco
        nunca se publica. NO habilita a deformar (mapa_grande sigue: la proporcion geografica
        es correcta y la caja se adapta al mapa); llenar el espacio se resuelve dimensionando,
        no estirando.

  # -------------------------------------------------------------------
  # Secuencia fija de variables (regla dura, aplica a toda la base 9 y a
  # cualquier base con mas de una medida)
  # -------------------------------------------------------------------
  secuencia_de_variables:
    regla: >
      El orden de las variables es SIEMPRE el mismo en todos los componentes de una pagina:
      indicadores, selectores del mapa, columnas de tabla y series. Para la base 9:
      superficie sembrada, superficie cosechada, produccion, rendimiento.
    origen_docx_v2: {texto: "La SECUENCIA DE VARIABLES DEBE SER SIEMPRE LA MISMA... En los recuadros de totales provinciales, está perfecto el orden, PERO NO EN EL MAPA POR DEPARTAMENTO (primero está 'prod')"}
    correccion_que_dispara: "El panel mapa del tablero de cultivos tenia produccion primero. Corregido en tablero-cultivos-extensivos.yaml."

  titulo_de_panel_inalterable:
    regla: >
      El titulo de un panel con selector de variable NO cambia con la variable elegida: queda un
      titulo generico ("Datos por departamento") y la variable se lee en el selector y en la
      leyenda. Vale para los paneles de tablero; las vistas de detalle siguen con el titulo
      dinamico de la seccion 2, que si nombra la variable porque ES la vista de una variable.
    origen_docx_v2: {texto: "el título no debería decir 'producción por departamento' sea cual sea la variable que miremos... al apretar 'sembrada' igual el titulo se mantiene inalterable"}
    nota_interpretacion: "JC lo dice sobre el mapa del tablero. Se aplica a todo panel con selector de variable, que es la lectura mas simple y consistente."

  # -------------------------------------------------------------------
  # Reglas de agregacion (que esta prohibido sumar o promediar)
  # -------------------------------------------------------------------
  agregacion:
    rendimiento_nunca_mezclado:
      regla: "PROHIBIDO promediar o mostrar rendimiento agregado de cultivos distintos. El rendimiento es una variable unica de cada cultivo."
      origen_docx_v2: {texto: "NO SE PUEDE HACER UN PROMEDIO DE RENDIMIENTOS DE TODOS LOS CULTIVOS MEZCLADOS. SIEMPRE el rendimiento es una variable ÚNICA PARA CADA CULTIVO."}
      consecuencia: "El indicador 'Rendimiento' solo se muestra con un cultivo seleccionado. Con 'Todos' no existe."
    superficies_no_se_suman_entre_estaciones:
      regla: >
        Superficie sembrada y cosechada NO se agregan mezclando cultivos de invierno y de verano:
        comparten lote y la suma daria mas hectareas que las que hay. Los agregados de superficie
        van por estacion (fina/invierno y gruesa/verano) o por cultivo, nunca "todos juntos".
      origen_docx_v2: {texto: "ESTAN MEZCLADOS CULTIVOS DE INVIERNO Y VERANO QUE SE HACEN EN LA MISMA SUPERFICIE, por ende los ítems 'Sup Sembrada y cosechada' NO serían correctos"}
      ya_existia: "_comunes-base-9.notas_metodologicas.verano-invierno lo decia para las participaciones; JC lo extiende a los indicadores de cabecera."
    produccion_total_rotulada:
      regla: "La produccion total de todos los cultivos SI se puede mostrar (las toneladas se suman), pero rotulada '(fina y gruesa)', como la rotula JC en su propio anillo."
      origen_docx_v2: {archivo_modelo: "0000000000 Modelo 1.xlsx", texto: "Participación porcentual por cultivo en el total de la producción (fina y gruesa)"}

  # -------------------------------------------------------------------
  # Todo explicito, nada tacito
  # -------------------------------------------------------------------
  parametros_explicitos:
    regla: "SIEMPRE y por defecto se muestran los parametros del dato y el periodo al que corresponde. La campaña se escribe, no se deduce."
    origen_docx_v2: {texto: "TIENE QUE SER EXPLÍCITO Y NO TÁCITO"}
    universo_explicito: "Cuando el dato es la totalidad, se dice ('Todos los cultivos', 'totales provinciales'): el selector arriba no alcanza como aclaracion."
    en_el_tablero: "El mockup lo resuelve con la tarjeta de contexto (icono + cultivo + campaña) pegada a los indicadores, y con el nivel 'Provincia' al final del breadcrumb."
  unidades_abreviadas:
    regla: "Si una cifra usa unidad abreviada ('M ha', 'M tn'), lleva asterisco y la aclaracion al pie ('* M ha = millones de hectáreas'). La unidad completa no lleva nada."
    origen_docx_v2: {texto: "lo mejor sería poner un asterisco y lo aclaramos debajo"}

  # -------------------------------------------------------------------
  # Selectores
  # -------------------------------------------------------------------
  selectores:
    campania:
      rotulo: "Campaña"
      origen_docx_v2: {texto: "habría que ponerle el título 'campaña' o 'seleccione campaña'"}
      nota_interpretacion: "Se adopta 'Campaña' (la corta), que es la que JC dibujo en el mockup."
    cultivo:
      forma: "chips con icono + nombre del cultivo, y el boton 'Todos' al final"
      universo_visible:
        regla: >
          El universo de cultivos VISIBLES (chips del selector, series individuales, cualquier
          lugar donde el cultivo sea una opcion elegible o una serie propia de un grafico) lo
          define el CATALOGO de JC: los cultivos de su mockup Modelo 2, que son exactamente los
          que tienen icono asignado en site/iconos-cultivo.yaml. NO lo define la existencia de
          datos: un cultivo con datos en la fuente pero fuera del catalogo (hoy Lenteja y
          Alpiste, en null en esa asignacion) no se dibuja como chip ni como serie individual.
        criterio: >
          visible = catalogo de JC ∩ con datos en la ventana. Las dos condiciones a la vez:
          estar en el catalogo no alcanza si no hay datos (sigue la regla solo_con_datos de
          abajo), y tener datos no alcanza si JC no lo puso en su catalogo.
        visible_no_es_incluido_en_agregados: >
          IMPORTANTE, la distincion que sostiene todo: visible NO es lo mismo que incluido en
          los agregados. Los AGREGADOS no cambian: el total de produccion "(fina y gruesa)", el
          anillo de participacion y su "Resto" se siguen calculando sobre TODOS los cultivos de
          la fuente, esten o no en el catalogo. No se ocultan datos del calculo ni se tocan los
          numeros que JC ya valido contra su mockup (Soja 48,1%, total 6.016.454 tn). Lo que se
          filtra es que cultivos se OFRECEN como seleccion, no que cultivos ENTRAN en la cuenta.
        alta_de_un_cultivo: >
          Si JC quiere sumar un cultivo (ej. Lenteja), manda su icono y se agrega a la
          asignacion de site/iconos-cultivo.yaml: el cultivo aparece solo en la proxima
          construccion. No hay otro camino de alta.
        origen: >
          correccion de Facu, 10-ago-2026 (continuacion de las decisiones del dia, con JC):
          "Los datos que NO ESTAN no se ponen en los graficos, ej. la lenteja". La lenteja
          tiene datos en la fuente MAGyP (70 ha en Jimenez, 2020/21) pero no esta entre los 14
          cultivos del mockup Modelo 2 ni tiene icono en el catalogo de JC: aparecia en los
          chips porque el criterio anterior era solo la existencia de datos. Backlog pregunta 37.
      solo_con_datos:
        regla: "Un cultivo sin datos NO aparece en el selector. Nada de entrar y encontrar 'sin datos'."
        origen_docx_v2: {texto: "SI NO HAY DATOS QUE NO SE INCLUYA EN EL LISTADO (por ejemplo Lenteja)... sólo cuando haya datos"}
        nota: >
          Desde el 10-ago-2026 esta regla es la MITAD "con datos en la ventana" del criterio de
          universo_visible: se aplica junto con el catalogo de JC, no en su lugar. Sola ya no
          define el selector.
      del_mockup: "Algodón, Avena, Cártamo, Cebada, Centeno, Colza, Garbanzo, Girasol, Maíz, Maní, Poroto, Soja, Sorgo, Trigo (orden alfabetico) + Todos"

  # -------------------------------------------------------------------
  # Navegacion
  # -------------------------------------------------------------------
  navegacion:
    breadcrumb:
      regla: >
        Cada pagina lleva la ruta completa y cada nivel linkea a SU nivel, sin cruces:
        "Inicio - Agricultura - Cultivos Extensivos - {cultivo} - {ambito}". El nivel intermedio
        que se nombra tiene que existir como pagina navegable.
      origen_docx_v2: {texto: "si aprieto allí me lleva a Agricultura, pero si aprieto 'Agricultura' me lleva a la página de inicio... en ninguna parte está esa posibilidad de selección"}
    menu_tematico_lateral:
      regla: "Menu lateral con los sectores (en el mockup: Inicio, Agricultura, Ganadería, Clima, Industria, Economía, General), desplegables. La organizacion tematica base es la del documento inicial de JC; no es definitiva."
      origen_mockup: "0000000000 Modelo 1.xlsx, hojas Modelo 1 y 2, columna izquierda"
      donde_aparece: >
        SOLO dentro de las secciones/dashboards. La home raiz del sitio va SIN menu lateral
        (cuarta tanda del 10-ago-2026, cuarta_tanda.home_sin_menu_lateral).
    persistencia_de_filtros:
      regla: "Los links 'ver detalle' y toda navegacion interna CONSERVAN la seleccion vigente (cultivo y campaña). Jamas resetear a otro cultivo u otra campaña."
      origen_docx_v2: {texto: "estoy en la misma selección: 'Algodón' 'campaña 2020/21'... aprieto abajo 'ver detalle'... ME LLEVA A SOJA DE LA 2024/25"}
    volver:
      regla: "Si hay un control de deshacer/volver ('borrar'), tiene que funcionar: regresa al estado anterior. Si no hace nada, no se dibuja."
      origen_docx_v2: {texto: "Dice 'borrar' pero no hace nada… yo podría 'regresar' al punto anterior"}
    dos_areas_de_inicio:
      regla: >
        Dos grandes areas: TEMATICA (por temas, la actual) y TERRITORIAL (por departamento). Un
        solo boton lleva al area territorial ("Datos por Departamento" en la cabecera del mockup);
        una vez ahi, mapa y listado, y la navegacion tematica es la del departamento.
      origen_docx_v2: {seccion: "Areas iniciales", texto: "Existirán 2 grandes áreas de inicio: Temática (por temas) y territorial (por departamentos)"}
      estado: >
        HABILITADO (Facu, 10-ago-2026, segunda tanda, con JC presente: "Habilita tambien los
        datos de deparamentos"). El boton de cabecera "Datos por Departamento" deja de ser
        "Proximamente" y pasa a FUNCIONAR: vista departamental de cultivos, donde se elige un
        departamento y se ven sus datos (KPIs, evolucion, tabla por campaña) con el mismo
        selector de cultivo del catalogo de JC. Los datos existen en marts a grano
        departamental. Sustituye al estado anterior del mismo dia (deshabilitado con
        "Proximamente"). Backlog pregunta 34, actualizada.
    comparacion_noa:
      regla: "La comparacion Santiago vs NOA sale de las paginas tematicas y va como tema puntual accesible desde el inicio (boton 'Santiago en el NOA' en la cabecera del mockup), para que no se confunda con el dato provincial. Solo hay datos de la campaña 2024/25."
      origen_docx_v2: {texto: "Lo de la comparación Santiago Vs NOA, ya veremos dónde incorporarla para que no haya confusiones, probablemente desde la página de inicio y como tema puntual"}
      habilitacion_10_ago: >
        HABILITADA por orden de Facu (10-ago-2026, segunda tanda, con JC presente: "Habilita
        tambien los datos de... santiago en el NOA"). La vista de _privado/ (participacion de
        Santiago en el NOA, spec 09-noa-participacion-provincia) pasa a ser PUBLICA dentro de
        cultivos y el boton de cabecera "Santiago en el NOA" pasa a funcionar. Sustituye a la
        ratificacion de esa misma mañana ("sigue afuera").
      ratificacion_pendiente: >
        La regla dura de CLAUDE.md dice que las comparaciones interprovinciales las habilita
        Francisco. La habilitacion queda registrada con atribucion a Facu y fecha; queda
        PENDIENTE la ratificacion de Francisco. Si Francisco lo baja, se vuelve atras: la vista
        regresa a _privado/ y el boton no se dibuja. Backlog pregunta 11, actualizada.

  sin_leyendas_de_tipo_de_grafico:
    regla: "Los rotulos que dicen QUE TIPO de grafico es un panel ('Anillo', 'Mapa', 'Líneas', 'Barras') se sacan. Al usuario no le importa el tipo; le importa el dato."
    origen_docx_v2: {texto: "Por favor sacarle las leyendas del tipo de gráfico."}
    correccion_que_dispara: "Los badges del template de tablero. Se sacan del template una sola vez y desaparecen de todas las secciones."

  estructura_de_seccion:
    regla_de_jc: >
      No plantear la seccion como "Tablero" + "análisis completo" sino por subdivision tematica,
      porque cultivos extensivos es solo la primera base de Agricultura y el formato debe
      mantenerse inalterable para todas las provincias (incluidas producciones regionales:
      olivo, caña, tabaco, vid, etc.).
    origen_docx_v2: {texto: "Por regla, no lo plantearemos como 'Tablero' y 'análisis completo', sino por la subdivisión temática... NO OLVIDEMOS QUE ESTE FORMATO DEBE MANTENERSE INALTERABLE PARA TODAS LAS PROVINCIAS"}
    estado: aprobada y AMPLIADA (tercera tanda del 10-ago-2026)
    decision: >
      Subdivision tematica APROBADA por Facu el 10-ago-2026, en persona con JC presente ("haz la
      subdivision"; JC tiene prioridad en como tiene que quedar). La estructura del Modelo 2
      MANDA: menu lateral verde por sector y breadcrumb jerarquico (Agricultura - Cultivos
      Extensivos - Soja - Provincia), aun donde reemplace el esquema tablero+analisis. El
      conflicto con la regla del 3-ago quedo resuelto por la actualizacion del 10-ago-2026 en
      CLAUDE.md. Backlog pregunta 28, resuelta.
    ampliacion_tercera_tanda: >
      El esquema tablero+analisis desaparece POR COMPLETO en cultivos: analisis.html no existe
      mas, sin links "ver detalle" ni navegacion de salida salvo los dos botones de cabecera y
      el dato departamental. Regla completa: tercera_tanda.solo_tableros. Backlog 28, ampliada.
    alcance: >
      Esta pasada aplica SOLO a cultivos extensivos; el resto de las secciones migra despues.

