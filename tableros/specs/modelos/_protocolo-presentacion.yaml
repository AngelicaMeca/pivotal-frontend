        resuelta.

  # -------------------------------------------------------------------
  # Lo que el docx v2 pone en duda de la v1 (no se toca hasta que se responda)
  # -------------------------------------------------------------------
  puntos_en_revision:
    - id: escala-unica-por-variable-en-mapas
      texto_jc: "Superficie sembrada SIEMPRE tendrá la misma escala, al igual que rendimientos, producción, etc."
      lectura: >
        Si "escala" significa CORTES fijos para toda la serie, es la respuesta a la pregunta 16 del
        backlog (hoy los cortes se recalculan por mapa). Si significa GAMA de colores, ya se cumple.
        Es ambiguo y no se cambia el algoritmo de quintiles hasta que JC confirme. Backlog 16 (actualizada).
    - id: rampa-marron-ganaderia
      texto_jc: "en algunos casos no se ve la data (por ejemplo el marrón del mapa de ganadería)"
      lectura: "JC objeta la rampa `cabezas` (marrones). Cambiarla es tocar colores.rampas, que es regla de este protocolo: se propone una rampa nueva y se cambia SOLO ahi cuando se acuerde. Backlog pregunta 30."
    - id: orden-y-abreviatura-en-titulos-del-mockup
      estado: RESUELTO (tercera tanda, 10-ago-2026)
      texto_jc: "titulos de los graficos del mockup: 'Soja - Sgo del Estero - Total - Evolución de la superficie cosechada y producción - Campañas 2013/14 a 2024/25'"
      resolucion: >
        JC lo cerro el mismo dia ("No son los mismos títulos. Los gráficos tampoco. Tenemos que
        respetar el protocolo de títulos de gráficos"): el orden y la abreviatura del mockup SON
        intencionales y los titulos del tablero de cultivos se calcan literales
        (tercera_tanda.titulos_del_tablero_literales). Las plantillas de la seccion 2 siguen
        vigentes para las otras bases y para los specs que quedan como registro. Backlog 31, RESUELTA.
    - id: ventana-de-campanias
      texto_jc: "el grafico del mockup cubre 2013/14 a 2024/25 (12 campañas); la hoja Modelo Analisis decia 10"
      lectura: >
        La ventana sigue en 10 (parametrizada en _comunes-base-9.ventana_campanias). Ademas
        2013/14 esta excluida por calidad (total sin departamentos). Backlog pregunta 32,
        agravada por la tercera tanda: el titulo literal del mockup dice "2013/14 a 2024/25",
        pero el slot de periodo se resuelve con las campañas realmente graficadas mientras JC
        no confirme ampliar (tercera_tanda.titulos_del_tablero_literales.nota_interpretacion).

