# PROTOCOLO DE PRESENTACION. Reglas mecanicas de titulos, escalas, colores, ejes y citas.
#
# QUE ES ESTO
# Es la traduccion a reglas ejecutables del documento de JC
# `specs/fuentes/000 PROTOCOLO PARA GRAFICOS Y MAPAS ELABORADOS.docx`.
# El documento NO es la regla: la regla es este archivo (specs/fuentes/README.md). Cada bloque de
# abajo lleva `origen_docx` con el parrafo y la cita literal que lo motivo, para poder volver a la
# fuente cuando alguien pregunte de donde salio un criterio.
#
# COMO SE USA
# Lo lee `constructor-dashboards`. Ningun titulo, color, corte de escala, marca de eje ni pie de
# fuente se escribe a mano en un template: todo sale de aca mas los `titulo_componentes` que
# declara cada spec de vista. Si un titulo no se puede armar con estas reglas, el build FALLA;
# no se publica un cuadro con el titulo a medias.
#
# ORDEN DE APLICACION en constructor-dashboards:
#   1. este protocolo (mecanica de presentacion)
#   2. `comunes: _comunes-base-N` (parametros de la base)
#   3. `igual_que: NN-slug` (herencia entre vistas)
#   4. el propio spec
#
# Escrito por constructor-reglas el 2026-07-30.

id: _protocolo-presentacion
version: 2
aplica_a: todas las bases y todos los tipos de vista
origen:
  tipo: documento-de-jc
  archivo: "specs/fuentes/000 PROTOCOLO PARA GRAFICOS Y MAPAS ELABORADOS.docx"
  autor: Juan Carlos Antuña
  fecha_registro: 2026-07-30
  contiene: "3 secciones (mapas de calor, graficos, tablas), 1 mapa de ejemplo del Chaco, 1 grafico de barras embebido y 1 tabla de ejemplo del stock del Chaco 2009 vs 2008"

# La version 2 (2026-08-10) incorpora el SEGUNDO documento de JC. No deroga nada de la v1:
# las reglas nuevas viven en la seccion 13 (`formato_v1`) y cada una cita su parrafo. Donde el
# documento nuevo pisa una regla vigente, la regla nueva lo dice explicitamente.
origen_version_2:
  tipo: documento-de-jc
  archivo: "specs/fuentes/0000 Protocolo de formato - Versión 1.docx"
  autor: Juan Carlos Antuña
  fecha_registro: 2026-08-10
  contiene: >
    Dos partes: (1) observaciones al sitio actual, con 6 capturas de pantalla, que fijan reglas de
    formato (secuencia de variables, periodos explicitos, agregacion, navegacion); (2) la propuesta
    de formato nueva, con 2 anexos de iconografia (~100 iconos por categoria tematica, la misma
    lista en blanco y negro y en color: 197 de las 203 imagenes del docx son iconos). El modelo
    visual de referencia llego aparte en specs/fuentes/0000000000 Modelo 1.xlsx (hojas "Modelo 1"
    y "Modelo 2": mockup de la pagina de un cultivo, con la hoja "Data" como datos de apoyo).

