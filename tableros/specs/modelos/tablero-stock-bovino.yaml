# Tablero de la base 48 (stock bovino). Es la PORTADA de la seccion Ganaderia > Stock bovino.
#
# Por ahora es lo UNICO que se construye de esta base: Francisco pidio el 5-ago-2026 hacer
# solo el tablero y dejar las vistas de detalle en stand by. Por eso los paneles no llevan
# `detalle`: no hay adonde ir todavia y un enlace que no lleva a ningun lado es peor que no
# tenerlo. Cuando se construya "Analisis completo" se agrega el slug de cada vista y los
# enlaces aparecen solos.
#
# Que cuenta este tablero, en el orden en que se lee: cuanta hacienda hay, de que esta hecho
# el rodeo, donde esta y como viene evolucionando.

id: tablero-stock-bovino
tipo: tablero
base: 48
# La seccion paso a llamarse `bovinos` con la maqueta de ganaderia del 9-oct-2026: el
# area se reorganizo por ESPECIE y esta pagina es la primera de las ocho de bovinos
# ("Stocks"). El id del spec no se renombra para no perder la trazabilidad de su
# historia; lo que manda es `seccion`.
seccion: bovinos
comunes: _comunes-base-48

titulo: "Bovinos"
subtitulo: "Provincia de Santiago del Estero · existencias al cierre de cada año"

# ---------------------------------------------------------------------------
# INDICADORES DE CABECERA
# ---------------------------------------------------------------------------
# Los dos primeros son volumen (cuanta hacienda hay y cuantos vientres), el tercero es
# eficiencia y el cuarto es estructura. Es la lectura que hace JC en su bloque "RELACIONES
# ENTRE CATEGORIAS": el stock solo no dice si el rodeo esta bien o mal.
#
# Ninguno se promedia entre departamentos: los ratios se recalculan sobre los totales
# provinciales, que es la unica forma correcta de agregarlos.
indicadores:
  # Los dos primeros son los de JC, textuales de su banda de KPIs: "Stock 1.083.349 cab" y
  # "Unidades Productivas 9.009". Los otros dos de su hoja son el departamento LIDER en
  # stock (Moreno) y en UP (Copo), que necesitan un tipo de indicador que el sitio todavia
  # no tiene -el maximo sobre una dimension- y quedan en el backlog 83. Mientras tanto van
  # dos de su propia lectura del rodeo (el bloque "RELACIONES ENTRE CATEGORIAS"), que es
  # mejor que dejar dos tarjetas vacias.
  - medida: cabezas
    categoria: "Total"
    etiqueta: "Stock total"
  - medida: unidades_productivas
    categoria: "Total"
    etiqueta: "Unidades productivas"
  - medida: cabezas
    categoria: "Vacas"
    etiqueta: "Vientres"
  - relacion: destete
    etiqueta: "Terneros por vaca"

# ---------------------------------------------------------------------------
# CRUZAR DATOS: la comparacion adentro del zoom (Francisco, 24-sep-2026)
# ---------------------------------------------------------------------------
cruzar_datos:
  pedido_por: "Francisco, 24-sep-2026"
  que_pidio: >
    Dos formas de cruce, elegidas por el explicitamente: dos VALORES DEL MISMO FILTRO
    superpuestos en un mismo grafico (dos cultivos, dos departamentos, dos anios) y dos
    MEDIDAS distintas de la misma base, con dos ejes cuando no comparten unidad. Descarto la
    tercera forma que estaba sobre la mesa: unir bases distintas en un mismo cuadro.
  donde_vive: >
    Adentro del ZOOM y en ningun otro lado. El tablero es la maqueta literal de JC -cuatro
    cuadros, una pantalla- y meterle selectores de comparacion romperia justo lo que el pidio
    que se respetara; el zoom ya tiene su barra de controles y lugar de sobra. Francisco lo
    sabe y esta de acuerdo. Son dos desplegables APAGADOS por defecto, y al cerrar el zoom la
    comparacion se apaga sola: el tablero vuelve a ser el de JC.
  que_cuadros_la_llevan: "tendencia (la serie anual de existencias), y ninguno mas"
  que_cuadros_no: >
    El mapa no (un mapa no admite dos categorias encima), el anillo tampoco (ya muestra la composicion entera) y el ranking tampoco: serian dos ordenes distintos en la misma tabla.
  reglas_de_jc_que_la_condicionan:
    nunca_se_combinan_en_un_numero: >
      Las dos series no se suman ni se promedian NUNCA: se dibujan una al lado de la otra. El
      rendimiento no se promedia entre cultivos y un precio no se suma. Cada serie sale de su
      propia combinacion del payload, ya calculada por el build; el navegador no hace una sola
      cuenta.
    cobertura_despareja: >
      Los anios sin declaracion viajan como huecos y no se dibujan (`connectNulls: false`). Todas las categorias de esta base cubren los mismos anios, asi que no hay cobertura despareja que advertir; si alguna entrega la trajera, el hueco se veria como hueco.
    unidades: >
      Si las dos medidas comparten unidad va UN solo eje (el build recalcula la escala sobre
      las dos series juntas para que la segunda entre entera). Si no la comparten, van dos
      ejes y cada uno con su unidad rotulada, con la misma cantidad de intervalos para que las
      marcas caigan sobre las mismas lineas de grilla. Nunca dos escalas sobre el mismo eje.
    colores: >
      Este cuadro no pinta por rampa de variable: su linea es cromo del tema (el verde medio declarado en site/theme.yaml para lineas de tendencia), asi que la serie comparada usa el otro verde de series del mismo theme.
      Lo que distingue a las dos series ademas del tono es el PUNTEADO de la comparada, que es
      lo unico que sobrevive a la impresion en blanco y negro con la que lee JC. Queda como
      pregunta para JC en el backlog: si prefiere otra cosa, se cambia en el protocolo y
      cambia en todo el sitio.
    leyenda_y_titulo: >
      La leyenda dice que es cada serie sin ambiguedad ("Vacas: Cabezas") y el titulo del
      cuadro refleja que hay comparacion ("... - comparado con Novillos"). Las dos frases salen
      de las
      plantillas de este spec: el navegador sustituye slots, no escribe texto.
  sobre_el_pdf:
    decision: "El PDF sigue siendo el TABLERO completo. La comparacion no viaja."
    por_que: >
      El formato de la hoja lo define la clase `imprimiendo` sobre el tablero entero y un
      dialogo modal no se imprime: con el cuadro ampliado afuera de su celda, la hoja saldria
      con un hueco donde iba el cuadro. Imprimir SOLO el cuadro ampliado seria otro producto
      (otra hoja, con su propio formato) y nadie lo pidio. Se eligio lo mas simple y
      predecible: "Generar PDF" cierra el zoom -y con el la comparacion- e imprime el tablero
      con la seleccion vigente.
    como_se_avisa: >
      No se deja que el usuario lo descubra perdiendo lo que estaba mirando: la barra del zoom
      lo dice al lado de los dos desplegables, con el texto de
      `paneles.<id>.comparacion.nota`.
    si_alguna_vez_se_quiere_al_reves: >
      Habria que darle al cuadro ampliado su propio formato de hoja (una pagina, un cuadro, su
      fuente y sus notas) y decidir que pasa con el resto del tablero. Es otra tarea y va al
      backlog, no una variante de esta.
  payload: >
    La comparacion por valor no agrega un byte al JSON de datos: es una segunda clave de
    combinacion y los combos ya estan en el payload (si el archivo esta partido por ese mismo
    filtro, el navegador baja la otra particion a pedido, como hace para cualquier cambio de
    ese filtro). Lo unico que se agrego son las series de la segunda medida (`medidas_extra`)
    donde el cuadro la ofrece, y el color de comparacion de cada serie. No se genera el
    producto cartesiano de las comparaciones posibles: seria imposible de sostener.

# ---------------------------------------------------------------------------
# ZOOM: ampliar un cuadro a pantalla completa (Francisco, 24-sep-2026)
# ---------------------------------------------------------------------------
zoom_de_los_cuadros:
  pedido_por: "Francisco, 24-sep-2026"
  palabra_de_jc: "Zoom"
  origen: >
    No es un invento nuestro: JC ya lo tiene dibujado en su maqueta de pasturas y forrajes
    (hoja "Agri 3 - C" de "0000000000 Modelo 1 - Pasturas y forrajes (1).xlsx"), donde al pie
    de los cuadros escribe "Generar PDF" y "Zoom". Se usa su palabra, sin traducir.
  que_hace: >
    Abre ESE cuadro a pantalla completa -su grafico, su tabla si la tiene, su titulo, su
    fuente y sus notas- con los controles que lo gobiernan adentro y mas grandes. El motivo
    del pedido son los controles: en el tablero los chips y los desplegables van chicos
    porque todo tiene que entrar en una pantalla, y asi son dificiles de usar.
  donde_se_declara: >
    Panel por panel (`paneles.<id>.acciones`), nunca a nivel del tablero: es lo unico que
    garantiza que no aparezca en un cuadro que no tiene nada que ampliar. No se prende sola.
  que_cuadros_la_llevan: "anillo, mapa y tendencia (los tres cuadros con grafico)"
  que_cuadros_no: "top: es una lista de barras en HTML, no un grafico; ampliarla no muestra nada nuevo"
  animacion: >
    Abre y cierra con movimiento, pedido de Francisco (24-sep-2026: "una animacion para
    hacerlo mas fluido"). El cuadro CRECE desde el lugar que ocupaba en el tablero hasta la
    pantalla completa y al cerrar vuelve a su lugar, en 220 ms, con el fondo oscuro
    acompaniando. El gesto es el que explica de donde salio el cuadro y a donde vuelve; un
    simple desvanecido no lo cuenta. Quien tenga puesto "reducir movimiento" en su sistema lo
    sigue viendo abrir y cerrar en seco.
  marco_y_click_afuera: >
    El dialogo deja un marco de fondo de 2vmin alrededor del cuadro. No es decoracion: el
    dialogo ocupa la ventana entera y ese marco es el UNICO pedazo suyo que queda a la vista,
    o sea la unica superficie donde puede caer un click "afuera". Sin el, la caja tapaba el
    100% del dialogo y el cierre por click en el fondo no funcionaba desde la primera version
    (lo verifico Francisco el 24-sep-2026). De paso el cuadro ampliado se ve flotando sobre el
    tablero en vez de taparlo entero, que acompania al gesto de "creci desde ahi" de la
    animacion. La animacion se calcula contra la CAJA y no contra la ventana: con el marco ya
    no miden lo mismo.
  sobre_el_pdf: >
    Si hay un cuadro ampliado, "Generar PDF" lo cierra ANTES de imprimir. El formato de la
    hoja lo define la clase `imprimiendo` sobre el tablero entero y un dialogo modal no se
    imprime: el PDF es siempre el tablero completo con la seleccion vigente.

# ---------------------------------------------------------------------------
# PANELES - la hoja "GanBov ST" de la maqueta de ganaderia
# ---------------------------------------------------------------------------
# La hoja se lee por los anclajes de sus imagenes, y son TRES PARES: a la izquierda un
# grafico y a la derecha su tabla. Arriba de todo, el mapa a la izquierda y la tabla por
# departamento a la derecha. No es una grilla de cuatro cuadros como los tableros
# anteriores: es una pagina de lectura, grafico y numero al lado.
#
# El cuarto cuadro de JC, "Bovinos, caravanas en existencia y promedio de solicitudes"
# (fila 91 de su hoja), NO se construye: no hay base de caravanas en la entrega. Backlog 84.
paneles:
  alto: fluye

  mapa:
    titulo: "Stock por departamento"
    # El color lo fija el protocolo por TIPO de variable: cabezas va en la rampa marron, la
    # misma que usa la base 85. No se elige aca.
    medida: cabezas
    rotulo_accion: "Seleccione departamento"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}

  tabla-departamentos:
    # Titulo literal de JC (cuadro de texto de la fila 16 de su hoja).
    titulo: "Sgo. del Estero - Stocks bovinos por categoría, totales y cantidad de UP por departamento - año {anio}"
    encabezado_geo: "Departamento"
    encabezado_total: "Total Cab"
    encabezado_up: "Total UP"
    # La primera fila de su tabla, resaltada.
    rotulo_total: "TOTAL PROV"
    nota: >
      El guion marca las categorías sin existencias en ese departamento, que no es lo mismo
      que un dato que la fuente no informó (ése sale como S/D).

  evolucion-total:
    # Titulo que JC escribe DENTRO de la imagen del gráfico, no en una celda.
    titulo: "Sgo del Estero - Evolución del stock total bovinos - años {desde} a {hasta}"
    medida_nombre: "Stock total"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}

  tabla-evolucion:
    titulo: "Sgo. del Estero - Evolución del stock bovino por categoría y totales - años {desde} a {hasta}"
    encabezado_anio: ""
    encabezado_total: "Total Cab"

  evolucion-categorias:
    titulo: "Sgo del Estero - Evolución del stock por categoría años {desde} a {hasta}"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}

  tabla-departamento-anios:
    titulo: "Sgo. del Estero - Evolución del stock bovino total por departamento - años {desde} a {hasta}"
    encabezado_geo: "Departamento"
    rotulo_total: "TOTAL PROV"
    # JC arranca esta tabla en 2015 y no en 2012 como las otras dos: son 27 filas y con
    # catorce columnas no entra. Se respeta su recorte.
    desde: 2015

  # Grafico a la izquierda, tabla a la derecha, que es como los pega JC. El 5/7 sale de sus
  # anclajes: el mapa ocupa las columnas 7 a 24 de su hoja y las tablas de la 30 a la 60.
  # 4/8 y no 5/7: la tabla mas ancha de las tres es la matriz departamento x anio, que mide
  # 836 px con sus doce columnas, y con 7 de 12 (747 px) se desbordaba y estiraba el ancho de
  # toda la pagina. El reparto es el mismo en los tres pares a proposito: tres divisiones
  # distintas en la misma pantalla se leen como un error de dibujo.
  orden:
    - {id: mapa, ancho: 4, alto: alto}
    - {id: tabla-departamentos, ancho: 8}
    - {id: evolucion-total, ancho: 4}
    - {id: tabla-evolucion, ancho: 8}
    - {id: evolucion-categorias, ancho: 4}
    - {id: tabla-departamento-anios, ancho: 8}

# ---------------------------------------------------------------------------
# FILTROS
# ---------------------------------------------------------------------------
# Dos, que es el maximo razonable para un tablero: el anio manda sobre todo y la categoria
# permite mirar el rodeo por partes (ver solo las vacas, solo los terneros). Con la categoria
# en "Total" el tablero muestra el rodeo entero, que es como abre.
filtros:
  - id: anio
    zona: periodo        # barra verde de la cabecera
  - id: categoria
    zona: barra          # barra de chips
    incluye_total: true
    defecto: "Total"
