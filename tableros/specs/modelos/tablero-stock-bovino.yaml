# Tablero de la base 48 (stock bovino). Es la PORTADA de la seccion Ganaderia > Stock bovino.
#
# Por ahora es lo UNICO que se construye de esta base: Francisco pidio el 5-ago-2026 hacer
# solo el tablero y dejar las vistas de detalle en stand by. Por eso los paneles no llevan
# `detalle`: no hay adonde ir todavia y un enlace que no lleva a ningun lado es peor que no
# tenerlo. Cuando se construya "Analisis completo" se agrega el slug de cada vista y los
# enlaces aparecen solos.
#
# Que cuenta este tablero, en el orden en que se lee: cuanta hacienda hay, de que esta hecho
# el rodeo, donde esta y como viene evolucionando.
#
# 15-oct-2026 (pedido de la usuaria, toda ganaderia): el mapa de la provincia lleva los NOMBRES
# de los departamentos escritos (`paneles.mapa.rotulos_departamento`). DESVIO de la maqueta
# "Maqueta Ganad VF", que dibuja los mapas sin nombres (viven en el tooltip y en la tabla por
# departamento); es el mismo desvio que agricultura (backlog 68). Pregunta para JC en el
# backlog 110; se apaga borrando esa linea del spec.

id: tablero-stock-bovino
tipo: tablero
base: 48
# La seccion paso a llamarse `bovinos` con la maqueta de ganaderia del 9-oct-2026: el
# area se reorganizo por ESPECIE y esta pagina es la primera de las ocho de bovinos
# ("Stocks"). El id del spec no se renombra para no perder la trazabilidad de su
# historia; lo que manda es `seccion`.
seccion: bovinos
comunes: _comunes-base-48

titulo: "Bovinos"
subtitulo: "Provincia de Santiago del Estero · existencias al cierre de cada año"

# ---------------------------------------------------------------------------
# REVISION CONTRA LA MAQUETA (13-oct-2026, JC: "NO SE ESTÁ RESPETANDO PARA NADA LA MAQUETA...
# POR FAVOR SIGAMOS EL MODELO"). Lo que se ajusto en esta hoja ("GanBov ST"):
# - la miga es la celda N5 de JC: "Ganadería - Bovinos - Provincia - Stocks";
# - la tarjeta "Datos 2025" con el icono de la vaca abre la banda, y las tarjetas no llevan
#   variacion contra el anio anterior (JC no la dibuja);
# - el mapa se titula "Stocks" (la pestaña de JC) y cita "Fuente: SENASA" como su H39;
# - la matriz departamento x anio va SIN la fila TOTAL PROV (JC no la pone) y entra entera a
#   1440 px (`compacta`);
# - la disposicion es la de sus anclajes: a la izquierda mapa, barras del total, barras
#   apiladas y anillo; a la derecha las tres tablas; las caravanas a todo el ancho debajo;
# - "Generar PDF" al pie (BE113).
# Lo que no se pudo: la faena como imagen del tablero de SENASA (F135) no tiene JPG (backlog
# 79) y la leyenda del mapa con cortes fijos espera a JC (backlog 91).
kpis_sin_variacion: true
tarjeta_datos:
  icono: bovinos

# ---------------------------------------------------------------------------
# INDICADORES DE CABECERA
# ---------------------------------------------------------------------------
# Los dos primeros son volumen (cuanta hacienda hay y cuantos vientres), el tercero es
# eficiencia y el cuarto es estructura. Es la lectura que hace JC en su bloque "RELACIONES
# ENTRE CATEGORIAS": el stock solo no dice si el rodeo esta bien o mal.
#
# Ninguno se promedia entre departamentos: los ratios se recalculan sobre los totales
# provinciales, que es la unica forma correcta de agregarlos.
indicadores:
  # Los cuatro de JC, textuales de su banda de KPIs: "Stock 1.083.349 cab", "Unidades
  # Productivas 9.009", "Stock Dto Moreno 127.858 cab" y "U.P. Dto Copo 936". Los dos del
  # departamento LIDER esperaban un tipo de indicador que el sitio no tenia (backlog 83); desde
  # el 12-oct-2026 existe (`lider`, site_build.indicador_de_departamento) y reemplazan a los
  # dos de relaciones entre categorias que iban provisoriamente.
  - medida: cabezas
    categoria: "Total"
    etiqueta: "Stock"
  - medida: unidades_productivas
    categoria: "Total"
    etiqueta: "Unidades Productivas"
  - lider: cabezas
    etiqueta: "Stock Dto {departamento}"
  - lider: unidades_productivas
    etiqueta: "U.P. Dto {departamento}"

# ---------------------------------------------------------------------------
# SIN CRUZAR DATOS (13-oct-2026)
# ---------------------------------------------------------------------------
# Aca estaba `cruzar_datos`: el zoom de la evolucion dejaba superponer otra categoria
# ("Vacas comparado con Novillos"). Se saco por pedido de JC (13-oct-2026): "JAMAS SE
# PUEDE ANALIZAR UN STOCK SEPARANDO LAS CATEGORIAS". El zoom sigue, sin comparacion; el
# build corta la corrida si un tablero de stock vuelve a declarar una.

# ---------------------------------------------------------------------------
# ZOOM: ampliar un cuadro a pantalla completa (Francisco, 24-sep-2026)
# ---------------------------------------------------------------------------
zoom_de_los_cuadros:
  # RETIRADO el 20-oct-2026 en todos los tableros (revision de JC del 16-oct-2026: "EL ZOOM NO
  # FUNCIONA COMO TAL, SOLO AUMENTA LOS TEXTOS... RESUMEN: ELIMINAR ESTA OPCION, AL MENOS PARA
  # ESTE TIPO DE DATOS"). Ningun panel declara la accion `zoom`; el mecanismo sigue en el sitio.
  # Lo que sigue es el registro de como era.
  estado: retirado
  pedido_por: "Francisco, 24-sep-2026"
  palabra_de_jc: "Zoom"
  origen: >
    No es un invento nuestro: JC ya lo tiene dibujado en su maqueta de pasturas y forrajes
    (hoja "Agri 3 - C" de "0000000000 Modelo 1 - Pasturas y forrajes (1).xlsx"), donde al pie
    de los cuadros escribe "Generar PDF" y "Zoom". Se usa su palabra, sin traducir.
  que_hace: >
    Abre ESE cuadro a pantalla completa -su grafico, su tabla si la tiene, su titulo, su
    fuente y sus notas- con los controles que lo gobiernan adentro y mas grandes. El motivo
    del pedido son los controles: en el tablero los chips y los desplegables van chicos
    porque todo tiene que entrar en una pantalla, y asi son dificiles de usar.
  donde_se_declara: >
    Panel por panel (`paneles.<id>.acciones`), nunca a nivel del tablero: es lo unico que
    garantiza que no aparezca en un cuadro que no tiene nada que ampliar. No se prende sola.
  que_cuadros_la_llevan: "anillo, mapa y tendencia (los tres cuadros con grafico)"
  que_cuadros_no: "top: es una lista de barras en HTML, no un grafico; ampliarla no muestra nada nuevo"
  animacion: >
    Abre y cierra con movimiento, pedido de Francisco (24-sep-2026: "una animacion para
    hacerlo mas fluido"). El cuadro CRECE desde el lugar que ocupaba en el tablero hasta la
    pantalla completa y al cerrar vuelve a su lugar, en 220 ms, con el fondo oscuro
    acompaniando. El gesto es el que explica de donde salio el cuadro y a donde vuelve; un
    simple desvanecido no lo cuenta. Quien tenga puesto "reducir movimiento" en su sistema lo
    sigue viendo abrir y cerrar en seco.
  marco_y_click_afuera: >
    El dialogo deja un marco de fondo de 2vmin alrededor del cuadro. No es decoracion: el
    dialogo ocupa la ventana entera y ese marco es el UNICO pedazo suyo que queda a la vista,
    o sea la unica superficie donde puede caer un click "afuera". Sin el, la caja tapaba el
    100% del dialogo y el cierre por click en el fondo no funcionaba desde la primera version
    (lo verifico Francisco el 24-sep-2026). De paso el cuadro ampliado se ve flotando sobre el
    tablero en vez de taparlo entero, que acompania al gesto de "creci desde ahi" de la
    animacion. La animacion se calcula contra la CAJA y no contra la ventana: con el marco ya
    no miden lo mismo.
  sobre_el_pdf: >
    Si hay un cuadro ampliado, "Generar PDF" lo cierra ANTES de imprimir. El formato de la
    hoja lo define la clase `imprimiendo` sobre el tablero entero y un dialogo modal no se
    imprime: el PDF es siempre el tablero completo con la seleccion vigente.

# ---------------------------------------------------------------------------
# PANELES - la hoja "GanBov ST" de la maqueta de ganaderia
# ---------------------------------------------------------------------------
# La hoja se lee por los anclajes de sus imagenes, y son TRES PARES: a la izquierda un
# grafico y a la derecha su tabla. Arriba de todo, el mapa a la izquierda y la tabla por
# departamento a la derecha. No es una grilla de cuatro cuadros como los tableros
# anteriores: es una pagina de lectura, grafico y numero al lado.
#
# El cuarto cuadro de JC, "Bovinos, caravanas en existencia y promedio de solicitudes"
# (fila 91 de su hoja), NO se construye: no hay base de caravanas en la entrega. Backlog 84.
# La miga de agricultura: "Provincia" es el link de vuelta cuando hay un departamento elegido.
breadcrumb: "Ganadería - Bovinos - Provincia - {departamento} - Stocks"

paneles:
  alto: fluye
  # "Generar PDF" al pie de la hoja, como en agricultura (celda BE113 de "GanBov ST").
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}

  mapa:
    # Nombres de los departamentos sobre el mapa: desvio de la maqueta (ver la cabecera).
    rotulos_departamento: true
    # Sin capas de contexto del IGN ni control "Capas" (pedido de la usuaria del
    # 16-oct-2026: "saca el boton capas de los mapas de ganaderia").
    # La pestaña de JC sobre su mapa ("Stocks") y su cita al pie (H39).
    titulo: "Stocks"
    fuente: "Fuente: SENASA"
    # El color lo fija el protocolo por TIPO de variable: cabezas va en la rampa marron, la
    # misma que usa la base 85. No se elige aca.
    medida: cabezas
    rotulo_accion: "Seleccione departamento"
    # JC, celda E121 de su hoja: "Seleccionando un departamento del mapa lleva a página de
    # datos (como en agri)". Es el mecanismo de cultivos extensivos: la MISMA página con los
    # datos del departamento (KPIs de volumen, los dos gráficos de evolución y la tabla por
    # categoría); el mapa, los anillos y las tablas por departamento siguen provinciales y
    # remarcan el elegido. El mapa en miniatura de JC con "Departamento ALBERDI" arriba no va:
    # mismo desvío que agricultura (Francisco, 2-oct-2026), el elegido ya se lee en el mapa y
    # en la miga.
    click_departamento: en-la-misma-vista
    seleccion_departamento:
      defecto: provincia
      rotulo_provincia: "Provincia"
      rotulo_cambiar: "Seleccione otro departamento si desea visualizar"
      miga: "Dto {Departamento}"
  tabla-departamentos:
    # Titulo literal de JC (cuadro de texto de la fila 16 de su hoja).
    titulo: "Sgo. del Estero - Stocks bovinos por categoría, totales y cantidad de UP por departamento - año {anio}"
    encabezado_geo: "Departamento"
    encabezado_total: "Total Cab"
    encabezado_up: "Total UP"
    # La primera fila de su tabla, resaltada.
    rotulo_total: "TOTAL PROV"
    nota: >
      El guion marca las categorías sin existencias en ese departamento, que no es lo mismo
      que un dato que la fuente no informó (ése sale como S/D).

  evolucion-total:
    # Titulo que JC escribe DENTRO de la imagen del gráfico, no en una celda.
    titulo: "Sgo del Estero - Evolución del stock total bovinos - años {desde} a {hasta}"
    medida_nombre: "Stock total"
  tabla-evolucion:
    titulo: "Sgo. del Estero - Evolución del stock bovino por categoría y totales - años {desde} a {hasta}"
    encabezado_anio: ""
    encabezado_total: "Total Cab"

  evolucion-categorias:
    titulo: "Sgo del Estero - Evolución del stock por categoría años {desde} a {hasta}"
  tabla-departamento-anios:
    titulo: "Sgo. del Estero - Evolución del stock bovino total por departamento - años {desde} a {hasta}"
    encabezado_geo: "Departamento"
    rotulo_total: "TOTAL PROV"
    # JC no pone la fila de la provincia en esta matriz: el total por anio ya esta en la
    # tabla de evolucion de arriba.
    sin_total: true
    # JC arranca esta tabla en 2015 y no en 2012 como las otras dos: son 27 filas y con
    # catorce columnas no entra. Se respeta su recorte.
    desde: 2015

  # Grafico a la izquierda, tabla a la derecha, que es como los pega JC. El 5/7 sale de sus
  # anclajes: el mapa ocupa las columnas 7 a 24 de su hoja y las tablas de la 30 a la 60.
  # 4/8 y no 5/7: la tabla mas ancha de las tres es la matriz departamento x anio, que mide
  # 836 px con sus doce columnas, y con 7 de 12 (747 px) se desbordaba y estiraba el ancho de
  # toda la pagina. El reparto es el mismo en los tres pares a proposito: tres divisiones
  # distintas en la misma pantalla se leen como un error de dibujo.
  # El anillo al pie de la columna izquierda de JC ("Participación departamentos en el stock
  # total - 2025"): sus siete primeros y el resto.
  anillo-departamentos:
    titulo: "Sgo del Estero - Participación departamentos en el stock total - {anio}"
    # Cinco y "Resto" y no los siete de su maqueta: regla de JC del 25-oct-2026,
    # "NORMALMENTE NO CONVIENE PONER MAS DE 5 ANTES DE 'RESTO'".
    cuantos: 5
  # El cuarto cuadro de la hoja (fila 90 a 151): "Bovinos, caravanas en existencia y promedio
  # de solicitudes". No hay base de caravanas en la entrega (backlog 84): JC pega la captura
  # del tablero de control de SENASA. Por pedido de Francisco (12-oct-2026: "hardcodealo y no
  # lo pongas como imagen") las cifras se TRANSCRIBIERON de esa captura y viven aca, en el
  # spec: cuatro tarjetas y la curva mensual de solicitudes 2025, dibujadas como el resto del
  # sitio (tooltip y zoom). NO se actualizan con los Excels: si SENASA publica otro corte hay
  # que cambiar estos numeros a mano, y si llega la base este cuadro pasa a leerla.
  # El rotulo de la tercera tarjeta esta cortado en la captura ("Promedio caravanas bovinas
  # solicitadas p..."): va hasta donde se lee, sin adivinar el final.
  cifras-caravanas:
    titulo: "Sgo. del Estero - Bovinos, caravanas en existencia y promedio de solicitudes - año 2.025"
    subtitulo: "En caravanas y unidades productivas"
    cifras:
      - {etiqueta: "Caravanas visuales bovinas", valor: 216425}
      - {etiqueta: "Caravanas electrónicas bovinas", valor: 70294}
      - {etiqueta: "Promedio caravanas bovinas solicitadas", valor: 324}
      - {etiqueta: "UPs RENSPA", valor: 886}
    serie:
      titulo: "Solicitudes de caravanas a través del tiempo"
      nombre: "2025"
      unidad: "caravanas"
      eje: "Caravanas"
      rotulos: [ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
      etiquetas: [enero 2025, febrero 2025, marzo 2025, abril 2025, mayo 2025, junio 2025,
                  julio 2025, agosto 2025, septiembre 2025, octubre 2025, noviembre 2025,
                  diciembre 2025]
      valores: [15775, 24175, 32250, 39925, 31675, 29825, 20475, 13475, 18950, 15950, 17250,
                26994]
    nota: >
      Cifras del tablero de control de SENASA para Santiago del Estero, año 2025, transcriptas
      a mano: no se actualizan con el resto de la página.
    fuente: "Fuente: SENASA"
  # Disposicion en COLUMNAS (12-oct-2026, "reacomoda... para que no haya espacios vacios"):
  # cada banda tiene dos columnas que se apilan a su ritmo, como las hojas de JC (graficos a
  # la izquierda, tablas a la derecha). Las bandas agrupan cuadros de alto parecido; los
  # altos se midieron a 1600 px.
  # 13-oct-2026: la disposicion de los anclajes de JC. Columna izquierda (col. 6-29 de su
  # hoja): mapa (filas 5-38), barras del total (39-55), apiladas (55-72) y anillo (72-89).
  # Columna derecha (29-59): tabla por departamento (15-38), tabla de evolucion (39-55) y la
  # matriz departamento x anio (55-85). Debajo, a todo el ancho, las caravanas (90-109).
  disposicion: columnas
  orden:
    - {id: mapa, ancho: 4, columna: izq}
    - {id: tabla-departamentos, ancho: 8, columna: der}
    - {id: evolucion-total, ancho: 4, columna: izq, nueva_banda: true}
    - {id: tabla-evolucion, ancho: 8, columna: der}
    - {id: evolucion-categorias, ancho: 4, columna: izq, nueva_banda: true}
    - {id: anillo-departamentos, ancho: 4, columna: izq}
    - {id: tabla-departamento-anios, ancho: 8, columna: der, compacta: true}
    # Solo en la provincia (JC, hoja "SID Muestra Dto-xGanad" G108: "ESTE GRAFICO NO DEBE IR EN
    # DEPARTAMENTOS - ELIMINAR EN LA INFO DEPARTAMENTAL, TANTO EN SID COMO EN GANADERIA").
    - {id: cifras-caravanas, ancho: 12, solo_provincia: true}

# ---------------------------------------------------------------------------
# FILTROS
# ---------------------------------------------------------------------------
# Solo el anio. NO hay filtro de categoria (JC, 13-oct-2026: "JAMAS SE PUEDE ANALIZAR UN
# STOCK SEPARANDO LAS CATEGORIAS"): el unico selector de sus hojas es el departamento, que
# se elige con un clic en el mapa. El mapa, la evolucion total y los KPIs de volumen son
# siempre el TOTAL; las categorias se ven solo juntas (tablas completas, barras apiladas).
# El build corta la corrida si un tablero de stock vuelve a declarar `categoria`.
filtros:
  - id: anio
    zona: periodo        # barra verde de la cabecera
