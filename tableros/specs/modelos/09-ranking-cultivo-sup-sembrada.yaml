# La tabla de ranking del mockup de JC (specs/fuentes/0000000000 Modelo 1.xlsx, hoja Modelo 2):
# "Ranking de sup. Sembrada sobre el total provincial", top 10 departamentos con la superficie
# sembrada del cultivo elegido y el % sobre el total provincial.
#
# Hereda del ranking por producción: misma mecánica, otra medida. El panel del tablero muestra
# el top 10 (como lo dibujó JC); esta vista completa lista los 26 departamentos, igual que sus
# hermanas.
base: 9
slug: ranking-cultivo-sup-sembrada
comunes: _comunes-base-9
igual_que: 09-ranking-cultivo-produccion
titulo: "Ranking de departamentos por superficie sembrada"
subtitulo: "Superficie sembrada en la campaña, en hectáreas"

# --- Solo las diferencias contra el spec padre ---
titulo_componentes:
  variable: {fijo: sup_sembrada_ha}
titulo_protocolo_ejemplo: "Ranking de superficie sembrada de soja por departamento - Santiago del Estero - campaña 2024/25"

variables: [sup_sembrada_ha]
orden: {por: sup_sembrada_ha, dir: desc}

columnas_tabla:
  - {campo: puesto, etiqueta: "Puesto", formato: "1°"}
  - {campo: departamento, etiqueta: "Departamento"}
  - {campo: sup_sembrada_ha, etiqueta: "Superficie semb. (ha)"}
  - {campo: participacion_provincial_pct, etiqueta: "% sobre total prov."}   # rótulo de JC

transformaciones:
  - ranking:
      particion: "cultivo + campania"
      ordenado_por: sup_sembrada_ha
      direccion: desc
      empates: "mismo puesto, el siguiente salta"
      calculado_en: marts
  - participacion_geografica_pct:
      denominador: "fila 'Total provincia' del mismo cultivo y campaña"
      verificacion: >
        Contra el mockup de JC (hoja 'Data', AP11:AS23, soja 2024/25): MORENO 355.400 ha y
        25,10%, GENERAL TABOADA 261.200 ha y 18,50%, COPO 26.700 ha y 1,90%. Los diez puestos
        y porcentajes del mockup salen de esta cuenta.

en_tablero:
  top_n: 10          # así lo dibujó JC en el panel; la vista completa muestra los 26

# Despublicada el 10-ago-2026 (tercera tanda, Facu con JC: "OLVIDATE DEL ANALISIS COMPLETO,
# ESO YA NO EXISTE MAS... NECESITO QUE LO SAQUES Y TE QUEDES CON LOS TABLEROS"). El spec queda
# como REGISTRO de la regla: no se construye pagina propia ni se linkea desde ningun lado.
# Las unicas paginas publicadas de cultivos son el tablero (index), 09-departamento-datos y
# 09-noa-participacion-provincia. Regla: _protocolo-presentacion.formato_v1.tercera_tanda.solo_tableros.
# Sus transformaciones SIGUEN alimentando el panel top del tablero
# (tablero-cultivos-extensivos.paneles): muere la pagina propia, no la regla.
estado: no-publicada

origen:
  tipo: documento-de-jc
  detalle: "specs/fuentes/0000000000 Modelo 1.xlsx, tabla 'Ranking de sup. Sembrada sobre el total provincial' de la hoja 'Modelo 2', datos de la hoja 'Data' AP11:AS23"
  fecha: 2026-08-10
