# ("0000000000 Maqueta Clima 1.xlsx", 14-oct-2026; base "3002 MP"). Lectura en
# docs/maqueta-clima.md.
#
# Galeria de IMAGENES de SEPA-INTA, publicadas tal cual (mismo mecanismo que
# 43-mapas-forrajeros: miniatura en la grilla y el original en el popup). Lo que pide JC, en rojo
# al pie de su hoja:
#   X56 "PARA EL BETA DE WEB PUBLICA, SOLO 6 meses de mapas - 3 por mes (son decádicas)"
#   X58 "LOS CODIGOS DE IMÁGENES ESTÁN PUESTOS por mes y década (1, 2 y 3)"
#   X60 "CORRECTAS LAS FECHAS Y LAS MINIATURAS"
# Los rotulos de la maqueta son aproximados ("10 al 20 mayo", "1 al 10 de abril"): aca se
# CALCULAN del nombre del archivo, decada 1 = 1 al 10, decada 2 = 11 al 20, decada 3 = 21 al
# ultimo dia del mes (que es la definicion del propio producto, en el texto de JC de abajo).
#
# Disposicion de la hoja: arriba a la izquierda el mapa MAS RECIENTE en grande, debajo el
# cuadro con la definicion del producto y el link a SEPA; a la derecha la grilla de seis por
# fila, del mas reciente al mas antiguo.
