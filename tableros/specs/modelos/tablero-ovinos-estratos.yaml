# Ganaderia > Ovinos > Estratos. Hoja "GanOviEstr" de la maqueta "Maqueta Ganad VF"
# (9-oct-2026), base 158.
#
# Misma banda de KPIs que la pagina de stocks (la hereda), el mapa a la izquierda con los
# dos anillos de estratos debajo, y a la derecha la tabla grande: cada departamento abierto
# por estrato con su total.
#
# 13-oct-2026 (revision contra la maqueta): el mapa se titula "Estratos" (la pestaña de JC),
# la tabla lleva las categorias en el orden de JC (Ovejas antes que Carneros, "Corderos"), no
# lleva fila de la provincia (la de JC no la tiene: arranca en Aguirre) y los estratos van sin
# numero ni especie ("Hasta 10"). El anillo de UP de JC trae los estratos de OTRA especie (los
# de caprinos): se publica el de ovinos y se le avisa (backlog).
#
# 15-oct-2026 (pedido de la usuaria, toda ganaderia): el mapa de la provincia lleva los NOMBRES
# de los departamentos escritos (`paneles.mapa.rotulos_departamento`). DESVIO de la maqueta
# "Maqueta Ganad VF", que dibuja los mapas sin nombres (viven en el tooltip y en la tabla por
# departamento); es el mismo desvio que agricultura (backlog 68). Pregunta para JC en el
# backlog 110; se apaga borrando esa linea en tablero-ovinos, de donde esta pagina lo hereda
# (`igual_que`).
id: tablero-ovinos-estratos
igual_que: tablero-ovinos
pagina: estratos
titulo_pagina: "Estratos"
periodo: estrato

breadcrumb: "Ganadería - Ovinos - Provincia - Estratos, Establecimientos y U.P."

paneles:
  mapa:
    titulo: "Estratos"
  tabla-departamento-estratos:
    titulo: "Sgo. del Estero - Stocks ovinos por categoría, estrato, cantidad de Establecimientos y UP por departamento - año {anio}"
    encabezado_geo: "Departamento"
    encabezado_estrato: "Estrato"
    encabezado_total: "TOTAL Ovinos"
    rotulo_total: "TOTAL PROV"
    total: "no"
    categorias: [Ovejas, Carneros, Borregos, Capones, Corderos/as]
    etiquetas: {"Corderos/as": "Corderos"}
    columnas_extra:
      - {medida: establecimientos, encabezado: "Establ"}
      - {medida: renspas, encabezado: "UP"}
    fuente: "Fuente: SENASA"
    nota: >
      Las UP son los RENSPA registrados en cada estrato. La base por estrato y la de stock por
      departamento son dos relevamientos distintos de SENASA: sus totales no tienen por qué
      coincidir.
  anillo-estratos:
    titulo: "Sgo del Estero - Ovinos - Participación de los estratos en la cantidad de cabezas - año {anio}"
    fuente: "Fuente: SENASA"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  anillo-estratos-up:
    titulo: "Sgo del Estero - Ovinos - Participación de los estratos en la cantidad de UP - año {anio}"
    subtitulo: "En unidades productivas (RENSPA)"
    fuente: "Fuente: SENASA"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  disposicion: columnas
  orden:
    - {id: mapa, ancho: 4, columna: izq}
    - {id: anillo-estratos, ancho: 4, columna: izq}
    - {id: anillo-estratos-up, ancho: 4, columna: izq}
    - {id: tabla-departamento-estratos, ancho: 8, columna: der, scroll_interno: true, compacta: true}
