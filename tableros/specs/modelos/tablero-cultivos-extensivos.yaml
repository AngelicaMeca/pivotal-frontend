    destinos_bloqueados_por: "faltan las bases de precios, costos y exportaciones (backlog 8); cada link se activa cuando entre su base"

  # Disposición calcada de la captura: columna izquierda = mapa (a lo alto) + UTILIDADES +
  # pie de tecnología; columna derecha = chips de cultivo, tarjeta + KPIs, fila de gráficos
  # (tendencia | anillo), fila de tablas (tabla-datos + informacion-relacionada | top).
  # SIN campo `detalle` en ningún panel: no existen páginas de detalle.
  orden:
    - {id: mapa,        columna: izquierda}
    - {id: utilidades,  columna: izquierda, debajo_de: mapa}
    - {id: tendencia,   columna: derecha, fila: graficos}
    - {id: anillo,      columna: derecha, fila: graficos}
    - {id: tabla-datos, columna: derecha, fila: tablas}
    - {id: informacion-relacionada, columna: derecha, fila: tablas, debajo_de: tabla-datos}
    - {id: top,         columna: derecha, fila: tablas}

