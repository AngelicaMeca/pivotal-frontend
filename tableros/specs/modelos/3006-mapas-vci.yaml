# AgroClima > Mapas > Índice de Condición de la Vegetación VCI · hoja "ClimVCI" de la maqueta de
# JC (base "3006 MP"). Mismo mecanismo que 3002-mapas-evapotranspiracion.
#   X61 "PARA EL BETA DE WEB PUBLICA, SOLO 6 meses de mapas - 4 por mes (son semanales)"
#   X63 "NO tienen código concreto - Van de manera descendente"
#   X65 "CORRECTAS LAS FECHAS Y LAS MINIATURAS"
# El nombre "vi_AAAADDD" trae el dia juliano en que empieza el periodo de 8 dias (el texto de JC
# dice "cada 8 días"). vi_2026249 = "6 al 13 septiembre", que coincide con la leyenda de la
# imagen ("Período: 06-Septiembre al 13-Septiembre de 2026"). 2026 no es bisiesto; el calculo
# usa el calendario, asi que un anio bisiesto sale bien solo.
# Ventana: 6 meses x 4 por mes = 24; hoy hay 23 (del 14 de marzo al 13 de septiembre).
familia: agroclima
seccion: agroclima
slug: 3006-mapas-vci
protocolo: _protocolo-presentacion
tipo: galeria

titulo: "Índice de Condición de la Vegetación VCI"
subtitulo: "SEPA - INTA · condición de la vegetación cada 8 días, últimos 6 meses"
breadcrumb: "AgroClima - Provincia - mapas - SEPA-INTA - Indice de Vegetación - VCI"
titulo_protocolo: "SEPA - INTA - Mapas de Indice de Condición de Vegetación - VCI - {anios} (últimos 6 meses)"
subtitulo_cuadro: "Del período más reciente al más antiguo · clic en un mapa para verlo completo"

serie: vci
assets:
  carpeta: "site/assets/clima/vci"
  patron: "^vi_(?P<anio>\\d{4})(?P<dia>\\d{3})(?P<mini>-mini)?\\.(?P<ext>gif|jpg)$"
periodo: dias-julianos
dias: 8
orden: descendente
por_fila: 6
ventana:
  cuantos: 24
  motivo: "JC, X61: SOLO 6 meses de mapas - 4 por mes (son semanales)"
destacado: mas_reciente

definicion:
  titulo: "INDICE CONDICION DE VEGETACIÓN - VCI"
  parrafos:
    - >
      El Índice de Condición de la Vegetación (VCI en inglés) evalúa el comportamiento temporal
      del IVN (índice de vegetación normalizado) cada 8 días respecto del mismo período de la
      serie histórica de información. Mediante la fórmula ((IVN (actual) - IVN (mínimo
      histórico)) / ((IVN máximo histórico) - (IVN mínimo histórico))) se generan 5 (cinco)
      clases que permiten analizar el aumento del riesgo de sequedad de la vegetación
      asociándolo a diferentes grados de intensidad de sequía. Cuánta más amplia sea la
      diferencia entre el valor actual y el mínimo histórico del NDVI y se mantengan o aumenten
      en el tiempo, mayor será el período de riesgo de sequía.
    - >
      Se utilizan imágenes del sensor VIIRS del satélite SUOMI-NPP con una resolución espacial
      de 500 metros.
  enlace: {texto: "https://sepa.inta.gob.ar/productos/", href: "https://sepa.inta.gob.ar/productos/"}

fuente:
  pie: "Fuente: SEPA - INTA (Instituto de Clima y Agua)"

sensibilidad: normal
estado: publicada
origen:
  tipo: maqueta de JC
  archivo: "0000000000 Maqueta Clima 1.xlsx"
  hojas: ["ClimVCI"]
  recibido: 2026-10-14

# VISOR GEORREFERENCIADO (20-oct-2026, pedido de la usuaria): cada imagen se ubica en el mapa
# con la caja del KML del SEPA (configs/dims/sepa-kml.yaml). La galeria sigue debajo, y una
# miniatura elige el periodo del visor.
georreferencia:
  kml: NDVI_DECADA
  # `usar` o `ignorar` la rotacion que trae el KML (se decide mirando si los limites calzan).
  rotacion: ignorar
  # LA ESCALA, ESCRITA ACA Y NO RECORTADA DE LA IMAGEN (26-oct-2026, pedido de la usuaria:
  # "hardcodea la escala de colores de los mapas de calor de agroclima, no me gusta que los
  # hayas puesto como imagen"). Es la misma decision que la faena equina de SENASA y las
  # caravanas: lo que la fuente publica dibujado se transcribe a datos y lo dibuja el sitio.
  # Asi la escala no depende de que la imagen cargue, entra en el ancho que le toque y se lee
  # con la tipografia del sitio.
  #
  # Responde al pedido de JC del 16-oct-2026: "LOS MAPAS DE AGROCLIMA SE VEN PERFECTOS... SOLO
  # QUE NO CONTIENEN LAS ESCALAS... ¿Y SI SE DIVIDE LA PANTALLA, SUPONGAMOS UN 20% DONDE ESTE
  # LA ESCALA QUE NO VARIE Y EN EL OTRO 80% PONEMOS EL MAPA AMPLIABLE???". El visor la dibuja
  # fija al costado del mapa: el zoom y el arrastre no la tocan.
  #
  # Los textos son LITERALES del recuadro que trae la imagen; el titulo tambien. El color de
  # cada clase NO se saca de una sola imagen: es la MEDIANA POR CANAL del relleno de esa muestra
  # medido en 22 de las 23 imagenes de la galeria. Las 22 dan el mismo color, con una diferencia
  # maxima de 1 por canal. El titulo del recuadro es "VCI" a secas, que es lo que escribe la
  # fuente; antes decia "Referencias VCI", que agregaba una palabra que no esta.
  leyenda:
    titulo: "VCI"
    clases:
      - {color: "#046103", texto: "Muy Buena"}
      - {color: "#7DFB07", texto: "Buena"}
      - {color: "#0102F4", texto: "Normal"}
      - {color: "#FCFD0A", texto: "Crítica"}
      - {color: "#F60303", texto: "Muy crítica"}
  # Caja AJUSTADA (21-oct-2026, pedido de la usuaria: "los bordes de la provincia y los
  # departamentos no coinciden con el borde negro"). La caja del KML deja la imagen corrida
  # unos px respecto de los limites que ella misma trae dibujados. Esta caja se midio
  # buscando el corrimiento y la escala que pegan los limites del GeoJSON del sitio a las
  # lineas de la imagen: en vi_2026073.jpg la distancia media de cada limite del GeoJSON a la
  # linea de la imagen paso de 2,29 px (caja del KML) a 1,79 px; en vi_2026249.jpg, de 4,03 a 3,66
  # px.
  # Todas las imagenes del producto tienen el mismo marco, asi que vale para toda la galeria.
  # Se mide sin rotacion, por eso `rotacion: ignorar`.
  caja_ajustada:
    norte: -16.326091
    sur: -59.967058
    este: -47.603653
    oeste: -79.360519
  nota: >-
    El SEPA no publica KML para el VCI: se ubica con el del NDVI decádico (NDVI_DECADA.kml), cuyas imágenes tienen el mismo marco. Se verificó que los límites departamentales calzan.
