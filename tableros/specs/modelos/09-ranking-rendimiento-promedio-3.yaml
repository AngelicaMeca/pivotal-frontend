# Tercer ranking de JC f165: "un tercer tipo de ranking tomara el promedio de rendimientos DE LAS
# ULTIMAS 3 CAMPAÑAS". Es el unico ranking que JC dejo calculado a mano en la hoja (filas 170 a 197,
# soja, campañas 2022/23 a 2024/25), asi que sirve de prueba de aceptacion.
base: 9
slug: ranking-rendimiento-promedio-3
comunes: _comunes-base-9
igual_que: 09-ranking-cultivo-rendimiento    # misma vista, cambia lo que sigue

titulo: "Ranking de departamentos por rendimiento promedio"
subtitulo: "Promedio de las últimas 3 campañas, en kilos por hectárea"

# --- Titulo del cuadro: lo arma _protocolo-presentacion, no se escribe a mano ---
protocolo: _protocolo-presentacion
titulo_componentes:                      # el resto se hereda de 09-ranking-cultivo-rendimiento
  variable:
    fijo: rendimiento_kg_ha
    override: "ranking de {frase} promedio"
    motivo: >
      Sin la palabra "promedio" el titulo seria identico al del ranking de una sola campaña y las
      dos vistas se confundirian. El periodo ("campañas 2022/23 a 2024/25") ya dice cuales son las
      tres, asi que no hace falta repetirlo en la variable.
  periodo: {ventana: ventana_propia}     # las 3 ultimas campañas, no la ventana de 10
titulo_protocolo_ejemplo: "Ranking de rendimiento promedio de soja por departamento - Santiago del Estero - campañas 2022/23 a 2024/25"

tipo: ranking                                # explicito: la herencia acá es de dos niveles
grafico: barras-horizontales

variables: [rendimiento_kg_ha]
dimensiones: [departamento, campania]
filtros: [cultivo]                           # la campaña ya no se elige: son siempre las ultimas 3
orden: {por: rendimiento_promedio_3, dir: desc}

defaults:
  cultivo: "Soja total"

ventana_propia:
  cantidad: 3
  ancla: ultima_campania_cerrada
  resueltas_2026_07_30: ["2022/23", "2023/24", "2024/25"]

columnas_tabla:
  - {campo: departamento, etiqueta: "Departamento"}
  - {campo: "rendimiento por campaña", etiqueta: "una columna por cada una de las 3 campañas"}
  - {campo: rendimiento_promedio_3, etiqueta: "Promedio 3 campañas"}
  - {campo: puesto, etiqueta: "Ranking", formato: "1°"}

transformaciones:
  - promedio_simple_n_campanias: {n: 3, variable: rendimiento_kg_ha}
  - ranking:
      particion: cultivo
      ordenado_por: rendimiento_promedio_3
      direccion: desc
      calculado_en: marts

prueba_de_aceptacion:
  descripcion: >
    El resultado para soja tiene que reproducir la tabla que JC calculo a mano en la hoja
    (filas 170 a 197): BELGRANO 1° con 2.970,67 kg/ha, GENERAL TABOADA 2° con 2.911,33,
    PELLEGRINI 3° con 2.775, y ALBERDI ultimo (26°) con 1.731,67.
  advertencia: >
    Esa tabla se usa SOLO para verificar que el calculo del pipeline coincide con el de JC. Los
    datos salen de staging, nunca de la hoja del Excel.
  ojo: >
    En esa misma tabla hay 11 departamentos con exactamente 1.500 kg/ha en 2022/23, lo que empuja
    a departamentos casi identicos a puestos distintos por diferencias de decenas de kilos. La
    llamada `estimacion-departamental` es obligatoria en esta vista.

exclusiones:
  - regla: "un departamento entra al ranking solo si tiene rendimiento en las 3 campañas"
    motivo_legible: >
      Un promedio de una sola campaña no se puede comparar contra uno de tres. Los que tienen
      menos van listados abajo, aparte, con la cantidad de campañas que informaron.
    nota_interpretacion: "JC no lo aclara. Es la interpretación más conservadora. Confirmar."

notas_metodologicas: [estimacion-departamental, rendimiento-no-se-suma, salavina-sin-datos]

fuente:                                  # _protocolo-presentacion.pie_de_fuente
  pie: "Fuente: MAGyP"                   # lo arma el protocolo, no se escribe en el template
  organismo_esperado: "MAGyP"            # tiene que coincidir con la columna `fuente` del mart
  publicacion: null                      # JC declara la cita como "Fuente: MAGyP" en su indice.
                                         # Si quiere "MAGyP, Estimaciones Agrícolas", se completa
                                         # aca y cambia en las 16 vistas. Backlog pregunta 14.
# Despublicada el 10-ago-2026 (tercera tanda, Facu con JC: "OLVIDATE DEL ANALISIS COMPLETO,
# ESO YA NO EXISTE MAS... NECESITO QUE LO SAQUES Y TE QUEDES CON LOS TABLEROS"). El spec queda
# como REGISTRO de la regla: no se construye pagina propia ni se linkea desde ningun lado.
# Las unicas paginas publicadas de cultivos son el tablero (index), 09-departamento-datos y
# 09-noa-participacion-provincia. Regla: _protocolo-presentacion.formato_v1.tercera_tanda.solo_tableros.
estado: no-publicada

origen: {tipo: modelo-analisis, detalle: "hoja 'Modelo  Analisis' base 9, filas 165 y 170 a 197", fecha: 2026-07-30}
nota_interpretacion: >
  El promedio es simple, no ponderado por superficie cosechada, porque es asi como lo calcula JC
  en su ejemplo. Ver `promedio_simple_n_campanias` en _comunes-base-9.yaml.
