# GRAF 2 de la hoja Modelo Analisis. Titulo original del grafico de JC:
# "Soja - Evolucion de la produccion y rendimientos".
base: 9
slug: cultivo-evolucion-prod-rendimiento
comunes: _comunes-base-9
igual_que: 09-cultivo-evolucion-sup-sembrada    # misma vista, cambia lo que sigue

titulo: "Cómo evolucionaron la producción y el rendimiento"
subtitulo: "Producción en toneladas y rendimiento en kilos por hectárea, por campaña"

# --- Titulo del cuadro: lo arma _protocolo-presentacion, no se escribe a mano ---
protocolo: _protocolo-presentacion
titulo_componentes:                      # lo no declarado se hereda de 09-cultivo-evolucion-sup-sembrada
  variable:
    override: "evolución de la producción y el rendimiento"
    motivo: >
      Son dos medidas en dos ejes. La union mecanica da "evolución de producción y rendimiento":
      en castellano el articulo va repetido. Cambia la redaccion, no las medidas, que siguen siendo
      las declaradas en `variables`.
titulo_protocolo_ejemplo: "Evolución de la producción y el rendimiento de soja - Santiago del Estero - campañas 2015/16 a 2024/25"

tipo: serie
grafico: barras-y-linea               # barras = producción, línea = rendimiento en eje secundario

variables: [produccion_tn, rendimiento_kg_ha]
ejes:
  izquierdo: {variable: produccion_tn, grafico: barras, unidad: tn}
  derecho: {variable: rendimiento_kg_ha, grafico: linea, unidad: kg/ha}

transformaciones:
  - variacion_interanual                  # solo sobre produccion_tn (JC f27)
  - variacion_decadica                    # solo sobre produccion_tn (JC f28)
  - variacion_promedio_anual              # sobre produccion_tn y sobre rendimiento_kg_ha
  - variacion_rendimiento_extremos        # JC f29

resumen_al_pie:
  - {etiqueta: "Variación del período", valor: variacion_decadica, variable: produccion_tn}
  - {etiqueta: "Var. anual promedio", valor: variacion_promedio_anual, variable: produccion_tn}
  - {etiqueta: "Variación del rendimiento entre extremos", valor: variacion_rendimiento_extremos}
  - {etiqueta: "Var. anual promedio del rendimiento", valor: variacion_promedio_anual, variable: rendimiento_kg_ha}

mouseover: "campaña + producción + rendimiento"

notas_metodologicas: [total-no-suma-componentes, campania-en-curso, rendimiento-no-se-suma]
notas_metodologicas_si_departamento: [estimacion-departamental]

fuente:                                  # _protocolo-presentacion.pie_de_fuente
  pie: "Fuente: MAGyP"                   # lo arma el protocolo, no se escribe en el template
  organismo_esperado: "MAGyP"            # tiene que coincidir con la columna `fuente` del mart
  publicacion: null                      # JC declara la cita como "Fuente: MAGyP" en su indice.
                                         # Si quiere "MAGyP, Estimaciones Agrícolas", se completa
                                         # aca y cambia en las 16 vistas. Backlog pregunta 14.
# Despublicada el 10-ago-2026 (tercera tanda, Facu con JC: "OLVIDATE DEL ANALISIS COMPLETO,
# ESO YA NO EXISTE MAS... NECESITO QUE LO SAQUES Y TE QUEDES CON LOS TABLEROS"). El spec queda
# como REGISTRO de la regla: no se construye pagina propia ni se linkea desde ningun lado.
# Las unicas paginas publicadas de cultivos son el tablero (index), 09-departamento-datos y
# 09-noa-participacion-provincia. Regla: _protocolo-presentacion.formato_v1.tercera_tanda.solo_tableros.
estado: no-publicada

origen: {tipo: modelo-analisis, detalle: "hoja 'Modelo  Analisis' base 9, GRAF 2 (filas 65 a 83) y cálculo c (fila 29)", fecha: 2026-07-30}
nota_interpretacion: >
  JC pide "variacion de rendimientos entre extremos de la serie y variacion promedio (la mas
  importante)" (f29). "Variacion promedio" se interpreta como la tasa geometrica anual, porque es
  exactamente lo que calcula su propia planilla en las celdas I62, I81 y J81 (verificado numero por
  numero, ver `variacion_promedio_anual` en _comunes-base-9.yaml). No es el promedio aritmetico de
  las variaciones anuales.
