# Ganaderia > Porcinos > Stocks. Hoja "GanPorcST" de la maqueta "Maqueta Ganad VF"
# (9-oct-2026). Misma anatomia que bovinos (tablero-stock-bovino): el mapa a la izquierda y
# la tabla por departamento a la derecha, y debajo dos pares de grafico + tabla.
#
# 15-oct-2026 (pedido de la usuaria, toda ganaderia): el mapa de la provincia lleva los NOMBRES
# de los departamentos escritos (`paneles.mapa.rotulos_departamento`). DESVIO de la maqueta
# "Maqueta Ganad VF", que dibuja los mapas sin nombres (viven en el tooltip y en la tabla por
# departamento); es el mismo desvio que agricultura (backlog 68). Pregunta para JC en el
# backlog 110; se apaga borrando esa linea del spec.
id: tablero-porcinos
tipo: tablero
familia: stock-porcinos
seccion: porcinos

titulo: "Porcinos"
subtitulo: "Provincia de Santiago del Estero · existencias por categoría y departamento"

# 13-oct-2026 (revision contra la maqueta): miga literal (N5), tarjeta "Datos 2025", sin
# variacion, encabezados y fila "Provincia" como los escribe JC (singulares, "Total
# Porcinos"), "Fuente: MAGyP" en sus siete cuadros, las barras apiladas en la columna
# izquierda ENTRE la barra del total y el anillo (filas 57-76), y "Generar PDF" (BF101). La
# config de la base 232 dice SENASA: la cita de JC va al backlog.
kpis_sin_variacion: true
tarjeta_datos:
  icono: porcinos

# Los cuatro de la banda de JC, textuales: "Stock 135.715 cab", "Unidades Productivas
# 6.273", "Stock Dto Juan F Ibarra 24.849 cab" y "U.P. Dto Figueroa 550". Los cuatro dan
# exacto contra la base. Las UP son los RENSPA de la base por estrato (91): es el unico lugar
# donde la especie las cuenta.
indicadores:
  - medida: cabezas
    categoria: "Total"
    etiqueta: "Stock"
  - medida: renspas
    origen: estrato
    etiqueta: "Unidades Productivas"
  - lider: cabezas
    etiqueta: "Stock Dto {departamento}"
  - lider: renspas
    origen: estrato
    etiqueta: "U.P. Dto {departamento}"

# La miga de agricultura: "Provincia" es el link de vuelta cuando hay un departamento elegido.
breadcrumb: "Ganadería - Porcinos - Provincia - {departamento} - Stocks"

paneles:
  alto: fluye
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}
  mapa:
    # Nombres de los departamentos sobre el mapa: desvio de la maqueta (ver la cabecera).
    rotulos_departamento: true
    # Sin capas de contexto del IGN ni control "Capas" (pedido de la usuaria del
    # 16-oct-2026: "saca el boton capas de los mapas de ganaderia").
    titulo: "Stocks"
    medida: cabezas
    fuente: "Fuente: MAGyP"
    rotulo_accion: "Seleccione departamento"
    # JC, celda E121 de su hoja: "Seleccionando un departamento del mapa lleva a página de
    # datos (como en agri)". Es el mecanismo de cultivos extensivos: la MISMA página con los
    # datos del departamento (KPIs de volumen, los dos gráficos de evolución y la tabla por
    # categoría); el mapa, los anillos y las tablas por departamento siguen provinciales y
    # remarcan el elegido. El mapa en miniatura de JC con "Departamento ALBERDI" arriba no va:
    # mismo desvío que agricultura (Francisco, 2-oct-2026), el elegido ya se lee en el mapa y
    # en la miga.
    click_departamento: en-la-misma-vista
    seleccion_departamento:
      defecto: provincia
      rotulo_provincia: "Provincia"
      rotulo_cambiar: "Seleccione otro departamento si desea visualizar"
      miga: "Dto {Departamento}"
  tabla-departamentos:
    titulo: "Sgo. del Estero - Stocks porcinos por categoría y totales por departamento - año {anio}"
    encabezado_geo: ""
    encabezado_total: "Total Porcinos"
    rotulo_total: "Provincia"
    etiquetas: &singular {Padrillos: Padrillo, Cerdas: Cerda, Lechones: Lechon, Cachorros: Cachorro,
                          Cachorras: Cachorra}
    fuente: "Fuente: MAGyP"
    columnas_extra: []
    nota: >
      El guion marca las categorías sin existencias en ese departamento, que no es lo mismo
      que un dato que la fuente no informó (ése sale como S/D).
  evolucion-total:
    titulo: "Sgo del Estero - Evolución del stock total porcinos - años {desde} a {hasta}"
    medida_nombre: "Stock total"
    fuente: "Fuente: MAGyP"
  tabla-evolucion:
    titulo: "Sgo. del Estero - Evolución del stock porcino por categoría y totales - años {desde} a {hasta}"
    encabezado_anio: ""
    encabezado_total: "Total Porcinos"
    etiquetas: *singular
    fuente: "Fuente: MAGyP"
  evolucion-categorias:
    titulo: "Sgo del Estero - Evolución del stock porcino por categoría años {desde} a {hasta}"
    fuente: "Fuente: MAGyP"
  tabla-departamento-anios:
    titulo: "Sgo. del Estero - Evolución del stock porcino total por departamento - años {desde} a {hasta}"
    encabezado_geo: ""
    rotulo_total: "Provincia"
    fuente: "Fuente: MAGyP"
  anillo-departamentos:
    titulo: "Sgo del Estero - Porcinos, Participación por departamento en el stock total año {anio}"
    cuantos: 7
    fuente: "Fuente: MAGyP"
  # Disposicion en COLUMNAS (12-oct-2026, "reacomoda... para que no haya espacios vacios"):
  # cada banda tiene dos columnas que se apilan a su ritmo, como las hojas de JC (graficos a
  # la izquierda, tablas a la derecha). Las bandas agrupan cuadros de alto parecido; los
  # altos se midieron a 1600 px.
  disposicion: columnas
  # Los anclajes de JC: a la izquierda mapa (5-38), barras del total (39-56), apiladas (57-76)
  # y anillo (76-95); a la derecha la tabla por departamento (16-47), la evolucion (48-60) y
  # la matriz departamento x anio (62-92).
  orden:
    - {id: mapa, ancho: 4, columna: izq}
    - {id: tabla-departamentos, ancho: 8, columna: der}
    - {id: evolucion-total, ancho: 4, columna: izq, nueva_banda: true}
    - {id: evolucion-categorias, ancho: 4, columna: izq}
    - {id: anillo-departamentos, ancho: 4, columna: izq}
    - {id: tabla-evolucion, ancho: 8, columna: der}
    - {id: tabla-departamento-anios, ancho: 8, columna: der, compacta: true}

# Solo el anio. NO hay filtro de categoria (JC, 13-oct-2026: "JAMAS SE PUEDE ANALIZAR UN
# STOCK SEPARANDO LAS CATEGORIAS"): el unico selector de sus hojas es el departamento, que
# se elige con un clic en el mapa. El mapa, la evolucion total y los KPIs de volumen son
# siempre el TOTAL; las categorias se ven solo juntas (tablas completas, barras apiladas).
# El build corta la corrida si un tablero de stock vuelve a declarar `categoria`.
filtros:
  - id: anio
    zona: periodo
