# Ficha del departamento. Es lo que se abre al hacer clic en el mapa (JC f16 y f153).
base: 9
slug: departamento-ficha-cultivos
comunes: _comunes-base-9
titulo: "Qué se produce en el departamento"
subtitulo: "Todos los cultivos del departamento en la campaña seleccionada"

# --- Titulo del cuadro: lo arma _protocolo-presentacion, no se escribe a mano ---
protocolo: _protocolo-presentacion
titulo_componentes:
  area: {desde_filtro: departamento}
  sujeto: {desde: subsector}             # "los cultivos extensivos"
  variable:
    override: "superficie, producción y rendimiento"
    motivo: >
      La ficha muestra 4 medidas. Nombrarlas una por una ("superficie sembrada, superficie
      cosechada, producción y rendimiento") da un titulo de 130 caracteres. Se juntan las dos
      superficies, que es como se habla.
  apertura: null
  periodo: {desde_filtro: campania}
titulo_protocolo_ejemplo: "Superficie, producción y rendimiento de los cultivos extensivos - MORENO (Santiago del Estero) - campaña 2024/25"

tipo: lista

variables: [sup_sembrada_ha, sup_cosechada_ha, produccion_tn, rendimiento_kg_ha]
dimensiones: [cultivo]
filtros: [departamento, campania]
orden: {por: produccion_tn, dir: desc}

defaults:
  campania: parametros.ventana_campanias.campania_por_defecto   # JC f16: "la ultima campaña"

universo:
  ambito: sde
  nivel_geo: departamento
  cultivo_rol: [agregado, simple]
  campanias: ventana_campanias

columnas:
  - {campo: cultivo, etiqueta: "Cultivo"}
  - {campo: estacion, etiqueta: "Temporada", valores: "Verano | Invierno"}
  - {campo: sup_sembrada_ha, etiqueta: "Sup. sembrada (ha)"}
  - {campo: sup_cosechada_ha, etiqueta: "Sup. cosechada (ha)"}
  - {campo: produccion_tn, etiqueta: "Producción (tn)"}
  - {campo: rendimiento_kg_ha, etiqueta: "Rendimiento (kg/ha)"}
  - {campo: participacion_provincial_pct, etiqueta: "% de la provincia"}

transformaciones:
  - participacion_geografica_pct:
      numerador: "valor del departamento"
      denominador: "valor de la fila 'Total provincia' del mismo cultivo y campaña"
      join: "cultivo + campania + medida"
      nota: "Es participación dentro de la provincia, no comparación entre provincias: NO es material sensible."

navegacion:
  - accion: "Ver todas las campañas"
    va_a: [09-cultivo-evolucion-sup-sembrada, 09-cultivo-evolucion-prod-rendimiento]
    con: "geo = este departamento, cultivo = el elegido en la lista"
    referencia: "JC f16, f155 y f156: los datos de cada cultivo se ven a traves de GRAF 1 y GRAF 2"
  - accion: "Cartera de cultivos"
    va_a: 09-departamento-cartera
    referencia: "JC f18"
  - accion: "Evolución de rendimientos"
    va_a: 09-departamento-evolucion-rendimientos
    referencia: "JC f19"
  - accion: "Posición en el ranking"
    va_a: 09-departamento-posicion-ranking
    referencia: "JC f157"

ubicacion_del_selector: "debajo del gráfico"    # JC f155: "que yo sugeriria colocar DEBAJO del grafico"

notas_metodologicas: [estimacion-departamental, total-no-suma-componentes, verano-invierno, clasificacion-provisoria]
filtros_calidad: [excluir-campanias-sin-departamento]

fuente:                                  # _protocolo-presentacion.pie_de_fuente
  pie: "Fuente: MAGyP"                   # lo arma el protocolo, no se escribe en el template
  organismo_esperado: "MAGyP"            # tiene que coincidir con la columna `fuente` del mart
  publicacion: null                      # JC declara la cita como "Fuente: MAGyP" en su indice.
                                         # Si quiere "MAGyP, Estimaciones Agrícolas", se completa
                                         # aca y cambia en las 16 vistas. Backlog pregunta 14.
sensibilidad: normal
# Despublicada el 10-ago-2026 (tercera tanda, Facu con JC: "OLVIDATE DEL ANALISIS COMPLETO,
# ESO YA NO EXISTE MAS... NECESITO QUE LO SAQUES Y TE QUEDES CON LOS TABLEROS"). El spec queda
# como REGISTRO de la regla: no se construye pagina propia ni se linkea desde ningun lado.
# Las unicas paginas publicadas de cultivos son el tablero (index), 09-departamento-datos y
# 09-noa-participacion-provincia. Regla: _protocolo-presentacion.formato_v1.tercera_tanda.solo_tableros.
estado: no-publicada

origen: {tipo: modelo-analisis, detalle: "hoja 'Modelo  Analisis' base 9, filas 16 a 19 y 151 a 158", fecha: 2026-07-30}
nota_interpretacion: >
  JC pregunta "pop up u otra pagina?" (f16). Se elige otra pagina, una por departamento, por el
  mismo criterio que en el mapa: paginas separadas antes que interactividad compleja.
  Los cultivos que en esa campaña quedaron sin cosechar o sin produccion informada se muestran con
  su estado (ver `estados_sin_dato` en _comunes-base-9.yaml), nunca como cero.
