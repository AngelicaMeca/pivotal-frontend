# Ganaderia > Porcinos > Movimientos. Hoja "GanPorcDTE" de la maqueta "Maqueta Ganad VF"
# (9-oct-2026). Base 144 (DTE porcinos).
#
# JC la arma con los titulos y KPIs de bovinos ("(SIMULACION) IDEM DTE BOVINOS"): es la pagina
# de movimientos de bovinos con los datos de porcinos, menos la matriz origen-destino ("SOLO
# EN CASO DE BOVINOS PUBLICAMOS LA MATRIZ OD", T128 de "GanBov DTE").
#
# 13-oct-2026 (revision contra la maqueta): misma estructura que bovinos. Se publican las
# tablas y anillos por provincia de destino y de origen y los KPIs que nombran la provincia
# (decision de la usuaria con el OK de Francisco); dos columnas como el molde (mapa y anillos
# a la izquierda, las cinco tablas a la derecha); con un departamento elegido, solo el anio
# elegido y sin el anillo departamental. La introduccion de un departamento al que no entro
# nada desde otra provincia es cero, no S/D.
#
# 15-oct-2026 (pedido de la usuaria, toda ganaderia): el mapa de la provincia lleva los NOMBRES
# de los departamentos escritos (`paneles.mapa.rotulos_departamento`). DESVIO de la maqueta
# "Maqueta Ganad VF", que dibuja los mapas sin nombres (viven en el tooltip y en la tabla por
# departamento); es el mismo desvio que agricultura (backlog 68). Pregunta para JC en el
# backlog 110; se apaga borrando esa linea del spec.
id: tablero-porcinos-movimientos
tipo: tablero
familia: movimientos-porcinos
seccion: porcinos
pagina: movimientos
titulo_pagina: "Movimientos"
sensibilidad: comparativo
aprobado_por: "fran, 2026-10-13 (decisión de la usuaria: comparaciones entre provincias de ganadería, según la maqueta)"

titulo: "Porcinos"
subtitulo: "Provincia de Santiago del Estero · movimientos de porcinos con DTE"

breadcrumb: "Ganadería - Porcinos - Provincia - {departamento} - Movimientos (DTE)"

kpis_sin_variacion: true
tarjeta_datos:
  icono: porcinos

indicadores:
  - recorte: totales_sin_introduccion
    etiqueta: "Totales movidos"
  - recorte: internos
    etiqueta: "Movimientos internos"
  - recorte: extraccion
    provincia_lider: true
    etiqueta: "Extracción a {provincia}"
  - recorte: introduccion
    provincia_lider: true
    etiqueta: "Introducción de {provincia}"

paneles:
  alto: fluye
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}
  mapa:
    # Nombres de los departamentos sobre el mapa: desvio de la maqueta (ver la cabecera).
    rotulos_departamento: true
    titulo: "Movimientos por departamento"
    rotulo_accion: "Seleccione departamento"
    click_departamento: en-la-misma-vista
    seleccion_departamento:
      defecto: provincia
      rotulo_provincia: "Provincia"
      rotulo_cambiar: "Seleccione otro departamento si desea visualizar"
      miga: "Dto {Departamento}"
  tabla-tipos:
    titulo: "Sgo. del Estero - Movimientos porcinos por tipo, categoría y DTE Totales provincia - años {desde} a {hasta} (parcial)"
    titulo_departamento: "Sgo. del Estero - Movimientos porcinos por tipo, categoría y DTE - Dto {departamento} - año {anio}"
    rotulos_franja:
      internos: "Movimientos internos (dentro de la provincia Sgo Estero)"
      extraccion: "Movimientos cabezas salidas de la provincia (extracción) - cálculo por diferencia"
    nota: >
      La extracción es la diferencia entre los movimientos totales y los internos. La planilla
      de SENASA informa los DTE por categoría: un documento que ampara animales de dos
      categorías se cuenta una vez en cada una, así que el total de DTE puede estar
      sobreestimado.
  tabla-balance:
    titulo: "Sgo. del Estero - Balance de movimientos porcinos (extracción - introducción) por categoría y totales - años {desde} a {hasta}"
    titulo_departamento: "Sgo. del Estero - Balance de movimientos porcinos (extracción - introducción) por categoría y totales - Dto {departamento} - año {anio}"
    # Mismo signo que en bovinos (introduccion - extraccion, el de los numeros de JC; backlog 86).
    nota: >
      Un número negativo quiere decir que salieron de la provincia más cabezas de esa
      categoría que las que entraron; uno positivo, que entraron más.
  tabla-departamentos:
    titulo: "Sgo. del Estero - Movimientos porcinos por tipo, categoría y DTE por Departamento - año {anio}"
    rotulo_total: "PROVINCIA"
  tabla-provincias-destino:
    titulo: "Sgo. del Estero - Movimientos porcinos de EXTRACCIÓN, categoría y DTE por Provincia de destino - año {anio}"
    encabezado: "Pcia. Destino"
  tabla-provincias-origen:
    titulo: "Sgo. del Estero - Movimientos porcinos de INTRODUCCIÓN, categoría y DTE por Provincia de origen - año {anio}"
    encabezado: "Pcia. Origen"
  anillo-categorias:
    titulo: "Sgo del Estero - Participación por categoría en movimientos totales año {anio}"
  anillo-departamentos:
    titulo: "Sgo del Estero - Participación de departamentos de origen en los movimientos totales año {anio}"
    cuantos: 5
  anillo-provincias-destino:
    titulo: "Sgo del Estero - Participación de las provincias de destino en los movimientos de EXTRACCIÓN año {anio}"
    cuantos: 4
  anillo-provincias-origen:
    titulo: "Sgo del Estero - Participación de las provincias de origen en los movimientos de INTRODUCCIÓN año {anio}"
    cuantos: 5
  disposicion: columnas
  orden:
    - {id: mapa, ancho: 4, columna: izq}
    - {id: anillo-categorias, ancho: 4, columna: izq}
    - {id: anillo-departamentos, ancho: 4, columna: izq, solo_provincia: true}
    - {id: anillo-provincias-destino, ancho: 4, columna: izq, solo_provincia: true}
    - {id: anillo-provincias-origen, ancho: 4, columna: izq, solo_provincia: true}
    - {id: tabla-tipos, ancho: 8, columna: der}
    - {id: tabla-balance, ancho: 8, columna: der}
    - {id: tabla-departamentos, ancho: 8, columna: der}
    - {id: tabla-provincias-destino, ancho: 8, columna: der, solo_provincia: true}
    - {id: tabla-provincias-origen, ancho: 8, columna: der, solo_provincia: true}

filtros:
  - id: anio
    zona: periodo
