# Ganaderia > Porcinos > Movimientos. Hoja "GanPorcDTE" de la maqueta "Maqueta Ganad VF"
# (9-oct-2026). Base 144 (DTE porcinos).
#
# JC la arma con los titulos y KPIs de bovinos ("PROCESAR IDEM DTE BOVINOS"): es la pagina de
# movimientos de bovinos con los datos de porcinos. Lo que va por provincia de destino y de
# origen queda en la pagina reservada, como en bovinos.
id: tablero-porcinos-movimientos
tipo: tablero
familia: movimientos-porcinos
seccion: porcinos
pagina: movimientos
titulo_pagina: "Movimientos"

titulo: "Porcinos"
subtitulo: "Provincia de Santiago del Estero · movimientos de porcinos con DTE"

breadcrumb: "Ganadería - Porcinos - Provincia - {departamento}"

indicadores:
  - recorte: totales_sin_introduccion
    etiqueta: "Totales movidos"
  - recorte: internos
    etiqueta: "Movimientos internos"
  - recorte: extraccion
    etiqueta: "Extracción"
  - recorte: introduccion
    etiqueta: "Introducción"

paneles:
  alto: fluye
  mapa:
    titulo: "Movimientos por departamento"
    rotulo_accion: "Seleccione departamento"
    click_departamento: en-la-misma-vista
    seleccion_departamento:
      defecto: provincia
      rotulo_provincia: "Provincia"
      rotulo_cambiar: "Seleccione otro departamento si desea visualizar"
      miga: "Dto {Departamento}"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  tabla-tipos:
    titulo: "Sgo. del Estero - Movimientos porcinos por tipo, categoría y DTE Totales provincia - años {desde} a {hasta}"
    nota: >
      La extracción es la diferencia entre los movimientos totales y los internos. La planilla
      de SENASA informa los DTE por categoría: un documento que ampara animales de dos
      categorías se cuenta una vez en cada una, así que el total de DTE puede estar
      sobreestimado.
  tabla-balance:
    titulo: "Sgo. del Estero - Balance de movimientos porcinos (extracción - introducción) por categoría y totales - años {desde} a {hasta}"
    # Mismo signo que en bovinos (introduccion - extraccion, el de los numeros de JC; backlog 86).
    nota: >
      Un número negativo quiere decir que salieron de la provincia más cabezas de esa
      categoría que las que entraron; uno positivo, que entraron más.
  tabla-departamentos:
    titulo: "Sgo. del Estero - Movimientos porcinos por tipo, categoría y DTE por Departamento - año {anio}"
    rotulo_total: "PROVINCIA"
  anillo-categorias:
    titulo: "Sgo del Estero - Participación por categoría en movimientos totales año {anio}"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  anillo-departamentos:
    titulo: "Sgo del Estero - Participación de departamentos de origen en los movimientos totales año {anio}"
    cuantos: 5
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  # Disposicion en COLUMNAS (12-oct-2026, "reacomoda... para que no haya espacios vacios"):
  # cada banda tiene dos columnas que se apilan a su ritmo, como las hojas de JC (graficos a
  # la izquierda, tablas a la derecha). Las bandas agrupan cuadros de alto parecido; los
  # altos se midieron a 1600 px.
  disposicion: columnas
  orden:
    - {id: mapa, ancho: 4, columna: izq}
    - {id: tabla-tipos, ancho: 8, columna: der}
    - {id: anillo-categorias, ancho: 6, columna: fila}
    - {id: anillo-departamentos, ancho: 6, columna: fila}
    - {id: tabla-balance, ancho: 12}
    - {id: tabla-departamentos, ancho: 12}

filtros:
  - id: anio
    zona: periodo
