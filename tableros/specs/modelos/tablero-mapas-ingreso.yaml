# Mapas · portada del area ("area de ingreso" que pidio JC el 15-nov-2026, punto 3.b).
#
# Texto de JC: "MAPAS: Con el mismo formato de 'Agroclima' hacemos un area de 'ingreso' con los
# titulos de los mapas que envie el link. Ahi esta la fuente, que salvo el de Poblacion, la
# mayoria son de INTA".
#
# Que es: la puerta de entrada al material geoespacial de terceros. Mismo mecanismo que la
# portada de AgroClima (`accesos-*`): tarjetas con miniatura, organismo y titulo. No tiene
# datos propios.
#
# DE DONDE SALE CADA TITULO Y CADA MINIATURA: configs/dims/mapas-ingreso.yaml. La hoja "BAJAR y
# agregar" del Excel de JC no trae los titulos como texto -solo las URL, con una CAPTURA del
# visor pegada debajo de cada una-, asi que se leyeron de esas capturas, una por una. Las
# capturas son ademas la miniatura de la tarjeta, reducidas a 400 px.
#
# DECISIONES QUE TOMAMOS Y JC VALIDA (backlog 116):
#  (a) Cada tarjeta LLEVA AL VISOR DEL ORGANISMO, en otra pestaña (`externo`). Ninguna de estas
#      capas esta ingestada todavia, asi que la alternativa era dejar las trece apagadas con
#      "Próximamente" y el area no serviria para nada. Linkear no es publicar material de
#      terceros: no incrusta, no copia y no toca la cuestion de licencias que sigue abierta con
#      los geoservicios del INTA ("son publicos, pero este tipo de acceso no", 22-oct-2026).
#  (b) Las tarjetas van en TRES bloques por organismo -INTA, CONAE e INDEC- porque es como JC
#      agrupa el Excel (el escribe "MAPAS INDEC (NACIONALES CON OPCIONES DEPARTAMENTALES)" como
#      titulo de ese grupo) y porque el mismo lo resume asi: "salvo el de Poblacion, la mayoria
#      son de INTA".
#  (c) Las cuatro capas del visor del INTA llevan en `detalle` DONDE esta la capa dentro del
#      visor ("Agua > Cuencas"), porque el link abre el visor en tu encuadre pero con sus capas
#      por defecto: sin esa indicacion el usuario no encuentra el mapa de la captura.
#  (d) Los dos servicios WMS/WFS de GeoNode INDEC ("POR FAVOR VER QUE ES ESTO") NO estan: no son
#      un mapa con titulo. Quedan en el catalogo de fuentes como "a evaluar".
id: tablero-mapas-ingreso
tipo: tablero
familia: agroclima
seccion: mapas

titulo: "Mapas"
subtitulo: "Provincia de Santiago del Estero · visores y capas de los organismos"
breadcrumb: "Mapas - Provincia - Acceso a visores y capas"

# Sin banda de KPIs, como la portada de AgroClima: del titulo directo a las tarjetas.
indicadores: []

paneles:
  alto: fluye
  disposicion: columnas
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}

  accesos-inta-visor:
    titulo: "INTA · Visor de mapas"
    subtitulo: "Cada tarjeta abre el visor del INTA en el encuadre de la provincia; la capa se prende en el menú de la izquierda"
    pie: "Fuente: INTA - Instituto Nacional de Tecnología Agropecuaria"
    tarjetas:
      - organismo: "INTA"
        titulo: "Cuencas hídricas del noroeste Argentino"
        detalle: "Visor INTA · Agua > Cuencas"
        externo: "https://visor.inta.gob.ar/es#5.45/-25.045/-65.584"
        miniatura: imagen
        imagen: mapas/ingreso/cuencas-hidricas-noa.png
      - organismo: "INTA"
        titulo: "Cursos de Agua Noroeste Argentino"
        detalle: "Visor INTA · Agua > Red de drenaje"
        externo: "https://visor.inta.gob.ar/es#6.38/-25.739/-66.292"
        miniatura: imagen
        imagen: mapas/ingreso/cursos-de-agua-noa.png
      - organismo: "INTA"
        titulo: "Areas ganaderas deforestadas durante 2008-2017"
        detalle: "Visor INTA · Ganadería"
        externo: "https://visor.inta.gob.ar/es#6.49/-26.617/-65.338"
        miniatura: imagen
        imagen: mapas/ingreso/areas-ganaderas-deforestadas.png
      - organismo: "INTA"
        titulo: "Cobertura del suelo de la Republica Argentina. Año 2006-2007 (LCCS-FAO)"
        detalle: "Visor INTA · Ordenamiento Territorial > Uso y cobertura"
        externo: "https://visor.inta.gob.ar/es#7.68/-26.549/-64.776"
        miniatura: imagen
        imagen: mapas/ingreso/cobertura-del-suelo-lccs-fao.png

  accesos-inta-catalogo:
    titulo: "INTA · Catálogo de datos"
    subtitulo: "Fichas del catálogo del INTA, con el mapa y sus metadatos"
    pie: "Fuente: INTA - Instituto Nacional de Tecnología Agropecuaria"
    tarjetas:
      - organismo: "INTA"
        titulo: "Aptitud de Tierras"
        externo: "https://geo-nodo02.inta.gob.ar/catalogue/#/dataset/140"
        miniatura: imagen
        imagen: mapas/ingreso/aptitud-de-tierras.png
      - organismo: "INTA"
        titulo: "Suelo Santiago del Estero"
        detalle: "Escala 1:500.000"
        bajada: "Mapa de suelos de la provincia. Fuente de la ficha: Angueira C., 2007."
        externo: "https://geo-nodo02.inta.gob.ar/catalogue/#/dataset/135"
        miniatura: imagen
        imagen: mapas/ingreso/suelo-santiago-del-estero.png
      - organismo: "INTA"
        titulo: "Zonificación del Uso del Suelo"
        bajada: "Elaborada en el marco de la Ley provincial 6.841, de ordenamiento de las áreas forestales."
        externo: "https://geo-nodo02.inta.gob.ar/catalogue/#/dataset/59"
        miniatura: imagen
        imagen: mapas/ingreso/zonificacion-uso-del-suelo.png
      - organismo: "INTA"
        titulo: "Ordenamiento Territorial de Bosques Nativos (actualización 2015)"
        # La interpretacion es de JC, literal (celda D214 del Excel). Es la unica que escribio
        # y la publica el sitio porque sin ella el semaforo no se entiende.
        bajada: >
          Zona roja: no se puede alterar el ecosistema (desmontar, etc.). Amarilla: explotación
          bajo determinadas condiciones. Verde: libre disponibilidad. Ley 6942, actualización
          2015.
        externo: "https://geo-nodo02.inta.gob.ar/catalogue/#/dataset/11"
        miniatura: imagen
        imagen: mapas/ingreso/ordenamiento-bosques-nativos.png

  accesos-conae:
    titulo: "CONAE"
    pie: "Fuente: CONAE - Comisión Nacional de Actividades Espaciales"
    tarjetas:
      - organismo: "CONAE"
        titulo: "Cobertura bosque nativo Argentina 2020"
        detalle: "GEOVisor general · Cobertura de bosques"
        externo: "https://geoportal.conae.gov.ar/mapstore/#/viewer/openlayers/geoportal"
        miniatura: imagen
        imagen: mapas/ingreso/cobertura-bosque-nativo-2020.png

  accesos-indec:
    # El titulo es el que JC escribe sobre ese grupo en el Excel (celda G217).
    titulo: "INDEC · Mapas nacionales con apertura departamental"
    subtitulo: "Portal geoestadístico del INDEC · todos permiten descargar los geodatos"
    pie: "Fuente: INDEC - Instituto Nacional de Estadística y Censos"
    tarjetas:
      - organismo: "INDEC"
        titulo: "Población total por departamento"
        externo: "https://portalgeoestadistico.indec.gob.ar/?indicator_id=93&members=108,34"
        miniatura: imagen
        imagen: mapas/ingreso/poblacion-total.png
      - organismo: "INDEC"
        titulo: "Viviendas particulares por departamento"
        externo: "https://portalgeoestadistico.indec.gob.ar/?indicator_id=166&members=108"
        miniatura: imagen
        imagen: mapas/ingreso/viviendas-particulares.png
      - organismo: "INDEC"
        titulo: "Densidad de población por departamento"
        externo: "https://portalgeoestadistico.indec.gob.ar/?indicator_id=96&members=108"
        miniatura: imagen
        imagen: mapas/ingreso/densidad-de-poblacion.png
      - organismo: "INDEC"
        titulo: "Parajes por provincia"
        externo: "https://portalgeoestadistico.indec.gob.ar/?indicator_id=92&members=108,34"
        miniatura: imagen
        imagen: mapas/ingreso/parajes.png

  orden:
    - {id: accesos-inta-visor, ancho: 6, columna: izq}
    - {id: accesos-inta-catalogo, ancho: 6, columna: der}
    - {id: accesos-conae, ancho: 6, columna: izq}
    - {id: accesos-indec, ancho: 6, columna: der}

filtros: []
