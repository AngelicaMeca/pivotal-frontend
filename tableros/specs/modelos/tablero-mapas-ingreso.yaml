# Mapas · portada del area ("area de ingreso" que pidio JC el 15-nov-2026, punto 3.b).
#
# Texto de JC: "MAPAS: Con el mismo formato de 'Agroclima' hacemos un area de 'ingreso' con los
# titulos de los mapas que envie el link. Ahi esta la fuente, que salvo el de Poblacion, la
# mayoria son de INTA".
#
# Que es: la puerta de entrada al material geoespacial de terceros. Mismo mecanismo que la
# portada de AgroClima (`accesos-*`): tarjetas con miniatura, organismo y titulo. No tiene
# datos propios.
#
# DE DONDE SALE CADA TITULO Y CADA MINIATURA: configs/dims/mapas-ingreso.yaml. La hoja "BAJAR y
# agregar" del Excel de JC no trae los titulos como texto -solo las URL, con una CAPTURA del
# visor pegada debajo de cada una-, asi que se leyeron de esas capturas, una por una. Las
# capturas son ademas la miniatura de la tarjeta, reducidas a 400 px.
#
# DECISIONES QUE TOMAMOS Y JC VALIDA (backlog 116):
#  (a) Cada tarjeta LLEVA AL VISOR DEL ORGANISMO, en otra pestaña (`externo`). Ninguna de estas
#      capas esta ingestada todavia, asi que la alternativa era dejar las trece apagadas con
#      "Próximamente" y el area no serviria para nada. Linkear no es publicar material de
#      terceros: no incrusta, no copia y no toca la cuestion de licencias que sigue abierta con
#      los geoservicios del INTA ("son publicos, pero este tipo de acceso no", 22-oct-2026).
#  (b) Las tarjetas van en TRES bloques por organismo -INTA, CONAE e INDEC- porque es como JC
#      agrupa el Excel (el escribe "MAPAS INDEC (NACIONALES CON OPCIONES DEPARTAMENTALES)" como
#      titulo de ese grupo) y porque el mismo lo resume asi: "salvo el de Poblacion, la mayoria
#      son de INTA".
#  (c) Las cuatro capas del visor del INTA llevan en `detalle` DONDE esta la capa dentro del
#      visor ("Agua > Cuencas"), porque el link abre el visor en tu encuadre pero con sus capas
#      por defecto: sin esa indicacion el usuario no encuentra el mapa de la captura.
#  (d) Los dos servicios WMS/WFS de GeoNode INDEC ("POR FAVOR VER QUE ES ESTO") NO estan: no son
#      un mapa con titulo. Quedan en el catalogo de fuentes como "a evaluar".
#
# QUE LE PASO A ESTA PORTADA EN EL QA DE FRANCISCO DEL 20-nov-2026 (backlog 137 a 140). Probo
# las seis tarjetas que abren un visor de un organismo y tres mentian. No era un problema de
# como estan hechas las tarjetas: era que el visor del organismo no muestra lo que la tarjeta
# promete. Lo que quedo:
#  (e) SALIO LA TARJETA DE LA CONAE ("Cobertura bosque nativo Argentina 2020"). El GEOVisor
#      abre el visor general, con el pais entero, sin la capa de bosque cargada y pidiendo
#      aceptar cookies: es exactamente lo que JC objeto el 18-nov ("LLEVA AL VISOR GENERAL").
#      Se busco como abrirlo en la capa y no se puede: el listado de mapas de su MapStore
#      (`/mapstore/rest/geostore/extjs/search/category/MAP`) vuelve VACIO, asi que no hay un
#      mapa con id al que linkear, y su GeoServer
#      (`geoportal.conae.gov.ar/geoserver/ows`) publica 70 capas que son todas mosaicos
#      SAOCOM: no esta el bosque nativo, asi que tampoco hay de donde bajarla. Con las tres
#      opciones de JC agotadas -visor propio, visor embebido, sacarlo- queda la tercera: "SI NO
#      SE PUEDE, ELIMINAMOS TODO". La fuente sigue en el catalogo, no publicada, con la
#      medicion escrita, y la decision vuelve a el (backlog 140).
#  (f) PARAJES pasa a nuestro visor y la tarjeta se muda al bloque de lo propio (ver su
#      comentario, mas abajo).
#  (g) VIVIENDAS abria el indicador equivocado y se corrigio el numero.
#  (h) LO QUE NO SE PUDO ARREGLAR: los tres visores del INDEC abren con el PAIS entero y con un
#      aviso legal que hay que aceptar cada vez. No es algo que podamos pasarle por la URL: su
#      portal acepta un parametro `filter` para arrancar en una provincia, pero el codigo del
#      propio portal solo lo aplica si su configuracion declara un nivel de desagregacion "0" y
#      hoy los cinco niveles lo traen VACIO, asi que el parametro no hace nada (leido en
#      `portalgeoestadistico.indec.gob.ar/js/core.js`, funcion `build_geoportal`). La unica
#      forma de que estos tres mapas abran en Santiago del Estero es dibujarlos nosotros: el
#      dato por departamento esta en la API publica del INDEC. Propuesto en el backlog 141.
id: tablero-mapas-ingreso
tipo: tablero
familia: agroclima
seccion: mapas

titulo: "Mapas"
subtitulo: "Provincia de Santiago del Estero · mapas propios y visores departamentales de los organismos"
breadcrumb: "Mapas - Provincia - Acceso a visores y capas"

# Sin banda de KPIs, como la portada de AgroClima: del titulo directo a las tarjetas.
indicadores: []

paneles:
  alto: fluye
  disposicion: columnas
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}

  # ---------------------------------------------------------------------------
  # LOS OCHO ACCESOS DEL INTA SALIERON DE ACA el 18-nov-2026, por pedido de JC (comentario en
  # la tarea 1220512131004640), textual: "JAMAS DIJE QUE PONGAMOS LINKS EXTERNOS AL RESTO DE
  # LOS MAPAS... la idea es QUE ESTEN DENTRO DE AGRIFOOD!!!! Nunca pusimos links externos a
  # nada, por ende, no se porque se hizo en este caso. La idea era BAJAR LAS CAPAS Y PONER
  # NUESTRO PROPIO VISOR, SI NO SE PUEDE, ELIMINAMOS TODO."
  #
  # SEIS de las ocho ya estan adentro, en dos paginas nuestras, con las capas bajadas por el
  # WFS del INTA y dibujadas en nuestro mapa con la leyenda del propio INTA:
  #   - "Suelos y uso del suelo" (tablero-mapas-suelos.yaml): aptitud de tierras, zonificacion
  #     del uso del suelo, cobertura del suelo 2006-2007 y areas ganaderas deforestadas.
  #   - "Cuencas y cursos de agua" (tablero-mapas-agua.yaml): cuencas hidricas y cursos de agua.
  #
  # De las DOS que faltan, ninguna es un problema tecnico nuestro: "Suelo Santiago del Estero"
  # se baja y se transforma bien pero espera que JC decida su leyenda (son 81 unidades
  # cartograficas), y el "Ordenamiento Territorial de Bosques Nativos" el INTA NO lo publica en
  # su servicio, asi que no hay de donde bajarlo. Ninguna de las dos queda como link externo,
  # que es justo lo que JC pidio sacar. Todo medido y escrito en configs/dims/capas-inta.yaml y
  # preguntado en el backlog 129.
  #
  # Las tarjetas del INDEC y de la CONAE se quedan: esas NO son links externos, abren el visor
  # del organismo EMBEBIDO adentro del sitio, que es el propio piso que puso JC en el mismo
  # comentario ("Si hay algun impedimento en la descarga de las capas, al menos hagamos como
  # estan los mapas de poblacion del INDEC").
  #
  # El panel de ACCESO a lo nuestro es el primero, porque es lo unico de esta portada que no
  # sale del sitio.
  accesos-propios:
    titulo: "Mapas de B³ AgriFood"
    subtitulo: "Dibujados dentro del sitio, sobre la división departamental y con zoom"
    pie: "Fuente: INTA - Aptitud de Tierras, Zonificación del Uso del Suelo, Cobertura del Suelo 2006-2007, Áreas Ganaderas Deforestadas 2008-2017, Cuencas Hídricas del NOA y Cursos de Agua del NOA · IGN - BAHRA (dato del INDEC)"
    tarjetas:
      - organismo: "B³ AgriFood"
        titulo: "Suelos y uso del suelo"
        detalle: "Aptitud, zonificación, cobertura del suelo y áreas deforestadas (INTA)"
        bajada: >
          Cuatro capas del INTA dibujadas en el mapa de la provincia, con sus clases y sus
          colores oficiales: para qué sirve cada tierra, cómo está zonificado su uso, qué
          cubría el suelo en 2006-2007 y qué se desmontó entre 2008 y 2017. Se prenden y se
          apagan, y el mapa se acerca con la rueda del mouse.
        destino: tablero-mapas-suelos
        miniatura: imagen
        imagen: mapas/ingreso/aptitud-de-tierras.png

      - organismo: "B³ AgriFood"
        titulo: "Cuencas y cursos de agua"
        detalle: "Cuencas hídricas y cursos de agua del NOA (INTA)"
        bajada: >
          Las macrocuencas y los cursos de agua del noroeste, recortados a la provincia y
          dibujados en el mapa. Se prenden y se apagan por separado, y el mapa se acerca con
          la rueda del mouse.
        destino: tablero-mapas-agua
        miniatura: imagenes
        imagenes: [mapas/ingreso/cuencas-hidricas-noa.png, mapas/ingreso/cursos-de-agua-noa.png]

      # PARAJES: la tarjeta pasa de "visor del INDEC" a NUESTRO visor (QA de Francisco del
      # 20-nov-2026, M1). Abria el portal del INDEC en "Poblacion total, por sexo, segun
      # jurisdiccion" -el indicador 92 es ese- y en el catalogo de 456 indicadores de ese
      # portal no hay ninguno de parajes, asi que la tarjeta prometia algo que el visor del
      # organismo no puede mostrar. La capa del IGN ya estaba bajada (1.022 parajes), asi que
      # se publica en el mapa de Infraestructura, que es donde JC quiere usarla: "CRUZAR CON
      # RED TERCIARIA Y RUTAS". El titulo sigue siendo el de su Excel.
      - organismo: "B³ AgriFood"
        titulo: "Parajes por provincia"
        detalle: "Capa del IGN en nuestro visor, sobre la red vial (Infraestructura)"
        bajada: >
          Los 1.022 parajes de la provincia que releva el IGN, dibujados en el mapa de
          Infraestructura y por lo tanto sobre las rutas, los caminos rurales y el tendido
          eléctrico: se prende la capa "Parajes" y cada punto dice su nombre al pasar el
          mouse. Es el paso previo a medir a qué distancia del pavimento queda cada paraje.
        destino: tablero-infraestructura-y-riesgo
        miniatura: imagen
        imagen: mapas/ingreso/parajes.png

  accesos-indec:
    # El titulo es el que JC escribe sobre ese grupo en el Excel (celda G217).
    titulo: "INDEC · Mapas nacionales con apertura departamental"
    # La segunda mitad del subtitulo es del QA del 20-nov-2026 (M4): el portal del INDEC abre
    # con el pais entero y con su aviso legal, y no acepta que le pasemos la provincia por la
    # URL. Mientras los tres mapas sean del visor del organismo, se avisa antes de abrirlo en
    # vez de dejar que el visitante crea que el mapa salio mal.
    subtitulo: "Portal geoestadístico del INDEC · abre con el país entero: acerque el mapa a Santiago del Estero · todos permiten descargar los geodatos"
    pie: "Fuente: INDEC - Instituto Nacional de Estadística y Censos"
    tarjetas:
      - organismo: "INDEC"
        titulo: "Población total por departamento"
        externo: "https://portalgeoestadistico.indec.gob.ar/?indicator_id=93&members=108,34"
        miniatura: imagen
        imagen: mapas/ingreso/poblacion-total.png
      # EL INDICADOR CORREGIDO (QA de Francisco del 20-nov-2026, M3). Con el 166 el visor abria
      # "Poblacion en viviendas particulares por departamento", que es POBLACION y no cantidad
      # de viviendas. El que corresponde al titulo de la tarjeta es el 34, "Viviendas
      # particulares, por departamento, partido o comuna", verificado contra el catalogo del
      # propio INDEC (datosestadisticos.indec.gob.ar/api/v1/indicator/34, publicado: true).
      - organismo: "INDEC"
        titulo: "Viviendas particulares por departamento"
        externo: "https://portalgeoestadistico.indec.gob.ar/?indicator_id=34&members=108"
        miniatura: imagen
        imagen: mapas/ingreso/viviendas-particulares.png
      - organismo: "INDEC"
        titulo: "Densidad de población por departamento"
        externo: "https://portalgeoestadistico.indec.gob.ar/?indicator_id=96&members=108"
        miniatura: imagen
        imagen: mapas/ingreso/densidad-de-poblacion.png
  # Las tres tarjetas de lo nuestro arriba y las tres del INDEC abajo. Eran dos bandas con la
  # de la CONAE al costado, que salio el 20-nov-2026.
  orden:
    - {id: accesos-propios, ancho: 12, columna: izq}
    - {id: accesos-indec, ancho: 12, columna: izq, nueva_banda: true}

filtros: []
