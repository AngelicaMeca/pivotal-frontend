# JC f48-f77 (cuadro de movimientos por departamento de origen) y f79: "HACER RANKING POR
# DEPARTAMENTO". El % del total ya lo trae calculado en su columna M.
base: 85
slug: ranking-departamento-origen
comunes: _comunes-base-85

titulo: "Ranking de departamentos por hacienda movida"
subtitulo: "Cabezas que salen de cada departamento, en el año seleccionado"

protocolo: _protocolo-presentacion
titulo_componentes:
  variable: {desde_filtro: medida}
  sujeto: {desde: subsector}
  recorte: {desde_universo: true}
  apertura: departamento
  area: provincia
  periodo: {desde_filtro: anio}
titulo_protocolo_ejemplo: "Ranking de cabezas movidas de la hacienda bovina (sin introducción) por departamento - Santiago del Estero - año 2025"

tipo: ranking

variables: [cabezas, documentos]
dimensiones: [departamento]
filtros: [anio, medida, categoria]
orden: {por: cabezas, dir: desc}

defaults:
  anio: parametros.ventana_anios.anio_por_defecto
  medida: cabezas
  categoria: Total

opciones_medida: [cabezas, documentos]
opciones_categoria: [Total, Terneros, Terneras, Novillitos, Novillos,
                     "Toritos / mejoradores", Toros, Vacas, Vaquillonas]

universo:
  ambito: sde
  recorte: totales_sin_introduccion
  especie: bovinos
  geo: origen                     # el departamento del ranking es el de ORIGEN del movimiento
  nivel_geo: departamento
  anios: ventana_anios
  excluye_anio_en_curso: true

columnas_tabla:
  - {campo: puesto, etiqueta: "Puesto", formato: "1°"}
  - {campo: departamento, etiqueta: "Departamento"}
  - {campo: documentos, etiqueta: "DTE emitidos"}
  - {campo: cabezas, etiqueta: "Cabezas movidas"}
  - {campo: participacion_provincial_pct, etiqueta: "% de la provincia"}
  - {campo: variacion_interanual_pct, etiqueta: "Var. vs año anterior"}

transformaciones:
  - ranking:
      particion: "anio + medida + categoria"
      ordenado_por: cabezas
      direccion: desc
      calculado_en: marts
  - participacion_geografica_pct:
      denominador: "total provincial del mismo año, recorte y categoría"
  - variacion_interanual: {sobre: [cabezas, documentos]}

filtros_calidad: [excluir-fila-total-al-pie, bubalinos-fuera-de-las-vistas]
notas_metodologicas: [que-es-un-dte, sin-introduccion, anio-en-curso]

fuente:
  pie: "Fuente: SENASA"
  organismo_esperado: "SENASA"
estado: publicada

origen: {tipo: modelo-analisis, detalle: "hoja 'Modelo Analisis' base 85, filas 48 a 81", fecha: 2026-07-31}
nota_interpretacion: >
  Verificado contra JC (f50-f76): Moreno 2.915 DTE y 129.256 cabezas, Robles 2.858 y 116.421,
  Jimenez 2.578 y 98.994. Exactos, los 27 departamentos.
  Ojo con una diferencia de criterio que hay que respetar: el ranking se arma sobre el
  departamento de ORIGEN, con el universo "sin introduccion". Si se armara sobre el archivo
  entero, los departamentos apareceran tambien como destino de la hacienda que entra de otras
  provincias y el numero dejaria de ser "cuanto mueve este departamento".
  JC f81 pide variaciones: van en la columna de la tabla, no en el grafico de barras.
