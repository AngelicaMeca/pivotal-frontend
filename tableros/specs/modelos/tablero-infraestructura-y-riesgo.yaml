# General > Infraestructura > Redes viales y tendido electrico (PORTADA de la seccion).
#
# HISTORIA DE ESTA PAGINA, que explica por que esta como esta:
#  - 14-oct-2026 (JC, WhatsApp, backlog 104): "Rutas provinciales, nacionales y caminos rurales
#    (Red vial primaria, secundaria y terciaria); Tendidos ferroviarios; Amenazas
#    hidrometeorologicas", del catalogo Capas SIG del IGN. Se construyo sin maqueta suya.
#  - 16-oct-2026 (JC, "REVISION AGRICULTURA AL 16 OCT.docx"): "NUNCA PASE MAQUETA DE GENERAL
#    AUN!!!" y "SACAR COMPLETO ESO DE RIESGO HIDROLOGICO". La seccion se despublico el 20-oct.
#  - 15-nov-2026 (JC, comentario en Asana, punto 3.a INFRAESTRUCTURA): "Van los mapas de Redes
#    viales (primaria, secundaria y terciaria) y el de tendido electrico. [...] La fuente es
#    IGN, salvo el de tendido electrico que es Secretaria de Energia". JC PIDE ahora
#    explicitamente las redes viales, asi que la pagina vuelve a publicarse.
#
# QUE CAMBIO AL REPUBLICARLA (17-nov-2026), y queda para que JC lo valide (backlog 115):
#  (a) La seccion se llama "Infraestructura" y NO "Infraestructura y riesgo": lo de riesgo lo
#      mando sacar el 16-oct y no lo volvio a pedir. La pagina de amenazas sigue
#      `no-publicada` (tablero-infraestructura-amenazas.yaml).
#  (b) Entra el TENDIDO ELECTRICO, que es la otra mitad de su pedido del 15-nov. No es del IGN:
#      es del Consejo Federal de la Energia Electrica con datos de EDESE
#      (configs/dims/capas-energia.yaml). Suma un KPI, una capa del mapa y su tabla de km.
#  (c) El FERROCARRIL se queda, aunque el 15-nov no lo nombre: lo pidio el 08-oct ("Ferroviario
#      (tendidos y estaciones)") y nunca lo retiro; lo unico que mando sacar fue riesgo. Esta
#      construido y verificado. Si quiere la pagina solo con viales y tendido, se saca el KPI
#      y la capa y queda igual de coherente.
#  (d) EL MAPA OCUPA TODA LA PAGINA Y TIENE ZOOM REAL, que es el resto de su pedido del 15-nov:
#      "SOLO PONEMOS COMO TITULO 'infraestructura' y que el mapa ocupe toda la pagina pudiendo
#      hacer zoom al maximo. Que el usuario pueda agregar o quitar capas. QUE SE VEA LA DIVISION
#      DEPARTAMENTAL Y LAS PRINCIPALES CIUDADES/PUEBLOS". Con eso:
#       - El mapa pasa a `ancho: 12` y `zoom: true` (rueda, doble clic, pellizco y arrastre,
#         hasta 40x; el gesto es el de los mapas de AgroClima, ver `cliente/gesto-zoom.js`).
#       - SALIERON LAS TRES TABLAS DE KM (red vial por calzada, ferrocarril por estado y tendido
#         por nivel). Estaban construidas y verificadas, y no se borro nada: sus armadores
#         siguen en el pipeline (`PANELES_RED_VIAL` de site_build.py) y el texto de los tres
#         cuadros esta en el historial de este archivo (commit del 17-nov-2026). Volver a
#         ponerlas es declararlas en `paneles` y en `paneles.orden`. Se sacaron porque con una
#         columna de tablas al costado el mapa se queda con poco mas de la mitad de la pagina,
#         que es justo lo contrario de lo que pide.
#       - Entra la capa de CIUDADES Y PUEBLOS (BAHRA del IGN), con el nombre escrito al lado
#         de cada punto. OJO: JC pide "LAS PRINCIPALES" y la fuente no permite elegirlas (no
#         trae poblacion ni jerarquia), asi que van las 165 y el mapa esconde los nombres que
#         se encimarian, que aparecen al acercar. Avisado en
#         configs/dims/capas-ign.yaml -> advertencias_para_jc.
#       - La DIVISION DEPARTAMENTAL ya se veia (los departamentos son el fondo del mapa) y
#         sigue con sus nombres escritos.
#       - La banda de KPIs se queda: es el cromo de toda pagina del sitio, va ARRIBA del mapa y
#         no le saca ancho. Si JC quiere la pagina con el mapa y nada mas, es `indicadores: []`.
#
# Lo que cuenta la pagina: un mapa grande de la provincia con los departamentos de fondo NEUTRO
# (no es un mapa de calor: el dato son las lineas) y las capas encima, con un control para
# prenderlas y apagarlas; al costado, cuanta red hay y de que calzada, cuanto ferrocarril queda
# activo y cuanta linea electrica hay por nivel. Los km los calcula el build (haversine sobre
# el trazado recortado, ver la nota `km-de-red`), nunca el navegador.
#
# Decisiones de la usuaria (14-oct-2026): la seccion es nueva Y las capas tambien se prenden
# sobre los mapas que ya existen; la red terciaria se publica COMPLETA (apagada al abrir: su
# archivo de 2 MB se baja recien al prenderla). El tendido electrico (3,6 MB) va igual.
#
# OBSERVACIONES DE JC SOBRE EL MAPA DE "PARAJES" (registradas el 27-nov-2026, backlog 142).
# Lo que la portada de Mapas llamaba "Parajes por provincia" ES ESTE MAPA, y JC dice que esta
# mal nombrado: "el objeto central es la RED VIAL, no los parajes" y "va en INFRAESTRUCTURA".
# Lo que cambia en este spec, punto por punto (numeracion de JC):
#  1. La tarjeta sale de la portada de Mapas (tablero-mapas-ingreso.yaml) y el mapa pasa a
#     llamarse por la red vial: titulo del cuadro "Red vial de Santiago del Estero" (ver
#     `mapa-capas.titulo`). Los parajes siguen siendo una capa mas de este mapa, apagada.
#  2. Ferrocarril y estaciones ARRANCAN APAGADOS (`prendida: false`).
#  3. y 6. Colores: cada categoria vial con su tono y los caminos rurales en otro color. Viven
#     en _protocolo-presentacion.yaml (`colores.capas_de_contexto`), como todo color de dato.
#  4. Tendido: un color por nivel de tension. Mismo lugar.
#  5. "No se deben poder marcar todas las variables juntas, solo las relacionadas": regla
#     general, en `mapa-capas.compatibilidad_de_capas` y en doctrina-jc.md (seccion 11).
#  7. Ferrocarril y estaciones: solo lo OPERATIVO (`solo:` en cada capa). El atributo es `fun`
#     del IGN (dominio 2 Abandonado, 4 Desmantelado, 6 Activo, 9 En construccion), que
#     pipeline/capas_ign.py ya traduce a `estado`. Quedan 12 de 26 tramos y 5 de 89 estaciones.
#  8. Mapa mas grande y con mas zoom (`alto_mapa` y `zoom_maximo` en `paneles.orden`).
id: tablero-infraestructura-y-riesgo
tipo: tablero
familia: capas-ign
estado: publicada
seccion: infraestructura

titulo: "Infraestructura"
# La bajada arranca por la red vial, que es el objeto central del mapa (JC, 27-nov-2026, punto
# 1), y dice "ferrocarril operativo" porque es lo unico que se publica (punto 7).
subtitulo: "Provincia de Santiago del Estero · red vial, con el ferrocarril operativo, el tendido eléctrico de media tensión, las ciudades y los parajes"
# La miga es solo "Infraestructura": el item "General" del que colgaba esta pagina DESAPARECIO
# el 17-nov-2026 por pedido de JC, y la seccion es ahora un titulo del menu de la izquierda.
breadcrumb: "Infraestructura"

# SIN BANDA DE INDICADORES (QA de Francisco del 19-nov-2026, defecto D1). Hasta el 19-nov esta
# pagina tenia cuatro tarjetas de kilometros (rutas nacionales, provinciales, caminos rurales y
# linea de media tension) y un segundo titulo arriba del mapa. Las dos cosas van ARRIBA del
# mapa, o sea que le sacan alto a lo unico que JC pidio: "SOLO PONEMOS COMO TITULO
# 'infraestructura' y que el mapa ocupe toda la pagina" (15-nov-2026). El "SOLO" es textual, y
# este archivo ya anticipaba el pedido: "Si JC quiere la pagina con el mapa y nada mas, es
# `indicadores: []`". Eso es lo que esta hecho.
#
# Los kilometros NO se perdieron: el mapa los sigue diciendo por departamento en el cartel de
# cada uno (RF25, `valores_por_departamento`), y sus armadores siguen en `PANELES_RED_VIAL`.
# Volver a poner la banda es volver a declarar las cuatro tarjetas aca.
indicadores: []
kpis_sin_variacion: true

# `km-de-red` salio con la banda de KPIs: explicaba como se miden kilometros que la pagina ya
# no publica. Y `tendido` se FUSIONO con `capas` el 20-nov-2026 (QA de Francisco): eran dos
# bloques de texto debajo del mapa y el segundo cerraba con "Los kilometros se miden igual que
# los de la red vial", una frase que remitia a `km-de-red`, o sea a un bloque que ya no esta.
# Ahora es una nota sola, que va DEBAJO del mapa (no le saca alto) y dice lo que hay que
# saberle al dato: de quien es cada capa, que el tendido no es del IGN y no sirve para ubicar
# un poste, y por que tres capas arrancan apagadas.
#
# NINGUNO de estos textos los escribio JC. Si los quiere afuera, se saca esta linea de las tres
# paginas de mapa propio. Preguntado en el backlog 137.
notas_metodologicas: [capas]

paneles:
  alto: fluye
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}
  mapa-capas:
    # TITULO DE LA RED VIAL (JC, 27-nov-2026, punto 1: lo que se llamaba "Parajes por
    # provincia" esta mal nombrado, "el objeto central es la RED VIAL"). Hasta el 27-nov este
    # cuadro iba sin titulo (QA del 19-nov-2026, D1) porque repetia la bajada; ahora dice otra
    # cosa que la bajada -nombra el objeto del mapa- y es el nombre con que la pagina se
    # reconoce desde que salio la tarjeta de la portada de Mapas. La miga y el titulo de la
    # pagina siguen siendo "Infraestructura", que es la regla de JC del 15-nov ("SOLO PONEMOS
    # COMO TITULO 'infraestructura'").
    # nota_interpretacion: JC pide "un titulo que hable de la red vial" para algo que vive en
    # Infraestructura. Se eligio lo mas simple -el titulo del cuadro del mapa- en vez de
    # renombrar la seccion o agregar una pagina. A confirmar (backlog 142).
    titulo: "Red vial de Santiago del Estero"
    subtitulo: "Acerque con la rueda del mouse y arrastre para desplazarse · active o desactive cada capa; pase el mouse por un trazo para ver qué es"
    # Las capas del mapa, en el orden en que se dibujan (la primera abajo). `prendida` es como
    # arranca la pagina. Las dos capas pesadas arrancan apagadas: los caminos rurales son
    # ~11.700 tramos y 2 MB, y el tendido ~29.500 polilineas y 3,6 MB.
    #
    # `solo:` (NUEVO, 27-nov-2026, JC punto 7: "eliminar red y estaciones desmanteladas/sin
    # servicio/etc.; dejar solo las OPERATIVAS actuales"). Es un filtro sobre las propiedades
    # del rasgo, con la misma forma que el `cuando` de los estilos: el rasgo se publica solo si
    # coincide. Se aplica en el BUILD (el archivo publicado ya no trae lo filtrado: no se baja
    # al navegador para esconderlo ahi), y el build corta si el filtro deja la capa vacia o si
    # nombra un valor que el dominio de la capa no tiene. Lo que sale es el estado `Activo` del
    # campo `fun` del IGN; "En construccion" (dominio 9) hoy no aparece en la provincia, y si
    # aparece tampoco se publica: no es operativo.
    # nota_interpretacion: "operativo" se toma como el `Activo` del IGN. El IGN no publica si
    # un ramal activo tiene hoy servicio de cargas o de pasajeros, ni la fecha de ese estado;
    # preguntado (backlog 142).
    capas:
      - {id: caminos-terciarios, prendida: false}
      - {id: tendido-media-tension, prendida: false}
      - {id: rutas-provinciales, prendida: true}
      - {id: rutas-nacionales, prendida: true}
      # Apagados al abrir (JC, 27-nov-2026, punto 2).
      - {id: ferrocarril, prendida: false, solo: {estado: [Activo]}}
      - {id: estaciones-ferrocarril, prendida: false, solo: {estado: [Activo]}}
      # Los PARAJES (1.022 puntos, QA del 20-nov-2026, M1): entran aca porque es lo que JC
      # quiere hacer con ellos -"CRUZAR CON RED TERCIARIA Y RUTAS"-, y el portal del INDEC no
      # tiene el indicador que la tarjeta de la portada prometia. Apagados al abrir: son mil
      # puntos y la pagina tiene que abrir mostrando las redes, que es lo que pidio.
      - {id: parajes, prendida: false}
      # Las ciudades y pueblos van ULTIMAS para que sus puntos y sus nombres queden sobre las
      # lineas, y PRENDIDAS: son la referencia que permite ubicarse al acercar.
      - {id: localidades, prendida: true}

    # QUE CAPAS SE PUEDEN VER JUNTAS (NUEVO, 27-nov-2026, JC punto 5). Regla general de JC:
    # "no se deben poder marcar todas las variables juntas, solo las relacionadas", y su caso
    # concreto: "lo ferroviario solo puede verse por separado o combinado unicamente con rutas
    # nacionales y provinciales". Queda en doctrina-jc.md (seccion 11) para cualquier mapa con
    # capas.
    #
    # Como se lee:
    #  - `referencia`: capas de UBICACION, no de dato; se combinan con cualquier cosa y no
    #    cuentan para la regla. Hoy solo las ciudades y pueblos, que JC pidio para poder leer
    #    el mapa ("QUE SE VEA LA DIVISION DEPARTAMENTAL Y LAS PRINCIPALES CIUDADES/PUEBLOS",
    #    15-nov-2026). La division departamental es el mapa base y tampoco cuenta.
    #  - `combinaciones`: cada una es un conjunto de capas RELACIONADAS. Un conjunto de capas
    #    prendidas es valido si, sacando las de referencia, entra entero en AL MENOS UNA
    #    combinacion. Una capa puede estar en varias (las rutas nacionales y provinciales estan
    #    en las tres: son la referencia vial de todo lo demas).
    #  - `al_prender_incompatible: apagar-las-otras`: tildar una capa que no entra con las que
    #    estan prendidas NO se bloquea (una casilla gris obliga al visitante a adivinar que
    #    destildar). La capa se prende y se apagan las que sobran: de las combinaciones que la
    #    contienen se elige la que conserva MAS capas de las ya prendidas (empate: la primera
    #    declarada) y se apagan las que no estan en ella. Determinista.
    #  - `aviso`: renglon que aparece un momento sobre el control cuando se apago algo, para
    #    que no parezca que la capa desaparecio sola. {capa} es la etiqueta de la que se
    #    prendio, {apagadas} la lista de las que se apagaron y {companeras} las otras capas de
    #    la combinacion elegida, todas con la `etiqueta` de su config. Lo compone el build.
    #  - El BUILD VALIDA: que toda capa de `capas` este en alguna combinacion o en
    #    `referencia`, que toda capa nombrada aca este en `capas`, y que las `prendida: true`
    #    formen un conjunto valido. Si no, corta la corrida.
    #
    # Las combinaciones de esta pagina:
    #  - red-vial: las tres redes y los parajes. Es el cruce que JC pidio con los parajes
    #    ("CRUZAR CON RED TERCIARIA Y RUTAS", nota de su Excel).
    #  - ferrocarril: tendido y estaciones con las rutas nacionales y provinciales, ni una mas
    #    (literal de JC).
    #  - tendido-electrico: el tendido con las rutas nacionales y provinciales, para ubicarse.
    # nota_interpretacion: JC solo dio la regla del ferrocarril. La del tendido (que no se
    # combine con caminos rurales, parajes ni ferrocarril) y la de los parajes (solo con la red
    # vial) son nuestras, con el criterio mas restrictivo que respeta "solo las relacionadas".
    # A confirmar con el, en especial si quiere ver parajes junto al tendido (backlog 142).
    compatibilidad_de_capas:
      referencia: [localidades]
      combinaciones:
        - id: red-vial
          capas: [rutas-nacionales, rutas-provinciales, caminos-terciarios, parajes]
        - id: ferrocarril
          capas: [ferrocarril, estaciones-ferrocarril, rutas-nacionales, rutas-provinciales]
        - id: tendido-electrico
          capas: [tendido-media-tension, rutas-nacionales, rutas-provinciales]
      al_prender_incompatible: apagar-las-otras
      # Redaccion neutra desde el 27-nov-2026: "se ve sola" no concordaba con las capas de
      # nombre masculino ("Tendido eléctrico... se ve sola"). Ajuste de constructor-dashboards
      # pedido junto con la tanda de JC (comentario en Asana) sobre la portada de Mapas.
      aviso: "Se apagó {apagadas}: {capa} se puede ver sin otras capas o junto a {companeras}."

  # Un solo cuadro a todo el ancho: el mapa ES la pagina.
  #
  # `zoom: true` es zoom real sobre la CARTOGRAFIA, no sobre los textos (JC, 15-nov-2026:
  # "pudiendo hacer zoom al maximo"; y el 16-oct: "EL ZOOM NO FUNCIONA COMO TAL, SOLO AUMENTA
  # LOS TEXTOS"). Rueda, doble clic, pellizco y arrastre, hasta 40 veces, que es lo que hace
  # util a la red terciaria: a la provincia entera es una maraña. El gesto es el mismo que el
  # de los mapas de AgroClima (`cliente/gesto-zoom.js`). Ademas le da al mapa el alto de la
  # pagina.
  orden:
    # `pais`: la casilla "Mostrar todo el pais", la misma que tienen Suelos y Cuencas
    # (pedido de la usuaria del 25-nov-2026, "quiero que en los 3 mapas se delimiten bien las
    # provincias y los departamentos de Santiago"). Aca la casilla va en la pildorita que
    # flota sobre el mapa, porque esta pagina es el titulo y el mapa y no lleva barra arriba.
    # Las capas del IGN que publica esta pagina son SOLO de la provincia: con el pais a la
    # vista se ven las 24 provincias con su nombre y las rutas siguen estando donde estan, que
    # es todo lo que hay publicado.
    #
    # MAS GRANDE Y CON MAS ZOOM (JC, 27-nov-2026, punto 8: "El mapa es muy chico: agrandarlo,
    # y permitir mas zoom"). Dos claves nuevas, que deciden el alto de la caja y el tope del
    # gesto (las dos leen el mismo panel de la pagina, como `zoom`):
    #  - `alto_mapa: pantalla`: la caja del mapa toma el alto de la ventana menos la cabecera
    #    del sitio y el titulo del cuadro, con un piso de 760 px (hoy es
    #    `max(640px, calc(100vh - 17rem))`, que en una pantalla de 908 px deja 716). Mantiene
    #    la regla de que el que ocupa la pagina es el MAPA, no la caja: sin deformar la
    #    provincia (doctrina-jc.md, seccion 3). `pantalla` es un valor con nombre para que el
    #    numero viva en un solo lugar (el CSS) y no en cada spec.
    #  - `zoom_maximo: 120`: veces el encuadre de la provincia (hoy el tope esta fijo en 40 en
    #    `cliente/capas.js`, `scaleLimit.max`). A 40x un camino rural todavia se lee como una
    #    maraña en los departamentos densos; 120x deja ver tramo por tramo. Es vector: acercar
    #    no pixela, asi que el tope solo lo pone la utilidad.
    # nota_interpretacion: "agrandarlo" se toma como mas alto, porque el ancho ya es el del
    # cuadro entero (12 columnas). Los numeros (760 px, 120x) son una propuesta; si JC lo sigue
    # viendo chico, se suben sin tocar codigo.
    - {id: mapa-capas, ancho: 12, zoom: true, pais: true, alto_mapa: pantalla, zoom_maximo: 120}

filtros: []
