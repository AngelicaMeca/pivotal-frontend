# Ganaderia > Bovinos > Movimientos. Hoja "GanBov DTE" de la maqueta "Maqueta Ganad VF"
# (9-oct-2026). Base 85.
#
# Lo que va por PROVINCIA de destino y de origen (dos tablas y dos anillos de su hoja) NO esta
# en esta pagina: es material reservado y vive en tablero-bovinos-movimientos-provincias
# (`reservado: true`), por decision del 12-oct-2026 ("déjalas en privado"). Por eso los KPIs
# tampoco nombran provincias: JC pone "Extracción a Santa Fe" e "Introducción de Chaco", y acá
# van los totales de extraccion e introduccion.
#
# La matriz origen-destino interna es otra pagina (85-matriz-od-interna) y se llega por el
# boton "Matrices Origen Destino (OD)" que JC dibuja en esta hoja.
id: tablero-bovinos-movimientos
tipo: tablero
familia: movimientos-bovinos
seccion: bovinos
pagina: movimientos
titulo_pagina: "Movimientos"

titulo: "Bovinos"
subtitulo: "Provincia de Santiago del Estero · movimientos de hacienda con DTE"

breadcrumb: "Ganadería - Bovinos - Provincia - {departamento}"

indicadores:
  - recorte: totales_sin_introduccion
    etiqueta: "Totales movidos"
  - recorte: internos
    etiqueta: "Movimientos internos"
  - recorte: extraccion
    etiqueta: "Extracción"
  - recorte: introduccion
    etiqueta: "Introducción"

paneles:
  alto: fluye
  # El boton de JC (cuadro de texto de la fila 14 y la flecha al pie de su hoja): lleva a la
  # matriz de movimientos internos departamento x departamento.
  acciones_de_tablero:
    - {id: matriz-od, etiqueta: "Matrices Origen Destino (OD)", vista: 85-matriz-od-interna, flecha: true}
  mapa:
    titulo: "Movimientos por departamento"
    rotulo_accion: "Seleccione departamento"
    # JC, celda E119: "Seleccionando un departamento del mapa lleva a página de datos (como en
    # agri)". Cambian los KPIs, las dos tablas de la serie y el anillo por categoria; la
    # introduccion de un departamento es la que ENTRO a el.
    click_departamento: en-la-misma-vista
    seleccion_departamento:
      defecto: provincia
      rotulo_provincia: "Provincia"
      rotulo_cambiar: "Seleccione otro departamento si desea visualizar"
      miga: "Dto {Departamento}"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  tabla-tipos:
    titulo: "Sgo. del Estero - Movimientos hacienda por tipo, categoría y DTE Totales provincia - años {desde} a {hasta}"
    nota: >
      La extracción es la diferencia entre los movimientos totales y los internos, como en la
      planilla de JC. Un DTE puede amparar animales de varias categorías: los documentos se
      cuentan una vez y no se abren por categoría.
  tabla-balance:
    titulo: "Sgo. del Estero - Balance de movimientos hacienda (extracción - introducción) por categoría y totales - años {desde} a {hasta}"
    # OJO: el titulo de JC dice "extracción - introducción", pero los numeros de su tabla son
    # introduccion - extraccion (2022: -168.296 el total, +64.676 terneros). Se publican sus
    # numeros y la nota dice como leerlos. Pregunta para JC: ¿se corrige el titulo o el signo?
    nota: >
      Un número negativo quiere decir que salieron de la provincia más cabezas de esa
      categoría que las que entraron; uno positivo, que entraron más.
  tabla-departamentos:
    titulo: "Sgo. del Estero - Movimientos hacienda por tipo, categoría y DTE por Departamento - año {anio}"
    rotulo_total: "PROVINCIA"
  anillo-categorias:
    titulo: "Sgo del Estero - Participación por categoría en movimientos totales año {anio}"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  anillo-departamentos:
    titulo: "Sgo del Estero - Participación de departamentos de origen en los movimientos totales año {anio}"
    cuantos: 5
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  # Disposicion en COLUMNAS (12-oct-2026, "reacomoda... para que no haya espacios vacios"):
  # cada banda tiene dos columnas que se apilan a su ritmo, como las hojas de JC (graficos a
  # la izquierda, tablas a la derecha). Las bandas agrupan cuadros de alto parecido; los
  # altos se midieron a 1600 px.
  disposicion: columnas
  orden:
    - {id: mapa, ancho: 4, columna: izq}
    - {id: tabla-tipos, ancho: 8, columna: der}
    - {id: anillo-categorias, ancho: 6, columna: fila}
    - {id: anillo-departamentos, ancho: 6, columna: fila}
    - {id: tabla-balance, ancho: 12}
    - {id: tabla-departamentos, ancho: 12}

filtros:
  - id: anio
    zona: periodo
