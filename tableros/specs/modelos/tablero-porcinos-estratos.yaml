# Ganaderia > Porcinos > Estratos y UP. Hoja "GanPorcESTR" de la maqueta "Maqueta Ganad VF"
# (9-oct-2026), base 91.
#
# JC la arma copiando la de ovinos ("EN ESTE CASO TODOS LOS VALORES NO SON REALES, CAMBIO DE
# FORMATO TOMADO DE OVINOS", celda E167): se usa la misma estructura con los datos reales de
# la base 91. Las UP de porcinos son los RENSPA de esta misma base, que es de donde salen las
# de la pagina de stocks.
#
# 13-oct-2026 (revision contra la maqueta): el mapa se titula "Estratos" y no lleva "Seleccione
# departamento" (no tiene clic y la hoja no lo pide); debajo, el texto de definiciones
# ESTRATO / ESTABLECIMIENTO / UP literal (filas 40-50) y UN solo anillo, el de cabezas (la
# hoja no tiene el de UP). La tabla grande no lleva la fila de la provincia (la copia de
# ovinos de JC no la tiene), la fila "Total X" va solo en los departamentos con mas de un
# estrato y entra entera a 1440 px (Cachorras incluida).
#
# 15-oct-2026 (pedido de la usuaria, toda ganaderia): el mapa de la provincia lleva los NOMBRES
# de los departamentos escritos (`paneles.mapa.rotulos_departamento`). DESVIO de la maqueta
# "Maqueta Ganad VF", que dibuja los mapas sin nombres (viven en el tooltip y en la tabla por
# departamento); es el mismo desvio que agricultura (backlog 68). Pregunta para JC en el
# backlog 110; se apaga borrando esa linea en tablero-porcinos, de donde esta pagina lo hereda
# (`igual_que`).
id: tablero-porcinos-estratos
igual_que: tablero-porcinos
pagina: estratos-y-up
titulo_pagina: "Estratos y UP"
# El stock por departamento viene desde 2017, pero los estratos son solo 2025.
periodo: estrato

breadcrumb: "Ganadería - Porcinos - Provincia - Estratos, Establecimientos y U.P."

paneles:
  mapa:
    titulo: "Estratos"
    click_departamento: null
    rotulo_accion: null
    fuente: "Fuente: SENASA"
  texto-definiciones:
    titulo: ""
    parrafos:
      - titulo: "ESTRATO"
        texto: "Rango de cabezas que clasifica el tamaño del establecimiento o la unidad productiva ganadera."
      - titulo: "ESTABLECIMIENTO"
        texto: "El espacio físico donde se desarrolla la actividad ganadera."
      - titulo: "UNIDAD PRODUCTIVA (UP)"
        texto: >
          Razón social (unipersonal o de cualquier tipo) que desarrolla la actividad ganadera
          dentro de un establecimiento. En un establecimiento puede existir más de una UP, por
          eso la cifra siempre es igual o mayor.
    fuente: "Fuente: SENASA"
  tabla-departamento-estratos:
    titulo: "Sgo. del Estero - Stocks porcinos por categoría, estrato, cantidad de Establecimientos y UP por departamento - año {anio}"
    encabezado_geo: "Departamento"
    encabezado_estrato: "Estrato"
    encabezado_total: "Total Porcinos"
    rotulo_total: "TOTAL PROV"
    total: "no"
    subtotal: varios
    columnas_extra:
      - {medida: establecimientos, encabezado: "Establ"}
      - {medida: renspas, encabezado: "UP"}
    fuente: "Fuente: SENASA"
    nota: >
      Las UP son los RENSPA registrados en cada estrato.
  anillo-estratos:
    titulo: "Sgo del Estero - Porcinos - Participación de los estratos en la cantidad de cabezas - año {anio}"
    fuente: "Fuente: SENASA"
  disposicion: columnas
  orden:
    - {id: mapa, ancho: 4, columna: izq}
    - {id: texto-definiciones, ancho: 4, columna: izq}
    - {id: anillo-estratos, ancho: 4, columna: izq}
    - {id: tabla-departamento-estratos, ancho: 8, columna: der, scroll_interno: true, compacta: true}
