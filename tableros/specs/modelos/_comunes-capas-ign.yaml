# Comunes de General > Infraestructura y riesgo (capas del IGN, pedido de JC del 14-oct-2026,
# backlog 104). Lo lee site_build.ContextoCapasIgn.
#
# Esto no sale de un Excel de JC ni pasa por raw/: son capas oficiales del Instituto Geografico
# Nacional bajadas por su WFS y recortadas a la provincia (configs/dims/capas-ign.yaml y
# configs/dims/capas-ign/). El sitio publica copias: no depende del servidor del IGN.
id: _comunes-capas-ign

presentacion:
  # El color lo fija el TIPO de variable (protocolo, `colores.rampas`). `registros_eventos` es
  # una rampa nueva, agregada el 14-oct-2026 para este mapa (backlog 106: JC la valida).
  tipos_de_variable:
    registros: registros_eventos

# Las citas al pie, una por fuente. Salen de configs/dims/capas-ign.yaml y
# configs/dims/capas-energia.yaml (procedencia).
fuentes:
  red_vial: "Fuente: IGN - Dirección Nacional de Vialidad, direcciones provinciales de vialidad y red vial terciaria (Capas SIG)"
  ferrocarril: "Fuente: IGN - Red ferroviaria (Capas SIG)"
  mapa_base: "Fuente: IGN - Límites departamentales"
  desinventar: "Fuente: IGN, base DESINVENTAR 1970-2015"
  sinagir: "Fuente: IGN, SINAGIR - PNRRD 2018-2023"
  # La licencia del tendido (CC BY 4.0) exige cita de fuente: el texto es el que declara
  # configs/dims/capas-energia.yaml en `licencia.atribucion`.
  tendido: "Fuente: Consejo Federal de la Energía Eléctrica - Secretaría de Energía, con datos de EDESE (CC BY 4.0)"

notas_metodologicas:
  km-de-red:
    titulo: "Cómo se miden los kilómetros"
    texto: >
      Los kilómetros se calculan sobre el trazado que publica el IGN, ya recortado al límite de
      la provincia: es la suma de la distancia sobre la superficie terrestre (fórmula del
      haversine, radio medio de 6.371 km) entre cada par de puntos consecutivos de cada tramo.
      No es la longitud oficial de cada ruta que informa Vialidad: un tramo compartido por dos
      rutas puede estar cargado dos veces, y un camino que sale y vuelve a entrar a la
      provincia cuenta solo lo que corre adentro. La red terciaria (caminos rurales) es la capa
      completa del IGN. Los kilómetros de línea eléctrica se calculan con la misma fórmula
      sobre el trazado del Consejo Federal de la Energía Eléctrica, también recortado al límite
      de la provincia.
  # UNA NOTA POR PAGINA, y cada una describe SUS capas (QA de Francisco del 19-nov-2026,
  # defecto D3). Antes habia una sola nota `capas-inta` compartida por las dos paginas de mapas
  # del INTA, escrita cuando Suelos tenia dos capas: decia "estos dos mapas" y describia la
  # aptitud de tierras, asi que la pagina de Cuencas y cursos de agua explicaba el mapa de otra
  # pagina y Suelos prometia dos capas de las cuatro que tiene.
  capas-inta-suelos:
    titulo: "Qué muestran estos cuatro mapas"
    texto: >
      Son cuatro capas del INTA, descargadas de sus geoservicios el 18 de noviembre de 2026 y
      publicadas acá como copia propia: el sitio no le pide nada al servidor del INTA al
      dibujarlas. "Aptitud de tierras" clasifica cada pedazo de la provincia por para qué
      sirve -agrícola, ganadera con su receptividad en hectáreas por unidad ganadera, agrícola
      ganadera, con riego, afloramientos rocosos, salinas, lagunas y embalses-;
      "Zonificación del uso del suelo" lo hace por zona de uso -forestal y ganadera, agrícola
      ganadera y forestal, bañados y áreas inundables, bosques de protección, áreas
      protegidas, urbana, con riego, salinas y lagunas saladas-; "Cobertura del suelo
      2006-2007" dice qué había sobre el terreno según el sistema de clasificación LCCS de la
      FAO -bosques, arbustales, pastizales, cultivos, suelo desnudo, agua-; y "Áreas ganaderas
      deforestadas 2008-2017" marca el desmonte relevado en esos diez años. Los nombres de las
      clases y sus colores son los que publica el INTA con cada capa, no una escala nuestra.
      Las tres primeras cubren la provincia entera, así que conviene mirarlas de una por vez:
      prendidas juntas, la de arriba tapa a la de abajo. La de áreas deforestadas es la única
      que se mira encima de otra: con la cobertura prendida debajo se lee qué había antes y
      qué se desmontó después. Dos cosas que el dato no puede: el catálogo del INTA no declara
      en qué año se relevó la aptitud ni la zonificación, y la cobertura es de 2006-2007, es
      decir que no describe el suelo de hoy. En el desmonte no se dibujan los parches de menos
      de una hectárea, que son el 63% de los parches y el 1% de la superficie desmontada.
  capas-inta-agua:
    titulo: "Qué muestran estos dos mapas"
    texto: >
      Son dos capas del INTA, descargadas de sus geoservicios el 18 de noviembre de 2026 y
      publicadas acá como copia propia: el sitio no le pide nada al servidor del INTA al
      dibujarlas. "Cuencas hídricas" divide el territorio por la cuenca a la que drena cada
      pedazo: en la provincia son las SEIS que lista la leyenda -Dulce, Dulce Superior,
      Juramento - Salado, Juramento Medio Inferior, Rosario Horcones - Urueña y Sin Aporte
      Significativo - Sureste de Salta-, con el nombre que les pone el INTA. Y "Cursos de
      agua" dibuja los ríos, arroyos y cañadas con el tipo que les pone la fuente.
      Las dos capas son de todo el Noroeste y se publican recortadas al límite de la
      provincia. Los nombres de las clases y sus colores son los que publica el INTA con cada
      capa, no una escala nuestra. Se pueden mirar juntas: las cuencas son áreas y los cursos
      son líneas, así que los ríos quedan dibujados encima de su cuenca. Una cosa que el dato
      no puede: el 4% de la superficie de la provincia no pertenece a ninguna cuenca en el
      propio dato del INTA, y ahí el mapa queda sin pintar.
  # UNA SOLA NOTA PARA INFRAESTRUCTURA (QA de Francisco del 20-nov-2026). Eran dos bloques de
  # texto debajo del mapa (`capas` y `tendido`) y el segundo cerraba con "Los kilómetros se
  # miden igual que los de la red vial", que remitía a la nota `km-de-red` que salió de esta
  # página el 19-nov con la banda de KPIs: una frase colgada que mandaba a un bloque que ya no
  # está. Las dos notas hablan de las capas del mismo mapa, así que son una, con el mismo
  # criterio que las dos páginas del INTA (una nota por página, y describe SUS capas).
  #
  # Ninguno de estos textos los escribió JC. Están porque es lo que hay que saberle al dato
  # (de quién es cada capa, qué exactitud tiene, por qué dos arrancan apagadas), y van DEBAJO
  # del mapa, así que no le sacan alto. Si él los quiere afuera, es sacar `notas_metodologicas`
  # del spec de cada una de las tres páginas. Preguntado en el backlog 137.
  capas:
    titulo: "Qué muestra el mapa"
    texto: >
      Las rutas, el ferrocarril, las estaciones, las ciudades y los parajes son capas del
      catálogo "Capas SIG" del IGN (apartados Transporte y Asentamientos), descargadas por sus
      servicios OGC. Lo pavimentado y lo activo va en trazo lleno; lo consolidado o de tierra,
      y lo abandonado o desmantelado, en trazo punteado. El tendido eléctrico no es del IGN:
      son las líneas de MEDIA TENSIÓN que publica el Consejo Federal de la Energía Eléctrica
      en el portal de datos abiertos de la Secretaría de Energía, con datos provistos por
      EDESE; esa fuente no declara su exactitud posicional, así que el mapa sirve para ver por
      dónde corre la red y no para ubicar un poste, y sus niveles de tensión se publican con
      el número que trae la fuente y sin unidad, porque ni el dataset ni su ficha de metadata
      documentan en qué unidad está ese campo. Los caminos rurales, el tendido eléctrico y los
      parajes están apagados al abrir la página porque son más de once mil, casi treinta mil y
      mil trazos o puntos: se cargan recién al prenderlos.
  desinventar:
    titulo: "Qué son los registros de DESINVENTAR"
    texto: >
      DESINVENTAR es un inventario de desastres armado sobre todo a partir de noticias de
      prensa: cada registro es un evento adverso de origen hidrometeorológico (una inundación,
      una tormenta, una sequía) que alguien informó en un departamento, entre 1970 y 2015. No
      mide la intensidad del evento ni el daño, y tiene subregistro: la propia metadata del IGN
      advierte que "nos brinda un contexto aproximado". Más registros en un departamento puede
      querer decir más eventos o más cobertura periodística. La serie termina en 2015.
  escala:
    titulo: "Cómo se pinta el mapa"
    texto: >
      El mapa reparte los departamentos en cinco tramos según su cantidad de registros, con la
      misma regla que el resto de los mapas del sitio. No usa la categoría que el IGN le pone a
      cada departamento ("Muy baja" o "Baja cantidad de registros"): esa categoría compara a
      cada departamento contra todo el país y deja a 25 de los 27 en la misma clase, así que no
      sirve para comparar departamentos de la provincia entre sí.
  sinagir:
    titulo: "Exposición a amenazas: SINAGIR"
    texto: >
      El Sistema Nacional para la Gestión Integral del Riesgo (SINAGIR) publica, en el Plan
      Nacional de Reducción del Riesgo de Desastres 2018-2023, un nivel de exposición por
      amenaza para cada REGIÓN del país. Santiago del Estero está en la región NOA y no hay
      detalle por provincia ni por departamento: el cuadro vale para toda la región. Los niveles
      se publican tal cual los trae el IGN; según su metadata la escala va de 1 a 6, pero la
      capa trae ceros en tres amenazas: se publican así y su significado está en consulta.
