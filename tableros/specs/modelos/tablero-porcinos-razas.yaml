# Ganaderia > Porcinos > Razas. Hoja "GanPorcRAZ" de la maqueta "Maqueta Ganad VF"
# (9-oct-2026). Base 90 (Siocarnes porcinos).
#
# JC cambia aca el planteo de bovinos (E114: "CAMBIAMOS EL PLANTEO DE MUESTRA DE DATOS POR LAS
# CARACTERISTICAS"): en vez de un anio, las tablas ponen 2024, 2025 y 2026 lado a lado, por
# departamento y por raza, en cabezas y en toneladas, mas el peso promedio. "TODO EL
# CONTENIDO ES REAL, SALVO LOS GRAFICOS" (E132): sus dos anillos son los de bovinos
# ("simulados... pero igual contenido y formato"), asi que aca van con los datos de porcinos.
#
# 13-oct-2026 (revision contra la maqueta):
# - Precio PROMEDIO SIMPLE como JC (Hibrida Materna ene-25 $ 1.035, Yorkshire $ 1.514, Capon
#   $ 1.155, Cerda $ 807: exactos).
# - Columna izquierda en el orden de JC: el mapa, las notas Caido / XD (filas 39-48), el
#   anillo por RAZA primero (48-64) y el de departamentos despues (64-79). El mapa no tiene
#   clic (E114 cambia el planteo de "pagina por departamento") y por eso no lleva "Seleccione
#   departamento" (pregunta para JC en el backlog).
# - Las razas en el orden de JC (Hampshire, Híbrida Materna, Pietrain, Yorkshire / Large-White,
#   Caídos *, Otras o Cruza, XD - Decomisado **), no alfabetico.
# - El titulo de banda de JC sobre los dos graficos de precio (fila 84).
# - Miga literal, tarjeta "Datos 2025", "Fuente: MAGyP - ARCA" en tablas y precios como JC, y
#   "Generar PDF" (BF105).
#
# 15-oct-2026 (pedido de la usuaria, toda ganaderia): el mapa de la provincia lleva los NOMBRES
# de los departamentos escritos (`paneles.mapa.rotulos_departamento`). DESVIO de la maqueta
# "Maqueta Ganad VF", que dibuja los mapas sin nombres (viven en el tooltip y en la tabla por
# departamento); es el mismo desvio que agricultura (backlog 68). Pregunta para JC en el
# backlog 110; se apaga borrando esa linea del spec.
id: tablero-porcinos-razas
tipo: tablero
familia: faena-porcinos
seccion: porcinos
pagina: razas
titulo_pagina: "Razas"

titulo: "Porcinos"
subtitulo: "Provincia de Santiago del Estero · porcinos enviados a faena por departamento y raza"

breadcrumb: "Ganadería - Porcinos - Provincia - Razas y categorías comercializadas para faena"

kpis_sin_variacion: true
tarjeta_datos:
  icono: porcinos

# La banda de JC: "Cabezas a faena 115.499 cab", "Dto Juan F. Ibarra 68,19 %", "Raza Híbrida
# Materna 90,13 %" y "Peso promedio/cab 124,7 Kg". Las cuatro dan exactas para 2025.
indicadores:
  - indicador: cabezas
    etiqueta: "Cabezas a faena"
  - indicador: departamento_lider
    medida: cabezas
    decimales: 2
    etiqueta: "Dto {departamento}"
  - indicador: raza_lider
    medida: cabezas
    decimales: 2
    etiqueta: "Raza {raza}"
  - indicador: peso_promedio
    etiqueta: "Peso promedio/cab"

paneles:
  alto: fluye
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}
  mapa:
    # Nombres de los departamentos sobre el mapa: desvio de la maqueta (ver la cabecera).
    rotulos_departamento: true
    titulo: "Razas y categorías"
    fuente: "Fuente: SENASA"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  # Texto LITERAL de JC (cuadro de texto bajo el mapa, filas 39-48).
  texto-notas:
    titulo: ""
    parrafos:
      - texto: >
          (*) Caído hace referencia a los animales que llegan al establecimiento de faena o que
          se encuentran dentro del predio con incapacidad para mantenerse en pie o movilizarse
          por sus propios medios
      - texto: >
          (**) XD - Decomisado: Es una categoría técnica de clasificación (equivalente a las
          razas en el sistema) que se utiliza para registrar aquellos animales o lotes de
          hacienda que fueron retirados o confiscados por las autoridades sanitarias por no
          cumplir con los requisitos sanitarios o de documentación.
    fuente: "Fuente: MAGyP - ARCA"
  tabla-anios-deptos-cab:
    titulo: "Sgo. del Estero - Porcinos - Cabezas totales y % enviadas a faena por departamento - años {desde} a {hasta}"
    dimension: geo
    medida: cabezas
    encabezado: "Departamento"
    fuente: "Fuente: MAGyP - ARCA"
  tabla-anios-deptos-tn:
    titulo: "Sgo. del Estero - Porcinos - Tn totales y % enviadas a faena por departamento - años {desde} a {hasta}"
    dimension: geo
    medida: tn
    encabezado: "Departamento"
    fuente: "Fuente: MAGyP - ARCA"
  tabla-anios-razas-cab:
    titulo: "Sgo. del Estero - Porcinos - Cabezas totales y % enviadas a faena por raza - años {desde} a {hasta}"
    dimension: raza
    medida: cabezas
    encabezado: "Raza"
    orden: &orden_jc ["HAMPSHIRE", "LÍNEA HÍBRIDA MATERNA", "PIETRAIN", "YORKSHIRE / LARGE-WHITE",
                      "Caídos", "OTRAS PURO o CRUZA (Detalle)", "XD - Decomisado"]
    fuente: "Fuente: MAGyP - ARCA"
  tabla-anios-razas-tn:
    titulo: "Sgo. del Estero - Porcinos - Tn totales y % enviadas a faena por raza - años {desde} a {hasta}"
    dimension: raza
    medida: tn
    encabezado: "Raza"
    orden: *orden_jc
    fuente: "Fuente: MAGyP - ARCA"
  tabla-peso-razas:
    titulo: "Sgo. del Estero - Porcinos - peso promedio por cabeza por raza enviadas a faena - años {desde} a {hasta}"
    # Caidos y decomisados no son una raza: no tiene sentido su peso promedio.
    excluir: ["Caídos", "XD - Decomisado"]
    orden: *orden_jc
    fuente: "Fuente: MAGyP - ARCA"
    # Nota LITERAL de JC.
    nota: >
      Nota: Pietrain 2024 sólo 25 kg/cab debido a que eran cachorras
  anillo-razas:
    titulo: "Sgo del Estero - Participación por raza en la venta para faena - año {anio}"
    cuantos: 3
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  anillo-departamentos:
    titulo: "Sgo del Estero - Participación por Departamento en la venta para faena - año {anio}"
    cuantos: 4
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  precios-razas-1:
    titulo: "Precio promedio mensual por raza - SDE - todas las cat. - $/kg en pie"
    razas: ["LÍNEA HÍBRIDA MATERNA", "YORKSHIRE / LARGE-WHITE"]
    etiquetas: {"YORKSHIRE / LARGE-WHITE": "Yorkshire"}
    desde: 2025
    fuente: "Fuente: MAGyP - ARCA"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  precios-categorias:
    titulo: "Precio promedio mensual Híbrida Materna - Capón y Cerda - SDE - $/kg en pie"
    raza: "LÍNEA HÍBRIDA MATERNA"
    categorias: ["Porcina Capón", "Porcina Cerda / Chancha"]
    desde: 2025
    fuente: "Fuente: MAGyP - ARCA"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  disposicion: columnas
  orden:
    - {id: mapa, ancho: 4, columna: izq}
    - {id: texto-notas, ancho: 4, columna: izq}
    - {id: anillo-razas, ancho: 4, columna: izq}
    - {id: anillo-departamentos, ancho: 4, columna: izq}
    - {id: tabla-anios-deptos-cab, ancho: 8, columna: der}
    - {id: tabla-anios-deptos-tn, ancho: 8, columna: der}
    - {id: tabla-anios-razas-cab, ancho: 8, columna: der}
    - {id: tabla-anios-razas-tn, ancho: 8, columna: der}
    - {id: tabla-peso-razas, ancho: 8, columna: der}
    # El titulo que JC escribe sobre los dos graficos de precio, a todo el ancho (fila 84).
    - {id: precios-razas-1, ancho: 6, columna: fila,
       titulo_fila: "Sgo. del Estero - Porcinos - precios promedio mensual por kg en pie declarados por los productores por raza y categoría enviadas a faena - años 2025 a 2026"}
    - {id: precios-categorias, ancho: 6, columna: fila}

filtros:
  - id: anio
    zona: periodo
