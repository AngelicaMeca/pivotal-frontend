    la base 53. Ese CSV no traia los graficos.
  correccion: >
    Francisco, 23-sep-2026 (SEGUNDA vuelta, la vigente): "El diseño que te pasé lo deduje de un
    CSV, y el CSV no traia los graficos: eran objetos de Excel y se perdieron al exportar. Abri
    el .xlsx original y ahora se exactamente que dibujo JC." Los cuatro paneles de esta pagina
    salen de la hoja "Agri 2" del archivo "0000000000 Maqueta Agri.xlsx", verificados objeto
    por objeto contra el XML del libro. Lo que se mantuvo de la primera vuelta: el selector de
    producto con sus iconos, la tira de años, la grilla 2x2 con cita de fuente por panel, el
    panel de utilidades con Exportar como PDF, el tratamiento de la papa (septiembre a
    diciembre visible en rotulos y notas, sin variacion interanual) y la nota de cobertura
    departamental.
  correccion_tercera_vuelta: >
    Francisco, 23-sep-2026 (TERCERA vuelta, la vigente): "Esta vez pude VER la maqueta
    renderizada: exporte la hoja Agri 2 a PDF con Excel y la mire por cuadrantes. Hasta ahora
    la habiamos reconstruido desde coordenadas de celdas y anclas de graficos, y se nos
    escaparon cosas." Lo que cambio: (1) el rendimiento de la cebolla pasa a 19.000 kg/ha, por
    evidencia contra la tabla que JC ya tenia calculada; (2) los dos cuadros de la columna
    izquierda llevan su tabla de datos debajo, con los años del grafico como columnas; (3) los
    chips de producto salen de la fila propia y pasan a vivir adentro de los dos paneles que
    los dibuja JC, manejados por el mismo filtro; (4) "Más información" y "Generar PDF" pasan
    al pie de cada cuadro y sale la tira de utilidades del final; (5) el panel de precios queda
    declarado con su estructura completa (cabecera, dos sub-pestañas, nueve chips, cuatro
    selectores, modo y rango), sin datos; (6) la tabla de estimaciones pasa a departamentos por
    AÑO con fila TOTAL. Lo que NO se toco, por pedido explicito: la grilla 2x2, los dos tipos
    de grafico, la ausencia de tarjetas de indicadores, el breadcrumb, el tratamiento de la
    papa y de la cobertura departamental, y el rotulo "bolsas"/"bultos" segun la composicion.
