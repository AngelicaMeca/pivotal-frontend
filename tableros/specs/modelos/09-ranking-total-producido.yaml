# Segundo ranking de JC f164: "por cultivo y EL TOTAL PRODUCIDO (verano + invierno)".
base: 9
slug: ranking-total-producido
comunes: _comunes-base-9
igual_que: 09-ranking-cultivo-produccion    # misma vista, cambia lo que sigue

titulo: "Ranking de departamentos por producción total"
subtitulo: "Suma de todos los cultivos de la campaña, en toneladas"

# --- Titulo del cuadro: lo arma _protocolo-presentacion, no se escribe a mano ---
protocolo: _protocolo-presentacion
titulo_componentes:                      # el resto se hereda de 09-ranking-cultivo-produccion
  sujeto: {desde_filtro: estacion}       # todos -> "los cultivos extensivos"; verano -> "los cultivos de verano"
titulo_protocolo_ejemplo: "Ranking de producción de los cultivos extensivos por departamento - Santiago del Estero - campaña 2024/25"

tipo: ranking

variables: [produccion_tn]
dimensiones: [departamento]
filtros: [campania, estacion]               # ya no hay filtro de cultivo: se suman todos
orden: {por: produccion_tn, dir: desc}

defaults:
  campania: parametros.ventana_campanias.campania_por_defecto
  estacion: todos                           # verano + invierno, que es lo que pide JC

opciones_estacion: [todos, verano, invierno]

universo:
  ambito: sde
  nivel_geo: departamento
  cultivo_rol: [agregado, simple]           # sin esto el ranking contaria la soja dos veces
  campanias: ventana_campanias

columnas_tabla:
  - {campo: puesto, etiqueta: "Puesto", formato: "1°"}
  - {campo: departamento, etiqueta: "Departamento"}
  - {campo: produccion_tn, etiqueta: "Producción total (tn)"}
  - {campo: cultivos_informados, etiqueta: "Cultivos"}
  - {campo: participacion_provincial_pct, etiqueta: "% de la provincia"}

transformaciones:
  - ranking:
      particion: "campania + estacion"
      ordenado_por: produccion_tn
      direccion: desc
      calculado_en: marts
  - participacion_geografica_pct:
      denominador: "suma provincial de los mismos cultivos y campaña"

advertencias:
  - id: toneladas-no-comparables
    texto_en_pantalla: >
      Este ranking suma toneladas de cultivos distintos. Una tonelada de maíz y una tonelada de
      algodón no valen lo mismo ni ocupan la misma superficie. Sirve para ver volumen físico
      producido, no valor económico. Cuando esté la base de precios se va a poder ordenar por valor.
    obligatoria: true

filtros_calidad: [excluir-campanias-sin-departamento]
notas_metodologicas: [estimacion-departamental, total-no-suma-componentes, verano-invierno, clasificacion-provisoria, campania-en-curso, salavina-sin-datos]

fuente:                                  # _protocolo-presentacion.pie_de_fuente
  pie: "Fuente: MAGyP"                   # lo arma el protocolo, no se escribe en el template
  organismo_esperado: "MAGyP"            # tiene que coincidir con la columna `fuente` del mart
  publicacion: null                      # JC declara la cita como "Fuente: MAGyP" en su indice.
                                         # Si quiere "MAGyP, Estimaciones Agrícolas", se completa
                                         # aca y cambia en las 16 vistas. Backlog pregunta 14.
# Despublicada el 10-ago-2026 (tercera tanda, Facu con JC: "OLVIDATE DEL ANALISIS COMPLETO,
# ESO YA NO EXISTE MAS... NECESITO QUE LO SAQUES Y TE QUEDES CON LOS TABLEROS"). El spec queda
# como REGISTRO de la regla: no se construye pagina propia ni se linkea desde ningun lado.
# Las unicas paginas publicadas de cultivos son el tablero (index), 09-departamento-datos y
# 09-noa-participacion-provincia. Regla: _protocolo-presentacion.formato_v1.tercera_tanda.solo_tableros.
estado: no-publicada

origen: {tipo: modelo-analisis, detalle: "hoja 'Modelo  Analisis' base 9, filas 162 a 164", fecha: 2026-07-30}
nota_interpretacion: >
  JC pide el total "verano + invierno" sumados. Sumar las dos temporadas en TONELADAS es correcto:
  su regla de separarlas (f8) aplica a las participaciones porcentuales y a las superficies, donde
  un mismo lote se contaria dos veces. Igual se deja el selector de temporada por si quiere verlas
  aparte. Este ranking NO se ofrece sobre superficie sembrada, justamente por el doble conteo del
  lote: si mas adelante lo pide, se agrega con la advertencia correspondiente.
