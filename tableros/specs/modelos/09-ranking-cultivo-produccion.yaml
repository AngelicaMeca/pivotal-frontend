# "Ranking de departamentos por cultivo (produccion y rendimiento)" (JC f21).
# "Se elaboraran 2 tipos de Ranking: por cultivo y el total producido (verano + invierno)" (JC f164).
# Este es el ranking por cultivo, en produccion. Es el spec padre de los otros tres rankings.
base: 9
slug: ranking-cultivo-produccion
comunes: _comunes-base-9
titulo: "Ranking de departamentos por cultivo"
subtitulo: "Producción de la campaña, en toneladas"

# --- Titulo del cuadro: lo arma _protocolo-presentacion, no se escribe a mano ---
protocolo: _protocolo-presentacion
titulo_componentes:
  area: provincia
  sujeto: {desde_filtro: cultivo}
  variable: {fijo: produccion_tn}
  apertura: departamento
  periodo: {desde_filtro: campania}
titulo_protocolo_ejemplo: "Ranking de producción de soja por departamento - Santiago del Estero - campaña 2024/25"

# Protocolo de tablas (docx de JC, tabla de ejemplo del Chaco 2009 vs 2008). Lo heredan los tres
# rankings que cuelgan de este spec.
protocolo_tablas:
  fila_total_arriba: true
  que_fila: "el 'Total provincia' de la fuente para ese cultivo y campaña, NO la suma de los departamentos"
  formato: "fondo gris claro y negrita, sin numero de puesto (la provincia no compite en su propio ranking)"
  origen: "docx de JC, parrafos 75-156: CHACO es la primera fila y los departamentos van debajo"

tipo: ranking
grafico: barras-horizontales

variables: [produccion_tn]
dimensiones: [departamento]
filtros: [cultivo, campania]
orden: {por: produccion_tn, dir: desc}
top_n: null            # se muestran los 26 departamentos: son pocos y JC lista la tabla entera

defaults:
  cultivo: "Soja total"
  campania: parametros.ventana_campanias.campania_por_defecto

universo:
  ambito: sde
  nivel_geo: departamento          # nunca la fila 'Total provincia' dentro del ranking
  cultivo_rol: [agregado, simple]  # JC f22-24
  campanias: ventana_campanias

columnas_tabla:
  - {campo: puesto, etiqueta: "Puesto", formato: "1°"}
  - {campo: departamento, etiqueta: "Departamento"}
  - {campo: produccion_tn, etiqueta: "Producción (tn)"}
  - {campo: participacion_provincial_pct, etiqueta: "% de la provincia"}

transformaciones:
  - ranking:
      particion: "cultivo + campania"
      ordenado_por: produccion_tn
      direccion: desc
      empates: "mismo puesto, el siguiente salta"
      calculado_en: marts
  - participacion_geografica_pct:
      denominador: "fila 'Total provincia' del mismo cultivo y campaña"

exclusiones:
  - regla: "los departamentos sin fila de ese cultivo en esa campaña no entran en el ranking"
    motivo_legible: "No informar un cultivo no es lo mismo que producir cero. Van listados aparte, abajo, como 'sin datos'."

notas_metodologicas: [estimacion-departamental, salavina-sin-datos, total-no-suma-componentes]
filtros_calidad: [excluir-campanias-sin-departamento]

fuente:                                  # _protocolo-presentacion.pie_de_fuente
  pie: "Fuente: MAGyP"                   # lo arma el protocolo, no se escribe en el template
  organismo_esperado: "MAGyP"            # tiene que coincidir con la columna `fuente` del mart
  publicacion: null                      # JC declara la cita como "Fuente: MAGyP" en su indice.
                                         # Si quiere "MAGyP, Estimaciones Agrícolas", se completa
                                         # aca y cambia en las 16 vistas. Backlog pregunta 14.
sensibilidad: normal
# Despublicada el 10-ago-2026 (tercera tanda, Facu con JC: "OLVIDATE DEL ANALISIS COMPLETO,
# ESO YA NO EXISTE MAS... NECESITO QUE LO SAQUES Y TE QUEDES CON LOS TABLEROS"). El spec queda
# como REGISTRO de la regla: no se construye pagina propia ni se linkea desde ningun lado.
# Las unicas paginas publicadas de cultivos son el tablero (index), 09-departamento-datos y
# 09-noa-participacion-provincia. Regla: _protocolo-presentacion.formato_v1.tercera_tanda.solo_tableros.
estado: no-publicada

origen: {tipo: modelo-analisis, detalle: "hoja 'Modelo  Analisis' base 9, filas 21, 162 a 167 y ejemplo de filas 200 a 227", fecha: 2026-07-30}
