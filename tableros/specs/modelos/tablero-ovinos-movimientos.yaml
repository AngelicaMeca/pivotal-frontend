# Ganaderia > Ovinos > Movimientos. Hoja "GanOviDTE" de la maqueta "Maqueta Ganad VF"
# (9-oct-2026). Base 145 (DTE ovinos).
#
# JC: "PROCESAR IDEM DTE BOVINOS, mismo formato y contenidos". Lo unico que no se puede
# repetir es la apertura por categoria: la base de ovinos no la trae, asi que las tablas van
# con DTE y total de cabezas y no hay anillo por categoria.
#
# 13-oct-2026 (revision contra la maqueta): el molde de bovinos completo, con lo que va por
# provincia de destino y de origen publicado (decision de la usuaria con el OK de Francisco) y
# los KPIs que nombran la provincia; dos columnas (mapa y anillos a la izquierda, las tablas a
# la derecha); con un departamento elegido, solo el anio elegido y sin el anillo departamental.
# La miga de JC dice "Stocks" por arrastre de copiar la hoja: va "Movimientos (DTE)", como en
# porcinos.
#
# 15-oct-2026 (pedido de la usuaria, toda ganaderia): el mapa de la provincia lleva los NOMBRES
# de los departamentos escritos (`paneles.mapa.rotulos_departamento`). DESVIO de la maqueta
# "Maqueta Ganad VF", que dibuja los mapas sin nombres (viven en el tooltip y en la tabla por
# departamento); es el mismo desvio que agricultura (backlog 68). Pregunta para JC en el
# backlog 110; se apaga borrando esa linea del spec.
id: tablero-ovinos-movimientos
tipo: tablero
familia: movimientos-ovinos
seccion: ovinos
pagina: movimientos
titulo_pagina: "Movimientos"
sensibilidad: comparativo
aprobado_por: "fran, 2026-10-13 (decisión de la usuaria: comparaciones entre provincias de ganadería, según la maqueta)"

titulo: "Ovinos"
subtitulo: "Provincia de Santiago del Estero · movimientos de ovinos con DTE"

breadcrumb: "Ganadería - Ovinos - Provincia - {departamento} - Movimientos (DTE)"

kpis_sin_variacion: true
tarjeta_datos:
  icono: ovinos

indicadores:
  - recorte: totales_sin_introduccion
    etiqueta: "Totales movidos"
  - recorte: internos
    etiqueta: "Movimientos internos"
  - recorte: extraccion
    provincia_lider: true
    etiqueta: "Extracción a {provincia}"
  - recorte: introduccion
    provincia_lider: true
    etiqueta: "Introducción de {provincia}"

paneles:
  alto: fluye
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}
  mapa:
    # Nombres de los departamentos sobre el mapa: desvio de la maqueta (ver la cabecera).
    rotulos_departamento: true
    titulo: "Movimientos por departamento"
    rotulo_accion: "Seleccione departamento"
    click_departamento: en-la-misma-vista
    seleccion_departamento:
      defecto: provincia
      rotulo_provincia: "Provincia"
      rotulo_cambiar: "Seleccione otro departamento si desea visualizar"
      miga: "Dto {Departamento}"
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  tabla-tipos:
    titulo: "Sgo. del Estero - Movimientos ovinos por tipo y DTE Totales provincia - años {desde} a {hasta} (parcial)"
    titulo_departamento: "Sgo. del Estero - Movimientos ovinos por tipo y DTE - Dto {departamento} - año {anio}"
    rotulos_franja:
      internos: "Movimientos internos (dentro de la provincia Sgo Estero)"
      extraccion: "Movimientos cabezas salidas de la provincia (extracción) - cálculo por diferencia"
    nota: >
      La planilla de SENASA no abre los movimientos de ovinos por categoría. La extracción es
      la diferencia entre los movimientos totales y los internos.
  tabla-balance:
    titulo: "Sgo. del Estero - Balance de movimientos ovinos (extracción - introducción) - años {desde} a {hasta}"
    titulo_departamento: "Sgo. del Estero - Balance de movimientos ovinos (extracción - introducción) - Dto {departamento} - año {anio}"
    nota: >
      Un número negativo quiere decir que salieron de la provincia más cabezas que las que
      entraron; uno positivo, que entraron más.
  tabla-departamentos:
    titulo: "Sgo. del Estero - Movimientos ovinos por tipo y DTE por Departamento - año {anio}"
    rotulo_total: "PROVINCIA"
  tabla-provincias-destino:
    titulo: "Sgo. del Estero - Movimientos ovinos de EXTRACCIÓN y DTE por Provincia de destino - año {anio}"
    encabezado: "Pcia. Destino"
  tabla-provincias-origen:
    titulo: "Sgo. del Estero - Movimientos ovinos de INTRODUCCIÓN y DTE por Provincia de origen - año {anio}"
    encabezado: "Pcia. Origen"
  anillo-departamentos:
    titulo: "Sgo del Estero - Participación de departamentos de origen en los movimientos totales año {anio}"
    cuantos: 5
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  anillo-provincias-destino:
    titulo: "Sgo del Estero - Participación de las provincias de destino en los movimientos de EXTRACCIÓN año {anio}"
    cuantos: 4
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  anillo-provincias-origen:
    titulo: "Sgo del Estero - Participación de las provincias de origen en los movimientos de INTRODUCCIÓN año {anio}"
    cuantos: 5
    acciones:
      - {id: zoom, etiqueta: "Zoom", icono: zoom, accion: zoom}
  disposicion: columnas
  orden:
    - {id: mapa, ancho: 4, columna: izq}
    - {id: anillo-departamentos, ancho: 4, columna: izq, solo_provincia: true}
    - {id: anillo-provincias-destino, ancho: 4, columna: izq, solo_provincia: true}
    - {id: anillo-provincias-origen, ancho: 4, columna: izq, solo_provincia: true}
    - {id: tabla-tipos, ancho: 8, columna: der}
    - {id: tabla-balance, ancho: 8, columna: der}
    - {id: tabla-departamentos, ancho: 8, columna: der}
    - {id: tabla-provincias-destino, ancho: 8, columna: der, solo_provincia: true}
    - {id: tabla-provincias-origen, ancho: 8, columna: der, solo_provincia: true}

filtros:
  - id: anio
    zona: periodo
