# Ganaderia > Apicola (pagina unica). Hoja "GanApi" de la maqueta "Maqueta Ganad VF"
# (9-oct-2026). Base 30 (RENAPA, MAGyP), datos a 2025.
#
# Lo que pide JC en la hoja "Modelo Analisis" de la base: "Dado que son datos de solo 2
# variables (apiarios y colmenas) en 1 variable geografica (departamento) y Totales
# provinciales, solo amerita: 1. Ranking por departamento (listado, sin grafico); 2. Grafico
# de participacion porcentual de los 6 [...] mas relevantes y el resto agrupados en 'resto';
# 3. Volcado de datos en cada departamento". Y en la maqueta (E66): "SIN SELECCION DE
# DEPARTAMENTO, SOLO MOSTRANDO ESCALAS DE COLMENAS Y APIARIOS".
#
# 15-oct-2026 (pedido de la usuaria, toda ganaderia): el mapa de la provincia lleva los NOMBRES
# de los departamentos escritos (`paneles.mapa.rotulos_departamento`). DESVIO de la maqueta
# "Maqueta Ganad VF", que dibuja los mapas sin nombres (viven en el tooltip y en la tabla por
# departamento); es el mismo desvio que agricultura (backlog 68). Pregunta para JC en el
# backlog 110; se apaga borrando esa linea del spec.
id: tablero-apicola
tipo: tablero
familia: apicola
seccion: apicola

titulo: "Apícola"
subtitulo: "Provincia de Santiago del Estero · apiarios y colmenas por departamento"

# 13-oct-2026 (revision contra la maqueta): TRES columnas como la hoja de JC (mapa y anillo |
# tabla de apiarios y colmenas | ranking, sin scroll), el mapa rotulado con la variable
# elegida ("Colmenas", su pestaña), una rampa de color POR VARIABLE (E84: colmenas en marron,
# apiarios en borravino), miga literal (N5), tarjeta "Datos 2025" y "Generar PDF" (BF59).
# JC cita "Fuente: SENASA" bajo su mapa (H39) y la base 30 es de RENAPA/MAGyP: se sigue a JC
# en ese cuadro y la duda va al backlog.
breadcrumb: "Ganadería - Apícola - Provincia"
tarjeta_datos:
  icono: apicolas

# La banda de JC, textual: "Total colmenas 93.618", "Colm. prom. por apiario 77,3",
# "Apiarios Dto Rivadavia 102" y "Colmenas Dto Choya 12.023". Las cuatro dan exactas.
indicadores:
  - indicador: total
    medida: colmenas
    etiqueta: "Total colmenas"
  - indicador: cociente
    numerador: colmenas
    denominador: apiarios
    etiqueta: "Colm. prom. por apiario"
  - indicador: lider
    medida: apiarios
    etiqueta: "Apiarios Dto {departamento}"
  - indicador: lider
    medida: colmenas
    etiqueta: "Colmenas Dto {departamento}"

paneles:
  alto: fluye
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}
  mapa:
    # Nombres de los departamentos sobre el mapa: desvio de la maqueta (ver la cabecera).
    rotulos_departamento: true
    # Sin capas de contexto del IGN ni control "Capas" (pedido de la usuaria del
    # 16-oct-2026: "saca el boton capas de los mapas de ganaderia").
    titulo: "{variable}"
    fuente: "Fuente: SENASA"
    variables: [colmenas, apiarios]
    nombres: {colmenas: "Colmenas", apiarios: "Apiarios"}
    unidades: {colmenas: "colmenas", apiarios: "apiarios"}
  tabla-departamentos:
    titulo: "Sgo. del Estero - Producción apícola - Cantidad de apiarios y colmenas por departamento - año {anio}"
    rotulo_total: "TOTAL PROVINCIA"
  tabla-ranking:
    titulo: "Sgo. del Estero - Producción apícola - Ranking en cantidad de colmenas por departamento - año {anio}"
    rotulo_total: "TOTAL PROVINCIA"
  anillo-departamentos:
    # Titulo de JC, con la errata "colmenaas" corregida.
    titulo: "Sgo del Estero - Cantidad de colmenas, Participación por departamento en el total año {anio}"
    # Cinco y "Resto": regla de JC del 25-oct-2026 ("NORMALMENTE NO CONVIENE PONER MAS
    # DE 5 ANTES DE 'RESTO'"). JC dibujaba seis en su maqueta.
    cuantos: 5
  # Disposicion en COLUMNAS (12-oct-2026, "reacomoda... para que no haya espacios vacios"):
  # cada banda tiene dos columnas que se apilan a su ritmo, como las hojas de JC (graficos a
  # la izquierda, tablas a la derecha). Las bandas agrupan cuadros de alto parecido; los
  # altos se midieron a 1600 px.
  disposicion: columnas
  orden:
    - {id: mapa, ancho: 4, columna: izq}
    - {id: anillo-departamentos, ancho: 4, columna: izq}
    - {id: tabla-departamentos, ancho: 4, columna: centro}
    - {id: tabla-ranking, ancho: 4, columna: der}

filtros:
  - id: variable
    zona: panel
