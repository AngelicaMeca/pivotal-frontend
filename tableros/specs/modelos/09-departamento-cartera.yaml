# "Opcion de cartera de cultivos: se mostrara la composicion porcentual de los cultivos de verano
# y de invierno de la ultima campaña. Solo superficies y produccion." (JC f18-f19)
base: 9
slug: departamento-cartera
comunes: _comunes-base-9
titulo: "Cartera de cultivos del departamento"
subtitulo: "Cómo se reparte la campaña entre los cultivos, en porcentaje"

# --- Titulo del cuadro: lo arma _protocolo-presentacion, no se escribe a mano ---
protocolo: _protocolo-presentacion
titulo_componentes:
  area: {desde_filtro: departamento}
  sujeto: {desde: presentacion.estacion} # cada torta trae la suya: verano y invierno
  variable: {desde_filtro: variable}
  apertura: cultivo
  periodo: {desde_filtro: campania}
titulo_por_elemento: true                # son DOS graficos, y JC pide titulo completo en cada uno
titulo_protocolo_ejemplo:
  - "Distribución porcentual de la producción de los cultivos de verano por cultivo - MORENO (Santiago del Estero) - campaña 2024/25"
  - "Distribución porcentual de la producción de los cultivos de invierno por cultivo - MORENO (Santiago del Estero) - campaña 2024/25"
# Al haber dos graficos en la misma pagina, aplica la numeracion del protocolo:
# "Gráfico 1 - ..." y "Gráfico 2 - ...". Los rotulos "Cultivos de verano" y "Cultivos de invierno"
# de `presentacion` quedan como encabezado corto adentro de cada torta, no reemplazan al titulo.

tipo: torta

variables: [produccion_tn, sup_sembrada_ha]     # JC f19: SOLO superficies y produccion
dimensiones: [cultivo]
filtros: [departamento, campania, variable]     # 3 filtros, el maximo permitido
orden: {por: valor, dir: desc}

defaults:
  campania: parametros.ventana_campanias.campania_por_defecto
  variable: produccion_tn

universo:
  ambito: sde
  nivel_geo: departamento
  cultivo_rol: [agregado, simple]
  campanias: ventana_campanias

presentacion:
  dos_tortas: true
  torta_izquierda: {estacion: verano, titulo: "Cultivos de verano"}
  torta_derecha: {estacion: invierno, titulo: "Cultivos de invierno"}
  regla: >
    Son DOS tortas separadas, cada una suma 100% por su cuenta. Nunca una sola torta con los dos
    grupos juntos. Es la regla de JC en f8. Debajo de cada torta va el total absoluto de esa
    temporada, para que se vea el tamaño relativo de una contra la otra.
  sin_dato: "Si el departamento no tiene ningún cultivo de una temporada en esa campaña, la torta se reemplaza por la leyenda 'Sin cultivos de invierno en esta campaña'."

transformaciones:
  - participacion_pct:
      universo: "cultivos con rol agregado o simple, del mismo departamento, campaña y estación"

mouseover: "cultivo + valor absoluto + porcentaje"

navegacion:
  - accion: "Ver todas las campañas"
    va_a: 09-cartera-evolucion-porcentual
    con: "geo = este departamento"
    referencia: "JC f18: 'ver todas las campañas o seleccionar alguna en particular'"

notas_metodologicas: [verano-invierno, clasificacion-provisoria, total-no-suma-componentes, estimacion-departamental]
filtros_calidad: [excluir-campanias-sin-departamento]

fuente:                                  # _protocolo-presentacion.pie_de_fuente
  pie: "Fuente: MAGyP"                   # lo arma el protocolo, no se escribe en el template
  organismo_esperado: "MAGyP"            # tiene que coincidir con la columna `fuente` del mart
  publicacion: null                      # JC declara la cita como "Fuente: MAGyP" en su indice.
                                         # Si quiere "MAGyP, Estimaciones Agrícolas", se completa
                                         # aca y cambia en las 16 vistas. Backlog pregunta 14.
sensibilidad: normal
# Despublicada el 10-ago-2026 (tercera tanda, Facu con JC: "OLVIDATE DEL ANALISIS COMPLETO,
# ESO YA NO EXISTE MAS... NECESITO QUE LO SAQUES Y TE QUEDES CON LOS TABLEROS"). El spec queda
# como REGISTRO de la regla: no se construye pagina propia ni se linkea desde ningun lado.
# Las unicas paginas publicadas de cultivos son el tablero (index), 09-departamento-datos y
# 09-noa-participacion-provincia. Regla: _protocolo-presentacion.formato_v1.tercera_tanda.solo_tableros.
estado: no-publicada

origen: {tipo: modelo-analisis, detalle: "hoja 'Modelo  Analisis' base 9, filas 18 y 19", fecha: 2026-07-30}
nota_interpretacion: >
  La misma vista sirve para la provincia entera si el filtro departamento se deja en "Total
  provincia": no se hace un spec aparte para eso.
