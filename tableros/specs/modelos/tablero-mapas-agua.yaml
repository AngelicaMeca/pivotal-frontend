# Cuencas hidricas y cursos de agua del INTA, en NUESTRO visor.
#
# Es la segunda pagina que sale del comentario de JC del 18-nov-2026 (tarea 1220512131004640):
# "la idea era BAJAR LAS CAPAS Y PONER NUESTRO PROPIO VISOR... PARA QUE QUEDE DENTRO DE NUESTRA
# WEB". Reemplaza a otras DOS de las ocho tarjetas con link externo de la portada de Mapas
# ("Cuencas hidricas del NOA" y "Cursos de Agua NOA", que abrian el visor del INTA).
#
# Estas dos capas son de TODO EL NOROESTE y vienen recortadas a la provincia: el borde calca la
# silueta del mapa porque el recorte camina por el contorno disuelto de los departamentos, el
# mismo que usan las capas del IGN. Procedencia, comandos, licencia, el recorte y lo que hay
# que saberle al dato, en configs/dims/capas-inta.yaml.
#
# MISMA MAQUETA QUE INFRAESTRUCTURA Y QUE SUELOS, a proposito: titulo, el mapa a toda la pagina
# con zoom real, control de capas y nada mas. Es la unica maqueta que JC dio para un mapa
# nuestro (15-nov-2026: "SOLO PONEMOS COMO TITULO 'infraestructura' y que el mapa ocupe toda la
# pagina pudiendo hacer zoom al maximo. Que el usuario pueda agregar o quitar capas").
#
# EL ORDEN DE LAS CAPAS IMPORTA ACA, al contrario que en Suelos: las cuencas son areas y los
# cursos de agua son lineas, asi que van las dos juntas y se leen bien. Las cuencas primero
# para que los rios queden DIBUJADOS ENCIMA de ellas y no debajo.
#
# Y POR ESO LAS DOS ARRANCAN PRENDIDAS (QA de Francisco del 19-nov-2026, defecto D6). Hasta el
# 19-nov arrancaban apagadas y la pagina abria sin una sola cuenca ni un solo rio: el protocolo
# de las capas apagadas es para las capas de contexto SOBRE UN MAPA DE CALOR, donde la capa es
# un agregado; aca las capas son la pagina. Se bajan 1,05 MB al abrir (~200 KB por la red, que
# las sirve comprimidas), del mismo orden que los 616 KB de Infraestructura, que tambien abre
# con sus capas prendidas. Preguntado en el backlog 132.
#
# SIN KPIs: no hay una magnitud que totalizar. La superficie de cada cuenca dentro de la
# provincia se podria calcular, pero seria un numero NUESTRO sobre un dato del INTA que el
# INTA no publica, y el 4% de la provincia no pertenece a ninguna cuenca en su propio dato.

id: tablero-mapas-agua
tipo: tablero
familia: capas-ign
estado: publicada
seccion: mapas
pagina: cuencas-y-cursos-de-agua

titulo: "Cuencas y cursos de agua"
subtitulo: "Provincia de Santiago del Estero · cuencas hídricas y cursos de agua del NOA, recortados a la provincia (INTA)"
titulo_pagina: "Cuencas y cursos de agua"
breadcrumb: "Mapas - Cuencas y cursos de agua"

indicadores: []
kpis_sin_variacion: true

notas_metodologicas: [capas-inta-agua]

paneles:
  alto: fluye
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}
  mapa-capas:
    # CON EL MISMO FORMATO QUE LOS MAPAS DE AGROCLIMA (pedido de la usuaria del 24-nov-2026:
    # "no me gusta como estan los mapas de suelos y cuencas; tienen que tener el mismo formato
    # que los mapas de agroclima, los que tienen visor propio de codigo"). Ese formato es el
    # del visor georreferenciado del SEPA: titulo del organismo arriba, barra de controles
    # sobre el mapa, el mapa en una caja con marco y la leyenda al costado en una tarjeta
    # "Referencias" con su pie de fuente. Lo declara `visor: true` en `paneles.orden`.
    #
    # Y CON EL MISMO ZOOM (pedido de la usuaria del 24-nov-2026: "quiero que el zoom sea como
    # el de los mapas de agroclima"): rueda continua, doble clic, pellizco y arrastre, con
    # los mismos pasos que el visor. El gesto vive en `cliente/gesto-zoom.js` y lo usan los
    # dos dibujos, asi que no hay dos fuentes de verdad para el mismo numero.
    #
    # El titulo vuelve (lo habia sacado el D1 del QA del 19-nov-2026 por repetir la bajada):
    # en este formato es el UNICO titulo de la pagina -no hay otro arriba, igual que en NDVI o
    # en el Mapa Nacional de Cultivos- y sigue el patron de esas paginas, organismo primero.
    titulo: "INTA - Cuencas y cursos de agua - Sgo del Estero"
    # La tarjeta de la leyenda, con el mismo encabezado que la del visor de AgroClima.
    leyenda_titulo: "Referencias"
    subtitulo: "Acerque con la rueda del mouse y arrastre para desplazarse · active las capas que quiera ver; pase el mouse por un área o un curso para ver de cuál se trata · con «Mostrar todo el país» las dos capas se ven enteras, tal como el INTA las publica para todo el noroeste"
    capas:
      - {id: inta-cuencas, prendida: true}
      - {id: inta-cursos-de-agua, prendida: true}
  orden:
    # "MOSTRAR TODO EL PAIS" (`pais: true`, pedido de la usuaria del 25-nov-2026: "no hay forma
    # de que haya un botoncito que diga 'mostrar todo el pais' asi como en los mapas de
    # agroclima?"). Es la misma casilla, con el mismo texto y en el mismo lugar de la barra que
    # la del visor de AgroClima. Prendida, el mapa base pasa a ser el pais (las 24 provincias
    # del IGN, configs/dims/pais-provincias.yaml) y cada capa que el INTA publique fuera de la
    # provincia se dibuja entera, con su propia leyenda (hay clases que adentro no existen).
    # Las capas que el INTA publica SOLO para Santiago del Estero se siguen viendo tal cual:
    # dibujadas sobre la provincia y nada alrededor, porque eso es todo lo que hay publicado.
    # Va en `orden` y no en el panel, igual que `zoom` y `visor`: decide la casilla de la barra
    # (cascara) y el mapa base que el navegador registra.
    # Las dos capas de esta pagina son de todo el NOROESTE: con el boton prendido se
    # ven enteras, y la leyenda de cuencas pasa de 6 a 16 macrocuencas.
    - {id: mapa-capas, ancho: 12, zoom: true, visor: true, pais: true}

filtros: []
