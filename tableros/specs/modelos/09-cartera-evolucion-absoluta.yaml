# GRAF 3 de la hoja Modelo Analisis. Titulo original del grafico de JC:
# "Evolucion de la produccion por cartera de cultivos de VERANO - Campañas 2014/15 a 2024/25 - En tn".
# JC anota al lado (f96): "DEBE HACERSE LO MISMO PARA CULTIVOS INVIERNO".
base: 9
slug: cartera-evolucion-absoluta
comunes: _comunes-base-9
titulo: "Cartera de cultivos: cómo cambió la producción campaña a campaña"
subtitulo: "Producción por cultivo y por campaña, en toneladas"

# --- Titulo del cuadro: lo arma _protocolo-presentacion, no se escribe a mano ---
protocolo: _protocolo-presentacion
titulo_componentes:
  area: {desde_filtro: geo}
  sujeto: {desde_filtro: estacion}       # verano -> "los cultivos de verano"
  variable: {desde_filtro: variable}
  apertura: cultivo
  periodo: {ventana: ventana_campanias}
titulo_protocolo_ejemplo: "Evolución de la producción de los cultivos de verano por cultivo - Santiago del Estero - campañas 2015/16 a 2024/25"

tipo: serie
grafico: barras-apiladas

variables: [produccion_tn, sup_sembrada_ha]
dimensiones: [campania, cultivo]
filtros: [estacion, geo, variable]          # 3 filtros, el maximo permitido
orden: {por: campania, dir: asc}

defaults:
  estacion: verano
  geo: provincia
  variable: produccion_tn

universo:
  ambito: sde
  nivel_geo: [provincia, departamento]
  cultivo_rol: [agregado, simple]           # JC f22-24: nunca componentes
  campanias: ventana_campanias
  variables_habilitadas: [produccion_tn, sup_sembrada_ha]

separacion_estacional:
  obligatoria: true
  dimension: dim-cultivos.estacion
  valores: [verano, invierno]
  regla: >
    Verano e invierno NUNCA se apilan en el mismo grafico. Se elige uno u otro con el selector.
    Es la regla de JC en f8: si se mezclan, la suma da mas que el todo, porque en un mismo lote
    entra un cultivo de invierno y despues uno de verano en el mismo año.
  referencia_jc: "hoja Modelo Analisis f8 y f96"

# Verificado contra staging: los cultivos de verano con datos en Santiago en la ventana son
# Algodón, Girasol, Maíz, Soja total, Sorgo, Poroto total y Maní. Los 6 primeros son exactamente
# los que JC apila en su GRAF 3 (columnas R a W). Maní se agrega porque tiene datos (campañas
# 2023/24 y 2024/25) y no hay motivo para dejarlo afuera.
# Los de invierno son Trigo total, Cebada total, Avena, Centeno, Garbanzo, Colza y Cártamo.

transformaciones: []

mouseover: "campaña + cultivo + producción"   # JC K94: "QUE SE MUESTREN LOS VALORES CON MOUSEOVER"

notas_metodologicas: [verano-invierno, total-no-suma-componentes, clasificacion-provisoria, campania-en-curso]
notas_metodologicas_si_departamento: [estimacion-departamental]
filtros_calidad: [excluir-campanias-sin-departamento]

fuente:                                  # _protocolo-presentacion.pie_de_fuente
  pie: "Fuente: MAGyP"                   # lo arma el protocolo, no se escribe en el template
  organismo_esperado: "MAGyP"            # tiene que coincidir con la columna `fuente` del mart
  publicacion: null                      # JC declara la cita como "Fuente: MAGyP" en su indice.
                                         # Si quiere "MAGyP, Estimaciones Agrícolas", se completa
                                         # aca y cambia en las 16 vistas. Backlog pregunta 14.
sensibilidad: normal
# Despublicada el 10-ago-2026 (tercera tanda, Facu con JC: "OLVIDATE DEL ANALISIS COMPLETO,
# ESO YA NO EXISTE MAS... NECESITO QUE LO SAQUES Y TE QUEDES CON LOS TABLEROS"). El spec queda
# como REGISTRO de la regla: no se construye pagina propia ni se linkea desde ningun lado.
# Las unicas paginas publicadas de cultivos son el tablero (index), 09-departamento-datos y
# 09-noa-participacion-provincia. Regla: _protocolo-presentacion.formato_v1.tercera_tanda.solo_tableros.
estado: no-publicada

origen: {tipo: modelo-analisis, detalle: "hoja 'Modelo  Analisis' base 9, GRAF 3 (filas 84 a 102) y f8", fecha: 2026-07-30}
nota_interpretacion: >
  JC arma su GRAF 3 solo con produccion. Se habilita tambien superficie sembrada porque en f19
  pide, para la cartera del departamento, "solo superficies y produccion": las dos variables. El
  grafico es el mismo, cambia la variable con el selector.
