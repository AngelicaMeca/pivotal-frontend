# El anillo del mockup de JC (specs/fuentes/0000000000 Modelo 1.xlsx). Título original:
# "Sgo del Estero - Campaña 2024/25 - Participación porcentual por cultivo en el total de la
#  producción (fina y gruesa)". Doughnut con los 5 cultivos principales + "Resto".
#
# Es la ÚNICA participación de la base 9 que mezcla verano e invierno, y es legal porque es
# PRODUCCIÓN (las toneladas se suman entre estaciones; las hectáreas no) y porque va rotulada
# "(fina y gruesa)", que es exactamente cómo la rotula JC (formato_v1.agregacion).
# Las carteras por superficie siguen separadas por estación (09-departamento-cartera y las dos
# de cartera-evolucion).
base: 9
slug: cartera-participacion-produccion
comunes: _comunes-base-9
titulo: "Qué parte de la producción pone cada cultivo"
subtitulo: "Participación porcentual en la producción de la campaña, verano e invierno juntos"

# --- Titulo del cuadro: lo arma _protocolo-presentacion, no se escribe a mano ---
protocolo: _protocolo-presentacion
titulo_componentes:
  area: provincia
  sujeto: null
  variable:
    override: "participación porcentual en el total de la producción (fina y gruesa)"
    motivo: >
      Calcado del título del anillo de JC en el mockup. El recorte "(fina y gruesa)" va adentro
      del override porque es parte de su frase literal.
  apertura: cultivo
  periodo: {desde_filtro: campania}
titulo_protocolo_ejemplo: "Participación porcentual en el total de la producción (fina y gruesa) por cultivo - Santiago del Estero - campaña 2024/25"
nota_interpretacion: >
  JC escribe "por cultivo" en el medio de la frase ("Participación porcentual por cultivo en el
  total..."); la plantilla `torta` lo pone al final. Mismos componentes, otro orden. Si JC
  quiere su orden exacto, se mueve al override completo. Backlog pregunta 31.

tipo: torta
grafico: anillo

variables: [produccion_tn]
dimensiones: [cultivo]
filtros: [campania]
orden: {por: produccion_tn, dir: desc}
top_n: 5                     # los 5 principales con porcentaje; el resto agrupado
resto: "Resto"               # en la Data del mockup: Soja 48,1%, Maíz 26,8%, Algodón 7,3%,
                             # Trigo 7,2%, Sorgo 5,4%, Resto 5,2%

defaults:
  campania: parametros.ventana_campanias.campania_por_defecto

universo:
  ambito: sde
  # CORRECCIÓN de constructor-dashboards (10-ago-2026): suma departamental, NO la fila
  # 'Total provincia'. Motivo verificado contra marts: 'Poroto total' no tiene fila
  # provincial en la fuente (193.944 tn en 2024/25, solo a nivel departamento) y con filas
  # provinciales el poroto desaparecía del anillo y la soja daba 49,7%. Con suma
  # departamental la soja da 48,1%, exactamente el anillo del mockup de JC (la verificación
  # que exige `transformaciones` acá abajo), y es la misma regla de conteo del tablero
  # (site_build.total_provincia_cultivos: "las dos formas de contar tienen que dar lo mismo
  # en todo el sitio"). No hay doble conteo: roles agregado y simple, sin componentes.
  nivel_geo: departamento         # suma de departamentos (ver corrección de arriba)
  cultivo_rol: [agregado, simple] # sin componentes: la soja 1ra y 2da ya están en el total
  campanias: ventana_campanias

transformaciones:
  - participacion_pct:
      universo: "todos los cultivos (rol agregado o simple) de la campaña, verano + invierno"
      nota: >
        A diferencia del resto de las participaciones de la base, acá NO se separa por estación:
        es producción en toneladas y va rotulada "(fina y gruesa)". Verificado contra la hoja
        'Data' del mockup: la participación de soja 2024/25 da 48,1%, igual que el anillo de JC.

mouseover: "cultivo + toneladas + porcentaje"

notas_metodologicas: [total-no-suma-componentes, campania-en-curso]
filtros_calidad: [excluir-campanias-sin-departamento]

fuente:
  pie: "Fuente: MAGyP"
  organismo_esperado: "MAGyP"
  publicacion: null

sensibilidad: normal
# Despublicada el 10-ago-2026 (tercera tanda, Facu con JC: "OLVIDATE DEL ANALISIS COMPLETO,
# ESO YA NO EXISTE MAS... NECESITO QUE LO SAQUES Y TE QUEDES CON LOS TABLEROS"). El spec queda
# como REGISTRO de la regla: no se construye pagina propia ni se linkea desde ningun lado.
# Las unicas paginas publicadas de cultivos son el tablero (index), 09-departamento-datos y
# 09-noa-participacion-provincia. Regla: _protocolo-presentacion.formato_v1.tercera_tanda.solo_tableros.
# Sus transformaciones SIGUEN alimentando el panel anillo del tablero
# (tablero-cultivos-extensivos.paneles): muere la pagina propia, no la regla.
estado: no-publicada

origen:
  tipo: documento-de-jc
  detalle: "specs/fuentes/0000000000 Modelo 1.xlsx, anillo de las hojas 'Modelo 1' y 'Modelo 2', datos de la hoja 'Data' C47:L64 (participaciones) y C66:D72 (top 5 + Resto)"
  fecha: 2026-08-10
