# Aptitud de tierras y zonificación del uso del suelo del INTA, en NUESTRO visor.
#
# Es la respuesta al comentario de JC del 18-nov-2026 (tarea 1220512131004640), textual:
#
#   "JAMAS DIJE QUE PONGAMOS LINKS EXTERNOS AL RESTO DE LOS MAPAS... la idea es QUE ESTEN
#   DENTRO DE AGRIFOOD!!!! Nunca pusimos links externos a nada, por ende, no se porque se hizo
#   en este caso. La idea era BAJAR LAS CAPAS Y PONER NUESTRO PROPIO VISOR, SI NO SE PUEDE,
#   ELIMINAMOS TODO. PARA QUE QUEDE DENTRO DE NUESTRA WEB. Lo que no entiendo es que si se
#   pudo hacer con el mapa de cultivos, porque no con los otros???? TODOS TIENEN LA OPCION DE
#   DESCARGAR LA CAPA."
#
# Tenia razon: se bajan por el WFS del INTA. Las dos capas de esta pagina estan commiteadas en
# configs/dims/capas-inta/ y el sitio publica una copia: no le pide nada al INTA al dibujar.
# Procedencia, comandos, licencia y lo que hay que saberle al dato, en
# configs/dims/capas-inta.yaml. Las clases y los colores de la leyenda son los del INTA,
# leidos de su propio SLD, no una paleta nuestra.
#
# ESTA PAGINA REEMPLAZA A DOS DE LAS TARJETAS con link externo de la portada de Mapas
# ("Aptitud de Tierras" y "Zonificacion del Uso del Suelo", que apuntaban a la ficha del
# catalogo del INTA). Las cuencas y los cursos de agua estan en tablero-mapas-agua.yaml, y las
# dos tarjetas del INTA que faltan -una espera una decision de JC y la otra el INTA no la
# publica en su servicio- estan en la tabla de configs/dims/capas-inta.yaml y en el backlog 129.
#
# MISMA MAQUETA QUE INFRAESTRUCTURA, a proposito. JC no mando maqueta de esta pagina, y la
# unica que dio para un mapa nuestro es la de Infraestructura del 15-nov-2026: "SOLO PONEMOS
# COMO TITULO 'infraestructura' y que el mapa ocupe toda la pagina pudiendo hacer zoom al
# maximo. Que el usuario pueda agregar o quitar capas". Asi que esto es el titulo, el mapa a
# toda la pagina con zoom real, y el control de capas. Nada mas. Sin KPIs: no hay una magnitud
# que totalizar (la aptitud y la zona son categorias, no kilometros), y JC no dibuja ninguno.
#
# LA PRIMERA CAPA ARRANCA PRENDIDA Y LAS OTRAS TRES APAGADAS (QA de Francisco del 19-nov-2026,
# defecto D6). Hasta el 19-nov arrancaban las cuatro apagadas, por arrastre del protocolo de
# las capas de contexto, que son opt-in SOBRE UN MAPA DE CALOR: ahi la capa es un agregado al
# dato del mapa. Aca las capas SON la pagina, asi que con todo apagado "Suelos y uso del suelo"
# abria mostrando la division departamental y ningun suelo. Abre con "Aptitud de tierras", que
# es la mas general de las cuatro y la mas liviana (137 KB).
#
# Las otras tres siguen apagadas, y no por peso: son capas de AREA que cubren la provincia
# entera, asi que prendidas dos a la vez una tapa a la otra. El control las deja comparar
# prendiendo y apagando, que es como se compara un mapa de aptitud con uno de zonas.
# Cual arranca prendida es decision de JC: preguntado en el backlog 132.
#
# LA TERCERA ES LA COBERTURA DEL SUELO 2006-2007 (LCCS-FAO), que entro despues que las otras
# dos: es una capa NACIONAL de 4,36 millones de vertices y hubo que recortarla a la provincia y
# simplificarla con su propia tolerancia. Va aca y no en una pagina propia porque habla de lo
# mismo que las otras dos -que hay sobre el suelo- y se mira igual: de a una por vez. Lo que
# hay que saberle -que tiene casi veinte anios- esta en configs/dims/capas-inta.yaml.
#
# LA CUARTA ES LA DE AREAS GANADERAS DESFORESTADAS 2008-2017, y es la UNICA que se mira encima
# de otra: la cobertura es de 2006-2007 y el desmonte de 2008-2017, asi que prendidas las dos
# se lee que habia antes y que se desmonto despues. Es de una sola clase, asi que no lleva
# lista de clases: su casilla del control tiene el color del INTA al lado. No se dibujan los
# parches de menos de 1 ha (el 63% de los parches, el 0,99% de la superficie: medido).

id: tablero-mapas-suelos
tipo: tablero
familia: capas-ign
estado: publicada
seccion: mapas
pagina: suelos-y-uso-del-suelo

titulo: "Suelos y uso del suelo"
subtitulo: "Provincia de Santiago del Estero · aptitud de tierras, zonificación del uso del suelo, cobertura del suelo 2006-2007 y áreas ganaderas deforestadas 2008-2017 del INTA"
titulo_pagina: "Suelos y uso del suelo"
breadcrumb: "Mapas - Suelos y uso del suelo"

# Sin banda de indicadores: la aptitud y la zona son categorias, no una magnitud que se sume.
indicadores: []
kpis_sin_variacion: true

notas_metodologicas: [capas-inta-suelos]

paneles:
  alto: fluye
  acciones_de_tablero:
    - {id: exportar-pdf, etiqueta: "Generar PDF", icono: exportar-como-pdf, accion: exportar-pdf}
  mapa-capas:
    # CON EL MISMO FORMATO QUE LOS MAPAS DE AGROCLIMA (pedido de la usuaria del 24-nov-2026:
    # "no me gusta como estan los mapas de suelos y cuencas; tienen que tener el mismo formato
    # que los mapas de agroclima, los que tienen visor propio de codigo"). Ese formato es el
    # del visor georreferenciado del SEPA: titulo del organismo arriba, barra de controles
    # sobre el mapa, el mapa en una caja con marco y la leyenda al costado en una tarjeta
    # "Referencias" con su pie de fuente. Lo declara `visor: true` en `paneles.orden`.
    #
    # Y CON EL MISMO ZOOM (pedido de la usuaria del 24-nov-2026: "quiero que el zoom sea como
    # el de los mapas de agroclima"): rueda continua, doble clic, pellizco y arrastre, con
    # los mismos pasos que el visor. El gesto vive en `cliente/gesto-zoom.js` y lo usan los
    # dos dibujos, asi que no hay dos fuentes de verdad para el mismo numero.
    #
    # El titulo vuelve (lo habia sacado el D1 del QA del 19-nov-2026 por repetir la bajada):
    # en este formato es el UNICO titulo de la pagina -no hay otro arriba, igual que en NDVI o
    # en el Mapa Nacional de Cultivos- y sigue el patron de esas paginas, organismo primero.
    titulo: "INTA - Suelos y uso del suelo - Sgo del Estero"
    # La tarjeta de la leyenda, con el mismo encabezado que la del visor de AgroClima.
    leyenda_titulo: "Referencias"
    subtitulo: "Acerque con la rueda del mouse y arrastre para desplazarse · active una capa por vez; pase el mouse por un área para ver de qué clase es"
    capas:
      - {id: inta-aptitud-tierras, prendida: true}
      - {id: inta-zonificacion-uso-suelo, prendida: false}
      - {id: inta-cobertura-suelo, prendida: false}
      # Va ULTIMA a proposito: es la unica que se mira ENCIMA de otra. La cobertura del suelo
      # es de 2006-2007 y el desmonte de 2008-2017, asi que las dos juntas cuentan que habia y
      # que se desmonto despues. El orden del panel es el orden de dibujo.
      - {id: inta-areas-deforestadas, prendida: false}
  orden:
    - {id: mapa-capas, ancho: 12, zoom: true, visor: true}

filtros: []
