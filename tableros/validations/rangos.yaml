# Rangos razonables por variable. Los usa el check "valores imposibles" de
# pipeline/validations.py. Un valor fuera de rango NO se corrige ni se dropea:
# se reporta en validations/reportes/entrega-NN.md y decide JC.
#
# Criterio para fijar los rangos: se toma el minimo y el maximo agronomicamente
# defendibles para Santiago del Estero y el NOA, con margen holgado hacia arriba
# (mejor un falso negativo que 200 falsos positivos). Cuando el rango se armo
# mirando lo que trajo un archivo concreto queda anotado en `visto`.
#
# Ampliar con criterio: si JC confirma que un valor raro es real, se ensancha el
# rango aca y se anota la fecha, nunca se toca el dato.

# ---------------------------------------------------------------------------
# Rendimiento de cultivos extensivos, en kg/ha sobre superficie COSECHADA.
# Se aplica solo a filas con rendimiento > 0 (rendimiento 0 con superficie
# cosechada 0 es "no se cosecho", lo mira otro check).
# ---------------------------------------------------------------------------
rendimiento_kg_ha:
  _default:              # cultivo que todavia no tiene rango propio
    min: 100
    max: 12000
    nota: "Rango amplio de contencion. Si el cultivo se vuelve importante, darle rango propio."
  Algodón:      {min: 300,  max: 5000,  visto: "1.000 a 4.000 en la entrega-01"}
  Alpiste:      {min: 200,  max: 3000,  visto: "800 a 1.287"}
  Arveja:       {min: 300,  max: 4500,  visto: "2.565 (unico dato, hoja pais)"}
  Avena:        {min: 200,  max: 5000,  visto: "495 a 2.000. Mucha avena va a pastoreo y no se cosecha."}
  Cebada total: {min: 200,  max: 7000,  visto: "500 a 3.670 (el 3.670 es el total pais)"}
  Centeno:      {min: 200,  max: 4000,  visto: "600 a 2.000"}
  Colza:        {min: 200,  max: 4000,  visto: "800 a 1.675"}
  Cártamo:      {min: 200,  max: 3500,  visto: "800 a 2.000"}
  Garbanzo:     {min: 200,  max: 4000,  visto: "600 a 2.000"}
  Girasol:      {min: 300,  max: 4500,  visto: "700 a 2.530"}
  Lenteja:      {min: 200,  max: 3000,  visto: "600 a 1.105"}
  Lino:         {min: 200,  max: 3000,  visto: "982 (unico dato, hoja pais)"}
  Maní:         {min: 300,  max: 6000,  visto: "1.000 a 2.500"}
  Maíz:         {min: 400,  max: 14000, visto: "639 a 8.500. El piso bajo es de campania seca."}
  Mijo:         {min: 200,  max: 4000,  visto: "1.000 a 1.379"}
  Poroto alubia: {min: 200, max: 4000,  visto: "600 a 1.300"}
  Poroto negro: {min: 200,  max: 4000,  visto: "600 a 2.500"}
  Poroto otros: {min: 200,  max: 4000,  visto: "800 a 2.500"}
  Poroto total: {min: 200,  max: 4000,  visto: "600 a 2.469"}
  Soja 1ra:     {min: 300,  max: 6000,  visto: "700 a 4.000"}
  Soja 2da:     {min: 300,  max: 6000,  visto: "700 a 3.900"}
  Soja total:   {min: 300,  max: 6000,  visto: "700 a 3.900"}
  Sorgo:        {min: 400,  max: 10000, visto: "1.200 a 5.500"}
  Trigo candeal: {min: 300, max: 7000,  visto: "800 a 2.756"}
  Trigo total:  {min: 300,  max: 8000,  visto: "600 a 3.100"}

# ---------------------------------------------------------------------------
# Superficies, en hectareas. Tope pensado como control de dedo: ningun
# departamento de SDE tiene 3 millones de ha sembradas de un solo cultivo,
# pero el total pais si (soja: 17,9 millones), por eso el tope va por nivel.
# ---------------------------------------------------------------------------
superficie_ha:
  departamento: {min: 0, max: 1500000}
  provincia:    {min: 0, max: 6000000}
  pais:         {min: 0, max: 40000000}

produccion_tn:
  departamento: {min: 0, max: 5000000}
  provincia:    {min: 0, max: 20000000}
  pais:         {min: 0, max: 120000000}

# ---------------------------------------------------------------------------
# Ganaderia. Todavia no hay base ingerida que lo use (48, 85, 144, 145, 151
# llegan en la proxima tanda), pero el check ya esta escrito y lee de aca.
# ---------------------------------------------------------------------------
cabezas:
  entero_obligatorio: true       # media vaca no existe
  min: 0
  max: 5000000
  nota: "Stock bovino de SDE ronda 1,3 millones de cabezas; el tope es de contencion."

peso_kg:
  min: 0
  max: 1500
  nota: "Peso por cabeza. Bovino adulto pesado ~700 kg; el tope deja lugar a bubalinos."

# ---------------------------------------------------------------------------
# Clima. Para las bases 110 y 111.
# ---------------------------------------------------------------------------
temperatura_c:      {min: -15, max: 50}
precipitacion_mm:   {min: 0,   max: 500,  nota: "Por dia. Un mensual va a otro rango cuando se ingiera la base."}
humedad_pct:        {min: 0,   max: 100}

# ---------------------------------------------------------------------------
# Peso de UN movimiento de producto vegetal (una DTV), en toneladas.
# Agregado el 2026-09-23 al entrar la familia DTV (bases 53, 56, 57 y 75).
#
# Una DTV ampara un transporte. El criterio es el del camion, no el del cultivo:
#   `max`            45 tn. Es el tope de un bitren cargado. Un semirremolque comun
#                    lleva 28-30 tn, asi que 45 ya deja margen holgado; lo que lo
#                    supera se lista para mirar, no se da por malo.
#   `max_imposible`  1.000 tn. Cuarenta camiones en una sola declaracion. No existe
#                    bajo ninguna lectura del dato, y una fila de este tamano se come
#                    sola el 6% de una base: por eso bloquea en vez de avisar.
# No se pone `min`: hay DTV chiquitas reales (25 kg de semilla) y no son sospechosas.
# ---------------------------------------------------------------------------
peso_por_movimiento_tn:
  _default:
    max: 45
    max_imposible: 1000
    nota: >
      Tope de transporte terrestre en Argentina. Vale igual para algodon, cebolla,
      batata y papa: lo que limita el peso es el camion, no el cultivo. Si JC confirma
      que alguna DTV ampara varios viajes, este rango se ensancha con la fecha anotada.

# ---------------------------------------------------------------------------
# Clima DIARIO por variable (base 111, estaciones del INTA en Santiago del Estero).
# Agregado el 2026-10-14 por qa-datos con la entrega-03. Lo usa el check
# `fuera_de_rango_fisico` via `rangos_por_variable` en reglas.yaml.
#
# Dos niveles: `min`/`max` = "mirarlo" (raro pero posible); `min_imposible`/
# `max_imposible` = no ocurre en la llanura santiaguena (estaciones entre ~100 y
# ~250 m de altura). Criterio: records absolutos de la region (maximas de ~47 C, minimas
# de ~-10 C) con margen. Las unidades NO estan confirmadas por la fuente para varias de
# estas variables (ver configs/dims/variables-clima.yaml): el rango supone la unidad
# obvia por la magnitud y lo dice en `unidad`. Si JC dice otra, se corrige aca.
# ---------------------------------------------------------------------------
temperatura_aire_maxima_diaria_c:
  {min: -5,  max: 46, min_imposible: -15, max_imposible: 50, unidad: "C (supuesta)"}
temperatura_aire_minima_diaria_c:
  {min: -10, max: 32, min_imposible: -15, max_imposible: 38, unidad: "C (supuesta)"}
temperatura_aire_media_diaria_c:
  min: -3
  max: 38
  min_imposible: -10
  max_imposible: 42
  unidad: "C (supuesta)"
  nota: "Una media diaria bajo -10 C no se registro nunca en la region."
temperatura_suelo_10cm_media_c:
  min: 0
  max: 45
  min_imposible: -3
  max_imposible: 55
  unidad: "C (supuesta)"
  nota: "A 10 cm el suelo amortigua: una media diaria bajo cero ya es para mirar, y de -3 para abajo no ocurre aca."
punto_rocio_medio_c:
  min: -15
  max: 28
  min_imposible: -30
  max_imposible: 32
  unidad: "C (supuesta)"
  nota: "Un rocio medio de 32 C es casi record mundial; en el Chaco seco no pasa de ~26."
precipitacion_diaria_mm:
  min: 0
  max: 200
  min_imposible: 0
  max_imposible: 500
  unidad: "mm"
  nota: "200 mm en un dia ya es extraordinario en Santiago; se lista para mirar."
precipitacion_30min_mm:
  {min: 0, max: 80, min_imposible: 0, max_imposible: 150, unidad: "mm"}
humedad_relativa_diaria_pct:
  min: 5
  max: 100
  min_imposible: 1
  max_imposible: 100
  unidad: "%"
  nota: "Una humedad relativa MEDIA DIARIA de 0% no existe en la atmosfera: es sensor caido."
horas_frio_dia:
  {min: 0, max: 24, min_imposible: 0, max_imposible: 24, unidad: "horas"}
tension_vapor_media_hpa:
  min: 2
  max: 40
  min_imposible: 0.5
  max_imposible: 50
  unidad: "hPa (supuesta)"
  nota: "50 hPa equivale a un rocio de ~33 C, que no ocurre en la region."
presion_media_estacion_hpa:
  min: 960
  max: 1040
  min_imposible: 930
  max_imposible: 1060
  unidad: "hPa (supuesta)"
  nota: "Estaciones a 100-250 m: por debajo de 930 hPa haria falta estar a ~700 m de altura."
heliofania_efectiva_h:
  min: 0
  max: 14
  min_imposible: 0
  max_imposible: 14.5
  unidad: "horas"
  nota: "Entre 26 y 30 grados sur el dia mas largo del anio tiene menos de 14 horas de sol posible."
radiacion_global_mj_m2_dia:
  min: 0
  max: 35
  min_imposible: 0
  max_imposible: 45
  unidad: "MJ/m2 por dia (supuesta)"
  nota: "Fuera de la atmosfera llegan ~44 MJ/m2 en el dia mas largo a esta latitud; en superficie, con cielo limpio, ~33."
evapotranspiracion_mm_dia:
  {min: 0, max: 12, min_imposible: 0, max_imposible: 20, unidad: "mm (supuesta)"}
