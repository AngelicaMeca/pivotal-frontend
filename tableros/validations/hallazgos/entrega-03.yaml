  severidad: bloqueante
  base: 111
  titulo: Estaciones cuyo ultimo dato queda muy atras del resto
  casos: 2
  detalle: La base llega hasta el 29/05/2026. Estas series dejan de traer datos mas de 30 dias antes,
    asi que 'el ultimo anio' de esa estacion no es el mismo que el de las otras.
  ejemplos:
  - 'Sachayoj: ultimo dato el 04/07/2025; dias con dato en la ventana publicada (30/05/2025 a 29/05/2026):
    36'
  - 'Monte Quemado: ultimo dato el 03/04/2026; dias con dato en la ventana publicada (30/05/2025 a 29/05/2026):
    309'
  propuesta: 'No mostrar el ultimo anio de esa estacion como si fuera el de las demas: o se muestra su
    propio ultimo anio con la fecha bien a la vista, o se deja afuera hasta que llegue el dato.'
  pregunta_jc: Esta estacion dejo de mandar datos hace meses. Esta fuera de servicio, o el INTA tiene
    los datos y faltan en la planilla?
