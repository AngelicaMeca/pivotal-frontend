  titulo: Cambio de formato respecto de lo declarado en el indice
  casos: 1
  detalle: 'Dos diferencias contra el índice de JC (configs/manifiesto-indice.yaml, base 8), las dos registradas
    y ninguna corregida. (1) El índice la da por PROMETIDA PARA LA ENTREGA-02 y sin archivo recibido;
    el archivo llegó igual con la entrega-01 y el pipeline ya lo baja de SharePoint en cada publicación.
    El manifiesto del índice va a seguir listándola como "prometida-no-recibida" hasta que indexador-contexto
    lo regenere: NO es un problema de datos. (2) El índice declara frecuencia MENSUAL y el archivo trae
    observaciones DIARIAS (5.655 fechas distintas entre 2017 y 2026). El grano bueno es el del archivo;
    el mensual se calcula. El rango sí coincide: el índice promete 2017-01-01 a 2026-04-30 y el archivo
    va de 2017-01-02 a 2026-04-09.'
  propuesta: 'No se corrige el archivo: el pipeline ya sabe leerlo como viene.'
