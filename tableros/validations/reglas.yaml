# Parametros de las validaciones, por base. Los lee pipeline/validations.py.
#
# Por que vive en validations/ y no en configs/bases/: configs/bases/*.yaml es la
# receta de LECTURA (la escribe ingestor-bases). Esto es la receta de CONTROL (la
# escribe qa-datos). Separadas para que los dos agentes no se pisen el archivo.
#
# Todos los checks son genericos: leen las columnas que se nombran aca. Una base
# sin entrada en `bases` igual pasa por los checks que no necesitan parametros
# (filas duplicadas, negativos, cobertura de entrega, geo, drift).

defaults:
  # Un total embebido que difiere mas de esto de la suma de su propio detalle es anomalia.
  tolerancia_agregado_pct: 0.5
  # CANT x PESO_UNITARIO vs PESO_TOTAL (bases DTV).
  tolerancia_producto_pct: 1.0
  # Columna calculada (ej. rendimiento) vs su propia formula.
  tolerancia_derivada_pct: 1.0
  # Un valor que se multiplica o se divide por mas que esto de un periodo al
  # siguiente se lista para que JC lo mire. No es error: en agro pasa.
  salto_serie_factor: 5
  # Cuantos periodos seguidos con el MISMO numero hacen sospechar de un dato
  # arrastrado (copy/paste o estimacion repetida).
  repeticion_min_periodos: 5
  # Minimo de filas para que dos particiones con igual conteo sean sospechosas.
  copypaste_min_filas: 50

bases:

  9:
    etiqueta: "Cultivos extensivos"
    columnas:
      particion: hoja            # dentro de una particion las comparaciones tienen sentido
      periodo: campania
      orden_periodo: campania_inicio
      categoria: cultivo
      grupo_categoria: cultivo_grupo
      rol_categoria: cultivo_rol
    clave_unica: [hoja, geo_id, campania, cultivo, medida]

    medidas_sumables: [sup_sembrada_ha, sup_cosechada_ha, produccion_tn]
    medidas_no_negativas: [sup_sembrada_ha, sup_cosechada_ha, produccion_tn, rendimiento_kg_ha]
    medidas_enteras: []          # ninguna: hectareas y toneladas pueden ser decimales

    # Una medida nunca puede superar a la otra.
    no_mayor_que:
      - menor: sup_cosechada_ha
        mayor: sup_sembrada_ha
        texto: "no se puede cosechar mas superficie de la que se sembro"

    # Columnas calculadas: resultado = numerador / denominador * factor.
    derivadas:
      - resultado: rendimiento_kg_ha
        numerador: produccion_tn
        denominador: sup_cosechada_ha
        factor: 1000
        texto: "rendimiento = produccion (tn) / superficie cosechada (ha) x 1.000"

    # Si A > 0 entonces B tiene que ser > 0.
    coherencia_actividad:
      - si: sup_cosechada_ha
        entonces: produccion_tn
        texto: "si se cosecho superficie tiene que haber produccion"

    # Grupos agregado/componente que NO se comparan porque el archivo no trae los
    # componentes por diseno de la fuente. Sin esto el check grita 94 veces al pedo.
    grupos_sin_componentes: [Cebada]

    # Rangos de validations/rangos.yaml que aplican a esta base, medida por medida.
    rangos:
      rendimiento_kg_ha: {tabla: rendimiento_kg_ha, por: cultivo}
      sup_sembrada_ha:   {tabla: superficie_ha,     por: nivel_geo}
      sup_cosechada_ha:  {tabla: superficie_ha,     por: nivel_geo}
      produccion_tn:     {tabla: produccion_tn,     por: nivel_geo}

    # Padron geografico: cuantas unidades tiene que haber si la base es censal.
    padron_geo:
      - provincia_id: 86
        nombre: "Santiago del Estero"
        unidades_esperadas: 27
        fuente_padron: "INDEC: SDE tiene 27 departamentos"

    # Rango de periodos que JC declaro PARA LA ENTREGA (no el de la fuente, que el
    # indice declara desde 1969). Lo que caiga afuera se reporta.
    periodos_declarados:
      desde: "2014/15"
      hasta: "2025/26"
      texto: >
        JC en el indice: "Campanas 2014/2015 hasta 2025/6 (en algunos casos hasta 2024/25)".
    # El indice declara 1969-2025 para la fuente completa del MAGyP; el archivo es un
    # recorte. Se reporta como cobertura, no como error.
    periodos_declarados_fuente:
      desde: "1969"
      hasta: "2025"

    # Particiones que no se comparan contra el resto (otro ambito, otra cobertura).
    particiones_de_referencia: ["9 PB 3 - B", "9 PB 3 - C"]

    # OJO: `registros_declarados: 147184` del indice es el conteo NACIONAL de la base
    # completa del MAGyP. El archivo recibido es el recorte SDE + NOA + pais. NO se usa
    # como validacion de cantidad de filas.
    ignorar_registros_declarados: true

  85:
    etiqueta: "Movimientos de hacienda bovina (DTE)"
    columnas:
      particion: hoja            # ORIGEN y DESTINO son dos universos distintos: lo que sale
                                 # de Santiago y lo que entra. No se comparan entre si.
      periodo: periodo           # 2022-01
      orden_periodo: orden_periodo   # mes corrido y contiguo, para detectar huecos de verdad
      categoria: categoria       # Terneros, Vacas, Total...
      grupo_categoria: especie   # bovinos / bubalinos: el total de cada especie cierra aparte
      rol_categoria: categoria_rol
      unidad: fila_origen        # una observacion = una fila del Excel = un movimiento.
                                 # Es el grano al que el total tiene que dar la suma de las
                                 # categorias (en las bases tidy ese grano es geo_id).
      variable: variable         # columna de origen, para el check de la fila de total al pie

    # Cada fila del Excel es un movimiento agregado por SENASA. Que se repita la
    # combinacion entera significa que el mismo movimiento entro dos veces.
    clave_unica: [hoja, periodo, motivo, tipo_origen, tipo_destino, origen_departamento,
                  origen_provincia, destino_departamento, destino_provincia, variable]

    medidas_sumables: [cabezas, documentos]
    medidas_no_negativas: [cabezas, documentos, ingreso_establecimiento, egreso_establecimiento]
    # Las cabezas de hacienda y los documentos son enteros por definicion. Si aparece un
    # decimal es un problema de la fuente (paso en la base 100, con 17.712,5 bovinos
    # faenados). Este check nunca se habia podido ejercitar con datos reales.
    medidas_enteras: [cabezas, documentos, ingreso_establecimiento, egreso_establecimiento]

    # Cobertura declarada. El archivo llega hasta mitad de 2026, asi que el ano en curso
    # esta incompleto por definicion y no es una anomalia.
    periodos_declarados:
      desde: "2022-01"
      hasta: "2026-12"
      texto: >
        El archivo cubre de enero 2022 a mitad de 2026. El 2026 esta incompleto: JC lo marca
        con asterisco en su propia hoja de analisis.

    # Sin `padron_geo`: el check necesita las columnas geo_id / provincia_id sueltas y esta
    # base tiene la geografia en dos puntas (origen y destino). La cobertura igual esta
    # verificada a mano: aparecen los 27 departamentos en las dos puntas.

    # Sin `rangos`: no hay tabla de rangos razonables para cabezas por movimiento todavia.
    # Cuando entre la base 48 (stock bovino) se va a poder acotar con algun criterio.

  48:
    etiqueta: "Stock bovino por departamento"
    columnas:
      particion: hoja            # una sola hoja de datos, pero el check la usa de llave
      periodo: anio              # 2012, 2013, ... (enteros: el grano es el anio calendario)
      orden_periodo: anio        # el anio ya es su propio orden y es contiguo
      categoria: categoria       # Vacas, Vaquillonas, Novillos, ... y Total
      grupo_categoria: especie   # bovinos
      rol_categoria: categoria_rol
      unidad: fila_origen        # una observacion = una fila del Excel = un anio y un
                                 # departamento. Es el grano al que el Total tiene que dar
                                 # la suma de las nueve categorias.
      variable: variable         # columna de origen

    # Un anio y un departamento no pueden venir dos veces con la misma columna.
    clave_unica: [hoja, anio, departamento, variable]

    medidas_sumables: [cabezas, unidades_productivas]
    medidas_no_negativas: [cabezas, unidades_productivas]
    # Aca es donde se ejercita de verdad el check: la fuente informa el stock de 2021 con
    # decimales. Un animal no se parte y un establecimiento tampoco.
    medidas_enteras: [cabezas, unidades_productivas]

    # Base censal: la vacunacion cubre los 27 departamentos de la provincia.
    padron_geo:
      - provincia_id: 86
        nombre: "Santiago del Estero"
        unidades_esperadas: 27
        fuente_padron: "INDEC: SDE tiene 27 departamentos"

    # Lo que el indice declara para esta base. El archivo arranca en 2012, asi que la
    # diferencia sale como cobertura y va al reporte para que JC decida.
    periodos_declarados:
      desde: 2007
      hasta: 2025
      texto: >
        El indice de JC declara la base 48 de 2007 a 2025. Se declara ese rango y no el del
        archivo a proposito: si se declarara 2012-2025 el control diria que esta todo bien y
        los cinco anios que faltan no se reportarian nunca.
    periodos_declarados_fuente:
      desde: 2007
      hasta: 2025

    # OJO: `registros_declarados: 7633` del indice no se usa como validacion de cantidad de
    # filas. El archivo recibido trae 392 filas (14 anios x 28 filas) y es el recorte de
    # Santiago; 7.633 es del orden de la base nacional completa. Se pregunta, no se valida.
    ignorar_registros_declarados: true

    # Sin `rangos`: para acotar cabezas por departamento hace falta una referencia de stock
    # razonable que todavia no existe en validations/rangos.yaml. Queda para cuando haya
    # dos entregas y se pueda mirar la variacion interanual.

  # -------------------------------------------------------------------------
  # Familia DTV (Declaraciones de Transito Vegetal, SENASA). Bases 53, 56, 57 y 75.
  # Agregadas el 2026-09-23. Las cuatro comparten schema, asi que comparten receta de
  # control; lo unico que cambia entre ellas es la cobertura declarada y si la base
  # trae o no el numero de DTV.
  #
  # Tres cosas que hay que saber para leer estos bloques:
  #
  # 1) `columnas.particion: hoja` NO es cosmetico. Cada hoja es un anio y trae su propia
  #    fila de =SUMA() al pie. Sin declararlo, el check de total al pie compara el pie de
  #    UNA hoja contra el detalle de las CINCO y reporta que no cierra cuando cierra
  #    exacto. Era el falso positivo de las bases 53 y 57.
  #
  # 2) `columnas.unidad_origen: um_origen`. La columna `unidad` del parquet ya es la de
  #    la medida canonica (tn, bultos, movimientos) y siempre esta bien por construccion.
  #    La U.M. que hay que controlar contra {Kg., Tn.} es la que trae el archivo.
  #
  # 3) La base es transaccional: una fila = una declaracion. No hay agregados geograficos
  #    embebidos ni columnas calculadas, asi que no llevan `derivadas`, `no_mayor_que`,
  #    `grupo_categoria` ni `padron_geo`. La geografia esta en dos puntas (origen y
  #    destino), igual que en la 85.
  # -------------------------------------------------------------------------

  53: &dtv
    etiqueta: "DTV Algodon (movimientos de producto vegetal)"
    columnas:
      particion: hoja            # una hoja por anio, cada una con su total al pie
      periodo: periodo           # 2021-01
      orden_periodo: orden_periodo   # mes corrido y contiguo: detecta huecos de verdad
      categoria: producto        # Algodon / grano / semilla / desperdicios
      variable: variable         # columna de origen, para el check del total al pie
      unidad_origen: um_origen   # la U.M. tal cual viene en el Excel (ver punto 2)
      factor_unidad: factor_tn   # con que factor se la convirtio a toneladas
      documento: nro_dtv         # numero de DTV: tendria que ser unico por declaracion

    # Que la MISMA declaracion aparezca dos veces con todo igual seria contarla dos
    # veces al sumar. `fecha_hora` entra en la clave a proposito: SENASA sella con hora
    # y sin ella 125 declaraciones distintas del mismo dia parecerian la misma.
    clave_unica: [hoja, fecha_hora, tipo_movimiento, origen_departamento,
                  destino_provincia, destino_departamento, producto, acondicionamiento,
                  um_origen, cantidad_origen, peso_unitario_origen, peso_total_origen,
                  variable]

    medidas_sumables: [peso, movimientos, cantidad]
    medidas_no_negativas: [peso, movimientos, cantidad]
    # `cantidad` son bultos (fardos, rollos, bolsas): se cuentan de a uno. `peso` NO va
    # aca: las toneladas tienen decimales por definicion.
    medidas_enteras: [movimientos]

    # La U.M. que admite CLAUDE.md para esta familia. Todo lo demas se reporta.
    unidades_admitidas: ["Kg.", "Tn."]

    # Unidades raras que YA estan entendidas: se siguen reportando en cada entrega (si la
    # fuente las saca queremos enterarnos) pero no bloquean. La que NO esta aca, bloquea.
    # "U." no esta y no va a estar hasta que JC diga que significa: es la pregunta 1 de
    # esta entrega.
    unidades_explicadas:
      "Kg-Tn": >
        el PESO TOTAL ya viene en toneladas y el PESO UNITARIO en kilos; se lee con factor
        1 y la identidad cantidad x unitario cierra dividiendo por 1.000 en 8.873 de las
        9.012 filas donde aplica

    # CANT. x PESO UNITARIO = PESO TOTAL, sobre las columnas crudas que conserva el
    # adapter. `factores_tolerados: [0.001]` = "si cierra pasando el unitario de kilos a
    # toneladas, esta entendido y no se pregunta"; es la convencion de las filas Kg-Tn.
    producto:
      - sobre: columnas
        factor_a: cantidad_origen
        factor_b: peso_unitario_origen
        total: peso_total_origen
        factores_tolerados: [0.001]

    # Cantidad y peso unitario miden cosas distintas (bultos y toneladas por bulto). Que
    # traigan el mismo numero y el total sea ese numero al cuadrado es un error de tipeo
    # clasico. `minimo: 5` deja pasar los casos chicos, donde la coincidencia es normal
    # (2 bultos de 2 tn pasa todos los dias).
    columnas_distintas:
      - a: cantidad_origen
        b: peso_unitario_origen
        consecuencia: peso_total_origen
        minimo: 5
        titulo: "Cantidad y peso unitario con el mismo numero, y el total elevado al cuadrado"
        texto: >
          Filas donde la columna de cantidad de bultos y la de peso por bulto traen
          exactamente el mismo numero, y por eso el peso total queda en ese numero
          multiplicado por si mismo: 15 y 15 dan 225 toneladas en un solo viaje.
        pregunta: >
          En estas filas la cantidad de bultos y el peso de cada bulto son el mismo
          numero, y el peso total queda en ese numero al cuadrado (15 y 15 dan 225 tn).
          Parece que el peso total se tipeo en las dos columnas. Vale el numero chico?

    rangos:
      peso: {tabla: peso_por_movimiento_tn, por: um_canonica}

    # Base transaccional: una fila es un movimiento. Un mes sin filas no es un dato que
    # falte, es un mes en el que no salio nada. Se reporta igual (el grafico tiene que
    # dibujar el cero) pero no bloquea la publicacion.
    periodos_vacios_son_cero: true

    periodos_declarados:
      desde: "2021-01"
      hasta: "2025-12"
      texto: >
        El archivo cubre los cinco anios completos, mes a mes. La hoja Modelo analisis de
        JC encabeza "Periodo: 2020 a 2026": se declara lo que trae el archivo y la
        diferencia contra lo que JC escribio se reporta como cobertura.

  56:
    <<: *dtv
    etiqueta: "DTV Batata (movimientos de producto vegetal)"
    columnas:
      particion: hoja
      periodo: periodo
      orden_periodo: orden_periodo
      categoria: producto
      variable: variable
      unidad_origen: um_origen
      factor_unidad: factor_tn
      # Sin `documento`: esta base no trae el numero de DTV (en esa posicion el Excel
      # trae "ANO"), asi que no se puede controlar si una declaracion vino repetida.

  57:
    <<: *dtv
    etiqueta: "DTV Cebolla (movimientos de producto vegetal)"
    columnas:
      particion: hoja
      periodo: periodo
      orden_periodo: orden_periodo
      categoria: producto
      variable: variable
      unidad_origen: um_origen
      factor_unidad: factor_tn
      documento: nro_dtv         # unica base de la familia que SI trae el numero

  75:
    <<: *dtv
    etiqueta: "DTV Papa (movimientos de producto vegetal)"
    columnas:
      particion: hoja
      periodo: periodo
      orden_periodo: orden_periodo
      categoria: producto
      variable: variable
      unidad_origen: um_origen
      factor_unidad: factor_tn
      documento: nro_dtv

    # LO MAS IMPORTANTE DE ESTA BASE. La fuente solo informa de septiembre a diciembre:
    # el propio indice de JC la titula "DTV - Papa (septiembre a diciembre)". Enero a
    # agosto no son huecos, no existen. Sin esta linea el check de cobertura denunciaria
    # 32 meses faltantes como bloqueantes y taparia cualquier hueco real.
    meses_de_la_fuente: [9, 10, 11, 12]

    periodos_declarados:
      desde: "2021-09"
      hasta: "2025-12"
      texto: >
        Cinco temporadas de septiembre a diciembre. Consecuencia para el tablero: ninguna
        vista puede llamar "total del anio" a lo que suma esta base.
